<style>
/* =========================================================
   TOKENS — style « rose / cadre blanc »
   ========================================================= */
:root{
  --frame:#E9779E;            /* fond rose autour du cadre */
  --bg:#FFFFFF;               /* intérieur du cadre */
  --s1:#FFF4F8; --s2:#FCE3ED; --line:#F5C6D7;
  --tx:#4A2238; --mu:#8A5670;
  --pk:#D4307B;               /* rose principal (titres, boutons) */
  --pk2:#B8346F;              /* rose texte lisible */
  --ac:#D9478A; --ac-ink:#FFFFFF;
  --hi:#139E73; --mid:#C98600; --warm:#E0611F; --lo:#D3304F;
  --fd:'Zen Dots','Trebuchet MS',system-ui,sans-serif;
  --fb:'Quicksand','Segoe UI',system-ui,-apple-system,sans-serif;
  --r:30px;
  --frame-bg:#E9779E; --field:#FFFFFF; --on-pk:#FFFFFF; --glass:rgba(255,255,255,.88); --glass-solid:#FFFFFF;
  --art-bg:#3F6B45; --art-tint:linear-gradient(200deg,transparent 45%,rgba(160,30,90,.45));
  --title:#fff; --title-stroke:0 transparent; --title-shadow:0 2px 20px rgba(120,20,70,.45);
  --case:lowercase; --fdw:400; --rf:40px; --rc:28px; --rp:999px; --ri:16px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{ background:var(--frame-bg); scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px); }
*,*::before,*::after{ box-sizing:border-box; }   /* pas « inherit » : le contenu d'un bloc repliable (details) n'hérite pas et débordait */
body{ margin:0; background:var(--frame-bg); color:var(--tx); font:500 15px/1.6 var(--fb); -webkit-font-smoothing:antialiased; }
img{ max-width:100%; }
a{ color:inherit; }
h1,h2,h3{ margin:0; line-height:1.15; }
h1,h2{ font-family:var(--fd); font-weight:var(--fdw); color:var(--pk); }
h2{ font-size:clamp(26px,3.4vw,38px); text-transform:var(--case); letter-spacing:.02em; }
h3{ font:700 19px var(--fb); color:var(--pk2); }
p{ margin:0; }
.muted{ color:var(--mu); }
:focus-visible{ outline:3px solid var(--tx); outline-offset:2px; }

/* Cadre blanc arrondi */
.frame{ width:min(1260px,100% - 28px); margin:14px auto; background:var(--bg); border-radius:var(--rf); padding:14px; min-height:calc(100vh - 28px); }
.wrap{ width:min(1140px,100% - 16px); margin-inline:auto; }

/* ---------- En-tête ---------- */
.top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bg); display:flex; align-items:center; gap:14px; padding:2px 4px 10px; border-radius:0 0 24px 24px; }
body.is-home .top{ display:none; }
.logo{ width:54px; height:54px; border-radius:50%; background:var(--pk); transition:background .4s; display:grid; place-items:center; flex:none; text-decoration:none; overflow:hidden; }
.logo img{ width:42px; height:42px; display:block; transition:transform .5s cubic-bezier(.3,1.6,.5,1); animation:spinIn 1s cubic-bezier(.3,1.6,.5,1) both; }
.dispo-panel{ margin-bottom:6px; }
.dispo-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.dispo-head h3{ margin:0; }
.pill-live{ font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px; background:color-mix(in srgb,var(--hi) 18%,transparent); color:var(--hi-tx); }
.dot-live{ display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--hi); box-shadow:0 0 0 0 color-mix(in srgb,var(--hi) 60%,transparent); animation:livepulse 1.6s infinite; margin-right:8px; }
@keyframes livepulse{ 0%{ box-shadow:0 0 0 0 color-mix(in srgb,var(--hi) 55%,transparent); } 70%{ box-shadow:0 0 0 9px transparent; } 100%{ box-shadow:0 0 0 0 transparent; } }
.dispo-cta{ display:inline-flex; align-items:center; }
.dispo-me{ display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; padding:12px 14px; border-radius:var(--ri); background:color-mix(in srgb,var(--hi) 10%,transparent); border:1.5px solid color-mix(in srgb,var(--hi) 40%,transparent); margin-bottom:12px; }
.dispo-list{ display:grid; gap:10px; margin-top:12px; }
.dispo-card{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 12px; border-radius:var(--ri); background:var(--field); border:1.5px solid var(--line); }
.dispo-card.same{ border-color:color-mix(in srgb,var(--hi) 50%,transparent); }
.dc-who{ display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; min-width:0; }
.dc-who div{ display:grid; min-width:0; }
.dc-who b{ font-size:15px; }
.dc-who span{ font-size:13px; color:var(--mu); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dc-who em{ font-size:12px; color:var(--mu); font-style:normal; }
.dc-act{ display:flex; align-items:center; gap:10px; flex:none; }
.dc-compat{ font-weight:800; color:var(--hi-tx); font-size:12px; font-style:normal; margin-left:8px; white-space:nowrap; }
.dc-who b{ display:flex; align-items:center; flex-wrap:wrap; gap:2px 0; }
.dc-sent{ font-size:12px; white-space:nowrap; }
.dispo-empty{ margin:8px 0 0; font-size:14px; }
.dp-durs{ display:flex; flex-wrap:wrap; gap:8px; }
.chip-btn{ padding:8px 14px; border-radius:999px; border:1.5px solid var(--line); background:var(--field); color:var(--tx); font:inherit; font-size:14px; cursor:pointer; }
.chip-btn.on{ border-color:var(--pk); background:color-mix(in srgb,var(--pk) 14%,transparent); color:var(--pk2,var(--pk)); font-weight:700; }
.tag-live{ display:inline-block; margin-left:8px; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; background:color-mix(in srgb,var(--hi) 18%,transparent); color:var(--hi-tx); vertical-align:middle; }
.ref-row{ display:flex; gap:8px; margin:10px 0; }
.ref-link{ flex:1; min-width:0; padding:10px 12px; border-radius:var(--ri); border:1.5px solid var(--line); background:var(--field); color:var(--tx); font:inherit; font-size:13px; }
.ref-stats{ font-size:14px; color:var(--mu); }
.ref-stats b{ color:var(--tx); font-size:18px; }
.btn-sm{ padding:7px 12px; font-size:13px; }
.logged-out .navpill,.logged-out .tabbar,.logged-out .top-right .live,.logged-out .notif-btn{ display:none !important; }
.logged-out .frame{ padding-bottom:14px; }
.no-profile .navpill,.no-profile .tabbar,.no-profile .notif-btn{ display:none !important; }
.no-profile .frame{ padding-bottom:14px; }
.inst-steps{ margin:8px 0 14px; padding-left:22px; display:grid; gap:10px; line-height:1.5; }
.inst-diag{ margin-top:10px; font-size:13px; } .inst-diag summary{ cursor:pointer; color:var(--mu); }
.linklike{ background:none; border:0; padding:0; font:inherit; color:var(--pk2,var(--pk)); text-decoration:underline; cursor:pointer; }
@media (pointer:coarse){ .chip,.chip-btn{ min-height:44px; } .btn-sm{ min-height:40px; } .linklike,.foot a{ display:inline-block; padding:8px 2px; } }
.toast{ z-index:9999 !important; }
.inapp-note{ display:grid; gap:4px; padding:12px 14px; border-radius:var(--ri); border:1.5px dashed var(--line); background:var(--field); font-size:14px; text-align:left; }
.inapp-note b{ color:var(--tx); } .inapp-note span{ color:var(--mu); }
.gbtn.is-inapp{ border-radius:var(--ri); overflow:visible; }
.welcome{ display:grid; gap:22px; max-width:760px; }
.wl-hero{ text-align:center; padding:18px 6px 0; }
.wl-kicker{ display:inline-block; font-size:13px; font-weight:700; color:var(--pk2,var(--pk)); padding:6px 14px; border-radius:999px; background:color-mix(in srgb,var(--pk) 14%,transparent); }
.wl-hero h1{ font-family:var(--fd); font-size:clamp(30px,7vw,52px); line-height:1.08; margin:14px 0 12px; color:var(--tx); }
.wl-hero p{ color:var(--mu); font-size:16px; max-width:560px; margin:0 auto; }
.wl-cta{ display:flex; flex-wrap:wrap; gap:14px; justify-content:center; align-items:center; margin-top:20px; }
.wl-demo{ display:grid; gap:10px; }
.wl-card{ display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--rc); background:var(--s1); border:1.5px solid var(--line); }
.wl-card > div:not(.ring){ flex:1; display:grid; } .wl-card > div > span{ font-size:13px; color:var(--mu); }
.wl-cap{ text-align:center; font-size:12px; color:var(--mu); margin:0; }
.wl-feats{ display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); }
.wl-feats div{ display:grid; gap:4px; padding:14px; border-radius:var(--rc); background:var(--s1); border:1.5px solid var(--line); }
.wl-feats span{ font-size:14px; color:var(--mu); }
.wl-legal{ text-align:center; font-size:12px; color:var(--mu); }
.invite-banner{ display:flex; gap:12px; align-items:center; padding:12px 14px; border-radius:var(--ri); background:color-mix(in srgb,var(--pk) 14%,transparent); border:1.5px solid var(--pk); }
.invite-banner div{ display:grid; } .invite-banner span{ font-size:13px; color:var(--mu); } .ib-gift{ font-size:26px; }
.onboard{ max-width:620px; }
.ob-head{ margin-bottom:14px; } .ob-head h2{ margin:10px 0 4px; } .ob-head p{ color:var(--mu); margin:0; }
.ob-progress{ height:6px; border-radius:6px; background:var(--line); overflow:hidden; } .ob-progress i{ display:block; height:100%; background:var(--pk); border-radius:6px; transition:width .3s; }
.ob-form{ display:grid; gap:18px; }
.ob-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
@media (min-width:600px){ .ob-grid{ grid-template-columns:repeat(4,minmax(0,1fr)); } .ob-grid.ob-3{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
.ob-tile{ min-height:64px; padding:12px; border-radius:var(--ri); border:2px solid var(--line); background:var(--field); color:var(--tx); font:inherit; font-weight:700; text-align:left; cursor:pointer; display:grid; align-content:center; gap:2px; }
.ob-tile small{ font-weight:500; color:var(--mu); font-size:12px; }
.ob-tile.on{ border-color:var(--pk); background:color-mix(in srgb,var(--pk) 16%,transparent); }
.ob-tile.on b::before{ content:'✓ '; color:var(--pk2,var(--pk)); }
.ob-more summary{ cursor:pointer; color:var(--pk2,var(--pk)); font-weight:700; margin-top:10px; min-height:44px; display:flex; align-items:center; }
.ob-check{ display:flex; gap:10px; align-items:center; margin-top:12px; min-height:44px; font-weight:600; }
.ob-check input{ width:22px; height:22px; accent-color:var(--pk); }
.ob-actions{ display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; } .ob-actions .btn-lg{ flex:1; max-width:320px; }
.ob-later{ text-align:center; font-size:13px; margin-top:12px; }
.home-top{ display:grid; gap:12px; }
.nudge{ display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit; }
.nudge div{ flex:1; display:grid; } .nudge span{ font-size:14px; color:var(--mu); } .nudge-ico{ font-size:24px; } .nudge-go{ font-size:28px; color:var(--pk2,var(--pk)) !important; }
.pulse{ display:grid; gap:8px; } .pulse > span{ font-size:14px; color:var(--mu); }
.pulse-list{ display:flex; flex-wrap:wrap; gap:8px; }
.pulse-chip{ display:inline-flex; gap:6px; align-items:center; min-height:40px; padding:0 14px; border-radius:999px; border:1.5px solid var(--line); background:var(--field); color:var(--tx); text-decoration:none; font-weight:600; font-size:14px; }
.pulse-chip i{ font-style:normal; color:var(--mu); font-weight:500; font-size:12px; } .pulse-chip.mine{ border-color:var(--pk); }

/* M3 : pour un membre, sur téléphone, le grand bandeau est réduit pour que l'action soit visible tout de suite */
@media (max-width:760px){ body.has-profile .marq{ display:none; } body.has-profile .hero2 .tab.bl{ display:none; } body.has-profile .hero2 .art{ max-height:300px; } body.has-profile .showcase{ max-height:340px; overflow:hidden; } }
.rep-msgs{ margin-top:8px; } .rep-msgs summary{ cursor:pointer; color:var(--pk2,var(--pk)); font-weight:600; min-height:40px; display:flex; align-items:center; }
.rep-msgs p{ margin:4px 0; font-size:13px; padding:6px 10px; border-radius:10px; background:var(--field); } .rep-msgs .by-target{ border-left:3px solid var(--lo); } .rep-msgs .by-rep{ border-left:3px solid var(--line); }
.rep-full{ margin-top:8px; }
.install-foot{ position:relative; z-index:1; display:flex; justify-content:center; padding:26px 16px 4px; }
.install-foot .btn{ display:inline-flex; align-items:center; gap:8px; }
.install-foot svg{ width:20px; height:20px; }
.loading-box{ display:grid; justify-items:center; gap:10px; }
.bubble-warn{ display:block; margin-top:6px; padding-top:6px; border-top:1px dashed currentColor; font-size:12px; font-style:normal; opacity:.8; }
/* Squelettes de chargement */
.sk{ display:block; height:12px; border-radius:6px; background:linear-gradient(90deg,var(--line) 25%,var(--s1) 50%,var(--line) 75%); background-size:200% 100%; animation:skShine 1.2s ease-in-out infinite; }
.sk-av{ width:52px; height:52px; border-radius:50%; flex:none; }
.sk-lines{ display:grid; gap:8px; flex:1; }
.sk-card .mc-head{ display:flex; align-items:center; gap:12px; }
.sk-card:hover{ transform:none; }
@keyframes skShine{ to{ background-position:-200% 0; } }
@media (prefers-reduced-motion: reduce){ .sk{ animation:none; } }

@keyframes spin{ to{ transform:rotate(360deg); } }

.brand-o{ color:var(--pk2,var(--pk)); font-weight:inherit; }
.mod-badge{ display:inline-block; width:1em; height:1em; margin-left:.28em; vertical-align:-.14em; flex:none; overflow:visible; }
.mod-badge .mb-seal{ fill:var(--pk); stroke:var(--pk); stroke-width:1.5; stroke-linejoin:round; }
.mod-badge .mb-check{ fill:none; stroke:var(--on-pk,#fff); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
.mod-tag{ display:inline-flex; align-items:center; gap:4px; padding:2px 10px 2px 6px; border-radius:999px; background:color-mix(in srgb,var(--pk) 16%,transparent); color:var(--pk2,var(--pk)); font-weight:700; font-size:12px; }
.mod-tag .mod-badge{ margin-left:0; }
.logo-mark{ width:44px; height:44px; display:block; background:var(--on-pk,#fff); -webkit-mask:var(--logo) center/contain no-repeat; mask:var(--logo) center/contain no-repeat; transition:transform .5s cubic-bezier(.3,1.6,.5,1), background .4s; animation:spinIn 1s cubic-bezier(.3,1.6,.5,1) both; }
.logo:hover .logo-mark{ transform:scale(1.1) rotate(-6deg); }
.logo:hover img{ transform:scale(1.12) rotate(-6deg); }
.logo svg{ width:32px; height:32px; transition:transform .5s cubic-bezier(.3,1.6,.5,1); animation:spinIn 1s cubic-bezier(.3,1.6,.5,1) both; }
.logo:hover svg{ transform:rotate(-12deg) scale(1.15); }
@keyframes spinIn{ from{ transform:rotate(-180deg) scale(0); } }
.navpill{ display:flex; gap:2px; padding:5px; background:var(--bg); border:1.5px solid var(--line); border-radius:var(--rp); }
.navpill a{ padding:6px 16px; border-radius:var(--rp); color:var(--pk); text-decoration:none; font:600 16px var(--fb); text-transform:var(--case); transition:background .2s, color .2s; white-space:nowrap; }
.navpill a:hover{ background:var(--s2); }
.navpill a[aria-current="page"]{ background:var(--pk); color:var(--on-pk); }
.top-right{ margin-left:auto; text-align:right; color:var(--pk); line-height:1.3; }
.top-right .live{ font-weight:700; display:inline-flex; align-items:center; gap:8px; }
.top-right .live::before{ content:''; width:8px; height:8px; border-radius:50%; background:var(--hi); animation:ping 2s ease-out infinite; }
.top-right small{ display:block; font-size:12px; color:var(--mu); }
.tabbar{ display:none; }
@media (max-width:860px){
  .navpill,.top-right{ display:none; }
  .top .notif-btn{ margin-left:auto; }
  .top{ padding-bottom:6px; }
  .tabbar{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:var(--bg); border-top:1.5px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); border-radius:22px 22px 0 0; }
  .tabbar a{ display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 0 9px; text-decoration:none; color:var(--mu); font-size:11px; font-weight:700; text-transform:var(--case); letter-spacing:0; position:relative; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .tabbar a[aria-current="page"]{ color:var(--pk2,var(--pk)); }
  .tabbar svg{ width:21px; height:21px; flex:none; }
  .frame{ padding-bottom:86px; }
}

/* ---------- Boutons pilule ---------- */
.btn{ --b:var(--s2); --t:var(--pk2); display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 22px;
  border:0; border-radius:var(--rp); background:var(--b); color:var(--t); font:700 15px var(--fb); text-transform:var(--case); cursor:pointer; text-decoration:none;
  position:relative; overflow:hidden; transition:filter .15s, transform .1s; }
.btn:hover{ filter:brightness(1.05); }
.btn:active{ transform:translateY(1px); }
.btn-ac{ --b:var(--pk); --t:var(--on-pk); }
.btn-lg{ min-height:52px; padding:0 30px; font-size:17px; }
.btn-ghost{ --b:transparent; --t:var(--pk2,var(--pk)); box-shadow:inset 0 0 0 1.5px var(--pk); }
.btn-danger{ --b:#FDE1E6; --t:#A8203C; }
.btn-sm{ min-height:36px; padding:0 16px; font-size:14px; }
.btn[disabled]{ opacity:.5; cursor:not-allowed; }
.linkbtn{ background:none; border:0; color:var(--mu); font:inherit; text-decoration:underline; cursor:pointer; padding:4px; }

/* ---------- Anneau de compatibilité ---------- */
@property --p{ syntax:'<number>'; inherits:true; initial-value:0; }
.ring{ --s:64px; --rb:var(--bg); width:var(--s); aspect-ratio:1; border-radius:50%; flex:none; position:relative; display:grid; place-items:center;
  background:conic-gradient(var(--c) calc(var(--p) * 1%), var(--s2) 0); }
.ring::before{ content:''; position:absolute; inset:6px; border-radius:50%; background:var(--rb); }
.ring span{ position:relative; font:400 calc(var(--s) * .27) var(--fd); color:var(--tx); }   /* le chiffre en couleur de texte, l'arc garde la couleur du score */
.ring small{ font-size:.55em; }
.ring-lg{ --s:120px; } .ring-lg::before{ inset:10px; }
.ring-sm{ --s:52px; } .ring-sm::before{ inset:5px; }

/* ---------- Avatars ---------- */
.av{ border-radius:var(--ri); flex:none; display:inline-grid; place-items:center; object-fit:cover; font:400 16px var(--fd); color:#fff;
  background:linear-gradient(140deg,hsl(var(--h) 80% 70%),hsl(calc(var(--h) + 40) 70% 50%)); }
.online{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--hi-tx); }
.online::before{ content:''; width:8px; height:8px; border-radius:50%; background:var(--hi); }

/* =========================================================
   ACCUEIL — panneau illustré avec coins découpés
   ========================================================= */
.hero2{ position:relative; }
.art{ position:relative; border-radius:var(--r); overflow:hidden; min-height:600px; background:var(--art-bg); }
.bloom{ position:absolute; inset:0; width:100%; height:100%; }
.art::after{ content:''; position:absolute; inset:0; pointer-events:none; background:var(--art-tint); }
.tab{ position:absolute; z-index:3; background:var(--bg); }
.tab::before,.tab::after{ content:''; position:absolute; width:var(--r); height:var(--r); pointer-events:none; }
.tl{ top:0; left:0; display:flex; align-items:center; gap:12px; padding:0 16px 14px 0; border-bottom-right-radius:var(--r); }
.tl::before{ left:100%; top:0; background:radial-gradient(circle at 100% 100%,transparent calc(var(--r) - .5px),var(--bg) var(--r)); }
.tl::after{ top:100%; left:0; background:radial-gradient(circle at 100% 100%,transparent calc(var(--r) - .5px),var(--bg) var(--r)); }
.tr{ top:0; right:0; padding:6px 8px 16px 24px; border-bottom-left-radius:var(--r); }
.tr::before{ right:100%; top:0; background:radial-gradient(circle at 0 100%,transparent calc(var(--r) - .5px),var(--bg) var(--r)); }
.tr::after{ top:100%; right:0; background:radial-gradient(circle at 0 100%,transparent calc(var(--r) - .5px),var(--bg) var(--r)); }
.tr .top-right{ display:block; }
.bl{ bottom:0; left:0; width:min(430px,42%); padding:26px 28px 4px 6px; border-top-right-radius:var(--r); display:grid; gap:14px; }
.bl::before{ bottom:100%; left:0; background:radial-gradient(circle at 100% 0,transparent calc(var(--r) - .5px),var(--bg) var(--r)); }
.bl::after{ left:100%; bottom:0; background:radial-gradient(circle at 100% 0,transparent calc(var(--r) - .5px),var(--bg) var(--r)); }
.bl h2{ font-size:clamp(30px,3.6vw,44px); line-height:1.05; }
.bl p{ color:var(--pk2); font-size:15px; max-width:36ch; }
.bl .hero-cta{ display:flex; gap:10px; flex-wrap:wrap; }
.hero-title{ position:absolute; right:32px; bottom:24px; z-index:2; text-align:right; color:var(--title); text-shadow:var(--title-shadow); -webkit-text-stroke:var(--title-stroke); paint-order:stroke fill; }
.hero-title small{ display:block; font:500 clamp(18px,2.4vw,30px) var(--fb); margin-bottom:2px; }
.hero-title strong{ display:block; font:400 clamp(44px,7.6vw,100px)/1 var(--fd); letter-spacing:.02em; }
.float-match{ position:absolute; z-index:2; top:110px; right:40px; display:grid; justify-items:center; gap:10px; padding:18px 22px;
  background:var(--glass); backdrop-filter:blur(8px); border-radius:var(--rc); box-shadow:0 18px 40px -18px rgba(120,20,70,.5); }
.float-match .duo{ display:flex; align-items:center; }
.float-match .duo > *:last-child{ margin-left:-12px; box-shadow:0 0 0 3px var(--bg); }
.float-match .duo > *:first-child{ box-shadow:0 0 0 3px var(--bg); }
.float-match .lbl{ font-weight:700; color:var(--pk2); font-size:14px; }
.float-match .ring{ --rb:var(--glass-solid); }

.steps{ list-style:none; margin:18px 0 0; padding:0; display:grid; gap:4px; counter-reset:s; }
.steps li{ counter-increment:s; display:grid; grid-template-columns:44px 1fr; gap:4px 12px; padding:10px 0; }
.steps li::before{ content:counter(s); grid-row:span 2; font:400 26px var(--fd); color:var(--pk); }
.steps b{ font-size:16px; color:var(--tx); }
.steps span{ color:var(--pk2); font-size:14px; }

.rows{ display:grid; margin-top:14px; }
.row{ display:grid; grid-template-columns:72px 1fr auto; gap:16px; align-items:center; padding:14px 0; border-bottom:1.5px solid var(--line); text-decoration:none; transition:transform .2s; }
.row:hover{ transform:translateX(6px); }
.row .av{ border-radius:var(--ri); }
.row p{ color:var(--pk2); font-size:14px; }
.row b{ display:block; color:var(--tx); font-size:16px; }

/* ---------- Pages ---------- */
.page{ padding:26px 0 48px; }
.page-head{ display:flex; justify-content:space-between; align-items:end; gap:16px; flex-wrap:wrap; margin-bottom:24px; }
.page-head p{ color:var(--pk2); margin-top:6px; }

.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr)); gap:16px; }   /* min(300px,100%) : pas de débordement sur les très petits écrans */
.mcard{ display:grid; gap:14px; padding:20px; background:var(--bg); border:1.5px solid var(--line); border-radius:var(--rc); text-decoration:none; transition:border-color .2s, transform .2s, box-shadow .2s; }
.mcard:hover{ border-color:var(--pk); transform:translateY(-3px); }
.mc-head{ display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; }
.mc-name{ font:700 18px var(--fb); color:var(--tx); display:block; overflow-wrap:anywhere; }
.facts{ margin:0; display:grid; gap:6px; font-size:14px; }
.facts div{ display:grid; grid-template-columns:118px 1fr; gap:8px; }
.facts dt{ color:var(--mu); }
.facts dd{ margin:0; color:var(--pk2); font-weight:600; }
.top-match{ grid-column:1 / -1; background:var(--s2); border-color:transparent; }
.top-match .ring{ --rb:var(--s2); }
@media (min-width:761px){ .top-match{ grid-template-columns:auto 1fr; align-items:center; column-gap:28px; padding:26px; } }
.mates-strip{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:28px; }
.mate-pill{ display:flex; align-items:center; gap:8px; padding:5px 14px 5px 5px; background:var(--bg); border:1.5px solid var(--line); border-radius:var(--rp); text-decoration:none; font-weight:700; color:var(--pk2); }
.mate-pill .av{ border-radius:50%; }
.empty{ text-align:center; padding:56px 20px; background:var(--s1); border:2px dashed var(--line); border-radius:var(--rc); display:grid; gap:14px; justify-items:center; }

/* ---------- Formulaires ---------- */
.form{ display:grid; grid-template-columns:minmax(0,1fr); gap:18px; }
.panel{ background:var(--s1); border-radius:var(--rc); padding:24px; display:grid; grid-template-columns:minmax(0,1fr); gap:18px; }
.field{ display:grid; grid-template-columns:minmax(0,1fr); gap:6px; }
.field label,.lbl{ font-weight:700; font-size:14px; color:var(--tx); }
.hint{ font-size:13px; color:var(--mu); }
.two{ display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
input[type=text],input[type=email],input[type=password],input[type=search],select,textarea{
  width:100%; min-height:46px; padding:10px 16px; background:var(--field); color:var(--tx); border:1.5px solid var(--line); border-radius:var(--ri); font:inherit; }
input:focus,select:focus,textarea:focus{ outline:none; border-color:var(--pk); box-shadow:0 0 0 3px color-mix(in srgb,var(--pk) 20%,transparent); }
.err{ color:#B81F45; font-size:14px; font-weight:600; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ min-height:38px; padding:0 16px; border-radius:var(--rp); border:1.5px solid var(--line); background:var(--field); color:var(--pk2); font:600 14px var(--fb); cursor:pointer; }
.chip[aria-pressed="true"]{ background:var(--pk); border-color:var(--pk); color:var(--on-pk); }
.chip[aria-pressed="true"]::before{ content:'✓ '; }
.tags{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
.avatar-pick{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
.avatar-pick button{ padding:0; border:3px solid transparent; border-radius:var(--ri); background:none; cursor:pointer; }
.avatar-pick button[aria-pressed="true"]{ border-color:var(--pk); }
.upload{ position:relative; overflow:hidden; }
.upload input{ position:absolute; inset:0; opacity:0; cursor:pointer; }
.toggle{ display:flex; justify-content:space-between; align-items:center; gap:16px; padding:12px 0; border-top:1.5px solid var(--line); }
.toggle:first-of-type{ border-top:0; }
.switch{ appearance:none; width:48px; height:28px; border-radius:var(--rp); background:var(--line); position:relative; cursor:pointer; flex:none; transition:background .15s; }
.switch::after{ content:''; position:absolute; top:4px; left:4px; width:20px; height:20px; border-radius:50%; background:var(--field); transition:transform .2s cubic-bezier(.3,1.6,.5,1); }
.switch:checked{ background:var(--pk); }
.switch:checked::after{ transform:translateX(20px); }
.strength{ height:5px; border-radius:3px; background:var(--line); overflow:hidden; }
.strength i{ display:block; height:100%; width:var(--w); background:var(--sc); transition:width .2s; }
.form-actions{ display:flex; gap:12px; flex-wrap:wrap; position:sticky; bottom:0; padding:14px 0; background:linear-gradient(transparent,var(--bg) 35%); }
@media (max-width:860px){ .form-actions{ bottom:calc(64px + env(safe-area-inset-bottom,0px)); } }

/* ---------- Recherche ---------- */
.filters{ display:grid; grid-template-columns:2fr 1.4fr auto; gap:12px; background:var(--s1); border-radius:var(--rc); padding:18px; margin-bottom:20px; align-items:end; }
.range-row{ display:flex; align-items:center; gap:10px; }
.range-row output{ font:400 16px var(--fd); color:var(--pk2,var(--pk)); min-width:52px; }
input[type=range]{ width:100%; accent-color:var(--pk); }
.count{ color:var(--pk2); margin-bottom:14px; font-size:14px; font-weight:600; }

/* ---------- Profil joueur ---------- */
.pp{ display:grid; grid-template-columns:minmax(0,1fr) 330px; grid-template-areas:'head side' 'main side'; gap:24px; align-items:start; }
.pp-head{ grid-area:head; } .pp-main{ grid-area:main; display:grid; gap:24px; min-width:0; } .pp-side{ grid-area:side; }
.pp-head{ display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
.pp-head h1{ font-size:clamp(30px,5vw,46px); overflow-wrap:anywhere; }
.pp-head .av{ border-radius:var(--rc); }
.pp-side{ position:sticky; top:96px; display:grid; gap:14px; justify-items:center; text-align:center; background:var(--s1); border-radius:var(--rc); padding:26px; }
.pp-side .ring{ --rb:var(--s1); }
.pp-side strong{ color:var(--pk2); }
.pp-side .btn{ width:100%; }
.breakdown{ display:grid; gap:10px; width:100%; text-align:left; }
.bd-row{ display:grid; grid-template-columns:1fr auto; gap:4px 10px; font-size:13px; font-weight:600; }
.bd-row .bar{ grid-column:1 / -1; height:8px; background:var(--s2); border-radius:var(--rp); overflow:hidden; }
.bd-row .bar i{ display:block; height:100%; width:var(--w); background:var(--k); border-radius:var(--rp); }
.gametag{ display:flex; justify-content:space-between; gap:8px; padding:11px 14px; background:var(--field); border:1.5px solid var(--line); border-radius:var(--ri); font-size:14px; font-weight:600; }
.gametag.shared{ border-color:var(--hi); }
.gametag em{ font-style:normal; color:var(--mu); overflow-wrap:anywhere; text-align:right; }
.safety{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; border-top:1.5px solid var(--line); padding-top:14px; width:100%; }
@media (max-width:900px){ .pp{ grid-template-columns:minmax(0,1fr); grid-template-areas:'head' 'side' 'main'; } .pp-side{ position:static; } }   /* téléphone : qui c'est, puis la compatibilité et le bouton, puis le détail */

/* ---------- Modale & toast ---------- */
dialog{ border:0; border-radius:var(--rc); background:var(--bg); color:var(--tx); padding:26px; width:min(480px,calc(100% - 32px)); }
dialog::backdrop{ background:rgba(74,34,56,.55); }
dialog h3{ margin-bottom:10px; font:400 22px var(--fd); color:var(--pk); }
.dlg-actions{ display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top:20px; }
.radio-list{ display:grid; gap:8px; margin:14px 0; }
.radio-list label{ display:flex; gap:10px; align-items:center; padding:10px 14px; border:1.5px solid var(--line); border-radius:var(--ri); cursor:pointer; }
.radio-list input{ accent-color:var(--pk); }
.toast{ position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,20px); opacity:0; z-index:50;
  background:var(--tx); color:var(--bg); font-weight:700; padding:12px 20px; border-radius:var(--rp); transition:.25s; pointer-events:none; max-width:calc(100% - 32px); }
.toast.show{ opacity:1; transform:translate(-50%,0); }
@media (max-width:860px){ .toast{ bottom:calc(88px + env(safe-area-inset-bottom,0px)); } }

/* ---------- Responsive ---------- */
@media (max-width:980px){
  .float-match{ top:auto; bottom:150px; right:20px; scale:.85; transform-origin:bottom right; }
}
@media (max-width:760px){
  .art{ min-height:440px; }
  .tl .navpill,.tr{ display:none; }
  .bl{ position:static; width:auto; padding:24px 6px 0; border-radius:0; }
  .bl::before,.bl::after{ display:none; }
  .hero-title{ right:20px; bottom:18px; }
  .float-match{ top:90px; bottom:auto; right:14px; padding:12px 14px; transform-origin:top right; }
  .two{ grid-template-columns:1fr; }
  
  
  .facts div{ grid-template-columns:104px 1fr; }
  .frame{ width:calc(100% - 16px); margin:8px auto; border-radius:var(--rc); padding:10px; }
}

/* =========================================================
   THÈMES — chaque thème redéfinit les variables
   ========================================================= */
html.skin-anim, html.skin-anim body, html.skin-anim *, html.skin-anim *::before, html.skin-anim *::after{
  transition:background-color .3s ease, color .3s ease, border-color .3s ease, box-shadow .3s ease, fill .3s ease !important; }

html[data-skin="lofi"]{
  --frame:#16112A; --frame-bg:#16112A;
  --bg:#251E3B; --s1:#2E2649; --s2:#3B3159; --line:#4D4170; --tx:#F6E7D7; --mu:#BBA9C9;
  --pk:#FFB37C; --pk2:#FFCCA6; --on-pk:#2B1A10; --field:#1E1832; --glass:rgba(37,30,59,.85); --glass-solid:#251E3B;
  --hi:#7EE0B5; --mid:#FFD27A; --warm:#FF9F6B; --lo:#FF7A8A;
  --fd:'Righteous',sans-serif; --fb:'Nunito','Segoe UI',sans-serif; --fdw:400; --case:lowercase;
  --art-bg:#1E1638; --art-tint:linear-gradient(200deg,transparent 55%,rgba(20,10,40,.55));
  --title:#FFE9C7; --title-shadow:0 0 34px rgba(255,170,110,.55);
  color-scheme:dark;
}
html[data-skin="lofi"] body::after{ content:''; position:fixed; inset:-50%; pointer-events:none; z-index:100; opacity:.08;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain 1s steps(4) infinite; }
@keyframes grain{ 25%{ transform:translate(-3%,2%); } 50%{ transform:translate(2%,-3%); } 75%{ transform:translate(-2%,-2%); } }

/* --- Esthétique --- */
html[data-skin="esth"]{
  --frame:#C9B8FF; --frame-bg:linear-gradient(120deg,#C9B8FF,#FFC2DF,#BFF0E0,#C9B8FF);
  --bg:#FCFAFF; --s1:#F4EFFF; --s2:#E9E0FF; --line:#DACFF7; --tx:#2E2A4A; --mu:#6C6595;
  --pk:#7B59EE; --pk2:#6448D2; --on-pk:#fff; --field:#fff; --glass:rgba(255,255,255,.75); --glass-solid:#fff;
  --fd:'Syne',sans-serif; --fdw:800; --fb:'DM Sans','Segoe UI',sans-serif; --case:lowercase;
  --rc:32px; --art-bg:#A99BFF; --art-tint:none; --title:#fff; --title-shadow:0 4px 30px rgba(110,70,220,.55);
}
html[data-skin="esth"] body{ background-size:300% 300%; animation:hueShift 18s ease infinite; }
@keyframes hueShift{ 50%{ background-position:100% 50%; } }
html[data-skin="esth"] h2::after{ content:' ✦'; font-size:.55em; vertical-align:middle; }

/* --- Sombre (gaming) --- */
html[data-skin="sombre"]{
  --frame:#07060F; --frame-bg:#07060F;
  --bg:#110E24; --s1:#1B1738; --s2:#262052; --line:#3B3478; --tx:#EEEAFF; --mu:#A9A2D3;
  --pk:#FF4D8D; --pk2:#FF8FB7; --on-pk:#22060F; --field:#0C0A1C; --glass:rgba(27,23,56,.85); --glass-solid:#1B1738;
  --hi:#3EE6B5; --mid:#FFC23D; --warm:#FF8A3D; --lo:#FF5A6E;
  --fd:'Chakra Petch',sans-serif; --fdw:700; --fb:'Sora','Segoe UI',sans-serif; --case:none;
  --art-bg:#04041A; --art-tint:none;
  --title:#fff; --title-shadow:0 0 30px rgba(255,77,141,.55);
  color-scheme:dark;
}
/* --- Océan --- */
html[data-skin="ocean"]{
  --frame:#2F7FD8; --frame-bg:#2F7FD8;
  --bg:#FFFFFF; --s1:#F2F8FF; --s2:#DDEBFF; --line:#C2DAF7; --tx:#10284A; --mu:#56708F;
  --pk:#1F6FD1; --pk2:#1858A8; --on-pk:#fff;
  --fd:'Chakra Petch',sans-serif; --fdw:700; --fb:'Sora','Segoe UI',sans-serif; --case:none;
  --art-bg:#1E86D6; --art-tint:linear-gradient(200deg,transparent 55%,rgba(5,30,80,.35));
  --title-shadow:0 2px 20px rgba(10,40,90,.5);
}
/* --- Menthe --- */
html[data-skin="menthe"]{
  --frame:#2FAE87; --frame-bg:#2FAE87;
  --bg:#FFFFFF; --s1:#F1FBF7; --s2:#D9F3E9; --line:#BFE6D6; --tx:#0F3A2D; --mu:#4B7666;
  --pk:#118365; --pk2:#0E6E54; --on-pk:#fff; --hi:#0F8F66;
  --fd:'Chakra Petch',sans-serif; --fdw:700; --fb:'Sora','Segoe UI',sans-serif; --case:none;
  --art-bg:#EAFBF4; --art-tint:none;
  --title:#0E6B4F; --title-shadow:0 2px 14px rgba(255,255,255,.8);
}

/* --- Défaut (thème par défaut) --- */
html[data-skin="defaut"]{
  --frame:#0D0F1E; --frame-bg:#0D0F1E;
  --bg:#0D0F1E; --s1:#171A2E; --s2:#20243C; --line:#2E3350; --tx:#F2F3FF; --mu:#9BA2C8;
  --pk:#7654FF; --pk2:#B4A1FF; --on-pk:#FFFFFF; --field:#0B0D1A; --glass:rgba(23,26,46,.86); --glass-solid:#171A2E;
  --hi:#C8FF4D; --mid:#FFC93D; --warm:#FF8A3D; --lo:#FF5A7A;
  --fd:'Outfit',sans-serif; --fdw:700; --fb:'Inter','Segoe UI',sans-serif; --case:none;
  --rf:28px; --rc:18px; --ri:12px; --r:24px;
  --art-bg:radial-gradient(circle at 75% 35%,#5B3FE8,#1A1640 60%,#0F1120);
  --art-tint:linear-gradient(200deg,transparent 50%,rgba(124,92,255,.18));
  --title:#fff; --title-shadow:0 0 30px rgba(124,92,255,.6);
  color-scheme:dark;
}
html:is([data-skin="defaut"],[data-skin="sombre"]) .top-right .live::before{ background:var(--hi); }
html:is([data-skin="defaut"],[data-skin="sombre"]) h2{ letter-spacing:-.01em; }

/* --- Samouraï --- */
html[data-skin="samurai"]{
  --frame:#C41E3A;
  --frame-bg:
    radial-gradient(circle at 100% 150%,#C41E3A 24%,#D23A52 24% 28%,#C41E3A 28% 36%,#D23A52 36% 40%,transparent 40%),
    radial-gradient(circle at 0 150%,#C41E3A 24%,#D23A52 24% 28%,#C41E3A 28% 36%,#D23A52 36% 40%,transparent 40%),
    radial-gradient(circle at 50% 100%,#D23A52 10%,#C41E3A 10% 23%,#D23A52 23% 30%,#C41E3A 30% 43%,#D23A52 43% 50%,#C41E3A 50% 63%,#D23A52 63% 71%,transparent 71%),
    radial-gradient(circle at 100% 50%,#D23A52 5%,#C41E3A 5% 15%,#D23A52 15% 20%,#C41E3A 20% 29%,#D23A52 29% 34%,#C41E3A 34% 44%,#D23A52 44% 49%,transparent 49%),
    radial-gradient(circle at 0 50%,#D23A52 5%,#C41E3A 5% 15%,#D23A52 15% 20%,#C41E3A 20% 29%,#D23A52 29% 34%,#C41E3A 34% 44%,#D23A52 44% 49%,transparent 49%) , #C41E3A;
  --bg:#F4ECE1; --s1:#EFE4D5; --s2:#E6D6C2; --line:#D9C3A9; --tx:#1E1416; --mu:#6B5752;
  --pk:#C41E3A; --pk2:#9A152D; --on-pk:#fff; --field:#FBF6EF; --glass:rgba(244,236,225,.92); --glass-solid:#F4ECE1;
  --hi:#2C7A57; --mid:#A8730C; --warm:#C25218; --lo:#C41E3A;
  --fd:'Anton',Impact,'Arial Narrow',sans-serif; --fdw:400; --fb:'Source Sans 3','Segoe UI',sans-serif; --case:uppercase;
  --rf:22px; --rc:14px; --ri:10px; --r:22px;
  --art-bg:
    radial-gradient(circle at 100% 150%,#F4ECE1 24%,#E8D9C6 24% 28%,#F4ECE1 28% 36%,#E8D9C6 36% 40%,transparent 40%),
    radial-gradient(circle at 0 150%,#F4ECE1 24%,#E8D9C6 24% 28%,#F4ECE1 28% 36%,#E8D9C6 36% 40%,transparent 40%),
    radial-gradient(circle at 50% 100%,#E8D9C6 10%,#F4ECE1 10% 23%,#E8D9C6 23% 30%,#F4ECE1 30% 43%,#E8D9C6 43% 50%,#F4ECE1 50% 63%,#E8D9C6 63% 71%,transparent 71%),
    radial-gradient(circle at 100% 50%,#E8D9C6 5%,#F4ECE1 5% 15%,#E8D9C6 15% 20%,#F4ECE1 20% 29%,#E8D9C6 29% 34%,#F4ECE1 34% 44%,#E8D9C6 44% 49%,transparent 49%),
    radial-gradient(circle at 0 50%,#E8D9C6 5%,#F4ECE1 5% 15%,#E8D9C6 15% 20%,#F4ECE1 20% 29%,#E8D9C6 29% 34%,#F4ECE1 34% 44%,#E8D9C6 44% 49%,transparent 49%) , #F4ECE1;
  --art-tint:none; --title:#C41E3A; --title-shadow:none; --title-stroke:0 transparent;
}
html[data-skin="samurai"], html[data-skin="samurai"] body{ background-size:100px 50px; }

/* =========================================================
   ANIMATIONS
   ========================================================= */
.page-in{ animation:pageIn .45s cubic-bezier(.2,.8,.2,1) both; }
@keyframes pageIn{ from{ opacity:0; transform:translateY(14px); } }
.mcard{ animation:cardIn .5s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i,0) * 70ms); position:relative; overflow:hidden; }
@keyframes cardIn{ from{ opacity:0; transform:translateY(24px) scale(.97); } }
.mcard:hover{ box-shadow:0 16px 36px -18px var(--c); }
.mcard::after{ content:''; position:absolute; inset:0; pointer-events:none; background:linear-gradient(115deg,transparent 35%,color-mix(in srgb,var(--pk) 16%,transparent) 50%,transparent 65%); transform:translateX(-100%); }
.mcard:hover::after{ transform:translateX(100%); transition:transform .7s ease; }
.mcard .ring{ animation:fill 1.2s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i,0) * 70ms + .15s); }
@keyframes fill{ from{ --p:0; } }
.ring.glow{ animation:fill 1.2s cubic-bezier(.2,.8,.2,1) both, glow 2.4s ease-in-out 1.4s infinite; }
@keyframes glow{ 50%{ box-shadow:0 0 20px -4px var(--c); } }
.btn::after{ content:''; position:absolute; top:0; bottom:0; width:40%; left:-60%; pointer-events:none; background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent); transform:skewX(-20deg); }
.btn:hover::after{ left:130%; transition:left .6s ease; }
.btn-ac{ animation:breathe 3s ease-in-out infinite; }
@keyframes breathe{ 50%{ box-shadow:0 0 0 6px color-mix(in srgb,var(--pk) 18%,transparent); } }
.tabbar a[aria-current="page"] svg{ animation:hop .45s cubic-bezier(.3,1.6,.5,1); }
@keyframes hop{ 40%{ transform:translateY(-5px) scale(1.12); } }

/* Accueil */
.art{ animation:artIn .9s cubic-bezier(.2,.8,.2,1) both; }
@keyframes artIn{ from{ clip-path:inset(0 0 100% 0 round var(--r)); } to{ clip-path:inset(0 0 0 0 round var(--r)); } }
.sway{ transform-box:fill-box; transform-origin:50% 90%; animation:sway 5s ease-in-out infinite alternate; animation-delay:calc(var(--sd) * -1); }
@keyframes sway{ to{ transform:rotate(2.5deg) translateY(-4px); } }
.petal{ animation:fall var(--dur) linear infinite; animation-delay:calc(var(--dl) * -1); }
@keyframes fall{ from{ transform:translate(0,0) rotate(0); } to{ transform:translate(var(--dx),720px) rotate(540deg); } }
.hero-title .w{ display:inline-block; animation:wordUp .8s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--d) * 70ms + .5s); }
@keyframes wordUp{ from{ opacity:0; transform:translateY(60%) rotate(6deg); } }
.hero-title small{ animation:pageIn .6s ease .4s both; }
.float-match{ animation:floatIn .8s cubic-bezier(.3,1.4,.5,1) .7s both, bob 5s ease-in-out 1.6s infinite; }
@keyframes floatIn{ from{ opacity:0; transform:translateY(30px) scale(.85); } }
@keyframes bob{ 50%{ translate:0 -8px; } }
.float-match .ring{ animation:fill 1.6s cubic-bezier(.2,.8,.2,1) .9s both, glow 2.4s ease-in-out 2.6s infinite; }
.bl > *{ animation:pageIn .6s cubic-bezier(.2,.8,.2,1) both; }
.bl > *:nth-child(2){ animation-delay:.1s; } .bl > *:nth-child(3){ animation-delay:.2s; }
.reveal{ opacity:0; transform:translateY(24px); transition:opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1); transition-delay:calc(var(--d,0) * 90ms); }
.reveal.in{ opacity:1; transform:none; }

@keyframes grow{ from{ transform:scaleX(0); } }

/* Formulaire */

.cscene{ position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.cs-l{ position:absolute; left:0; bottom:0; width:100%; height:100%; will-change:transform; }
.cs-sky{ transform:translateY(calc(var(--sy,0) * .25px)); }
.cs-far{ transform:translateY(calc(var(--sy,0) * .18px)); }
.cs-mid{ transform:translateY(calc(var(--sy,0) * .1px)); }

.cs-sun{ fill:#D4FF3F; }
.cs-glow{ animation:csGlow 6s ease-in-out infinite; transform-origin:1210px 250px; }
.cs-clouds path{ fill:var(--cs-cloud); }
.cs-clouds{ animation:csDrift 40s linear infinite alternate; }
.cs-city rect, .cs-city circle:not(.cs-blink){ fill:var(--cs-far); }
.cs-win{ fill:#D4FF3F; opacity:.8; }
.cs-win-b{ animation:csTw 3s steps(2) infinite; }
.cs-hill1{ fill:var(--cs-h1); }
.cs-mast path{ stroke:var(--cs-h2); }
.cs-wave{ stroke:#D4FF3F !important; opacity:0; animation:csWave 2.4s ease-out infinite; }
.cs-blink{ fill:#FF5A7A; animation:csTw 1.6s steps(2) infinite; }
.cs-hill2{ fill:var(--cs-h2); }
.cs-tree path, .cs-tree ellipse{ fill:var(--cs-h3); stroke:var(--cs-h3); }
.cs-house rect:not(.cs-win), .cs-house path{ fill:var(--cs-h3); }
.cs-hill3{ fill:var(--cs-h3); }
.cs-fly{ fill:#D4FF3F; animation:csFly 7s ease-in-out infinite; filter:drop-shadow(0 0 4px #D4FF3F); }
.cs-fg{ fill:var(--cs-fg); }
.cs-fg2{ fill:var(--cs-fg2); }
.cs-flower{ fill:#D4FF3F; }
.cs-sway{ transform-origin:150px 900px; animation:csSway 7s ease-in-out infinite; }
.cs-sway-r{ transform-origin:1450px 900px; animation-delay:-3.5s; }
@keyframes csTw{ 50%{ opacity:.15; } }
@keyframes csGlow{ 50%{ transform:scale(1.08); opacity:.8; } }
@keyframes csDrift{ to{ transform:translateX(60px); } }
@keyframes csWave{ 0%{ opacity:0; transform:translateY(6px); } 30%{ opacity:.9; } 100%{ opacity:0; transform:translateY(-8px); } }
@keyframes csFly{ 0%,100%{ transform:translate(0,0); opacity:.2; } 50%{ transform:translate(14px,-26px); opacity:1; } }
@keyframes csSway{ 0%,100%{ transform:rotate(0deg); } 50%{ transform:rotate(2.2deg); } }

@media (max-width:760px){

<style id="coopo-rev">

[hidden]{ display:none !important; }   /* un élément masqué le reste, même si une autre règle lui donne un affichage (le bouton Installer restait visible dans l'appli installée) */

:root{ --hi-tx:color-mix(in srgb,var(--hi) 55%,var(--tx)); --mid-tx:color-mix(in srgb,var(--mid) 45%,var(--tx)); --warm-tx:color-mix(in srgb,var(--warm) 45%,var(--tx)); --lo-tx:color-mix(in srgb,var(--lo) 70%,var(--tx)); --mu-tx:color-mix(in srgb,var(--mu) 60%,var(--tx)); }

.to-banner .sq-game{ background:var(--s1); }

  .board-tabs .chip{ flex:1 1 auto; justify-content:center; padding-left:10px; padding-right:10px; }
  @media (max-width:340px){ .board-tabs .chip{ font-size:13px; padding-left:7px; padding-right:7px; } .board-tabs .cnt{ margin-left:4px; } }

}

.sp-art .sp-p{ position:absolute; display:block; background:#fff; -webkit-mask:var(--m) 0 0/100% 100% no-repeat; mask:var(--m) 0 0/100% 100% no-repeat; }
.sp-art .sp-pl{ --m:var(--m-pl); left:0; top:0; width:100%; height:100%; transform-origin:50% 52%; animation:spPlan 1.6s ease-in-out var(--land) infinite alternate; }   /* la planète se balance doucement */
.sp-art .sp-an{ --m:var(--m-an); left:0; top:0; width:100%; height:100%; transform-origin:50% 55%; animation:spAnneau .5s ease-in-out infinite alternate, spAnneau 2.2s ease-in-out var(--land) infinite alternate; }   /* l'anneau oscille : vite pendant le vol, lentement une fois posé */
@keyframes spPlan{ from{ transform:rotate(-3deg); } to{ transform:rotate(3deg); } }
@keyframes spAnneau{ from{ transform:rotate(-6deg) scale(1.02,.96); } to{ transform:rotate(5deg) scale(.98,1.04); } }
.sp-fish .sp-art{ filter:drop-shadow(0 0 12px rgba(var(--sp-a),.45)); }
.sp-body{ transform:rotate(-58deg); animation:spTravel .78s linear .06s both; }
html.sp-quick .sp-body{ animation:spPop .36s cubic-bezier(.2,.9,.3,1.2) both; }
html.sp-quick .sp-echo{ display:none; }
.sp-squash{ animation:spLand .5s cubic-bezier(.3,1.4,.5,1) calc(var(--land) - .04s) both; }
.sp-bob{ animation:spBob 2.4s ease-in-out calc(var(--land) + .45s) infinite; }
.sp-echo{ opacity:0; animation:spTravelE .78s linear calc(.06s + var(--k) * 58ms) both; }
.sp-echo .sp-art{ transform:rotate(58deg) scale(var(--e)); }
.sp-echo b{ background:rgb(var(--c)); opacity:var(--o); }
/* halo et ondes à l'atterrissage */
.sp-glow{ position:absolute; left:50%; top:50%; width:0; height:0; transition:opacity .3s ease; }
#splash.out .sp-glow{ opacity:0; }
.sp-halo{ position:absolute; left:-150px; top:-150px; width:300px; height:300px; border-radius:50%; background:radial-gradient(closest-side,rgba(var(--sp-a),.26),rgba(var(--sp-a),.08) 55%,rgba(var(--sp-a),0)); animation:spHaloIn .7s ease-out var(--land) both, spHalo 3s ease-in-out calc(var(--land) + .7s) infinite; }
.sp-rip{ position:absolute; left:-75px; top:30px; width:150px; height:44px; border-radius:50%; border:1.5px solid rgba(var(--sp-a),.42); opacity:0; animation:spRip 2.6s cubic-bezier(.15,.6,.3,1) var(--land) infinite; }
.sp-rip + .sp-rip{ animation-delay:calc(var(--land) + 1.3s); }
/* départ : la planète recule un instant puis file vers le haut-droite, sa traînée derrière elle ; le voile se lève */
#splash.out .sp-fish{ animation:spDash .48s both; }
#splash.out .sp-bob{ animation-play-state:paused; }
#splash.out .sp-art .sp-an{ animation:spAnneau .12s ease-in-out infinite alternate; }
#splash.out .sp-echo{ animation:spDashE .4s cubic-bezier(.3,0,.8,.6) calc(.07s + var(--k) * 30ms) both; }
/* le nom, le message, l'astuce */
.sp-txt{ position:absolute; inset:0; pointer-events:none; transition:opacity .25s ease, transform .3s ease; }
#splash.out .sp-txt{ opacity:0; transform:translateY(10px); }
.sp-in{ position:absolute; left:0; right:0; top:calc(40% + var(--fs) / 2 + 14px); display:grid; justify-items:center; gap:8px; padding:0 24px; }
.sp-name{ display:block; font:700 34px/1 'Outfit',system-ui,sans-serif; letter-spacing:.01em; white-space:nowrap; }
.sp-name i{ display:inline-block; font-style:normal; animation:spLetter .55s cubic-bezier(.2,.9,.3,1.25) calc(var(--land) - .12s + var(--i,0) * 55ms) both; }
.sp-name i:nth-child(2){ --i:1; } .sp-name i:nth-child(3){ --i:2; } .sp-name i:nth-child(4){ --i:3; } .sp-name i:nth-child(5){ --i:4; }
.sp-msg{ margin:0; min-height:1.6em; font-size:14px; color:#fff; animation:spFade .45s ease calc(var(--land) + .12s) both; }
.sp-tip{ position:absolute; left:0; right:0; bottom:calc(30px + env(safe-area-inset-bottom,0px)); margin:0 auto; padding:0 24px; max-width:440px; font-size:13px; line-height:1.5; color:#fff; text-shadow:0 1px 8px rgba(var(--w-top),.9); text-wrap:balance; animation:spFade .5s ease calc(var(--land) + .35s) both; }
@media (max-height:480px){ .sp-tip{ display:none; } }
.sp-name,.sp-msg{ text-shadow:0 1px 10px rgba(var(--w-top),.9); }
@keyframes spFade{ from{ opacity:0; } }
@keyframes spLetter{ from{ opacity:0; transform:translateY(14px) scale(.85); } to{ opacity:1; transform:none; } }
@keyframes spPop{ from{ transform:translate(0,.3em) rotate(-58deg) scale(.4,.4); opacity:0; } to{ transform:translate(0,0) rotate(-58deg) scale(1,1); opacity:1; } }

/* mode léger (petits téléphones) : la planète est tout de suite à sa place et se balance doucement, rien d'autre ne bouge */
html.lite .sp-echo, html.lite .sp-motes, html.lite .sp-rip{ display:none; }
html.lite .sp-fish .sp-art{ filter:none; }
html.lite #splash .sp-bob{ animation:spBob 2.4s ease-in-out infinite !important; }
html.lite #splash.out{ opacity:0; transition:opacity .35s ease, visibility 0s linear .35s; }
html.lite #splash.out .sp-fish{ animation:none !important; }
/* « réduire les animations » : rien ne bouge, l'écran s'efface simplement */
@media (prefers-reduced-motion:reduce){
  #splash *, html.lite #splash .sp-bob, html.lite #splash .sp-bw, html.lite #splash .sp-art :is(.sp-pl,.sp-an){ animation:none !important; }
  .sp-echo, .sp-motes, .sp-rip{ display:none; }
  #splash.out{ opacity:0; transition:opacity .35s ease, visibility 0s linear .35s; }
}
/* ---- Boutons de l'en-tête : verre sombre, comme sur l'accueil ---- */
.top .notif-btn,.top .skin-btn{ background:rgba(var(--w-top),.5); border-color:rgba(255,255,255,.24); color:#fff; box-shadow:none; }
@supports ((-webkit-backdrop-filter:blur(2px)) or (backdrop-filter:blur(2px))){ html:not(.lite) .top :is(.notif-btn,.skin-btn){ -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); } }
/* ---- Puces posées sur le décor (tri, onglets de la communauté, jeux du moment) : verre sombre ; la puce choisie ressort ---- */
:is(.sort-row,.board-tabs) .chip, .pulse-chip{ background:rgba(var(--w-top),.46); border-color:rgba(255,255,255,.3); color:#fff; box-shadow:none; }
.pulse-chip i{ color:rgba(255,255,255,.86); }
:is(.sort-row,.board-tabs) .chip[aria-pressed="true"], .pulse-chip.on{ background:var(--cta-b); border-color:var(--cta-b); color:var(--cta-t); box-shadow:0 8px 18px -10px rgba(0,0,0,.55); }
.pulse-chip.on i{ color:inherit; }
.board-tabs .cnt{ background:#fff; color:rgb(var(--w-top)); }
.board-tabs .chip[aria-pressed="true"] .cnt{ background:var(--cta-t); color:var(--cta-b); }
/* ---- Conversation : le correspondant dans une pastille de verre sombre (lisible sur n'importe quel dessin) ---- */
.chat-who{ padding:5px 14px 5px 5px; border-radius:999px; background:rgba(var(--w-top),.62); border:1px solid rgba(255,255,255,.22); }
html[data-skin] body .chat-who :is(b,.muted,.online){ text-shadow:none; }
.chat-who .av{ border-radius:50% !important; }
/* ---- Petits ornements des titres, recolorés pour le décor ---- */
html[data-skin] body .page-head h2{ animation:none; background:none; -webkit-background-clip:border-box; background-clip:border-box; }
html:is([data-skin="defaut"],[data-skin="sombre"]) .page-head h2::after{ color:#D4FF3F; text-shadow:none; }
html[data-skin="menthe"] .page-head h2::after{ color:#F3EDA8; text-shadow:none; }
html[data-skin="ocean"] body .page-head h2{ padding-bottom:12px; background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='8'><path d='M0 4 Q10 0 20 4 T40 4' fill='none' stroke='%239FD8FF' stroke-width='2.5'/></svg>") 0 100%/40px 8px repeat-x; animation:waveX 2s linear infinite; }
.wrap.page > h3 .online::before{ box-shadow:0 0 0 2px rgba(255,255,255,.9); }
/* ---- Blocs qui étaient teintés et transparents : sur le décor, ils deviennent une vraie surface ou un verre sombre ---- */
.dispo-me{ background:var(--s1); border:1px solid var(--hair); box-shadow:var(--e1); margin-bottom:0; }
.pp-dispo{ background:rgba(var(--w-top),.62); border-color:rgba(255,255,255,.22); color:#fff; }
.pp-dispo em{ color:rgba(255,255,255,.88); }
.pp-meta .mod-tag{ background:#fff; color:rgb(var(--w-top)); text-shadow:none; }
dialog > h3{ color:var(--pk2,var(--pk)); }
/* fenêtres : les champs respirent, et les boutons du bas restent visibles même quand la fenêtre est plus haute que l'écran (petits téléphones) */
dialog .field + .field, dialog p + .field{ margin-top:14px; }
/* la barre touche le bas de la fenêtre : la marge du bas passe de la fenêtre à la barre (sinon le contenu se voyait dessous pendant le défilement) */
dialog:has(> .dlg-actions:last-child){ padding-bottom:0; }
dialog:has(> .dlg-actions:last-child) > .dlg-actions:last-child{ position:sticky; bottom:0; margin:20px -26px 0; padding:12px 26px 26px; background:var(--bg); box-shadow:0 -12px 14px -8px var(--bg); }
/* thèmes pas encore en vente : les prix restent lisibles (bordure en pointillés au lieu d'un bloc grisé) */
.buy-soon .buy-opt{ opacity:1; border-style:dashed; background:none; }
.buy-soon .buy-opt strong{ color:var(--mu); }
/* ---- Ordinateur : menu du haut, infos de connexion et panneau des pages Connexion / Inscription ---- */
.navpill{ background:var(--s1); border:1px solid var(--hair); box-shadow:var(--e1); }
.navpill a{ color:var(--pk2,var(--pk)); }
.top-right{ padding:5px 14px; border-radius:18px; background:rgba(var(--w-top),.5); border:1px solid rgba(255,255,255,.2); }
html[data-skin] body .top-right, html[data-skin] body .top-right :is(small,a){ text-shadow:none; }
.top-right:empty{ display:none; }

.auth-steps li:not(.on){ background:rgba(10,11,14,.56); border:1px solid rgba(255,255,255,.16); color:#fff; }

<style id="coopo-plaques">
/* ==== Plaques nominatives, façon Discord ====
   Une plaque = un bandeau décoré DERRIÈRE toute la ligne d'un joueur (photo, pseudo, statut) : une couleur de fond, un dessin à droite
   qui s'efface vers la gauche, et une animation qui ne joue que quand on passe la souris sur la ligne (ou là où la plaque est mise en avant, avec la
   classe .plq-live : profil, en-tête d'une conversation, boutique). Le reste du temps la plaque est une image fixe : elle ne coûte rien au téléphone.
   Chaque plaque apporte son fond ET sa couleur de texte : le pseudo reste lisible dans tous les thèmes.
     .plq-on.pq-<nom>  la ligne qui porte la plaque (c'est elle qui fixe les couleurs --pa, --pb et --ptx)
     .plq              le bandeau, glissé en premier dans la ligne          .plq > i   la « fenêtre » du dessin, collée à droite
   Les dessins sont originaux. Ils sont décrits dans atelier/plaques/dessins.py, et ce bloc est fabriqué par atelier/plaques/gen.py (voir le LISEZ-MOI de ce dossier) :
   pour changer une plaque, on modifie son dessin là-bas puis on relance gen.py et poser.py, plutôt que de retoucher ce bloc à la main. */
.plq-on{ --pa:#2A2D3A; --pb:#4A5070; --ptx:#fff; position:relative; isolation:isolate; }
.plq{ position:absolute; top:var(--plq-y,0); bottom:var(--plq-y,0); left:var(--plq-x,0); right:var(--plq-x,0); z-index:-1; overflow:hidden; border-radius:var(--plq-r,inherit); pointer-events:none; background:linear-gradient(100deg,var(--pa) 30%,var(--pb)); transition:filter .2s; }
.plq-on:hover > .plq{ filter:brightness(1.07) saturate(1.05); }
.plq::before{ content:''; position:absolute; left:0; top:0; width:100%; height:100%; z-index:3; border-radius:inherit; box-shadow:inset 0 0 0 1px rgba(255,255,255,.13), inset 0 1px 0 rgba(255,255,255,.15); }
.plq::after{ content:''; position:absolute; left:0; top:0; width:100%; height:100%; z-index:2; background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.2) 50%,transparent 58%); transform:translateX(-120%); }
.plq-on:is(:hover,:focus-visible,.plq-live) > .plq::after{ animation:plqShine 5s ease-in-out infinite; }
.plq > i{ position:absolute; top:0; right:0; height:100%; aspect-ratio:4/1; max-width:74%; overflow:hidden; background:var(--art,none) right center/auto 100% no-repeat;
  -webkit-mask-image:linear-gradient(90deg,transparent,rgba(0,0,0,.55) 36%,#000 68%); mask-image:linear-gradient(90deg,transparent,rgba(0,0,0,.55) 36%,#000 68%); }
@supports not (aspect-ratio:1){ .plq > i{ width:62%; } }
.plq > i::before, .plq > i::after{ content:''; position:absolute; left:0; right:0; top:0; height:100%; background-repeat:no-repeat; background-position:right center; background-size:auto 100%; }
/* le texte posé sur une plaque */
.plq-on.plq-on, .plq-on.plq-on b, .plq-on.plq-on strong, .plq-on.plq-on h1, .plq-on.plq-on h2, .plq-on.plq-on h3, .plq-on.plq-on small, .plq-on.plq-on em, .plq-on.plq-on .muted, .plq-on.plq-on .online, .plq-on.plq-on .mc-name, .plq-on.plq-on .me-name, .plq-on.plq-on .me-stats, .plq-on.plq-on .rejoue, .plq-on.plq-on .plq-t, .plq-on.plq-on .sn-st, .plq-on.plq-on .x{ color:var(--ptx) !important; text-shadow:var(--pts,0 1px 2px rgba(0,0,0,.5)) !important; -webkit-text-fill-color:currentColor; }
.plq-on.plq-on .muted, .plq-on.plq-on .sn-st{ opacity:.86; }
/* le pseudo seul dans un petit bandeau : là où il n'y a pas de ligne (message d'un groupe, phrase) */
.plq-chip{ display:inline-flex; align-items:center; max-width:100%; min-width:0; min-height:1.8em; padding:.14em 4.4em .16em .62em; border-radius:.5em; font-weight:700; line-height:1.3; vertical-align:middle; text-transform:none; letter-spacing:0; }
.plq-chip > .plq > i{ max-width:5.4em; }
.plq-t{ position:relative; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* les mouvements */
@keyframes plqShine{ 0%,62%{ transform:translateX(-120%); } 100%{ transform:translateX(120%); } }
@keyframes plqPulse{ to{ opacity:.25; } }
@keyframes plqBob{ to{ transform:translateY(-5%); } }
@keyframes plqTilt{ from{ transform:rotate(-5deg); } to{ transform:rotate(5deg); } }
@keyframes plqY2{ to{ transform:translateY(66.667%); } }
@keyframes plqY2u{ to{ transform:translateY(-66.667%); } }
@keyframes plqY1{ to{ transform:translateY(50%); } }
@keyframes plqF8{ to{ background-position:100% 114.286%; } }
@keyframes plqX1l{ from{ transform:translateX(50%); } to{ transform:none; } }
@keyframes plqX1r{ from{ transform:none; } to{ transform:translateX(50%); } }

/* mode économie et « moins d'animations » : les plaques restent fixes */
html.lite .plq, html.lite .plq::after, html.lite .plq > i, html.lite .plq > i::before, html.lite .plq > i::after{ animation:none !important; }
@media (prefers-reduced-motion:reduce){ .plq, .plq::after, .plq > i, .plq > i::before, .plq > i::after{ animation:none !important; } }
/* ---- où les plaques s'affichent ---- */
.chat-row b{ min-width:0; }
.plq-on:hover > .plq > i, .plq-live > .plq > i{ background-image:var(--art-live,var(--art,none)); }
.plq-img > i{ aspect-ratio:auto; width:64%; background-size:cover; background-position:center; }   /* plaque faite d'une image ou d'un GIF (voir PLATES : img, gif) */
/* conversations : colonne de gauche sur ordinateur, liste sur téléphone, en-tête d'une conversation */
.dm-row.plq-on{ margin-block:2px; }
.dm-row.plq-on.on{ box-shadow:0 0 0 2px var(--pk); }
.sn-row.plq-on{ --plq-y:5px; --plq-x:8px; --plq-r:16px; }
.sn-row.plq-on .sn-av .online{ border-color:var(--pa); }
.sn-row.plq-on .sn-end{ opacity:1; } .sn-row.plq-on .sn-end svg{ display:none; }   /* la petite bulle de droite laisse la place au dessin (la pastille des messages non lus reste) */
.chat-who.plq-on{ border-color:transparent; padding-right:clamp(40px,9vw,120px); }
@media (max-width:999px){ .chat-page .chat-who.plq-on{ padding:4px 12px 4px 4px; border-radius:12px; margin-right:4px; } }
/* groupes : membres, invitations */
.nrow.plq-on{ padding-inline:10px; margin-block:2px; }
.plq-on .linkbtn{ padding:3px 10px; border-radius:999px; background:var(--pbt,rgba(0,0,0,.34)); color:var(--ptx); font-size:13px; font-weight:600; text-decoration:none; }
/* cartes des joueurs et profils */
/* carte d'un joueur : la plaque s'arrête avant le rond de compatibilité */
.mc-head.mc-plq{ grid-template-columns:minmax(0,1fr) auto; } .top-match .mc-head.mc-plq{ min-width:min(380px,100%); }
.mc-id{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:12px; align-items:center; min-width:0; margin:-8px 0 -8px -10px; padding:8px 10px; border-radius:calc(var(--rc) - 8px); }
.me-id.plq-on{ margin:-10px -12px; padding:10px 12px; border-radius:var(--ri); }
/* profil d'un joueur : la photo, le pseudo et la ligne d'infos tiennent sur une seule ligne, posée sur la plaque */
.pp-id{ flex:1 1 auto; display:flex; gap:18px; align-items:center; min-width:0; padding:14px 18px; border-radius:var(--rc); }
.pp-id > div{ flex:1 1 0; min-width:0; }
@media (max-width:560px){ .pp-id{ gap:12px; padding:12px 14px; } .pp-id .av{ width:64px !important; height:64px !important; font-size:23px !important; } .pp-id h1{ font-size:26px; } }
/* une plaque montrée « en situation » dans la boutique, et l'aperçu avant achat */
.plq-demo{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:10px; align-items:center; width:100%; min-height:52px; padding:8px 10px; border-radius:12px; text-align:left; }

/* =========================================================
   Messagerie sur téléphone : plein écran, sans décor
   - dans une conversation : ni logo, ni cloche, ni boutique, ni barre d'onglets ; la conversation occupe tout l'écran
   - dans la liste : pas d'en-tête du site
   - des angles plus nets (moins d'arrondis)
   ========================================================= */
@media (max-width:999px){
  body:has(.chat-page) .top, body:has(.dm-list-page) .top{ display:none; }

  .chat-page{ position:fixed; left:0; right:0; top:0; z-index:20; width:auto; max-width:none; height:var(--vvh,100dvh) !important; min-height:0; margin:0; padding:0 !important; display:flex; flex-direction:column; background:var(--s1); color:var(--tx); }
  .chat-page .chat-head{ flex:none; margin:0; padding:max(6px,env(safe-area-inset-top)) 6px 6px 2px; gap:4px; background:var(--s1); border-bottom:1px solid var(--hair); }
  .chat-page .chat-head .back{ margin:0; color:var(--tx); min-width:40px; min-height:44px; justify-content:center; font-size:0; gap:0; } .chat-page .chat-head .back svg{ width:22px; height:22px; }
  .chat-page .chat-who{ flex:1 1 0 !important; max-width:none; min-width:0; padding:0; border:0; border-radius:0; background:none; color:var(--tx); text-align:left; } .chat-page .chat-who .muted{ color:inherit; opacity:.7; }
  .chat-page .chat-head, .chat-page .chat-head .back, .chat-page .chat-who:not(.plq-on), .chat-page .chat-who:not(.plq-on) b, .chat-page .chat-who:not(.plq-on) span:not(.online){ color:var(--tx) !important; text-shadow:none !important; }
  .chat-page .chat-calls{ gap:0; } .chat-page .call-btn{ background:none; border:0; box-shadow:none; border-radius:8px; color:var(--pk); } .chat-page .call-btn svg{ width:22px; height:22px; }
  .chat-page .flame-hint{ flex:none; margin:0; padding:4px 12px; } .chat-page .flame-hint:empty{ display:none; }
  .chat-page .chat-box{ flex:1 1 0; min-height:0; max-height:none; border:0; border-radius:0; padding:12px 10px; gap:6px; background:var(--s1); }
  .chat-page .chat-form{ flex:none; margin:0; gap:6px; padding:8px 8px max(8px,env(safe-area-inset-bottom)); border:0; border-top:1px solid var(--hair); border-radius:0; background:var(--s1); }
  .chat-page .chat-form > input{ border:1px solid var(--line) !important; background:var(--field) !important; border-radius:8px; padding:0 12px; min-height:44px; }
  .chat-page .chat-form .mic-btn{ border-radius:8px; }

  .chat-page .chat-form .rec-bar{ border:1px solid var(--line); border-radius:8px; background:var(--field); }
  .chat-page .bubble{ max-width:84%; border-radius:10px 10px 10px 2px; border-width:1px; padding:8px 12px; animation:none; } .chat-page .bubble.me{ border-radius:10px 10px 2px 10px; }
  body:has(.chat-page) .toast{ bottom:calc(76px + env(safe-area-inset-bottom,0px)); }
  /* la liste : des angles plus nets */
  .sn-list{ border-radius:10px; } .sn-round{ border-radius:10px; } .sn-fab{ border-radius:14px; } .sn-chips .chip{ border-radius:8px; } .sn-search{ border-radius:8px; }
  .sn-row.grp .sn-av > *:first-child{ border-radius:12px !important; }
}

/* =========================================================
   Ordinateur : barre de navigation sur le côté gauche
   Le menu du haut (Accueil, Matchs…) devient une colonne d'icônes, réunie avec la barre des groupes.
   De haut en bas : logo, pages, groupes, « + », puis la cloche et la boutique tout en bas.
   Sur téléphone et pour un visiteur non connecté, rien ne change.
   ========================================================= */
.siderail{ display:none; }

  .sr-i svg{ width:24px; height:24px; }

  .sr-i[aria-current="page"]::before{ content:""; position:absolute; left:-14px; top:50%; width:4px; height:28px; margin-top:-14px; border-radius:0 4px 4px 0; background:var(--pk); }
  .sr-i:focus-visible, .siderail .dm-ico:focus-visible{ outline:2px solid var(--pk); outline-offset:2px; }
  .sr-i .tb-badge{ position:absolute; right:-3px; top:-3px; min-width:18px; height:18px; padding:0 5px; box-sizing:border-box; border-radius:9px; background:#E5484D; color:#fff; font:700 11px/18px var(--fb,inherit); text-align:center; border:2px solid var(--s1); }
  .siderail .notif-btn, .siderail .skin-btn{ width:48px; height:48px; border-radius:14px; border:0; background:none; box-shadow:none; color:var(--pk); animation:none; }

  .dm-shell .chat-head .chat-who{ flex:1 1 0 !important; min-width:0; max-width:none; }
  /* la barre des groupes est maintenant dans la colonne de gauche : la messagerie n'a plus que deux colonnes */
  .dm-shell{ grid-template-columns:300px minmax(0,1fr) !important; } .dm-shell .dm-rail{ display:none !important; }

}

<script>
/* =========================================================
   1. CONFIGURATION — tout ce qui se modifie facilement
   ========================================================= */
const CONFIG = {
  // Poids des critères (en points). Le score est normalisé sur 100,
  // donc la somme n'a pas besoin de faire exactement 100.
  // Mettre un poids à 0 désactive le critère.
  weights: { games:40, hours:25, style:15, days:10, platform:10, rank:6, language:5, country:4, voice:0, goal:0 },
  // Nombre de signalements ouverts avant masquage automatique d'un profil (en attendant la modération)
  autoHideReports: 3,
  // Score partiel quand l'un des deux joueurs a choisi « Les deux » / « Parfois »
  partialMatch: 0.6,
  // Sans aucun jeu en commun, la compatibilité ne dépasse pas ce score (sur 100)
  noCommonGameCap: 40,
  minUsername: 3, maxUsername: 20, minPassword: 8,
  // Âge minimum pour utiliser le site
  minAge: 13,
  // Protection des mineurs : tout le monde se voit (separateMinors: false). Entre un adulte et un 13-17 ans,
  // c'est le 13-17 ans qui envoie la demande de mate ; messages écrits, vocaux et appels vocaux oui, appels vidéo et photos non.
  // (separateMinors: true remettrait les deux groupes séparés dans le site, mais les règles Firestore v7 restent celles des âges réunis.)
  adultAge: 18, separateMinors: false,
};

const GAMES = ['Free Fire','eFootball','Call of Duty Mobile','EA FC Mobile','PUBG Mobile','Fortnite','Roblox','Minecraft',

  'Dream League Soccer':['mobile'],'Blood Strike':['mobile','pc'],'8 Ball Pool':['mobile'],'Clash of Clans':['mobile'],'Clash Royale':['mobile'],'Brawl Stars':['mobile'],'Mobile Legends':['mobile'],
  'Fortnite':['mobile','ps','pc','xbox','switch'],'Roblox':['mobile','pc','xbox','ps'],'Minecraft':['mobile','pc','ps','xbox','switch'],'Among Us':['mobile','pc','switch'],
  'EA Sports FC':['ps','pc','xbox'],'Call of Duty':['ps','pc','xbox'],'GTA V':['ps','pc','xbox'],'Valorant':['pc'],'Apex Legends':['ps','pc','xbox'],'League of Legends':['pc'],
  'Rocket League':['ps','pc','xbox','switch'],'Counter-Strike 2':['pc'],'Fall Guys':['ps','pc','xbox','switch'],'Overwatch 2':['ps','pc','xbox','switch']};
const TOP_GAMES = ['Free Fire','eFootball','Call of Duty Mobile','EA FC Mobile','PUBG Mobile','Fortnite','Roblox','Minecraft'];
const HOURS = [['matin','Matin'],['aprem','Après-midi'],['soir','Soir'],['nuit','Nuit']];
const DAYS = [['lun','Lun'],['mar','Mar'],['mer','Mer'],['jeu','Jeu'],['ven','Ven'],['sam','Sam'],['dim','Dim']];

const GOALS = [['serieux','Jouer sérieusement'],['fun',"S'amuser"],['both','Les deux']];

};

const DEMO_AGES={p1:22,p2:19,p3:24,p4:27,p5:21,p6:20,p7:16,p8:23,p9:25,p10:29,p11:15,p12:17,p13:26,p14:22,p15:16,p16:17};

/* ---- Âge ---- */
function ageFrom(dob){
  const d=new Date(dob+'T00:00:00'); if(!dob||isNaN(d)) return null;
  const n=new Date(); let a=n.getFullYear()-d.getFullYear();
  if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate())) a--;
  return a;
}
const ageOf = p => p.dob ? ageFrom(p.dob) : p.age;
const ageGroup = p => { const a=ageOf(p); if(a==null && p && p.ageGroup) return p.ageGroup; return (a ?? 0) >= CONFIG.adultAge ? 'adult' : 'minor'; };
// En ligne = statut actif ET activité récente : un onglet fermé sans prévenir ne reste pas « en ligne » pour toujours
const ONLINE_MS = 5*60*1000;
const isOnline = p => !!p && !!p.online && (!p.lastSeen || Date.now()-p.lastSeen < ONLINE_MS);
// Joueur hors ligne : « Vu il y a 2 h » s'il affiche son statut et qu'il est passé depuis moins de 30 jours, sinon « Hors ligne »
const seenTxt = p => { const t=+p.lastSeen||0, d=Date.now()-t; return t>0&&d>=0&&d<30*864e5 ? 'Vu '+ago(t) : 'Hors ligne'; };
// Sans profil avec âge, on ne montre que des profils adultes.
const sameGroup = p => !CONFIG.separateMinors || (S.me && S.me.dob ? ageGroup(p)===ageGroup(S.me) : ageGroup(p)==='adult');

/* =========================================================
   3. MOTEUR DE COMPATIBILITÉ
   ========================================================= */
const MATCHERS = {
  // Chevauchement de listes : moyenne de (communs/plus petite liste) et (communs/plus grande liste)
  overlap(a=[],b=[]){ if(!a.length||!b.length) return 0; const s=a.filter(x=>b.includes(x)).length;
    return (s/Math.min(a.length,b.length) + s/Math.max(a.length,b.length))/2; },
  // Choix simple avec option « mixte » (les deux / parfois)
  choice(a,b,mixed){ if(a===b) return 1; if(a===mixed||b===mixed) return CONFIG.partialMatch; return 0; },
};
const CRITERION_SCORE = {
  games:(a,b)=>MATCHERS.overlap(a.games,b.games),
  hours:(a,b)=>MATCHERS.overlap(a.hours,b.hours),
  days:(a,b)=>MATCHERS.overlap(a.days,b.days),
  style:(a,b)=>MATCHERS.choice(a.style,b.style,'both'),
  goal:(a,b)=>MATCHERS.choice(a.goal,b.goal,'both'),
  voice:(a,b)=>MATCHERS.choice(a.voice,b.voice,'parfois'),
  platform:(a,b)=>a.platforms.some(x=>b.platforms.includes(x)) ? 1 : 0,
  // Rang proche sur les jeux en commun (écart de niveau sur une échelle de 1 à 5)
  rank:(a,b)=>{ const sh=a.games.filter(g=>b.games.includes(g)); if(!sh.length) return 0; const ra=a.ranks||{}, rb=b.ranks||{};
    return sh.reduce((t,g)=>{ const x=rankLevel(g,ra[g]), y=rankLevel(g,rb[g]); return t+(x!=null&&y!=null ? 1-Math.abs(x-y)/4 : .5); },0)/sh.length; },
  language:(a,b)=>(a.langs||['fr']).some(x=>(b.langs||['fr']).includes(x)) ? 1 : 0,
  country:(a,b)=>a.country&&a.country===b.country ? 1 : 0,
};
function compat(a,b){
  const w = S.weights || CONFIG.weights;
  let total=0, sum=0; const detail=[];
  for(const k in w){ if(!w[k] || !CRITERION_SCORE[k]) continue;
    const s = CRITERION_SCORE[k](a,b); total+=w[k]; sum+=w[k]*s; detail.push({k,w:w[k],s}); }
  let pct = total ? Math.round(sum/total*100) : 0;
  const commonGames = a.games.filter(g=>b.games.includes(g));
  if(w.games && !commonGames.length) pct=Math.min(pct, CONFIG.noCommonGameCap);
  // Avis après une partie : « je rejouerais avec lui » remonte le profil, l'inverse le descend
  const rv=a.id==='me'&&S.ratings?S.ratings[b.id]:0; if(rv===1) pct=Math.min(100,pct+5); if(rv===-1) pct=Math.max(0,pct-20);
  return { pct, detail,
    common:{ games:commonGames, hours:a.hours.filter(h=>b.hours.includes(h)) } };
}
const tier = p => p>=80?'var(--hi)':p>=60?'var(--mid)':p>=40?'var(--warm)':'var(--lo)';
const tierTx = p => p>=80?'var(--hi-tx)':p>=60?'var(--mid-tx)':p>=40?'var(--warm-tx)':'var(--lo-tx)';   // même teinte, assombrie ou éclaircie pour rester lisible en petit

/* =========================================================
   4. ÉTAT LOCAL (prototype) — en production : API + base de données
   ========================================================= */
const KEY='matematch.v1';
const fresh = () => ({ skin:'defaut', auth:null, profiles:{}, accounts:{}, dobs:{}, requests:[], notifs:[], chats:{}, squads:[], joined:[], ratings:{}, unread:{}, hidden:[], banned:[], sort:'compat', me:null, mates:[], blocked:[], reports:[], weights:null,
  privacy:{ tags:true, online:true } });

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const BOOT_SKIN = S.skinOk || S.skin; // dernier thème choisi et affiché (pas un simple aperçu)
const visible = () => PLAYERS.filter(p=>!S.blocked.includes(p.id) && !S.hidden.includes(p.id) && !S.banned.includes(p.id) && sameGroup(p));
const ranked = () => visible().map(p=>({p,c:compat(S.me,p)})).sort((x,y)=>y.c.pct-x.c.pct);

/* =========================================================
   5. COMPOSANTS D'AFFICHAGE
   ========================================================= */
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ring = (p,size='') => `<div class="ring ${size}${p>=80?' glow':''}" data-count="${p}" style="--p:${p};--c:${tier(p)}" role="img" aria-label="${p} % compatible"><span>${p}<small>%</small></span></div>`;
function avatar(u,size=48){
  const a=u.avatar||{hue:260};
  const minor = u.ageGroup==='minor' || (u.dob && ageGroup(u)==='minor');   // jamais de photo pour les 13-17 ans
  if(a.src && !minor && /^data:image\/(png|jpeg|webp);base64,/.test(a.src)) return `<img class="av" src="${esc(a.src)}" alt="" loading="lazy" decoding="async" width="${size}" height="${size}" style="width:${size}px;height:${size}px">`;
  return `<span class="av" aria-hidden="true" style="width:${size}px;height:${size}px;--h:${(Number(a.hue)||0)%360};font-size:${Math.round(size*.36)}px">${esc((u.name||'?').slice(0,2).toUpperCase())}</span>`;
}
const list = (arr,map) => arr.length ? arr.map(map).join(' • ') : '—';

function matchCard({p,c}, top=false, i=0){
  return `<a class="mcard${top?' top-match':''}" href="#/joueur/${p.id}" style="--i:${i};--c:${c?tier(c.pct):'var(--line)'}">
    <div class="mc-head${plateOf(p)?' mc-plq':''}">${plateOf(p)?`<div class="mc-id${plqOn(p)}">${plq(p)}`:''}${avatar(p,top?64:52)}<div><span class="mc-name">${esc(p.name)}${modBadge(p)}${dispoActive(p)?`<span class="tag-live">Dispo · ${esc(p.dispo.game)}</span>`:''}</span>${isOnline(p)?'<span class="online">En ligne</span>':''}</div>${plateOf(p)?'</div>':''}${c?ring(c.pct, top?'ring-lg':''):''}</div>
    <dl class="facts">
      <div><dt>${c&&c.common.games.length?'Jeux en commun':'Joue à'}</dt><dd>${esc(list(c&&c.common.games.length?c.common.games:p.games.slice(0,4),g=>g))}</dd></div>
      <div><dt>Horaires</dt><dd>${list(p.hours,h=>L(HOURS,h))}</dd></div>
      <div><dt>Style</dt><dd>${L(STYLES,p.style)}</dd></div>
    </dl></a>`;
}
function chips(group,options,selected,single=false){
  return `<div class="chips" role="group">${options.map(([v,l])=>
    `<button type="button" class="chip" data-chip="${group}" data-val="${esc(v)}" ${single?'data-single="1"':''} aria-pressed="${[].concat(selected).includes(v)}">${esc(l)}</button>`).join('')}</div>`;
}
const toastEl=document.getElementById('toast'); let tt;

const dlg=document.getElementById('dlg');
function modal(html, onOpen){ try{ if(dlg.open) dlg.close(); }catch(e){}   // une fenêtre déjà ouverte est remplacée proprement (anciens navigateurs : sinon erreur)
  dlg.innerHTML=html; try{ dlg.showModal(); }catch(e){ dlg.setAttribute('open',''); } dlg.scrollTop=0; onOpen&&onOpen(dlg); }
dlg.addEventListener('click',e=>{ if(e.target===dlg || e.target.closest('[data-close]')) dlg.close(); });

/* =========================================================

const ICONS = {

const MOD_SVG='<svg class="mod-badge" viewBox="0 0 24 24" role="img" aria-label="Modérateur certifié Coopô"><title>Modérateur certifié Coopô</title><path class="mb-seal" d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/><path class="mb-check" d="m9 12 2 2 4-4"/></svg>';
const isMod = p => !!p && (p.moderator===true || ((p.id==='me' || (S.auth && p.id===S.auth.uid)) && isAdmin()));
const modBadge = p => isMod(p) ? MOD_SVG : '';
// Favicon aux couleurs du thème actif
const _favImg=new Image(); _favImg.src=LOGO_MASK;
function updateFavicon(){ const draw=()=>{ try{ const cs=getComputedStyle(document.documentElement), bg=cs.getPropertyValue('--pk').trim()||'#7C5CFF', fg=cs.getPropertyValue('--on-pk').trim()||'#fff';
  const c=document.createElement('canvas'); c.width=c.height=64; const x=c.getContext('2d');
  const t=document.createElement('canvas'); t.width=t.height=64; const y=t.getContext('2d'); y.drawImage(_favImg,4,4,56,56); y.globalCompositeOperation='source-in'; y.fillStyle=fg; y.fillRect(0,0,64,64);
  x.fillStyle=bg; x.beginPath(); x.arc(32,32,32,0,Math.PI*2); x.fill(); x.drawImage(t,0,0);
  let l=document.querySelector('link[rel="icon"]'); if(!l){ l=document.createElement('link'); l.rel='icon'; document.head.appendChild(l); } l.type='image/png'; l.href=c.toDataURL('image/png'); }catch(e){} };
  _favImg.complete ? draw() : _favImg.onload=draw; }
// 5 onglets seulement : la recherche se range dans Matchs, les réglages dans Profil
const NAV=[['accueil','Accueil'],['matchs','Matchs'],['groupes','Communauté'],['messages','Messages'],['profil','Profil']];
const NAV_PARENT={groupe:'messages',recherche:'matchs',parametres:'profil',boutique:'profil','faux-paiement':'profil',paiement:'profil',aide:'profil',contact:'profil',app:'profil',cgu:'profil',confidentialite:'profil',cookies:'profil',remboursement:'profil',moderation:'profil'};   // page secondaire → onglet allumé
const TAB_LBL={groupes:'Commu'};
function renderNav(active){
  if(active==='groupes'&&location.hash.startsWith('#/groupes/groupes')) active='messages';   // la liste des groupes se range maintenant avec les messages
  const navItems = isAdmin() ? [...NAV,['moderation','Modération']] : NAV;
  const top = navItems.some(([r])=>r===active) ? active : (NAV_PARENT[active]||active);   // menu du haut (ordinateur) : « Modération » y a son propre onglet
  active=NAV_PARENT[active]||active;
  const cur = r => r===active ? 'aria-current="page"' : '';
  document.querySelectorAll('.navpill').forEach(n=>n.innerHTML = navItems.map(([r,l])=>`<a href="#/${r}" data-nav="${r}" ${r===top?'aria-current="page"':''}>${l}</a>`).join(''));
  // Colonne de gauche (ordinateur) : logo, pages en icônes, groupes, puis cloche et boutique
