  background:var(--np-bg); color:var(--np-tx) !important; -webkit-text-fill-color:currentColor; font-weight:700; line-height:1.35; text-shadow:none !important; text-transform:none; letter-spacing:0; vertical-align:middle; overflow:hidden; isolation:isolate; }
.np-t{ position:relative; z-index:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* couleurs */
.np-rubis{ --np-bg:#B3122E; --np-tx:#fff; --np-bd:#E86B80; } .np-saphir{ --np-bg:#1746B8; --np-tx:#fff; --np-bd:#7C9FF5; } .np-emeraude{ --np-bg:#0B6B4F; --np-tx:#fff; --np-bd:#49C79D; }
.np-ambre{ --np-bg:#F2B63C; --np-tx:#2A1A00; --np-bd:#B77F0C; } .np-onyx{ --np-bg:#15161C; --np-tx:#F3F4F8; --np-bd:#565B73; }
/* dégradés animés */
.np-aurore,.np-lagune,.np-braise{ --np-tx:#fff; background-size:300% 100%; animation:npSlide 7s linear infinite; }
.np-aurore .np-t,.np-lagune .np-t,.np-braise .np-t,.np-dragon .np-t,.np-flamme100 .np-t{ text-shadow:0 1px 2px rgba(0,0,0,.6); }
.np-aurore{ --np-bd:#E7A8FF; background-image:linear-gradient(110deg,#5B1FD0,#B5067A,#B84A0A,#5B1FD0); }
.np-lagune{ --np-bd:#8FE3E0; background-image:linear-gradient(110deg,#0B5FA8,#087878,#1D6B3C,#0B5FA8); }
.np-braise{ --np-bd:#FFB48A; background-image:linear-gradient(110deg,#8E1010,#B8370A,#8F5207,#8E1010); }
.np-neon{ --np-bg:#0D0B1E; --np-tx:#7CFFCB; --np-bd:#7CFFCB; box-shadow:0 0 .55em rgba(124,255,203,.6); animation:npGlow 2.4s ease-in-out infinite; }
/* motifs gaming */
.np-pixel{ --np-tx:#C6F86A; --np-bd:#6E9424; border-radius:.2em; background:linear-gradient(rgba(255,255,255,.07) 50%,transparent 50%) 0 0/6px 6px, linear-gradient(90deg,rgba(255,255,255,.07) 50%,transparent 50%) 0 0/6px 6px, #1E2233; }
.np-manette{ --np-tx:#fff; --np-bd:#9A7BFF; padding-inline:.95em; background:radial-gradient(circle at .42em 50%,#FF5C7A 0 .15em,transparent .18em), radial-gradient(circle at calc(100% - .42em) 50%,#4FD1FF 0 .15em,transparent .18em), #2B1B5A; }
.np-circuit{ --np-tx:#6DF2C2; --np-bd:#239C78; background:linear-gradient(90deg,transparent 46%,rgba(109,242,194,.2) 46% 54%,transparent 54%) 0 0/14px 100%, linear-gradient(transparent 44%,rgba(109,242,194,.14) 44% 56%,transparent 56%) 0 0/100% 9px, #062A22; }
.np-damier{ --np-tx:#FFD23F; --np-bd:#FFD23F; background:conic-gradient(#1F1F25 25%,#0E0E11 0 50%,#1F1F25 0 75%,#0E0E11 0) 0 0/10px 10px; }
/* effets brillants : un reflet passe */
.np-or::after,.np-chrome::after,.np-holo::after{ content:''; position:absolute; inset:0; background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.8) 50%,transparent 62%); transform:translateX(-130%); animation:npShine 3.4s ease-in-out infinite; }
.np-or{ --np-tx:#2A1E00; --np-bd:#8A6A12; background:linear-gradient(180deg,#F8DF86,#D9A92B 55%,#F1CC5A); }
.np-chrome{ --np-tx:#10151C; --np-bd:#6C7786; background:linear-gradient(180deg,#F1F5F9,#AEB8C5 55%,#DCE3EB); }
.np-holo{ --np-tx:#1B1030; --np-bd:#B79CFF; background:linear-gradient(110deg,#B8F3FF,#E3C4FF,#FFD6E8,#C9FFD9,#B8F3FF) 0 0/300% 100%; animation:npSlide 8s linear infinite; }
/* édition limitée */
.np-dragon{ --np-tx:#FFE2B0; --np-bd:#E0A83A; background:linear-gradient(110deg,#3A0606,#8B1A0A,#3A0606,#9A3A0C,#3A0606) 0 0/300% 100%; animation:npSlide 5s linear infinite; box-shadow:0 0 0 1.5px #5A1206, 0 0 .6em rgba(255,120,40,.5); }
.np-galaxie{ --np-tx:#EDE8FF; --np-bd:#8C7BFF; box-shadow:0 0 .6em rgba(140,123,255,.55);
  background:radial-gradient(circle at 12% 30%,#fff 0 1px,transparent 1.6px), radial-gradient(circle at 72% 72%,#fff 0 1px,transparent 1.6px), radial-gradient(circle at 44% 18%,#BFD4FF 0 1px,transparent 1.6px), radial-gradient(circle at 90% 26%,#fff 0 .8px,transparent 1.4px), radial-gradient(circle at 28% 80%,#D9CCFF 0 .8px,transparent 1.4px), linear-gradient(120deg,#0A0A2A,#2A1466,#0A0A2A); }
.np-galaxie::after{ content:''; position:absolute; inset:0; background:radial-gradient(circle at 60% 40%,rgba(255,255,255,.9) 0 1px,transparent 1.8px), radial-gradient(circle at 20% 55%,rgba(255,255,255,.9) 0 1px,transparent 1.8px); animation:npTwinkle 2.6s ease-in-out infinite; }
.np-foudre{ --np-tx:#FFE94A; --np-bd:#FFE94A; background:linear-gradient(115deg,#0B1320 40%,#22365C 50%,#0B1320 60%) 0 0/250% 100%; animation:npSlide 2.6s linear infinite, npFlash 3.8s steps(1,end) infinite; }
/* à gagner */
.np-flamme10{ --np-bg:#3A1404; --np-tx:#FFB877; --np-bd:#FF7A1A; }
.np-flamme30{ --np-tx:#FFE0B8; --np-bd:#FF8A2A; background:linear-gradient(180deg,#5A1A04,#8A2C06); }
.np-flamme100{ --np-tx:#FFF0D6; --np-bd:#FFC043; background:linear-gradient(110deg,#6A1204,#A3360A,#6A1204) 0 0/250% 100%; animation:npSlide 4s linear infinite; box-shadow:0 0 .5em rgba(255,122,26,.6); }
.np-flamme365{ --np-tx:#2A1200; --np-bd:#FFF3B0; background:linear-gradient(110deg,#FFB02E,#FFE27A,#FF8A1E,#FFE27A,#FFB02E) 0 0/300% 100%; animation:npSlide 4s linear infinite; box-shadow:0 0 .7em rgba(255,176,46,.8); }
.np-souvenir{ --np-tx:#F7D58A; --np-bd:#E2A23B; background:repeating-linear-gradient(135deg,rgba(226,162,59,.16) 0 4px,transparent 4px 9px), #3A2618; }
@keyframes npSlide{ to{ background-position:-300% 0; } }
@keyframes npShine{ 0%,55%{ transform:translateX(-130%); } 100%{ transform:translateX(130%); } }
@keyframes npGlow{ 50%{ box-shadow:0 0 .9em rgba(124,255,203,.95); } }
@keyframes npTwinkle{ 50%{ opacity:.15; } }
@keyframes npFlash{ 0%,100%{ box-shadow:0 0 .4em rgba(255,233,74,.5); } 46%{ box-shadow:0 0 1.1em rgba(255,233,74,1); } 50%{ box-shadow:0 0 .4em rgba(255,233,74,.5); } 54%{ box-shadow:0 0 .9em rgba(255,233,74,.9); } }
html.lite .np, html.lite .np::after{ animation:none !important; }
@media (prefers-reduced-motion:reduce){ .np, .np::after{ animation:none !important; } }
/* là où le pseudo est affiché */
.mc-name .np,.chat-row b .np,.chat-who b .np{ flex:0 1 auto; }
.pp-head h1 .np{ font-size:.92em; }
.chat-row b{ min-width:0; }
/* aperçu d'une plaque sur son profil */
.np-prev{ display:grid; gap:10px; margin-top:14px; }
.np-prev > div{ display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--ri); background:var(--s2); min-width:0; }
.np-prev > div > div{ display:grid; gap:2px; min-width:0; } .np-prev .muted{ font-size:12px; }
.np-prev-name{ font:var(--fdw) 22px/1.2 var(--fd); }
.np-prev-msg{ flex-direction:column; align-items:flex-start !important; gap:4px !important; } .np-prev-msg small{ font-size:13px; } .np-prev-msg .bubble{ animation:none; max-width:100%; }

/* ==== Boutique ==== */
html[data-skin] body .on-world{ color:#fff; text-shadow:var(--w-halo); }
html[data-skin] body p.on-world{ color:rgba(255,255,255,.92); }
.shop .page-head{ align-items:center; }
.shop-cur{ display:flex; align-items:center; gap:8px; grid-template-columns:none; } .shop-cur label{ color:#fff; text-shadow:var(--w-halo); font-size:13px; } .shop-cur select{ min-height:38px; padding-top:4px; padding-bottom:4px; width:auto; max-width:200px; }
.shop-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
.shop-grid-wide{ grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr)); }
.shop-sec{ margin-top:28px; } .shop-sec > h3{ font:var(--fdw) 20px/1.2 var(--fd); text-transform:var(--case); color:#fff; text-shadow:var(--w-halo); }
.shop-sec > p{ margin:4px 0 0; color:rgba(255,255,255,.92) !important; text-shadow:var(--w-halo); font-size:14px; }
.shop-sec > .shop-grid{ margin-top:12px; }
.shop-card{ position:relative; display:grid; grid-template-rows:auto 1fr auto; gap:10px; min-width:0; padding:10px 10px 12px; background:var(--s1); border:1px solid var(--hair); border-radius:var(--rc); box-shadow:var(--e1); color:var(--tx); }
.shop-card.is-rare{ border-color:#E0A83A; box-shadow:var(--e1), 0 0 0 1px #E0A83A; }
.shop-prev{ height:98px; border-radius:calc(var(--rc) - 8px); display:grid; place-items:center; overflow:hidden; min-width:0; }
.shop-prev-np{ padding:0 10px; font-size:17px; background:linear-gradient(90deg,#F2F3F8 50%,#181922 50%); }
.shop-prev-th{ background:var(--a); padding:12px 14px; }
.th-mock{ position:relative; width:100%; height:100%; border-radius:10px; background:var(--b); overflow:hidden; }
.th-mock i{ position:absolute; left:10px; height:6px; border-radius:3px; background:var(--c2); opacity:.5; }
.th-mock i:nth-child(1){ top:12px; width:52%; } .th-mock i:nth-child(2){ top:26px; width:34%; opacity:.3; } .th-mock i:nth-child(3){ top:40px; width:44%; opacity:.3; }
.th-mock b{ position:absolute; right:10px; bottom:10px; width:22px; height:22px; border-radius:50%; background:var(--c2); animation:thPulse 2.6s ease-in-out infinite; }
.th-mock::after{ content:''; position:absolute; inset:0; background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%); transform:translateX(-130%); animation:npShine 4.2s ease-in-out infinite; }
@keyframes thPulse{ 50%{ transform:scale(1.18); } }
html.lite .th-mock b, html.lite .th-mock::after{ animation:none; }
.shop-prev-pk{ display:flex; flex-wrap:wrap; gap:6px; align-content:center; justify-content:center; padding:10px; background:var(--s2); font-size:12px; }
.shop-prev-pk i{ width:26px; height:26px; border-radius:8px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12); } .shop-prev-pk small{ align-self:center; color:var(--mu); font-weight:700; }
.shop-info{ display:grid; gap:3px; align-content:start; min-width:0; } .shop-info b{ font:var(--fdw) 16px/1.2 var(--fd); text-transform:var(--case); overflow-wrap:anywhere; } .shop-info .muted{ font-size:13px; line-height:1.35; }
.shop-own{ font-size:12px; font-weight:700; color:var(--pk2,var(--pk)); } .shop-eco{ font-size:13px; font-weight:700; color:var(--pk2,var(--pk)); }
.shop-foot{ display:flex; gap:8px; flex-wrap:wrap; } .shop-foot .btn{ flex:1 1 auto; padding:0 10px; animation:none; white-space:nowrap; }
.shop-tag{ position:absolute; top:16px; left:16px; z-index:2; padding:3px 9px; border-radius:999px; background:#16131F; color:#fff; font:700 11px/1.4 var(--fb); }
.shop-tag.rare{ background:#FFD23F; color:#231A00; }
.buy-line{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-top:14px; padding:12px 14px; border-radius:var(--ri); background:var(--s2); }
.buy-line strong{ font:var(--fdw) 20px/1 var(--fd); color:var(--pk2,var(--pk)); white-space:nowrap; }
.test-note{ display:grid; gap:2px; margin:12px 0; padding:10px 14px; border-radius:var(--ri); background:#FFF1B8; color:#3A2A00; border:1.5px dashed #9A6B00; font-size:14px; } .test-note b{ font-size:15px; }
.fakepay{ display:grid; gap:12px; padding:24px; border-radius:var(--rc); background:#FFF8DC; color:#2A2000; border:3px dashed #9A6B00; }
.fakepay h2{ margin:0; color:#2A2000; font:var(--fdw) 24px/1.15 var(--fd); } .fakepay p{ margin:0; } .fakepay .muted{ color:#5C4A12; font-size:13px; overflow-wrap:anywhere; }
.fakepay-flag{ justify-self:start; padding:4px 12px; border-radius:999px; background:#2A2000; color:#FFE27A; font:700 12px/1.5 var(--fb); text-transform:uppercase; letter-spacing:.06em; }
.fakepay-act{ display:grid; gap:10px; margin-top:6px; } .fakepay .btn-ghost{ --t:#2A2000; box-shadow:inset 0 0 0 1.5px #2A2000; }
.lang-pick #lang-list{ margin-top:4px; } .lang-pick input{ max-width:420px; }
body.logged-out .skin-btn{ display:none; }

/* ==== Groupes ==== */
.g-h{ margin:24px 0 10px; font:var(--fdw) 19px/1.2 var(--fd); text-transform:var(--case); }
.g-lock{ display:inline-flex; width:14px; height:14px; color:var(--mu); flex:none; } .g-lock svg{ width:100%; height:100%; }
.chat-row.g-inv{ grid-template-columns:52px 1fr; } .g-inv .nact{ grid-column:1 / -1; }
.chat-row b{ overflow:hidden; } .chat-row > div{ min-width:0; }
.g-card-head{ display:flex; gap:12px; align-items:center; min-width:0; } .g-card-head > div{ display:grid; gap:2px; min-width:0; } .g-card-head h3{ overflow-wrap:anywhere; }
.g-desc{ overflow-wrap:anywhere; font-size:14px; }
.g-join{ justify-items:center; text-align:center; } .g-join h2{ overflow-wrap:anywhere; }
button.g-who{ cursor:pointer; font:inherit; color:inherit; text-align:left; min-width:0; flex:0 1 auto; }
.gmsg{ display:flex; gap:8px; align-items:flex-end; max-width:88%; align-self:flex-start; } .gmsg.me{ align-self:flex-end; } .gmsg.same{ margin-top:-4px; }
.gmsg > div{ display:grid; gap:3px; min-width:0; justify-items:start; } .gmsg.me > div{ justify-items:end; }
.gmsg .bubble{ max-width:100%; } .gmsg a{ flex:none; line-height:0; } .g-gap{ width:32px; flex:none; }
.g-from{ display:flex; align-items:center; gap:6px; padding-left:4px; font-size:13px; min-width:0; max-width:100%; }
.g-role{ flex:none; padding:1px 7px; border-radius:999px; background:var(--s2); color:var(--tx); font:700 10px/1.6 var(--fb); font-style:normal; text-transform:uppercase; letter-spacing:.04em; margin-left:6px; }
.g-role.admin{ background:var(--pk); color:var(--on-pk); }
.g-del{ border:0; background:none; padding:0; font:inherit; color:inherit; text-decoration:underline; cursor:pointer; }
.g-info-head{ display:flex; gap:14px; align-items:center; min-width:0; } .g-info-head > div{ display:grid; gap:2px; min-width:0; } .g-info-head h3{ margin:0; overflow-wrap:anywhere; }
.g-acts{ display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 6px; } .g-sub{ display:block; margin:10px 0 2px; }
.g-members{ display:grid; max-height:42vh; overflow:auto; } .g-members .nrow > div{ min-width:0; } .g-members .nrow b{ display:flex; align-items:center; flex-wrap:wrap; gap:2px; min-width:0; }
.g-pick{ grid-template-columns:22px 40px 1fr; cursor:pointer; } .g-pick input{ width:20px; height:20px; accent-color:var(--pk); }
.g-img-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
/* ==== Flammes ==== */
.flame{ display:inline-flex; align-items:center; gap:3px; flex:none; padding:1px 9px 1px 6px; border-radius:999px; background:#3A1404; color:#FFD9A8; font:700 13px/1.6 var(--fb); white-space:nowrap; text-shadow:none; }
.flame b{ font:inherit; } .flame.warn{ background:#4A3A00; color:#FFE27A; animation:flamePulse 1.6s ease-in-out infinite; }
.flame-hint:empty{ display:none; }
.g-name{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.flame-hint{ margin:0 0 10px; padding:8px 12px; border-radius:var(--ri); background:rgba(var(--w-top),.66); border:1px solid rgba(255,255,255,.2); color:#fff; font-size:13px; line-height:1.4; }
.flame-party{ display:grid; gap:8px; justify-items:center; text-align:center; } .flame-big{ font-size:64px; line-height:1.1; animation:flameDance 1.2s ease-in-out infinite; }
@keyframes flamePulse{ 50%{ transform:scale(1.08); } }
@keyframes flameDance{ 50%{ transform:scale(1.12) rotate(-4deg); } }
html.lite .flame.warn, html.lite .flame-big{ animation:none; }
@media (prefers-reduced-motion:reduce){ .flame.warn,.flame-big{ animation:none; } }

/* =========================================================
   Messagerie sur téléphone : plein écran, sans décor
   - dans une conversation : ni logo, ni cloche, ni boutique, ni barre d'onglets ; la conversation occupe tout l'écran
   - dans la liste : pas d'en-tête du site
   - des angles plus nets (moins d'arrondis)
   ========================================================= */
@media (max-width:999px){
  body:has(.chat-page) .top, body:has(.dm-list-page) .top{ display:none; }
  body:has(.chat-page) .tabbar{ display:none; }
  body:has(.dm-list-page) .page{ padding-top:max(14px,env(safe-area-inset-top)); }
  .chat-page{ position:fixed; left:0; right:0; top:0; z-index:20; width:auto; max-width:none; height:var(--vvh,100dvh) !important; min-height:0; margin:0; padding:0 !important; display:flex; flex-direction:column; background:var(--s1); color:var(--tx); }
  .chat-page .chat-head{ flex:none; margin:0; padding:max(6px,env(safe-area-inset-top)) 6px 6px 2px; gap:4px; background:var(--s1); border-bottom:1px solid var(--hair); }
  .chat-page .chat-head .back{ margin:0; color:var(--tx); min-width:40px; min-height:44px; justify-content:center; font-size:0; gap:0; } .chat-page .chat-head .back svg{ width:22px; height:22px; }
  .chat-page .chat-who{ flex:1 1 0; min-width:0; padding:0; border:0; border-radius:0; background:none; color:var(--tx); text-align:left; } .chat-page .chat-who .muted{ color:inherit; opacity:.7; }
  .chat-page .chat-head, .chat-page .chat-head .back, .chat-page .chat-who, .chat-page .chat-who b, .chat-page .chat-who span:not(.online):not([class*=plate]):not([class*=np]){ color:var(--tx) !important; text-shadow:none !important; }
  .chat-page .chat-calls{ gap:0; } .chat-page .call-btn{ background:none; border:0; box-shadow:none; border-radius:8px; color:var(--pk); } .chat-page .call-btn svg{ width:22px; height:22px; }
  .chat-page .flame-hint{ flex:none; margin:0; padding:4px 12px; } .chat-page .flame-hint:empty{ display:none; }
  .chat-page .chat-box{ flex:1 1 0; min-height:0; max-height:none; border:0; border-radius:0; padding:12px 10px; gap:6px; background:var(--s1); }
  .chat-page .chat-form{ flex:none; margin:0; gap:6px; padding:8px 8px max(8px,env(safe-area-inset-bottom)); border:0; border-top:1px solid var(--hair); border-radius:0; background:var(--s1); }
  .chat-page .chat-form > input{ border:1px solid var(--line) !important; background:var(--field) !important; border-radius:8px; padding:0 12px; min-height:44px; }
  .chat-page .chat-form .mic-btn{ border-radius:8px; }
  .chat-page .chat-form > .btn-ac{ border-radius:8px; min-height:44px; box-shadow:none; }
  .chat-page .chat-form .rec-bar{ border:1px solid var(--line); border-radius:8px; background:var(--field); }
  .chat-page .bubble{ max-width:84%; border-radius:10px 10px 10px 2px; border-width:1px; padding:8px 12px; animation:none; } .chat-page .bubble.me{ border-radius:10px 10px 2px 10px; }
  body:has(.chat-page) .toast{ bottom:calc(76px + env(safe-area-inset-bottom,0px)); }
  /* la liste : des angles plus nets */
  .sn-list{ border-radius:10px; } .sn-round{ border-radius:10px; } .sn-fab{ border-radius:14px; } .sn-chips .chip{ border-radius:8px; } .sn-search{ border-radius:8px; }
  .sn-row.grp .sn-av > *:first-child{ border-radius:12px !important; }
}

<script>
/* =========================================================

  'EA Sports FC':['ps','pc','xbox'],'Call of Duty':['ps','pc','xbox'],'GTA V':['ps','pc','xbox'],'Valorant':['pc'],'Apex Legends':['ps','pc','xbox'],'League of Legends':['pc'],
  'Rocket League':['ps','pc','xbox','switch'],'Counter-Strike 2':['pc'],'Fall Guys':['ps','pc','xbox','switch'],'Overwatch 2':['ps','pc','xbox','switch']};

const HOURS = [['matin','Matin'],['aprem','Après-midi'],['soir','Soir'],['nuit','Nuit']];

};

let PLAYERS = [

  P('p2','ShadowPlayer',200,['Roblox','Fortnite'],['aprem','nuit'],['mer','sam','dim'],'casual','fun','parfois',['ps','pc'],'shadowplayer',true,false,{Fortnite:'Shad0w'}),

  P('p5','MamadouFC',120,['EA Sports FC','eFootball'],['soir'],['mer','sam','dim'],'comp','serieux','oui',['ps'],'mamadou.fc',true,false),
  P('p6','YaoRush',30,['Fortnite','Apex Legends','Rocket League'],['aprem','soir'],['sam','dim'],'both','both','oui',['pc','xbox'],'yaorush',true,true),
  P('p7','FatouCraft',320,['Minecraft','Fall Guys'],['matin','aprem'],['mer','sam'],'casual','fun','parfois',['mobile','switch'],'fatoucraft',false,false),
  P('p8','Gbaka_225',45,['Free Fire','PUBG Mobile','Mobile Legends'],['soir','nuit'],['lun','ven','sam','dim'],'comp','serieux','oui',['mobile'],'gbaka225',true,true,{'Free Fire':'GBAKA225'}),
  P('p9','NdeyeGG',285,['League of Legends','Valorant'],['soir'],['mar','jeu','sam'],'both','serieux','oui',['pc'],'ndeyegg',true,false),

  P('p13','KouameV',190,['Valorant','Overwatch 2'],['soir','nuit'],['lun','mer','ven'],'comp','serieux','parfois',['pc'],'kouamev',true,false),

];

const DEMO_AGES={p1:22,p2:19,p3:24,p4:27,p5:21,p6:20,p7:16,p8:23,p9:25,p10:29,p11:15,p12:17,p13:26,p14:22,p15:16,p16:17};

/* ---- Âge ---- */
function ageFrom(dob){
  const d=new Date(dob+'T00:00:00'); if(!dob||isNaN(d)) return null;
  const n=new Date(); let a=n.getFullYear()-d.getFullYear();
  if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate())) a--;
  return a;
}
const ageOf = p => p.dob ? ageFrom(p.dob) : p.age;
const ageGroup = p => { const a=ageOf(p); if(a==null && p && p.ageGroup) return p.ageGroup; return (a ?? 0) >= CONFIG.adultAge ? 'adult' : 'minor'; };
// En ligne = statut actif ET activité récente : un onglet fermé sans prévenir ne reste pas « en ligne » pour toujours
const ONLINE_MS = 5*60*1000;
const isOnline = p => !!p && !!p.online && (!p.lastSeen || Date.now()-p.lastSeen < ONLINE_MS);
// Joueur hors ligne : « Vu il y a 2 h » s'il affiche son statut et qu'il est passé depuis moins de 30 jours, sinon « Hors ligne »
const seenTxt = p => { const t=+p.lastSeen||0, d=Date.now()-t; return t>0&&d>=0&&d<30*864e5 ? 'Vu '+ago(t) : 'Hors ligne'; };
// Sans profil avec âge, on ne montre que des profils adultes.
const sameGroup = p => !CONFIG.separateMinors || (S.me && S.me.dob ? ageGroup(p)===ageGroup(S.me) : ageGroup(p)==='adult');

/* =========================================================
   3. MOTEUR DE COMPATIBILITÉ
   ========================================================= */
const MATCHERS = {
  // Chevauchement de listes : moyenne de (communs/plus petite liste) et (communs/plus grande liste)
  overlap(a=[],b=[]){ if(!a.length||!b.length) return 0; const s=a.filter(x=>b.includes(x)).length;
    return (s/Math.min(a.length,b.length) + s/Math.max(a.length,b.length))/2; },
  // Choix simple avec option « mixte » (les deux / parfois)
  choice(a,b,mixed){ if(a===b) return 1; if(a===mixed||b===mixed) return CONFIG.partialMatch; return 0; },
};
const CRITERION_SCORE = {
  games:(a,b)=>MATCHERS.overlap(a.games,b.games),
  hours:(a,b)=>MATCHERS.overlap(a.hours,b.hours),
  days:(a,b)=>MATCHERS.overlap(a.days,b.days),
  style:(a,b)=>MATCHERS.choice(a.style,b.style,'both'),
  goal:(a,b)=>MATCHERS.choice(a.goal,b.goal,'both'),
  voice:(a,b)=>MATCHERS.choice(a.voice,b.voice,'parfois'),
  platform:(a,b)=>a.platforms.some(x=>b.platforms.includes(x)) ? 1 : 0,
  // Rang proche sur les jeux en commun (écart de niveau sur une échelle de 1 à 5)
  rank:(a,b)=>{ const sh=a.games.filter(g=>b.games.includes(g)); if(!sh.length) return 0; const ra=a.ranks||{}, rb=b.ranks||{};
    return sh.reduce((t,g)=>{ const x=rankLevel(g,ra[g]), y=rankLevel(g,rb[g]); return t+(x!=null&&y!=null ? 1-Math.abs(x-y)/4 : .5); },0)/sh.length; },
  language:(a,b)=>(a.langs||['fr']).some(x=>(b.langs||['fr']).includes(x)) ? 1 : 0,
  country:(a,b)=>a.country&&a.country===b.country ? 1 : 0,
};
function compat(a,b){
  const w = S.weights || CONFIG.weights;
  let total=0, sum=0; const detail=[];
  for(const k in w){ if(!w[k] || !CRITERION_SCORE[k]) continue;
    const s = CRITERION_SCORE[k](a,b); total+=w[k]; sum+=w[k]*s; detail.push({k,w:w[k],s}); }
  let pct = total ? Math.round(sum/total*100) : 0;
  const commonGames = a.games.filter(g=>b.games.includes(g));
  if(w.games && !commonGames.length) pct=Math.min(pct, CONFIG.noCommonGameCap);
  // Avis après une partie : « je rejouerais avec lui » remonte le profil, l'inverse le descend
  const rv=a.id==='me'&&S.ratings?S.ratings[b.id]:0; if(rv===1) pct=Math.min(100,pct+5); if(rv===-1) pct=Math.max(0,pct-20);
  return { pct, detail,
    common:{ games:commonGames, hours:a.hours.filter(h=>b.hours.includes(h)) } };
}
const tier = p => p>=80?'var(--hi)':p>=60?'var(--mid)':p>=40?'var(--warm)':'var(--lo)';
const tierTx = p => p>=80?'var(--hi-tx)':p>=60?'var(--mid-tx)':p>=40?'var(--warm-tx)':'var(--lo-tx)';   // même teinte, assombrie ou éclaircie pour rester lisible en petit

}

const ICONS = {

// Favicon aux couleurs du thème actif

/* --- Animations pilotées en JS --- */
function countUp(el){
  const target=+el.dataset.count, span=el.querySelector('span'); if(!span||reduced()) return;
  const card=el.closest('.mcard'), delay=(card?+(card.style.getPropertyValue('--i')||0)*70+150:el.closest('.float-match')?900:0);
  const dur=1200, t0=performance.now()+delay;
  const tick=t=>{ const k=Math.min(1,Math.max(0,(t-t0)/dur)), e=1-Math.pow(1-k,3);
    span.firstChild.nodeValue=Math.round(target*e); if(k<1) requestAnimationFrame(tick); };
  span.firstChild.nodeValue='0'; requestAnimationFrame(tick);
}
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }),{threshold:.2}) : null;
function animateAfterRender(root=app){
  root.querySelectorAll('.ring[data-count]').forEach(countUp);
  root.querySelectorAll('.reveal').forEach(el=> io ? io.observe(el) : el.classList.add('in'));
  root.querySelectorAll('.panel').forEach((p,i)=>p.style.setProperty('--i',i));
}
function burst(x,y){
  if(reduced()) return;
  const cols=['#D9478A','#FF93BB','#FFC6DB','#F04E8C','#9A6BE0'];
  for(let i=0;i<26;i++){ const s=document.createElement('i'); s.className='spark';
    const a=Math.random()*Math.PI*2, d=60+Math.random()*90;
    s.style.cssText=`left:${x}px;top:${y}px;background:${cols[i%5]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px;--r:${Math.random()*540}deg`;
    document.body.appendChild(s); setTimeout(()=>s.remove(),850); }
}

function bloomSVG(){
  let seed=11; const R=()=>(seed=(seed*16807)%2147483647,(seed-1)/2147483646);
  const W=1200,H=640; let leaves='',flowers='',petals='';
  const greens=['#4E7A4A','#3D6640','#6B9A5A','#2F5236','#5C8C50'];
  for(let i=0;i<80;i++){ const x=R()*W|0,y=R()*H|0,rx=30+R()*55|0;
    leaves+=`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${rx*.36|0}" transform="rotate(${R()*180|0} ${x} ${y})" fill="${greens[i%5]}"/>`; }
  const pinks=['#F04E8C','#F77BAA','#FBA6C6','#E23C7A','#FFC6DB','#D9447F','#FF93BB'];
  for(let i=0;i<48;i++){ const cx=R()*W, cy=R()*H, r=40+R()*75; let g=''; const n=14+(R()*12|0);
    for(let j=0;j<n;j++){ const a=R()*6.283, d=R()*r, pr=10+R()*17, fx=cx+Math.cos(a)*d|0, fy=cy+Math.sin(a)*d|0;
      g+=`<circle cx="${fx}" cy="${fy}" r="${pr|0}" fill="${pinks[R()*7|0]}"/>`;
      if(R()>.55) g+=`<circle cx="${fx-pr*.3|0}" cy="${fy-pr*.3|0}" r="${pr*.3|0}" fill="#FFE6F0" opacity=".85"/>`; }
    flowers+=`<g class="sway" style="--sd:${(R()*5).toFixed(1)}s">${g}</g>`; }
  for(let i=0;i<16;i++){ petals+=`<ellipse class="petal" cx="${R()*W|0}" cy="-20" rx="${6+R()*4|0}" ry="4" fill="${['#FFD3E4','#FFB3CF','#FFFFFF'][i%3]}" opacity=".9" style="--dur:${(9+R()*7).toFixed(1)}s;--dl:${(R()*14).toFixed(1)}s;--dx:${(R()*240-120)|0}px"/>`; }
  return `<svg class="bloom" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="${W}" height="${H}" fill="#3A6340"/>${leaves}${flowers}${petals}</svg>`;
}

/* ----- Champ date de naissance (jour / mois / année) ----- */
const knownDob = () => (S.me&&S.me.dob) || (S.auth&&S.dobs&&S.dobs[S.auth.uid]) || '';
const MONTHS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const LOCK_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
function dobField(){
  const kd=knownDob();
  if(kd){
    const [y,m,d]=kd.split('-').map(Number);
    return `<div class="field"><span class="lbl">Date de naissance</span><div class="dob-locked">${LOCK_ICON}<span>${d} ${MONTHS[m-1]} ${y}</span><b>${ageFrom(kd)} ans</b></div><span class="hint">Elle ne peut plus être modifiée. Contacte le support en cas d'erreur.</span></div>`;
  }
  const [y,m,d]=(draft.dob||'--').split('-'), Y=new Date().getFullYear();
  const opt=(v,l,sel)=>`<option value="${v}" ${sel?'selected':''}>${l}</option>`;
  return `<div class="field" role="group" aria-labelledby="dob-lbl"><span class="lbl" id="dob-lbl">Date de naissance</span>
    <div class="dob-row">
      <label class="dob-f"><span>Jour</span><select id="dob-d"><option value="">--</option>${Array.from({length:31},(_,i)=>opt(i+1,i+1,+d===i+1)).join('')}</select></label>
      <label class="dob-f"><span>Mois</span><select id="dob-m"><option value="">--</option>${MONTHS.map((n,i)=>opt(i+1,n[0].toUpperCase()+n.slice(1),+m===i+1)).join('')}</select></label>
      <label class="dob-f"><span>Année</span><select id="dob-y"><option value="">----</option>${Array.from({length:96},(_,i)=>Y-5-i).map(v=>opt(v,v,+y===v)).join('')}</select></label>
    </div>
    <div class="dob-status" id="dob-status" aria-live="polite"></div>
    <span class="hint">Il faut avoir au moins ${CONFIG.minAge} ans. Elle n'est jamais affichée aux autres joueurs.</span></div>`;
}
function initDob(){
  const D=document.getElementById('dob-d'); if(!D) return;
  const M=document.getElementById('dob-m'), Y=document.getElementById('dob-y'), st=document.getElementById('dob-status');
  const update=animate=>{
    const max = M.value ? new Date(+Y.value||2000, +M.value, 0).getDate() : 31;
    [...D.options].forEach(o=>{ if(o.value) o.disabled = +o.value>max; });
    if(+D.value>max) D.value='';
    [D,M,Y].forEach(x=>x.classList.toggle('filled',!!x.value));
    if(D.value && M.value && Y.value){
      draft.dob=`${Y.value}-${M.value.padStart(2,'0')}-${D.value.padStart(2,'0')}`;
      const a=ageFrom(draft.dob);
      if(a<CONFIG.minAge){ st.className='dob-status bad'; st.innerHTML=`<b>${a} ans</b><span>Il faut avoir au moins ${CONFIG.minAge} ans pour utiliser Coopô.</span>`; }
      else{ const minor=a<CONFIG.adultAge; st.className='dob-status ok';
        st.innerHTML=`<b>${a} ans</b><span>${!CONFIG.separateMinors?'Parfait, tu peux trouver ton mate.':minor?`Tu verras les joueurs de ${CONFIG.minAge} à ${CONFIG.adultAge-1} ans.`:`Tu verras les joueurs de ${CONFIG.adultAge} ans et plus.`}</span>`; }
      if(animate){ st.classList.remove('pop'); void st.offsetWidth; st.classList.add('pop'); }
    } else { draft.dob=''; st.className='dob-status'; st.textContent=''; }
  };
  [D,M,Y].forEach(x=>x.addEventListener('change',()=>update(true)));
  update(false);
}
function toggleChip(c){
  c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
  const g=c.dataset.chip, v=c.dataset.val;
  if(c.dataset.single){ draft[g]=v; c.parentElement.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',b===c)); return; }
  const on = c.getAttribute('aria-pressed')!=='true';
  if(on && g==='langs' && draft.langs.length>=LANG_MAX){ toast(`${LANG_MAX} langues au maximum`); return; }
  c.setAttribute('aria-pressed',on);
  draft[g] = on ? [...draft[g],v] : draft[g].filter(x=>x!==v);
  if(g==='games') renderTags();
}
function addOtherGame(){
  const i=document.getElementById('f-other'), v=i.value.trim().slice(0,40); if(!v) return;
  if(!draft.games.includes(v)) draft.games.push(v);
  const box=document.querySelector('.chips'); if(!box.querySelector(`[data-val="${CSS.escape(v)}"]`)){
    box.insertAdjacentHTML('beforeend',`<button type="button" class="chip" data-chip="games" data-val="${esc(v)}" aria-pressed="true">${esc(v)}</button>`); }
  else box.querySelector(`[data-val="${CSS.escape(v)}"]`).setAttribute('aria-pressed','true');
  i.value=''; renderTags();
}
function renderTags(){
  const el=document.getElementById('tags');
  draft.roles=draft.roles||{};
  el.innerHTML = draft.games.length ? draft.games.map((g,i)=>{ const opts=rankOptions(g), cur=draft.ranks[g];
    return `<div class="gameprof"><b>${esc(g)}</b><div class="gp-row">
      <input id="tag${i}" type="text" data-game="${esc(g)}" maxlength="40" value="${esc(draft.tags[g]||'')}" placeholder="Pseudo ou ID sur ${esc(g)}" aria-label="Ton pseudo ou ID sur ${esc(g)}">
      <select data-rank="${esc(g)}" aria-label="Ton rang sur ${esc(g)}"><option value="">${GAME_RANKS[g]?'Rang…':'Niveau…'}</option>${opts.map(([v,l])=>`<option value="${esc(v)}" ${cur===v?'selected':''}>${esc(l)}</option>`).join('')}${cur&&!opts.some(([v])=>v===cur)?`<option value="${esc(cur)}" selected>${esc(rankLabel(g,cur))}</option>`:''}</select>
      ${GAME_ROLES[g]?`<select data-role="${esc(g)}" aria-label="Ton rôle sur ${esc(g)}"><option value="">Rôle…</option>${GAME_ROLES[g].map(r=>`<option value="${esc(r)}" ${draft.roles[g]===r?'selected':''}>${esc(r)}</option>`).join('')}</select>`:''}
    </div></div>`; }).join('')
    : '<p class="hint">Sélectionne tes jeux pour ajouter ton pseudo, ton rang et ton rôle.</p>';
  el.querySelectorAll('input').forEach(i=>i.addEventListener('input',()=>{ draft.tags[i.dataset.game]=i.value.trim(); }));
  el.querySelectorAll('select[data-rank]').forEach(x=>x.addEventListener('change',()=>{ if(x.value) draft.ranks[x.dataset.rank]=x.value; else delete draft.ranks[x.dataset.rank]; }));
  el.querySelectorAll('select[data-role]').forEach(x=>x.addEventListener('change',()=>{ if(x.value) draft.roles[x.dataset.role]=x.value; else delete draft.roles[x.dataset.role]; }));

function pwStrength(p){ let s=0; if(p.length>=CONFIG.minPassword) s++; if(/[a-zA-Z]/.test(p)&&/\d/.test(p)) s++; if(/[^a-zA-Z0-9]/.test(p)) s++; if(p.length>=12) s++; return p?Math.max(s,1):0; }
function loadAvatar(file){
  if(!file||!file.type.startsWith('image/')) return;
  const img=new Image(), url=URL.createObjectURL(file);
  img.onload=()=>{ const c=document.createElement('canvas'); c.width=c.height=128; const x=c.getContext('2d'), m=Math.min(img.width,img.height);   // 128 px suffisent (affichage 88 px max) : image 2 fois plus légère
    x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,128,128); draft.avatar={src:c.toDataURL('image/jpeg',.72)}; URL.revokeObjectURL(url);
    document.querySelectorAll('[data-hue]').forEach(b=>b.setAttribute('aria-pressed','false')); document.getElementById('av-prev').innerHTML=avatar(draft,48); };
  img.src=url;
}
async function submitProfile(e){
  e.preventDefault(); const sbtn=e.target.querySelector('button[type=submit]'); if(sbtn&&sbtn.disabled) return;
  const isNew=!S.me, pw=document.getElementById('f-pw')?.value||'', pw2=document.getElementById('f-pw2')?.value||'';
  draft.name=draft.name.trim(); delete draft.discord; delete draft.whatsapp; delete draft.socials;   // Coopô ne garde plus aucun pseudo d'autres réseaux
  const errs=[];
  if(!new RegExp(`^[A-Za-z0-9_.-]{${CONFIG.minUsername},${CONFIG.maxUsername}}$`).test(draft.name)) errs.push("Choisis un nom d'utilisateur de 3 à 20 caractères (lettres, chiffres, _ . -).");
  if(PLAYERS.some(p=>p.name.toLowerCase()===draft.name.toLowerCase())) errs.push("Ce nom d'utilisateur est déjà pris.");
  if(!S.auth && (isNew||pw)){ if(pw.length<CONFIG.minPassword||!/[a-zA-Z]/.test(pw)||!/\d/.test(pw)) errs.push(`Le mot de passe doit faire au moins ${CONFIG.minPassword} caractères, avec une lettre et un chiffre.`);
    else if(pw!==pw2) errs.push('Les deux mots de passe ne sont pas identiques.'); }
  const age=ageFrom(draft.dob);
  if(age===null) errs.push('Indique ta date de naissance.');
  else if(age<CONFIG.minAge) errs.push(`Tu dois avoir au moins ${CONFIG.minAge} ans pour utiliser Coopô.`);
  else if(age>100) errs.push('Vérifie ta date de naissance.');
  if(!draft.games.length) errs.push('Sélectionne au moins un jeu.');
  if(!draft.hours.length) errs.push('Indique au moins un horaire de jeu.');
  if(!draft.style) errs.push('Choisis ton style de jeu.');
  if(!draft.platforms.length) errs.push('Sélectionne au moins une plateforme.');
  const fe=document.getElementById('ferr');
  const nameChanged = !!S.me && draft.name.toLowerCase()!==String(S.me.name||'').toLowerCase();
  if(nameChanged && S.me.nameAt && Date.now()-S.me.nameAt < NAME_WAIT_DAYS*864e5) errs.push(nameWaitMsg(S.me.nameAt+NAME_WAIT_DAYS*864e5));
  if(!errs.length && (!S.me || draft.name.toLowerCase()!==String(S.me.name||'').toLowerCase())){ if(sbtn) sbtn.disabled=true; const taken=await DB.nameTaken(draft.name); if(sbtn) sbtn.disabled=false; if(taken) errs.push("Ce nom d'utilisateur est déjà pris."); }
  if(errs.length){ fe.innerHTML=errs.map(esc).join('<br>'); fe.scrollIntoView({block:'center'}); return; }
  // Le mot de passe n'est jamais stocké ici. En production : l'envoyer en HTTPS au serveur, qui le hache (argon2 / bcrypt).
  Object.keys(draft.tags).forEach(g=>{ if(!draft.games.includes(g)) delete draft.tags[g]; });
  Object.keys(draft.ranks).forEach(g=>{ if(!draft.games.includes(g)) delete draft.ranks[g]; });
  Object.keys(draft.roles||{}).forEach(g=>{ if(!draft.games.includes(g)) delete draft.roles[g]; });
  if(!draft.langs.length) draft.langs=['fr'];
  S.langAsk=false;
  const prevMe=S.me, sLabel=sbtn?sbtn.textContent:'', wasComplete=profileComplete();
  S.me={...draft,id:'me'}; if(nameChanged) S.me.nameAt=Date.now(); else if(prevMe&&prevMe.nameAt) S.me.nameAt=prevMe.nameAt;
  if(S.auth) S.profiles[S.auth.uid]=S.me; if(isNew) S.onboard=true; save();
  if(sbtn){ sbtn.disabled=true; sbtn.textContent='Enregistrement…'; }
  if(!(await DB.saveProfile(S.me))){   // échec : on revient à l'ancien profil, sans faire croire que c'est enregistré
    S.me=prevMe; if(S.auth&&prevMe) S.profiles[S.auth.uid]=prevMe; save(); if(sbtn){ sbtn.disabled=false; sbtn.textContent=sLabel; }
    if(DB._saveErr==='nameWait'&&prevMe){ prevMe.nameAt=DB._nameAt; save(); }   // on retient la date pour prévenir tout de suite la prochaine fois
    fe.textContent = DB._saveErr==='nameWait' ? nameWaitMsg(DB._nameAt+NAME_WAIT_DAYS*864e5) : DB._saveErr==='name' ? "Ce nom d'utilisateur vient d'être pris. Choisis-en un autre." : "Tes modifications n'ont pas pu être enregistrées. Vérifie ta connexion et réessaie.";
    fe.scrollIntoView({block:'center'}); return; }
  demoScheduleIncoming();
  toast(isNew?'Profil créé':'Modifications enregistrées');
  let next=wasComplete?'#/profil':'#/matchs'; if(isNew){ try{ next=sessionStorage.getItem('coopo_after_profile')||sessionStorage.getItem('coopo_after_login')||'#/matchs'; sessionStorage.removeItem('coopo_after_profile'); sessionStorage.removeItem('coopo_after_login'); }catch(e){} }
  location.hash=next;
}
function publicMe(){ return {...S.me, online:S.privacy.online, lastSeen:Date.now()}; }

/* ----- Mes matchs ----- */
let _lastRefresh=0;
function refreshAfterData(){
  splashSync();   // les données sont là : l'écran d'ouverture peut se retirer
  // Un écran de chargement (squelette) est affiché : on le remplace toujours par la vraie page, quelle que soit la page
  const waiting=!!document.querySelector('#app [aria-busy="true"]');
  if(!waiting && Date.now()-_lastRefresh<800) return; _lastRefresh=Date.now();
  const a=document.activeElement, typing=a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.value;
  const h=location.hash||'#/accueil';
  if(waiting || (!typing && /^#\/(accueil|matchs|groupes|messages|moderation|joueur|recherche|parametres)?(\/|$)/.test(h))) { const y=scrollY; route(); scrollTo(0,y); }
}
// Profil venu de Firestore : on complète les champs manquants pour qu'aucune page ne plante
function normP(p){ p=p||{}; ['games','hours','days','platforms','langs'].forEach(k=>{ if(!Array.isArray(p[k])) p[k]=[]; }); ['tags','ranks','roles'].forEach(k=>{ if(!p[k]||typeof p[k]!=='object') p[k]={}; });
  if(!p.avatar||typeof p.avatar!=='object') p.avatar={hue:265}; if(typeof p.name!=='string'||!p.name) p.name='Joueur';
  if(p.langs.some(x=>!LANG_OK.has(x))){ p.langs=p.langs.filter(x=>LANG_OK.has(x)); p._langLost=true; }   // langue retirée de la liste
  return p; }
const dataPending = () => DB.live && !!S.auth && !DB._loaded;
/* Écran squelette : on montre tout de suite la forme des cartes pendant que les données arrivent */
function loadingView(title){ const sk=`<div class="mcard sk-card" aria-hidden="true"><div class="mc-head"><span class="sk sk-av"></span><div class="sk-lines"><span class="sk" style="width:60%"></span><span class="sk" style="width:35%"></span></div></div><span class="sk" style="width:90%"></span><span class="sk" style="width:70%"></span></div>`;
  app.innerHTML=`<div class="wrap page" aria-busy="true"><div class="page-head"><div><h2>${title}</h2><p class="muted">Chargement de tes données…</p></div></div><div class="grid">${sk.repeat(6)}</div></div>`; }
function needProfile(title){
  app.innerHTML=`<div class="wrap page"><div class="page-head"><h2>${title}</h2></div><div class="empty"><h3>Crée ton profil pour voir tes matchs</h3>
  <p class="muted">Tes jeux, horaires et style servent à calculer ta compatibilité avec chaque joueur.</p><a class="btn btn-ac" href="#/profil">Créer mon profil</a>${S.auth?'':'<a class="linkbtn" href="#/connexion">J\'ai déjà un compte</a>'}</div></div>`;

let shown=9;
function viewMatches(){
  if(dataPending()) return loadingView('Mes matchs');

  const vis=visible(), mates=matesList(), onlineNow=ranked().filter(({p})=>isOnline(p));

    ${onlineNow.length?`<h3 style="margin-bottom:10px"><span class="online"></span> En ligne maintenant</h3><div class="online-strip">${onlineNow.slice(0,10).map(({p,c})=>`<a class="online-card" href="#/joueur/${p.id}">${avatar(p,56)}<b>${esc(p.name)}${modBadge(p)}</b><span style="color:${tierTx(c.pct)}">${c.pct} %</span></a>`).join('')}</div>`:''}
    ${mates.length?`<h3 style="margin-bottom:10px">Mes mates</h3><div class="mates-strip">${mates.map(p=>`<a class="mate-pill" href="#/joueur/${p.id}">${avatar(p,28)}${esc(p.name)}${modBadge(p)}</a>`).join('')}</div>`:''}
    ${r.length?'':`<div class="empty"><h3>Coopô vient d'ouvrir</h3><p class="muted">Les premiers joueurs arrivent. Partage le site à tes amis : dès qu'un joueur compatible s'inscrit, il apparaît ici.</p><button class="btn btn-ac" type="button" id="ref-share">Inviter mes amis</button></div>`}
    <div class="grid">${r.slice(0,shown).map((m,i)=>matchCard(m,i===0,i)).join('')}</div>

  document.getElementById('more')?.addEventListener('click',()=>{ shown+=9; viewMatches(); animateAfterRender(); });

  onboarding();
}

/* ----- Recherche ----- */
const F={q:'',game:'',level:'',platform:'',hour:'',style:'',lang:'',country:'',online:false,min:0,shown:24};   // shown : nombre de cartes affichées (pagination)
const F_MORE=['level','platform','hour','style','lang','country'];   // filtres rangés sous « Plus de filtres »
const filtersOn = () => ['q','game',...F_MORE].filter(k=>F[k]).length + (F.online?1:0) + (F.min>0?1:0);
function resetFilters(){ Object.assign(F,{q:'',game:'',level:'',platform:'',hour:'',style:'',lang:'',country:'',online:false,min:0,shown:24}); }
function viewSearch(){
  const opt=(arr,sel)=>arr.map(([v,l])=>`<option value="${esc(v)}" ${sel===v?'selected':''}>${esc(l)}</option>`).join('');
  const sel=(id,k,label,all,arr)=>`<div class="field"><label for="${id}">${label}</label><select id="${id}" data-f="${k}"><option value="">${all}</option>${opt(arr,F[k])}</select></div>`;
  const games=[...new Set([...GAMES,...visible().flatMap(p=>p.games),...(F.game?[F.game]:[])])];   // la liste + les jeux ajoutés par les joueurs
  const nMore=F_MORE.filter(k=>F[k]).length;
  app.innerHTML=`<div class="wrap page">
    ${backLink('#/matchs','Mes matchs')}
    <div class="page-head"><div><h2>Recherche</h2><p>Trouve un joueur par son pseudo ou selon tes critères.</p></div></div>
    ${gamesPulse()}
    <div class="filters" id="filters">
      <div class="field"><label for="s-q">Pseudo</label><input id="s-q" type="search" data-f="q" value="${esc(F.q)}" placeholder="Rechercher un joueur" autocomplete="off"></div>
      ${sel('s-g','game','Jeu','Tous',games.map(g=>[g,g]))}
      <label class="f-check"><input type="checkbox" id="s-on" data-f="online" ${F.online?'checked':''}> En ligne ou dispo</label>
      <details class="f-more"${nMore||innerWidth>860?' open':''}><summary>Plus de filtres${nMore?` (${nMore})`:''}</summary><div class="f-more-body">
        ${sel('s-l','level','Niveau','Tous',RANKS)}
        ${sel('s-p','platform','Plateforme','Toutes',PLATFORMS)}
        ${sel('s-h','hour','Horaire','Tous',HOURS)}
        ${sel('s-s','style','Style','Tous',STYLES.slice(0,2))}
        ${sel('s-la','lang','Langue','Toutes',LANGS)}
        ${sel('s-c','country','Pays','Tous',COUNTRIES)}
        ${S.me?`<div class="field f-wide"><label for="s-m">Compatibilité minimum</label><div class="range-row"><input id="s-m" type="range" min="0" max="100" step="5" data-f="min" value="${F.min}"><output id="s-mo">${F.min} %</output></div></div>`:''}
      </div></details>
    </div>
    <p class="count" aria-live="polite"><span id="count"></span> <button type="button" class="linklike" id="s-reset" hidden>Effacer les filtres</button></p><div class="grid" id="results"></div></div>`;
  let tq; // debounce : on attend que le joueur arrête de taper (250 ms) avant de relancer la recherche
  document.getElementById('filters').addEventListener('input',e=>{ const k=e.target.dataset.f; if(!k) return;
    F[k]= k==='min' ? +e.target.value : k==='online' ? e.target.checked : e.target.value; if(k==='min') document.getElementById('s-mo').textContent=F.min+' %';
    clearTimeout(tq); if(k==='q'||k==='min') tq=setTimeout(()=>{ F.shown=24; renderResults(); },250); else { F.shown=24; renderResults(); } });
  document.getElementById('s-reset').onclick=()=>{ resetFilters(); viewSearch(); };
  renderResults();
  if(DB.live&&S.me&&DB._loaded) DB.refreshPlayers().then(ch=>{ if(ch&&location.hash==='#/recherche'&&document.getElementById('results')) renderResults(); }).catch(()=>{});
}
function renderResults(){
  const lvl=(p,g)=>{ const l=rankLevel(g,(p.ranks||{})[g]); return l==null?null:Math.round(l); };   // rang du jeu ramené sur 5 niveaux
  let rows = S.me ? ranked() : visible().map(p=>({p,c:null}));
  rows = rows.filter(({p,c})=>(!F.q||p.name.toLowerCase().includes(F.q.toLowerCase())) && (!F.game||p.games.includes(F.game))
    && (!F.level||(F.game?lvl(p,F.game)===+F.level:p.games.some(g=>lvl(p,g)===+F.level)))
    && (!F.platform||p.platforms.includes(F.platform)) && (!F.hour||p.hours.includes(F.hour))
    && (!F.style||p.style===F.style||p.style==='both')
    && (!F.lang||(p.langs&&p.langs.length?p.langs:['fr']).includes(F.lang)) && (!F.country||p.country===F.country)
    && (!F.online||isOnline(p)||dispoActive(p)) && (!c||c.pct>=F.min));
  document.getElementById('count').textContent = `${rows.length} joueur${rows.length>1?'s':''} trouvé${rows.length>1?'s':''}`;
  document.getElementById('s-reset').hidden = !filtersOn();
  // Pagination : on n'affiche que les 24 premiers joueurs, puis 24 de plus à chaque clic
  document.getElementById('results').innerHTML = rows.length ? rows.slice(0,F.shown).map((m,i)=>matchCard(m,false,Math.min(i,10))).join('')
      + (rows.length>F.shown?`<div style="grid-column:1/-1;text-align:center;margin-top:8px"><button class="btn" type="button" id="more-results">Voir plus de joueurs (${rows.length-F.shown})</button></div>`:'')
    : `<div class="empty" style="grid-column:1/-1"><h3>Aucun mate trouvé</h3><p class="muted">${filtersOn()?'Essaie d\'élargir tes filtres : retires-en un, ou baisse la compatibilité minimum.':'Aucun joueur n\'est encore inscrit. Invite tes amis !'}</p>${filtersOn()?'<button class="btn btn-ac" type="button" id="s-reset2">Effacer les filtres</button>':'<button class="btn btn-ac" type="button" data-ref-share>Inviter mes amis</button>'}</div>`;
  const more=document.getElementById('more-results'); if(more) more.onclick=()=>{ F.shown+=24; renderResults(); };
  const r2=document.getElementById('s-reset2'); if(r2) r2.onclick=()=>{ resetFilters(); viewSearch(); };
  animateAfterRender(document.getElementById('results'));
}
/* ----- Profil public d'un joueur ----- */

  const shared = g => S.me&&!self&&S.me.games.includes(g);

  app.innerHTML=`<div class="wrap page"><a class="back" href="#/matchs" data-back><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Retour</a>
  <div class="pp">

    <div class="pp-main">
    <section class="panel"><h3>Jeux</h3><div class="tags">${p.games.map(g=>`<div class="gametag${shared(g)?' shared':''}"><span>${esc(g)}${p.ranks&&p.ranks[g]?` <small class="rank">${esc(rankLabel(g,p.ranks[g]))}</small>`:''}${p.roles&&p.roles[g]?` <small class="rank role">${esc(p.roles[g])}</small>`:''}</span><em>${showTags&&p.tags[g]?esc(p.tags[g]):(shared(g)?'En commun':'')}</em></div>`).join('')}</div></section>
    <section class="panel"><h3>Habitudes de jeu</h3><dl class="facts">
      <div><dt>Horaires</dt><dd>${list(p.hours,h=>L(HOURS,h))}</dd></div>
      <div><dt>Jours</dt><dd>${list(p.days,d=>L(DAYS,d))}</dd></div>
      <div><dt>Style</dt><dd>${L(STYLES,p.style)}</dd></div>
      <div><dt>Recherche</dt><dd>${L(GOALS,p.goal)}</dd></div>
      <div><dt>Communication</dt><dd>${L(VOICE,p.voice)}</dd></div>
      <div><dt>Plateformes</dt><dd>${list(p.platforms,x=>L(PLATFORMS,x))}</dd></div></dl></section>
    ${mate?`<section class="panel rate"><h3>Vous avez joué ensemble ?</h3><p class="muted">Tu rejouerais avec ${esc(p.name)} ? Ta réponse reste privée et affine tes prochains matchs.</p>
      <div class="nact"><button class="btn ${S.ratings[id]===1?'btn-ac':'btn-ghost'}" data-rate="1">👍 Oui, carrément</button><button class="btn ${S.ratings[id]===-1?'btn-danger':'btn-ghost'}" data-rate="-1">👎 Non, pas trop</button></div></section>`:''}
  </div>

      :self?`<p class="muted">C'est ton profil tel que les autres joueurs le voient.</p>`:`<p class="muted">Crée ton profil pour voir ta compatibilité avec ${esc(p.name)}.</p>`}

  document.getElementById('accept')?.addEventListener('click',ev=>{ const b=ev.currentTarget.getBoundingClientRect(); burst(b.left+b.width/2,b.top+b.height/2); answerRequest(id,true); renderNotifBadge(); re(); });

  document.getElementById('unmate')?.addEventListener('click',()=>modal(`<h3>Retirer ${esc(p.name)} de tes mates ?</h3><p class="muted">Vous ne pourrez plus vous écrire, sauf nouvelle demande acceptée.</p><div class="dlg-actions"><button class="btn btn-ghost" data-close>Annuler</button><button class="btn btn-danger" id="uok">Retirer</button></div>`,

  document.getElementById('block')?.addEventListener('click',()=>modal(`<h3>Bloquer ${esc(p.name)} ?</h3><p class="muted">Tu ne verras plus son profil, ${esc(p.name)} ne pourra plus te contacter et sera retiré de tes mates. Tu peux le débloquer dans les paramètres.</p>

/* E-mail non vérifié (comptes créés avec e-mail + mot de passe) : on propose de renvoyer le lien de vérification */
function emailVerifyPanel(){
  let u=null; try{ u=AUTH_LIVE&&window.firebase&&firebase.auth?firebase.auth().currentUser:null; }catch(e){}
  if(!u||u.emailVerified||!u.providerData.some(x=>x&&x.providerId==='password')) return '';
  return `<section class="panel" id="ev-panel"><h3>Vérifie ton adresse e-mail</h3><p class="hint">Ton adresse n'est pas encore vérifiée. Clique sur le lien reçu par e-mail : ça protège ton compte et permet de le récupérer si tu oublies ton mot de passe.</p><button class="btn" type="button" id="ev-send">Renvoyer l'e-mail de vérification</button></section>`;
}
document.addEventListener('click',async e=>{ const b=e.target.closest&&e.target.closest('#ev-send'); if(!b) return; b.disabled=true;
  try{ const u=firebase.auth().currentUser; await u.reload(); if(u.emailVerified){ toast('Ton e-mail est déjà vérifié'); document.getElementById('ev-panel')?.remove(); return; }
    await u.sendEmailVerification(); toast('E-mail envoyé. Regarde aussi dans tes spams.'); }
  catch(err){ console.error(err); toast("L'e-mail n'a pas pu être envoyé. Réessaie dans quelques minutes."); b.disabled=false; } });

if(discordOK()){ const ft=document.querySelector('.foot'); if(ft) ft.insertAdjacentHTML('afterbegin',`<a href="${esc(DISCORD_INVITE)}" target="_blank" rel="noopener noreferrer">Discord</a>`); }

const rng = seed => () => (seed=(seed*16807)%2147483647,(seed-1)/2147483646);
const svgWrap = (inner,defs='') => `<svg class="bloom" viewBox="0 0 1200 640" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>${defs}</defs>${inner}</svg>`;

function shapesSVG(){
  const R=rng(5); let out='';
  const cols=['#3EE6B5','#FF5A6E','#9FD4FF','#FF8FD0'];
  const shape=(t,x,y,s,c)=> t===0?`<polygon points="${x},${y-s} ${x+s*.87|0},${y+s*.5|0} ${x-s*.87|0},${y+s*.5|0}" stroke="${c}"/>`
    : t===1?`<circle cx="${x}" cy="${y}" r="${s}" stroke="${c}"/>`
    : t===2?`<path d="M${x-s} ${y-s}L${x+s} ${y+s}M${x+s} ${y-s}L${x-s} ${y+s}" stroke="${c}"/>`
    : `<rect x="${x-s}" y="${y-s}" width="${s*2}" height="${s*2}" rx="${s*.18|0}" stroke="${c}"/>`;
  for(let i=0;i<24;i++){ const t=i%4, x=R()*1200|0, y=R()*640|0, s=18+R()*42|0;
    out+=`<g class="floaty" style="--fdl:${(R()*9).toFixed(1)}s;--fx:${(R()*80-40)|0}px;--fy:${(R()*80-40)|0}px;--fr:${(R()*120-60)|0}deg;opacity:${(.35+R()*.6).toFixed(2)}">${shape(t,x,y,s,cols[t])}</g>`; }
  return svgWrap(`<rect width="1200" height="640" fill="url(#dots)"/><g fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">${out}</g>`,
    `<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="rgba(255,255,255,.2)"/></pattern>`);
}

function lofiSVG(){
  const R=rng(57);
  const f=n=>n.toFixed(1);
  // gros cumulus peints : bulles blanches, ombres bleutées en bas
  let cdefs='';
  const cloud=(cx,cy,w,h,seed,op,cls)=>{ const r=rng(seed), id='etC'+seed; let b='', hl='', sh='';
    cdefs+=`<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="0" y1="${f(cy-h)}" x2="0" y2="${f(cy+h*.3)}"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#F6FAFC"/><stop offset=".8" stop-color="#C9DCEB"/><stop offset="1" stop-color="#9DBBD6"/></linearGradient>`;
    for(let i=0;i<30;i++){ const t=r(), x=cx+(t-.5)*w, k=1-Math.pow(Math.abs(t-.5)*2,1.5), rad=h*(.2+r()*.3)*(.5+k*.7), top=cy-k*h*(.5+r()*.45);
      b+=`<circle cx="${f(x)}" cy="${f(top+rad*.5)}" r="${f(rad)}"/>`;
      if(r()<.45) hl+=`<circle cx="${f(x-rad*.18)}" cy="${f(top+rad*.25)}" r="${f(rad*.6)}"/>`;
      if(r()<.3) sh+=`<circle cx="${f(x+rad*.3)}" cy="${f(top+rad*.95)}" r="${f(rad*.55)}"/>`; }
    b+=`<ellipse cx="${cx}" cy="${f(cy+h*.1)}" rx="${f(w*.5)}" ry="${f(h*.2)}"/>`;
    return `<g class="${cls||''}" opacity="${op}"><g filter="url(#etSoft)"><g fill="url(#${id})">${b}</g><g fill="#B7CFE3" opacity=".25">${sh}</g><g fill="#FFFFFF" opacity=".4">${hl}</g></g></g>`; };

  // fleurs des champs
  const fl=(x,y,s,c)=>{ let p=''; for(let i=0;i<5;i++){ const a=i*72*Math.PI/180; p+=`<circle cx="${f(Math.cos(a)*5*s)}" cy="${f(Math.sin(a)*5*s)}" r="${f(3.6*s)}" fill="${c}"/>`; }

  let flowers='';
  const fcols=['#FFFFFF','#FFFFFF','#F7B6C8','#FFE07A','#FFFFFF'];
  for(let i=0;i<26;i++){ const x=R()*1200, y=470+R()*120; flowers+=fl(x,y,.8+R()*.7,fcols[(R()*5)|0]); }
  // feuilles qui s'envolent avec le vent
  let leaves='';
  for(let i=0;i<10;i++){ leaves+=`<g class="et-leaf" style="--y:${(120+R()*360)|0}px;--d:${(7+R()*7).toFixed(1)}s;--dl:${(R()*12).toFixed(1)}s"><path d="M0 0 C6 -6 16 -6 22 0 C16 6 6 6 0 0Z" fill="${R()<.5?'#6CBF3A':'#A5D867'}" transform="scale(${(.7+R()*.7).toFixed(2)})"/></g>`; }
  return svgWrap(`<rect width="1200" height="640" fill="url(#etSky)"/>
    <rect width="1200" height="640" fill="url(#etLight)"/>
    ${cloud(980,250,640,260,5,1,'')}${cloud(170,170,420,150,9,1,'et-drift')}${cloud(560,120,260,80,14,.9,'et-drift2')}
    ${cloud(560,470,900,150,21,1,'')}
    <path d="M-20 520 C200 470 420 500 640 480 C860 460 1040 500 1220 470 L1220 640 L-20 640Z" fill="#7CC24A"/>
    <path d="M-20 545 C240 520 470 540 700 525 C900 512 1060 540 1220 520 L1220 640 L-20 640Z" fill="#5FAE36"/>
    <g>${grassBack}</g>
    <g>${flowers}</g>
    <g>${grassFront}</g>
    <g>${leaves}</g>`,
    `<linearGradient id="etSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0F6EA8"/><stop offset=".45" stop-color="#1F86C2"/><stop offset=".8" stop-color="#5DB0DB"/><stop offset="1" stop-color="#9ED2EC"/></linearGradient>
     <radialGradient id="etLight" cx=".75" cy=".1" r=".7"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".25"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
     <filter id="etSoft" x="-10%" y="-20%" width="120%" height="140%"><feGaussianBlur stdDeviation="1.4"/></filter>${cdefs}`);
}

const LOW_END = (()=>{ try{ return (navigator.deviceMemory&&navigator.deviceMemory<=2) || (navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=2) || !!(navigator.connection&&navigator.connection.saveData); }catch(e){ return false; } })();
const liteOn = () => typeof S.lite==='boolean' ? S.lite : LOW_END;

const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.random()*a.length|0];
const reduced=()=>liteOn()||matchMedia('(prefers-reduced-motion: reduce)').matches;

function buildFx(){
  const fx=document.getElementById('fx'), orbs=document.querySelector('.orbs');
  if(!fx||!orbs) return;
  fx.innerHTML=''; orbs.innerHTML='';
  const f=FX[S.skin]; if(!f||reduced()) return;
  if(f.orbs) orbs.innerHTML=[...f.orbs,...f.orbs].slice(0,5).map((c,i)=>
    `<i style="--c:${c};--x:${rand(-15,75)|0}%;--y:${(i*20+rand(-6,8))|0}%;--s:${rand(280,540)|0}px;--d:${rand(16,26)|0}s;--dl:${rand(0,20)|0}s;--o:${f.orbO||.3}"></i>`).join('');
  const p=f.particles; if(!p) return;
  const n = innerWidth<700 ? Math.ceil(p.n*.5) : p.n; let h='';
  for(let i=0;i<n;i++){
    const st=`--l:${rand(0,100).toFixed(1)}%;--c:${pick(p.colors)};--dur:${rand(p.dmin,p.dmax).toFixed(1)}s;--dl:${rand(0,18).toFixed(1)}s;--dx:${rand(-140,140)|0}px;--r:${rand(180,720)|0}deg`;
    if(p.kind==='petal'||p.kind==='leaf') h+=`<i class="p ${p.kind}" style="${st};--w:${rand(9,15)|0}px"></i>`;
    else if(p.kind==='sparkle') h+=`<i class="p spk" style="${st};--t:${rand(6,94).toFixed(1)}%;--w:${rand(10,22)|0}px">${pick(p.chars)}</i>`;
    else if(p.kind==='dot') h+=`<i class="p dot" style="${st};--w:${rand(2,5).toFixed(1)}px"></i>`;
    else if(p.kind==='bubble') h+=`<i class="p bub" style="${st};--w:${rand(8,22)|0}px"></i>`;
  }
  fx.innerHTML=h;
}
function playWipe(){
  const f=FX[S.skin], w=document.getElementById('wipe'); if(!w||!f||!f.wipe||reduced()) return;
  w.className=''; w.innerHTML = f.wipe==='panels' ? '<i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i>' : '';
  void w.offsetWidth; w.className=f.wipe;
  clearTimeout(w._t); w._t=setTimeout(()=>{ w.className=''; w.innerHTML=''; },950);
}
function spawn(x,y,o){
  const s=document.createElement('i'); s.className='fxp '+o.cls; if(o.text) s.textContent=o.text;
  s.style.cssText=`left:${x}px;top:${y}px;--dx:${(o.dx||0)|0}px;--dy:${(o.dy||0)|0}px;--r:${rand(-90,90)|0}deg;--t:${o.life}ms;`
    +(o.color?`color:${o.color};`:'')+(o.size&&o.text?`font-size:${o.size|0}px;`:'')+(o.bg?`background:${o.bg};width:${o.size}px;height:${o.size}px;`:'');
  document.body.appendChild(s); setTimeout(()=>s.remove(),o.life+60);
}

function prunierSVG(){
  const PR_W=Math.min(2000,Math.max(800,Math.ceil(innerWidth*Math.min(window.devicePixelRatio||1,2)/400)*400));   // largeur de la photo adaptée à l'écran
  const R=rng(88);
  const f1=n=>n.toFixed(1);
  // point et tangente d'une courbe de Bézier cubique
  const bez=(p,t)=>{ const u=1-t; return [u*u*u*p[0]+3*u*u*t*p[2]+3*u*t*t*p[4]+t*t*t*p[6], u*u*u*p[1]+3*u*u*t*p[3]+3*u*t*t*p[5]+t*t*t*p[7]]; };
  // branche pleine qui s'affine, avec un léger relief irrégulier
  const limb=(p,w0,w1,n,wob)=>{ const L=[],Rt=[];
    for(let i=0;i<=n;i++){ const t=i/n, a=bez(p,t), b=bez(p,Math.min(1,t+.01)), c=bez(p,Math.max(0,t-.01));
      const dx=b[0]-c[0], dy=b[1]-c[1], l=Math.hypot(dx,dy)||1, nx=-dy/l, ny=dx/l;

      <circle r="${f1(13*s)}" fill="url(#prHeart)"/>${st}
      <circle r="${f1(4*s)}" fill="#D9E27A"/><circle r="${f1(2*s)}" fill="#9BAF3A"/></g>`;
  };
  const bud=(x,y,s,a)=>`<g transform="translate(${x} ${y}) rotate(${a})">
      <path d="M${-4*s} ${2*s} Q0 ${-3*s} ${4*s} ${2*s} L${2*s} ${7*s} L${-2*s} ${7*s}Z" fill="#3A1712"/>

const curOK = c => !SHOP.currencies || SHOP.currencies.includes(c);
