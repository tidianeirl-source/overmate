function countUp(el){
  const target=+el.dataset.count, span=el.querySelector('span'); if(!span||reduced()) return;
  const card=el.closest('.mcard'), delay=(card?+(card.style.getPropertyValue('--i')||0)*70+150:el.closest('.float-match')?900:0);
  const dur=1200, t0=performance.now()+delay;
  const tick=t=>{ const k=Math.min(1,Math.max(0,(t-t0)/dur)), e=1-Math.pow(1-k,3);
    span.firstChild.nodeValue=Math.round(target*e); if(k<1) requestAnimationFrame(tick); };
  span.firstChild.nodeValue='0'; requestAnimationFrame(tick);
}
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }),{threshold:.2}) : null;
function animateAfterRender(root=app){
  root.querySelectorAll('.ring[data-count]').forEach(countUp);
  root.querySelectorAll('.reveal').forEach(el=> io ? io.observe(el) : el.classList.add('in'));
  root.querySelectorAll('.panel').forEach((p,i)=>p.style.setProperty('--i',i));
}
function burst(x,y){
  if(reduced()) return;
  const cols=['#D9478A','#FF93BB','#FFC6DB','#F04E8C','#9A6BE0'];
  for(let i=0;i<26;i++){ const s=document.createElement('i'); s.className='spark';
    const a=Math.random()*Math.PI*2, d=60+Math.random()*90;
    s.style.cssText=`left:${x}px;top:${y}px;background:${cols[i%5]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px;--r:${Math.random()*540}deg`;
    document.body.appendChild(s); setTimeout(()=>s.remove(),850); }
}

function bloomSVG(){
  let seed=11; const R=()=>(seed=(seed*16807)%2147483647,(seed-1)/2147483646);
  const W=1200,H=640; let leaves='',flowers='',petals='';
  const greens=['#4E7A4A','#3D6640','#6B9A5A','#2F5236','#5C8C50'];
  for(let i=0;i<80;i++){ const x=R()*W|0,y=R()*H|0,rx=30+R()*55|0;
    leaves+=`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${rx*.36|0}" transform="rotate(${R()*180|0} ${x} ${y})" fill="${greens[i%5]}"/>`; }
  const pinks=['#F04E8C','#F77BAA','#FBA6C6','#E23C7A','#FFC6DB','#D9447F','#FF93BB'];
  for(let i=0;i<48;i++){ const cx=R()*W, cy=R()*H, r=40+R()*75; let g=''; const n=14+(R()*12|0);
    for(let j=0;j<n;j++){ const a=R()*6.283, d=R()*r, pr=10+R()*17, fx=cx+Math.cos(a)*d|0, fy=cy+Math.sin(a)*d|0;
      g+=`<circle cx="${fx}" cy="${fy}" r="${pr|0}" fill="${pinks[R()*7|0]}"/>`;
      if(R()>.55) g+=`<circle cx="${fx-pr*.3|0}" cy="${fy-pr*.3|0}" r="${pr*.3|0}" fill="#FFE6F0" opacity=".85"/>`; }
    flowers+=`<g class="sway" style="--sd:${(R()*5).toFixed(1)}s">${g}</g>`; }
  for(let i=0;i<16;i++){ petals+=`<ellipse class="petal" cx="${R()*W|0}" cy="-20" rx="${6+R()*4|0}" ry="4" fill="${['#FFD3E4','#FFB3CF','#FFFFFF'][i%3]}" opacity=".9" style="--dur:${(9+R()*7).toFixed(1)}s;--dl:${(R()*14).toFixed(1)}s;--dx:${(R()*240-120)|0}px"/>`; }
  return `<svg class="bloom" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="${W}" height="${H}" fill="#3A6340"/>${leaves}${flowers}${petals}</svg>`;
}

function initDob(){
  const D=document.getElementById('dob-d'); if(!D) return;
  const M=document.getElementById('dob-m'), Y=document.getElementById('dob-y'), st=document.getElementById('dob-status');
  const update=animate=>{

    [...D.options].forEach(o=>{ if(o.value) o.disabled = +o.value>max; });
    if(+D.value>max) D.value='';
    [D,M,Y].forEach(x=>x.classList.toggle('filled',!!x.value));
    if(D.value && M.value && Y.value){
      draft.dob=`${Y.value}-${M.value.padStart(2,'0')}-${D.value.padStart(2,'0')}`;
      const a=ageFrom(draft.dob);
      if(a<CONFIG.minAge){ st.className='dob-status bad'; st.innerHTML=`<b>${a} ans</b><span>Il faut avoir au moins ${CONFIG.minAge} ans pour utiliser Coopô.</span>`; }
      else{ const minor=a<CONFIG.adultAge; st.className='dob-status ok';
        st.innerHTML=`<b>${a} ans</b><span>${!CONFIG.separateMinors?(minor?'Parfait, tu peux trouver ton mate. Avec les joueurs de 18 ans et plus, c\'est toi qui envoies la demande.':'Parfait, tu peux trouver ton mate.'):minor?`Tu verras les joueurs de ${CONFIG.minAge} à ${CONFIG.adultAge-1} ans.`:`Tu verras les joueurs de ${CONFIG.adultAge} ans et plus.`}</span>`; }
      if(animate){ st.classList.remove('pop'); void st.offsetWidth; st.classList.add('pop'); }
    } else { draft.dob=''; st.className='dob-status'; st.textContent=''; }
  };
  [D,M,Y].forEach(x=>x.addEventListener('change',()=>update(true)));

}

  app.innerHTML=`<div class="wrap page">

        ${S.me?`<div class="field f-wide"><label for="s-m">Compatibilité minimum</label><div class="range-row"><input id="s-m" type="range" min="0" max="100" step="5" data-f="min" value="${F.min}"><output id="s-mo">${F.min} %</output></div></div>`:''}

  let tq; // debounce : on attend que le joueur arrête de taper (250 ms) avant de relancer la recherche
  document.getElementById('filters').addEventListener('input',e=>{ const k=e.target.dataset.f; if(!k) return;
    F[k]= k==='min' ? +e.target.value : k==='online' ? e.target.checked : e.target.value; if(k==='min') document.getElementById('s-mo').textContent=F.min+' %';
    clearTimeout(tq); if(k==='q'||k==='min') tq=setTimeout(()=>{ F.shown=24; renderResults(); },250); else { F.shown=24; renderResults(); } });
  document.getElementById('s-reset').onclick=()=>{ resetFilters(); viewSearch(); };
  renderResults();
  if(DB.live&&S.me&&DB._loaded) DB.refreshPlayers().then(ch=>{ if(ch&&location.hash==='#/recherche'&&document.getElementById('results')) renderResults(); }).catch(()=>{});
}
function renderResults(){
  const lvl=(p,g)=>{ const l=rankLevel(g,(p.ranks||{})[g]); return l==null?null:Math.round(l); };   // rang du jeu ramené sur 5 niveaux
  let rows = S.me ? ranked() : visible().map(p=>({p,c:null}));
  rows = rows.filter(({p,c})=>(!F.q||p.name.toLowerCase().includes(F.q.toLowerCase())) && (!F.game||p.games.includes(F.game))
    && (!F.level||(F.game?lvl(p,F.game)===+F.level:p.games.some(g=>lvl(p,g)===+F.level)))
    && (!F.platform||p.platforms.includes(F.platform)) && (!F.hour||p.hours.includes(F.hour))
    && (!F.style||p.style===F.style||p.style==='both')
    && (!F.lang||(p.langs&&p.langs.length?p.langs:['fr']).includes(F.lang)) && (!F.country||p.country===F.country)
    && (!F.online||isOnline(p)||dispoActive(p)) && (!c||c.pct>=F.min));
  document.getElementById('count').textContent = `${rows.length} joueur${rows.length>1?'s':''} trouvé${rows.length>1?'s':''}`;
  document.getElementById('s-reset').hidden = !filtersOn();
  // Pagination : on n'affiche que les 24 premiers joueurs, puis 24 de plus à chaque clic
  document.getElementById('results').innerHTML = rows.length ? rows.slice(0,F.shown).map((m,i)=>matchCard(m,false,Math.min(i,10))).join('')
      + (rows.length>F.shown?`<div style="grid-column:1/-1;text-align:center;margin-top:8px"><button class="btn" type="button" id="more-results">Voir plus de joueurs (${rows.length-F.shown})</button></div>`:'')
    : `<div class="empty" style="grid-column:1/-1"><h3>Aucun mate trouvé</h3><p class="muted">${filtersOn()?'Essaie d\'élargir tes filtres : retires-en un, ou baisse la compatibilité minimum.':'Aucun joueur n\'est encore inscrit. Invite tes amis !'}</p>${filtersOn()?'<button class="btn btn-ac" type="button" id="s-reset2">Effacer les filtres</button>':'<button class="btn btn-ac" type="button" data-ref-share>Inviter mes amis</button>'}</div>`;
  const more=document.getElementById('more-results'); if(more) more.onclick=()=>{ F.shown+=24; renderResults(); };
  const r2=document.getElementById('s-reset2'); if(r2) r2.onclick=()=>{ resetFilters(); viewSearch(); };
  animateAfterRender(document.getElementById('results'));
}

function emailVerifyPanel(){
  let u=null; try{ u=AUTH_LIVE&&window.firebase&&firebase.auth?firebase.auth().currentUser:null; }catch(e){}
  if(!u||u.emailVerified||!u.providerData.some(x=>x&&x.providerId==='password')) return '';
  return `<section class="panel" id="ev-panel"><h3>Vérifie ton adresse e-mail</h3><p class="hint">Ton adresse n'est pas encore vérifiée. Clique sur le lien reçu par e-mail : ça protège ton compte et permet de le récupérer si tu oublies ton mot de passe.</p><button class="btn" type="button" id="ev-send">Renvoyer l'e-mail de vérification</button></section>`;
}
document.addEventListener('click',async e=>{ const b=e.target.closest&&e.target.closest('#ev-send'); if(!b) return; b.disabled=true;
  try{ const u=firebase.auth().currentUser; await u.reload(); if(u.emailVerified){ toast('Ton e-mail est déjà vérifié'); document.getElementById('ev-panel')?.remove(); return; }

const rng = seed => () => (seed=(seed*16807)%2147483647,(seed-1)/2147483646);
const svgWrap = (inner,defs='') => `<svg class="bloom" viewBox="0 0 1200 640" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>${defs}</defs>${inner}</svg>`;

function shapesSVG(){
  const R=rng(5); let out='';
  const cols=['#3EE6B5','#FF5A6E','#9FD4FF','#FF8FD0'];
  const shape=(t,x,y,s,c)=> t===0?`<polygon points="${x},${y-s} ${x+s*.87|0},${y+s*.5|0} ${x-s*.87|0},${y+s*.5|0}" stroke="${c}"/>`
    : t===1?`<circle cx="${x}" cy="${y}" r="${s}" stroke="${c}"/>`
    : t===2?`<path d="M${x-s} ${y-s}L${x+s} ${y+s}M${x+s} ${y-s}L${x-s} ${y+s}" stroke="${c}"/>`
    : `<rect x="${x-s}" y="${y-s}" width="${s*2}" height="${s*2}" rx="${s*.18|0}" stroke="${c}"/>`;
  for(let i=0;i<24;i++){ const t=i%4, x=R()*1200|0, y=R()*640|0, s=18+R()*42|0;
    out+=`<g class="floaty" style="--fdl:${(R()*9).toFixed(1)}s;--fx:${(R()*80-40)|0}px;--fy:${(R()*80-40)|0}px;--fr:${(R()*120-60)|0}deg;opacity:${(.35+R()*.6).toFixed(2)}">${shape(t,x,y,s,cols[t])}</g>`; }
  return svgWrap(`<rect width="1200" height="640" fill="url(#dots)"/><g fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">${out}</g>`,
    `<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="rgba(255,255,255,.2)"/></pattern>`);
}

function lofiSVG(){
  const R=rng(57);
  const f=n=>n.toFixed(1);
  // gros cumulus peints : bulles blanches, ombres bleutées en bas
  let cdefs='';
  const cloud=(cx,cy,w,h,seed,op,cls)=>{ const r=rng(seed), id='etC'+seed; let b='', hl='', sh='';
    cdefs+=`<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="0" y1="${f(cy-h)}" x2="0" y2="${f(cy+h*.3)}"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#F6FAFC"/><stop offset=".8" stop-color="#C9DCEB"/><stop offset="1" stop-color="#9DBBD6"/></linearGradient>`;
    for(let i=0;i<30;i++){ const t=r(), x=cx+(t-.5)*w, k=1-Math.pow(Math.abs(t-.5)*2,1.5), rad=h*(.2+r()*.3)*(.5+k*.7), top=cy-k*h*(.5+r()*.45);
      b+=`<circle cx="${f(x)}" cy="${f(top+rad*.5)}" r="${f(rad)}"/>`;
      if(r()<.45) hl+=`<circle cx="${f(x-rad*.18)}" cy="${f(top+rad*.25)}" r="${f(rad*.6)}"/>`;

    b+=`<ellipse cx="${cx}" cy="${f(cy+h*.1)}" rx="${f(w*.5)}" ry="${f(h*.2)}"/>`;

  let flowers='';

  return svgWrap(`<rect width="1200" height="640" fill="url(#etSky)"/>

    ${cloud(560,470,900,150,21,1,'')}

    <path d="M-20 545 C240 520 470 540 700 525 C900 512 1060 540 1220 520 L1220 640 L-20 640Z" fill="#5FAE36"/>
    <g>${grassBack}</g>
    <g>${flowers}</g>
    <g>${grassFront}</g>
    <g>${leaves}</g>`,
    `<linearGradient id="etSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0F6EA8"/><stop offset=".45" stop-color="#1F86C2"/><stop offset=".8" stop-color="#5DB0DB"/><stop offset="1" stop-color="#9ED2EC"/></linearGradient>

}

const LOW_END = (()=>{ try{ return (navigator.deviceMemory&&navigator.deviceMemory<=2) || (navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=2) || !!(navigator.connection&&navigator.connection.saveData); }catch(e){ return false; } })();
const liteOn = () => typeof S.lite==='boolean' ? S.lite : LOW_END;

const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.random()*a.length|0];

function buildFx(){
  const fx=document.getElementById('fx'), orbs=document.querySelector('.orbs');
  if(!fx||!orbs) return;
  fx.innerHTML=''; orbs.innerHTML='';
  const f=FX[S.skin]; if(!f||reduced()) return;
  if(f.orbs) orbs.innerHTML=[...f.orbs,...f.orbs].slice(0,5).map((c,i)=>
    `<i style="--c:${c};--x:${rand(-15,75)|0}%;--y:${(i*20+rand(-6,8))|0}%;--s:${rand(280,540)|0}px;--d:${rand(16,26)|0}s;--dl:${rand(0,20)|0}s;--o:${f.orbO||.3}"></i>`).join('');
  const p=f.particles; if(!p) return;
  const n = innerWidth<700 ? Math.ceil(p.n*.5) : p.n; let h='';
  for(let i=0;i<n;i++){
    const st=`--l:${rand(0,100).toFixed(1)}%;--c:${pick(p.colors)};--dur:${rand(p.dmin,p.dmax).toFixed(1)}s;--dl:${rand(0,18).toFixed(1)}s;--dx:${rand(-140,140)|0}px;--r:${rand(180,720)|0}deg`;
    if(p.kind==='petal'||p.kind==='leaf') h+=`<i class="p ${p.kind}" style="${st};--w:${rand(9,15)|0}px"></i>`;
    else if(p.kind==='sparkle') h+=`<i class="p spk" style="${st};--t:${rand(6,94).toFixed(1)}%;--w:${rand(10,22)|0}px">${pick(p.chars)}</i>`;
    else if(p.kind==='dot') h+=`<i class="p dot" style="${st};--w:${rand(2,5).toFixed(1)}px"></i>`;
    else if(p.kind==='bubble') h+=`<i class="p bub" style="${st};--w:${rand(8,22)|0}px"></i>`;
  }

}

function spawn(x,y,o){
  const s=document.createElement('i'); s.className='fxp '+o.cls; if(o.text) s.textContent=o.text;
  s.style.cssText=`left:${x}px;top:${y}px;--dx:${(o.dx||0)|0}px;--dy:${(o.dy||0)|0}px;--r:${rand(-90,90)|0}deg;--t:${o.life}ms;`
    +(o.color?`color:${o.color};`:'')+(o.size&&o.text?`font-size:${o.size|0}px;`:'')+(o.bg?`background:${o.bg};width:${o.size}px;height:${o.size}px;`:'');
  document.body.appendChild(s); setTimeout(()=>s.remove(),o.life+60);
}

function prunierSVG(){
  const PR_W=Math.min(2000,Math.max(800,Math.ceil(innerWidth*Math.min(window.devicePixelRatio||1,2)/400)*400));   // largeur de la photo adaptée à l'écran
  const R=rng(88);
  const f1=n=>n.toFixed(1);
  // point et tangente d'une courbe de Bézier cubique
  const bez=(p,t)=>{ const u=1-t; return [u*u*u*p[0]+3*u*u*t*p[2]+3*u*t*t*p[4]+t*t*t*p[6], u*u*u*p[1]+3*u*u*t*p[3]+3*u*t*t*p[5]+t*t*t*p[7]]; };
  // branche pleine qui s'affine, avec un léger relief irrégulier
  const limb=(p,w0,w1,n,wob)=>{ const L=[],Rt=[];
    for(let i=0;i<=n;i++){ const t=i/n, a=bez(p,t), b=bez(p,Math.min(1,t+.01)), c=bez(p,Math.max(0,t-.01));
      const dx=b[0]-c[0], dy=b[1]-c[1], l=Math.hypot(dx,dy)||1, nx=-dy/l, ny=dx/l;
      const w=(w0+(w1-w0)*Math.pow(t,.8))*(1+(R()-.5)*wob);
      L.push(f1(a[0]+nx*w/2)+' '+f1(a[1]+ny*w/2)); Rt.unshift(f1(a[0]-nx*w/2)+' '+f1(a[1]-ny*w/2)); }
    return 'M'+L.join(' L')+' L'+Rt.join(' L')+'Z'; };

  const petal=(s)=>{ const k=()=>1+(R()-.5)*.08;
    return `M0 0 C${f1(-24*s*k())} ${f1(-8*s)} ${f1(-40*s*k())} ${f1(-38*s*k())} ${f1(-28*s)} ${f1(-56*s*k())} C${f1(-18*s)} ${f1(-70*s*k())} ${f1(18*s)} ${f1(-70*s*k())} ${f1(28*s)} ${f1(-56*s*k())} C${f1(40*s*k())} ${f1(-38*s*k())} ${f1(24*s*k())} ${f1(-8*s)} 0 0Z`; };

      for(let v=-2;v<=2;v++) veins+=`<path transform="rotate(${f1(a)})" d="M0 ${f1(-6*s)} Q${f1(v*5*s)} ${f1(-30*s)} ${f1(v*9*s)} ${f1(-50*s)}" stroke="#E3C2C6" stroke-width="${f1(.45*s)}" fill="none" opacity=".3"/>`; }
    let st='';
    for(let i=0;i<42;i++){ const a=(i/42)*Math.PI*2+R()*.2, l=(22+R()*14)*s, bend=(R()-.5)*6*s;
      const ex=Math.cos(a)*l, ey=Math.sin(a)*l, mx=Math.cos(a)*l*.5-Math.sin(a)*bend, my=Math.sin(a)*l*.5+Math.cos(a)*bend;
      st+=`<path d="M0 0 Q${f1(mx)} ${f1(my)} ${f1(ex)} ${f1(ey)}" stroke="url(#prFil)" stroke-width="${f1(.6*s)}" fill="none"/><ellipse cx="${f1(ex)}" cy="${f1(ey)}" rx="${f1(2.1*s)}" ry="${f1(1.4*s)}" transform="rotate(${f1(a*57.3)} ${f1(ex)} ${f1(ey)})" fill="url(#prAnther)"/>`; }
    return `<g transform="translate(${x} ${y}) scale(1 ${tilt})" filter="url(#prShadow)">${p}${veins}
      <circle r="${f1(13*s)}" fill="url(#prHeart)"/>${st}
      <circle r="${f1(4*s)}" fill="#D9E27A"/><circle r="${f1(2*s)}" fill="#9BAF3A"/></g>`;
  };
  const bud=(x,y,s,a)=>`<g transform="translate(${x} ${y}) rotate(${a})">
      <path d="M${-4*s} ${2*s} Q0 ${-3*s} ${4*s} ${2*s} L${2*s} ${7*s} L${-2*s} ${7*s}Z" fill="#3A1712"/>

  // fleurs floues au loin (profondeur de champ)
  let bokeh='';
  [[150,150,26,.18],[1080,520,34,.14],[980,90,18,.12],[260,560,22,.10],[1150,250,14,.12]].forEach(([x,y,r,o])=>{ bokeh+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#FFE9EC" opacity="${o}"/>`; });

  const mainP=[-60,640, 250,500, 650,350, 985,212];
  const twig1=[520,399, 526,372, 530,346, 522,318];
  const twig2=[304,485, 296,466, 298,446, 306,428];
  const twig3=[760,303, 788,286, 810,276, 830,252];
  const bark=(d)=>`<path d="${d}" fill="url(#prBark)"/><path d="${d}" fill="url(#prBarkLight)" opacity=".7"/>`;
  const branch=`<g filter="url(#prBranchShadow)">${bark(limb(mainP,15,3.2,90,.10))}${bark(limb(twig1,4.2,2,14,.08))}${bark(limb(twig2,3.6,1.8,12,.08))}${bark(limb(twig3,3.4,1.6,12,.08))}

    <g class="pr-sway">${flower(712,306,1.2,-14,.92)}${flower(626,378,1.02,22,.88)}</g>

    <g class="pr-falls">${fall}</g>

const curOK = c => !SHOP.currencies || SHOP.currencies.includes(c);
function curCode(){
  if(S.currency && CURRENCIES[S.currency] && curOK(S.currency)) return S.currency;
  const c=S.me&&S.me.country; const hit=Object.entries(CURRENCIES).find(([k,v])=>v.countries.includes(c)&&curOK(k));
  return hit?hit[0]:(SHOP.currencies&&SHOP.currencies[0])||'XOF';

function canUseSkin(id){
  if(!PAID_SKINS.includes(id)) return true;
  if(!AUTH_LIVE || !SHOP.enabled) return true;
  if(S.auth && id===BOOT_SKIN && !(()=>{ try{ return DB._checked||DB._loaded; }catch(e){ return false; } })()) return true; // déjà validé : affiché tout de suite, revérifié après chargement      // mode démo ou boutique fermée : tout est libre

  const rw=S.rewards||{}; if((rw.referrals||0)>=REF_REWARD.all) return true; if(id===REF_REWARD.one&&(rw.referred||(rw.referrals||0)>=1)) return true;

// Une plaque nominative = un bandeau décoré DERRIÈRE toute la ligne d'un joueur (photo, pseudo, statut) : une couleur, un dessin à droite, une animation au survol.
// Chaque plaque a son propre fond et sa propre couleur de texte : elle reste donc lisible sur tous les thèmes.
// Le dessin de chaque plaque est dans le style « coopo-plaques » (classe .pq-<id>). On peut aussi faire une plaque avec une image ou un GIF dont on a les droits :
//   monid:{label:'Mon nom',cat:'…',col:['#1B1030','#4A2A8C'],img:'plaques/monimage.webp',gif:'plaques/monanimation.gif'}
//   (col = les deux couleurs du fond, foncées car le pseudo est écrit en blanc · img = image fixe · gif = facultatif, joué au survol · fichiers légers, rangés dans le dépôt)
const PLATES = {
  base:{label:'Classique',cat:'base',desc:'Offerte à tous les joueurs'},
  rubis:{label:'Rubis',cat:'couleur'}, saphir:{label:'Saphir',cat:'couleur'}, emeraude:{label:'Émeraude',cat:'couleur'}, ambre:{label:'Ambre',cat:'couleur'}, onyx:{label:'Onyx',cat:'couleur'},
  aurore:{label:'Aurore',cat:'degrade',tag:'Populaire'}, lagune:{label:'Lagune',cat:'degrade'}, braise:{label:'Braise',cat:'degrade'}, neon:{label:'Néon',cat:'degrade',tag:'Nouveau'},
  pixel:{label:'Pixel',cat:'gaming',tag:'Populaire'}, manette:{label:'Manette',cat:'gaming'}, circuit:{label:'Circuit',cat:'gaming'}, damier:{label:'Damier',cat:'gaming',tag:'Nouveau'},
  or:{label:'Or',cat:'brillant',tag:'Populaire'}, chrome:{label:'Chrome',cat:'brillant'}, holo:{label:'Holo',cat:'brillant',tag:'Nouveau'},
  dragon:{label:'Dragon',cat:'rare'}, galaxie:{label:'Galaxie',cat:'rare'}, foudre:{label:'Foudre',cat:'rare'},
  flamme10:{label:'Étincelle',cat:'recompense',how:'10 jours de flamme avec un mate'}, flamme30:{label:'Brasier',cat:'recompense',how:'30 jours de flamme avec un mate'},
  flamme100:{label:'Fournaise',cat:'recompense',how:'100 jours de flamme avec un mate'}, flamme365:{label:'Flamme éternelle',cat:'recompense',how:'365 jours de flamme avec un mate'},
  souvenir:{label:'Souvenir Awalé',cat:'recompense',how:'Offerte aux joueurs qui avaient le thème Awalé'},
  coquelicots:{label:'Coquelicots',cat:'illustre',tag:'Nouveau'}, bouffon:{label:'Bouffon',cat:'illustre',tag:'Nouveau'},
  // Une plaque en préparation s'écrit avec « soon:true » : on la voit dans la boutique sous « Bientôt », avec un aperçu, mais personne ne peut l'acheter ni la porter.
  // Pour la vendre : l'ajouter au catalogue du serveur de paiement (lib/catalogue.js), ranger sa famille dans PLATE_CATS avec un prix, puis retirer « soon:true ».
};
// [catégorie, titre, clé de prix, phrase]
const PLATE_CATS=[['couleur','Couleurs','p1','Une couleur franche, et des cristaux qui scintillent.'],['degrade','Dégradés animés','p2','Lever de soleil, lagune, néons : le décor bouge doucement.'],['gaming','Motifs gaming','p2','Pixels, manette, circuit, drapeau à damier.'],['brillant','Effets brillants','p3','Or, chrome, hologramme : un reflet passe sur la plaque.'],['illustre','Illustrées','p5','Un vrai petit décor qui s\'anime : un pré de coquelicots, un bonnet de bouffon.'],['rare','Édition limitée','p4','En vente pour un temps limité, puis plus jamais.']];
const RARE_UNTIL='2027-01-31';   // dernier jour de vente des plaques en édition limitée (le serveur applique la même date)
const rareOpen = () => Date.now() < Date.parse(RARE_UNTIL+'T23:59:59Z');
// Plaques retirées le 22 novembre 2026 : plus en vente, plus montrées dans la boutique, plus offertes (même aux modérateurs).
// Un joueur qui en aurait vraiment acheté ou gagné une la garde : elle reste dans « Mes objets » et s'affiche toujours sur son profil.
const RETIRED_PLATES=['or','chrome','holo','braise','souvenir'];
const platesIn = cat => Object.keys(PLATES).filter(k=>PLATES[k].cat===cat&&!RETIRED_PLATES.includes(k));
const platesSoon = () => Object.keys(PLATES).filter(k=>PLATES[k].soon);   // plaques en préparation : pas encore en vente
const PPACKS={ couleurs:{label:'Pack Couleurs',cat:'couleur',price:'k1'}, degrades:{label:'Pack Dégradés',cat:'degrade',price:'k1'}, gaming:{label:'Pack Gaming',cat:'gaming',price:'k2'},
  plaques:{label:'Toutes les plaques',price:'k4',tag:'Populaire'} };
const ppackItems = k => PPACKS[k].cat ? platesIn(PPACKS[k].cat) : ['couleur','degrade','gaming','brillant'].flatMap(platesIn);
const platePrice = (id,cur=curCode()) => { const c=PLATE_CATS.find(x=>x[0]===PLATES[id].cat); return c?price(c[2],cur):0; };
const plateOf = p => { const id=p&&p.plate; return id&&PLATES[id]?id:''; };
// plq(p)    le bandeau de la plaque d'un joueur : à glisser EN PREMIER dans sa ligne (rien si le joueur n'a pas de plaque)
// plqOn(p)  les classes à ajouter à cette ligne ; live = la plaque s'anime sans attendre le survol (profil, en-tête d'une conversation, aperçu)
// np(p)     le pseudo seul dans un petit bandeau, là où il n'y a pas de ligne (message d'un groupe, phrase)
const plq = p => { const id=plateOf(p); if(!id) return ''; const pl=PLATES[id], net=u=>String(u).replace(/[^\w./#-]/g,''), st=[];
  if(pl.col) st.push('--pa:'+net(pl.col[0]),'--pb:'+net(pl.col[1]||pl.col[0]));                                             // plaque faite d'une image : ses deux couleurs de fond
  if(pl.img){ st.push(`--art:url('${net(pl.img)}')`); if(pl.gif) st.push(`--art-live:url('${net(pl.gif)}')`); }   // … son image fixe, et son GIF joué au survol
  return `<i class="plq${pl.img?' plq-img':''}" aria-hidden="true"${st.length?` style="${st.join(';')}"`:''}><i></i></i>`; };
const plqOn = (p,live) => { const id=plateOf(p); return id?` plq-on pq-${id}${live?' plq-live':''}`:''; };
function np(p,name){ const id=plateOf(p), n=esc(name??(p&&p.name)??''); return id?`<span class="plq-chip${plqOn(p)}">${plq(p)}<span class="plq-t">${n}</span></span>`:n; }
// Une plaque montrée « en situation » dans la boutique : la ligne d'un joueur, avec sa photo, son pseudo et son statut
const plqDemo = id => { const me={...publicMe(),plate:id}; return `<div class="plq-demo${plqOn(me)}">${plq(me)}${avatar(me,34)}<div><b>${esc(me.name)}</b><span class="muted">En ligne</span></div></div>`; };
// Dans la boutique, une plaque s'anime dès qu'elle est à l'écran (ailleurs : quand on passe la souris sur la ligne)
let _plqIO=null;
function plqWatch(){ if(_plqIO) _plqIO.disconnect(); if(!('IntersectionObserver' in window)) return;
  _plqIO=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('plq-live',e.isIntersecting)),{threshold:.6});
  document.querySelectorAll('.shop .plq-demo').forEach(x=>_plqIO.observe(x)); }
function ownsPlate(id){ const pl=PLATES[id]; if(!pl||pl.soon) return false; if(pl.cat==='base') return true;
  if(RETIRED_PLATES.includes(id)) return pl.cat==='recompense' ? (((S.rewards||{}).plates)||[]).includes(id) : ((S.owned&&S.owned.plates)||[]).includes(id);   // plaque retirée : seulement si on l'a vraiment
  if(!AUTH_LIVE||!SHOP.enabled) return true;   // démonstration : tout est libre
  if(S.auth&&isAdmin()) return true;           // modérateurs
  if(pl.cat==='recompense') return (((S.rewards||{}).plates)||[]).includes(id);
  return ((S.owned&&S.owned.plates)||[]).includes(id); }
function setPlate(id){ if(!S.me) return; id=id&&PLATES[id]&&ownsPlate(id)?id:''; S.me.plate=id; if(S.auth) S.profiles[S.auth.uid]=S.me; save(); DB.savePlate(id);
  toast(id?`Plaque ${PLATES[id].label} équipée`:'Plaque retirée'); }
// Aperçu d'une plaque sur son propre profil, avant de l'acheter : en-tête de profil, message, ligne de la liste des mates
function platePreview(id){ const pl=PLATES[id]; if(!pl) return; const me={...publicMe(),plate:id}, own=ownsPlate(id), on=plateOf(S.me)===id;
  const act = pl.soon ? '' : own ? (on?`<button class="btn" data-use-plate="" data-close>Retirer</button>`:`<button class="btn btn-ac" data-use-plate="${id}" data-close>Équiper</button>`)
    : pl.cat==='recompense' ? '' : (pl.cat==='rare'&&!rareOpen()) ? '' : `<button class="btn btn-ac" data-shop-buy="plate:${id}">${money(platePrice(id))}</button>`;
  modal(`<h3>Plaque ${esc(pl.label)}</h3><p class="muted">Voilà ce que les autres joueurs verront.</p>
    <div class="np-prev"><div class="np-prev-head${plqOn(me,1)}">${plq(me)}${avatar(me,64)}<div><b class="np-prev-name">${esc(me.name)}</b><span class="muted">Sur ton profil</span></div></div>
      <div class="np-prev-row${plqOn(me,1)}">${plq(me)}${avatar(me,40)}<div><b>${esc(me.name)}</b><span class="muted">Dans les messages et la liste des mates</span></div></div>
      <div class="np-prev-msg"><small>${np(me)}</small><div class="bubble"><span>On lance une partie ce soir ?</span></div><span class="muted">Dans un groupe</span></div></div>
    <p class="muted" style="margin-top:10px;font-size:13px">Le décor s'anime quand on passe sur ta ligne, et en continu sur ton profil.</p>
    ${pl.soon?'<p class="hint">Cette plaque est en préparation : elle n\'est pas encore en vente.</p>':''}${pl.how&&!own?`<p class="hint">Cette plaque ne s'achète pas : ${esc(pl.how)}.</p>`:''}
    <div class="dlg-actions"><button class="btn btn-ghost" data-close>Fermer</button>${act}</div>`); }

/* ---- Paiement : le serveur dit s'il est ouvert (mode « test » = faux paiements, réservés aux modérateurs) ---- */
const PAY={ mode:'off', label:'', loaded:false };
async function payInit(){ if(PAY.loaded||PAY._busy||!SHOP.api||!AUTH_LIVE) return; PAY._busy=true;
  try{ const r=await fetch(SHOP.api.replace(/\/$/,'')+'/config'); if(r.ok){ const j=await r.json();
      if(j&&(j.mode==='test'||j.mode==='live')){ PAY.mode=j.mode; PAY.label=String(j.label||'').slice(0,60);
        if(Array.isArray(j.currencies)){ const cs=j.currencies.filter(c=>CURRENCIES[c]); if(cs.length) SHOP.currencies=cs; } } } }catch(e){}
  PAY.loaded=true; PAY._busy=false;
  if(location.hash.startsWith('#/boutique')){ const y=scrollY; route(); scrollTo(0,y); } }
const canPay = () => PAY.mode==='live' || (PAY.mode==='test' && isAdmin());
const TEST_NOTE='<div class="test-note" role="note"><b>Mode test</b><span>Faux paiement : aucun argent n\'est débité. Réservé à la modération, pour vérifier que tout marche.</span></div>';
// Description d'un article : 'theme:<id>', 'pack' (tous les thèmes), 'plate:<id>', 'ppack:<id>'
function itemInfo(item,cur=curCode()){ const [k,id]=String(item).split(':');
  if(k==='theme'&&SKINS[id]&&PAID_SKINS.includes(id)) return {title:'Thème '+SKINS[id].label,desc:SKINS[id].desc,price:skinPrice(id,cur)};
  if(k==='pack') return {title:'Tous les thèmes',desc:`Les ${PAID_SKINS.length} thèmes payants d'un coup.`,price:price('pack',cur)};
  if(k==='plate'&&PLATES[id]&&platePrice(id,cur)) return {title:'Plaque '+PLATES[id].label,desc:'Un bandeau animé derrière ton pseudo, visible par tous les joueurs.',price:platePrice(id,cur)};
  if(k==='ppack'&&PPACKS[id]) return {title:PPACKS[id].label,desc:`${ppackItems(id).length} plaques : ${ppackItems(id).map(x=>PLATES[x].label).join(', ')}.`,price:price(PPACKS[id].price,cur)};
  return null; }
function buy(item){ const inf=itemInfo(item); if(!inf) return;
  const head=`<h3>${esc(inf.title)}</h3><p class="muted">${esc(inf.desc)}</p>`, close='<div class="dlg-actions"><button class="btn" data-close>Fermer</button></div>';
  if(!AUTH_LIVE){ modal(head+'<p class="muted">En démonstration, tout est déjà débloqué.</p>'+close); return; }
  if(!canPay()){ modal(head+`<div class="buy-line"><span>Prix</span><strong>${money(inf.price)}</strong></div><div class="soon-note"><b>Bientôt disponible</b><span>Le paiement par Mobile Money arrive bientôt. En attendant, tu peux utiliser l'aperçu.</span></div>`+close); return; }
  if(!S.auth||!(S.me&&S.me.dob)){ modal(head+'<p class="muted">Termine ton profil avant de faire un achat.</p><div class="dlg-actions"><a class="btn btn-ac" href="#/profil" data-close>Compléter mon profil</a></div>'); return; }
  const minor=ageGroup(S.me)==='minor'; let cur=curCode(); const many=(SHOP.currencies||Object.keys(CURRENCIES)).length>1;
  modal(`${head}${PAY.mode==='test'?TEST_NOTE:''}
    ${many?`<div class="field buy-cur"><label for="buy-cur">Devise</label><select id="buy-cur">${Object.entries(CURRENCIES).filter(([k])=>curOK(k)).map(([k,v])=>`<option value="${k}" ${k===cur?'selected':''}>${v.label} (${k})</option>`).join('')}</select></div>`:''}
    <div class="buy-line"><span>À payer</span><strong id="buy-price">${money(inf.price,cur)}</strong></div>
    ${minor?`<label class="buy-consent"><input type="checkbox" id="buy-parent"> Un parent ou tuteur est d'accord avec cet achat.</label>`:''}
    <p class="muted buy-note">${PAY.mode==='test'?'Tu vas arriver sur une page de faux paiement.':`Paiement sécurisé${PAY.label?' par '+esc(PAY.label):''}.`} L'achat est lié à ton compte. <a href="#/remboursement" data-close>Politique de remboursement</a>.</p>
    <p class="ferr" id="buy-err" role="alert"></p>
    <div class="dlg-actions"><button class="btn btn-ghost" data-close>Annuler</button><button class="btn btn-ac" id="buy-go">Payer</button></div>`, d=>{
    const sel=d.querySelector('#buy-cur'); if(sel) sel.onchange=()=>{ cur=sel.value; S.currency=cur; save(); d.querySelector('#buy-price').textContent=money(itemInfo(item,cur).price,cur); };
    d.querySelector('#buy-go').onclick=async ev=>{ const b=ev.currentTarget, err=d.querySelector('#buy-err'), pc=d.querySelector('#buy-parent');
      if(minor && !(pc&&pc.checked)){ err.textContent='Coche la case pour confirmer l\'accord de ton parent ou tuteur.'; return; }
      if(!(DB.live&&DB.fns)){ err.textContent='Le serveur de paiement n\'est pas prêt. Réessaie dans un instant.'; return; }
      b.disabled=true; b.textContent='Redirection…'; err.textContent='';
      try{ const r=await DB.fns.httpsCallable('createPayment')({item,currency:cur,parentConsent:!!(pc&&pc.checked)}); const u=String((r.data&&r.data.url)||'');
        if(u.startsWith('#/')){ d.close(); location.hash=u; } else if(/^https:\/\//.test(u)) location.href=u; else throw new Error('Le paiement n\'a pas pu démarrer.'); }
      catch(e){ err.textContent=(e&&e.message)||'Le paiement n\'a pas pu démarrer.'; b.disabled=false; b.textContent='Payer'; } }; }); }

/* ---- La page Boutique ---- */
const SHOP_TABS=[['themes','Thèmes'],['plaques','Plaques'],['packs','Packs'],['objets','Mes objets']];
const shopTag = t => t?`<span class="shop-tag${t==='Édition limitée'?' rare':''}">${t}</span>`:'';
const SKIN_TAGS={ prunier:'Nouveau', ocean:'Populaire', samurai:'Populaire' };
function themeCard(id){ const t=SKINS[id], paid=PAID_SKINS.includes(id), own=canUseSkin(id), on=(S.skinWanted||S.skin)===id&&!_preview;
  const prev=`<div class="shop-prev shop-prev-th" style="--a:${t.sw[0]};--b:${t.sw[1]};--c2:${t.sw[2]}"><div class="th-mock"><i></i><i></i><i></i><b></b></div></div>`;
  const act = own ? (on?'<button class="btn btn-sm" disabled>Actif</button>':`<button class="btn btn-sm btn-ac" data-use-skin="${id}">Utiliser</button>`)
    : `<button class="btn btn-sm btn-ghost" data-shop-prev="theme:${id}">Aperçu</button><button class="btn btn-sm btn-ac" data-shop-buy="theme:${id}">${money(skinPrice(id))}</button>`;
  return `<article class="shop-card${own?' owned':''}">${prev}${shopTag(own?'':SKIN_TAGS[id])}<div class="shop-info"><b>${esc(t.label)}</b><span class="muted">${esc(t.desc)}</span>${own?`<small class="shop-own">${paid?'À toi':'Gratuit'}</small>`:''}</div><div class="shop-foot">${act}</div></article>`; }
function plateCard(id){ const pl=PLATES[id], own=ownsPlate(id), on=plateOf(S.me)===id, rare=pl.cat==='rare', sold=rare&&!rareOpen();
  const act = pl.soon ? `<button class="btn btn-sm btn-ghost" data-shop-prev="plate:${id}">Aperçu</button>` : own ? (on?`<button class="btn btn-sm" data-use-plate="">Retirer</button>`:`<button class="btn btn-sm btn-ac" data-use-plate="${id}">Équiper</button>`)
    : pl.cat==='recompense' ? `<button class="btn btn-sm btn-ghost" data-shop-prev="plate:${id}">Aperçu</button>`
    : `<button class="btn btn-sm btn-ghost" data-shop-prev="plate:${id}">Aperçu</button>${sold?'':`<button class="btn btn-sm btn-ac" data-shop-buy="plate:${id}">${money(platePrice(id))}</button>`}`;
  const sub = pl.soon ? 'Bientôt en vente' : own ? (on?'Équipée':'À toi') : pl.cat==='recompense' ? pl.how : rare ? (sold?'Plus en vente':`Jusqu'au ${new Date(RARE_UNTIL).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}`) : pl.cat==='base' ? pl.desc : '';
  return `<article class="shop-card${own?' owned':''}${rare?' is-rare':''}"><div class="shop-prev shop-prev-np">${plqDemo(id)}</div><div class="shop-info"><b>${esc(pl.label)}${shopTag(pl.soon?'Bientôt':own?'':rare?'Édition limitée':pl.tag).replace('shop-tag','shop-tag in')}</b>${sub?`<span class="muted">${esc(sub)}</span>`:''}</div><div class="shop-foot">${act}</div></article>`; }
function packCard(item){ const inf=itemInfo(item), [k,id]=item.split(':'); let prev, own, full, tag='';
  if(k==='pack'){ own=ownsAll()||PAID_SKINS.every(canUseSkin); full=PAID_SKINS.reduce((a,x)=>a+skinPrice(x),0); tag='Populaire';
    prev=`<div class="shop-prev shop-prev-pk">${PAID_SKINS.map(x=>`<i style="background:${SKINS[x].sw[0]}"></i>`).join('')}</div>`; }
  else { const its=ppackItems(id); own=its.every(ownsPlate); full=its.reduce((a,x)=>a+platePrice(x),0); tag=PPACKS[id].tag||'';
    prev=`<div class="shop-prev shop-prev-pk np-stack">${its.slice(0,5).map(x=>np({plate:x,name:PLATES[x].label})).join('')}${its.length>5?`<small>+${its.length-5}</small>`:''}</div>`; }
  const eco=full-inf.price;
  return `<article class="shop-card shop-pack${own?' owned':''}">${prev}${shopTag(own?'':tag)}<div class="shop-info"><b>${esc(inf.title)}</b><span class="muted">${esc(inf.desc)}</span>${!own&&eco>0?`<small class="shop-eco">${money(eco)} d'économie</small>`:''}</div>
    <div class="shop-foot">${own?'<button class="btn btn-sm" disabled>Déjà à toi</button>':`<button class="btn btn-sm btn-ac" data-shop-buy="${item}">${money(inf.price)}</button>`}</div></article>`; }
function viewShop(tab){
  if(dataPending()) return loadingView('Boutique');
  if(!S.me) return needProfile('Boutique');
  payInit();
  tab=SHOP_TABS.some(x=>x[0]===tab)?tab:'themes';
  const many=AUTH_LIVE&&(SHOP.currencies||Object.keys(CURRENCIES)).length>1;
  let body='';
  if(tab==='themes') body=`<div class="shop-grid">${Object.keys(SKINS).map(themeCard).join('')}</div>`;
  else if(tab==='plaques') body=`<section class="shop-sec"><h3>Offerte</h3><p class="muted">Une plaque, c'est un bandeau décoré derrière ton pseudo : dans les messages, les groupes et sur ton profil.</p><div class="shop-grid shop-grid-np">${plateCard('base')}</div></section>`
    + PLATE_CATS.filter(([c])=>platesIn(c).some(x=>!PLATES[x].soon)).map(([c,l,,sub])=>`<section class="shop-sec${c==='rare'?' shop-sec-rare':''}"><h3>${l}</h3><p class="muted">${sub}</p><div class="shop-grid shop-grid-np">${platesIn(c).filter(x=>!PLATES[x].soon).map(plateCard).join('')}</div></section>`).join('')
    + `<section class="shop-sec"><h3>À gagner</h3><p class="muted">Ces plaques ne s'achètent pas : elles se méritent.</p><div class="shop-grid shop-grid-np">${platesIn('recompense').map(plateCard).join('')}</div></section>`
    + (platesSoon().length?`<section class="shop-sec"><h3>Bientôt</h3><p class="muted">Des plaques en préparation. Tu peux déjà regarder l'aperçu.</p><div class="shop-grid shop-grid-np">${platesSoon().map(plateCard).join('')}</div></section>`:'');
  else if(tab==='packs') body=`<div class="shop-grid shop-grid-wide">${['pack',...Object.keys(PPACKS).map(k=>'ppack:'+k)].map(packCard).join('')}</div>`;
  else { const th=Object.keys(SKINS).filter(canUseSkin), pls=Object.keys(PLATES).filter(ownsPlate);
    body=`<section class="shop-sec"><h3>Mes thèmes</h3><div class="shop-grid">${th.map(themeCard).join('')}</div></section>
      <section class="shop-sec"><h3>Mes plaques</h3><p class="muted">Équipe une plaque pour l'afficher derrière ton pseudo, ou retire-la.</p><div class="shop-grid shop-grid-np">${pls.map(plateCard).join('')}</div>
      ${plateOf(S.me)?'<p style="margin-top:14px"><button class="btn btn-ghost btn-sm" data-use-plate="">Ne porter aucune plaque</button></p>':''}</section>`; }
  app.innerHTML=`<div class="wrap page shop"><div class="page-head"><div><h2>Boutique</h2><p>Thèmes et plaques nominatives pour personnaliser ton Coopô.</p></div>
      ${many?`<div class="field shop-cur"><label for="shop-cur">Devise</label><select id="shop-cur">${Object.entries(CURRENCIES).filter(([k])=>curOK(k)).map(([k,v])=>`<option value="${k}" ${k===curCode()?'selected':''}>${v.label}</option>`).join('')}</select></div>`:''}</div>
    <div class="chips board-tabs" role="tablist">${SHOP_TABS.map(([k,l])=>`<a class="chip" role="tab" href="#/boutique/${k}" aria-selected="${tab===k}" aria-pressed="${tab===k}">${l}</a>`).join('')}</div>
    ${PAY.mode==='test'&&isAdmin()?TEST_NOTE.replace('</div>','<button class="btn btn-sm" data-shop-buy="plate:rubis">Essayer un faux achat</button></div>'):''}${body}</div>`;
  plqWatch();
}
document.addEventListener('change',e=>{ if(e.target&&(e.target.id==='shop-cur'||e.target.id==='set-cur')){ S.currency=e.target.value; save(); const y=scrollY; route(); scrollTo(0,y); } });
document.addEventListener('click',e=>{ const t=e.target;
  const bb=t.closest('[data-shop-buy]'); if(bb){ buy(bb.dataset.shopBuy); return; }

/* ---- Retour de paiement ---- */
function viewPayment(tx){
  const box=(h,p,act='')=>`<div class="wrap page"><div class="empty"><h3>${h}</h3><p class="muted">${p}</p>${act}</div></div>`;
  if(!tx){ app.innerHTML=box('Paiement interrompu','Aucun montant n\'a été débité. Tu peux réessayer depuis la boutique.','<a class="btn" href="#/boutique">Retour à la boutique</a>'); return; }
  if(!S.auth){ app.innerHTML=box('Connecte-toi','Connecte-toi avec le compte qui a fait l\'achat pour le récupérer.','<a class="btn btn-ac" href="#/connexion">Se connecter</a>'); return; }
  app.innerHTML=box('Vérification du paiement…','Ça prend quelques secondes.');
  let tries=0;
  const check=async()=>{
    if(!location.hash.startsWith('#/paiement')) return;
    if(!(DB.live&&DB.fns)){ if(tries++<10) return setTimeout(check,800); app.innerHTML=box('Vérification impossible','Recharge la page dans un instant.'); return; }
    try{ const r=(await DB.fns.httpsCallable('checkPayment')({tx})).data;
      if(r.status==='paid'){ await DB.loadPurchases(); const item=String(r.item||''), [k,id]=item.split(':'), inf=itemInfo(item);
        if(k==='theme'&&SKINS[id]){ applySkin(id,true); DB.saveSkin(id); } else if(k==='plate'&&PLATES[id]&&ownsPlate(id)) setPlate(id);
        app.innerHTML=box('Merci, c\'est débloqué !', k==='theme'?`Le thème ${esc(SKINS[id]?.label||id)} est à toi et vient d'être activé.`:k==='plate'?`La plaque ${esc(PLATES[id]?.label||id)} est à toi et vient d'être équipée.`:`${esc(inf?inf.title:'Ton achat')} : tout est à toi. Retrouve-le dans « Mes objets ».`,'<a class="btn btn-ac" href="#/boutique/objets">Voir mes objets</a>'); return; }
      if(r.status==='failed'){ app.innerHTML=box('Paiement non abouti','Le paiement a été refusé ou annulé. Rien n\'a été débloqué et rien n\'a été débité.','<a class="btn" href="#/boutique">Retour à la boutique</a>'); return; }
      if(r.status==='review'){ app.innerHTML=box('Paiement en vérification','Le montant reçu ne correspond pas au prix. La modération va vérifier : écris-nous via « Nous écrire » avec la référence '+esc(tx)+'.'); return; }
      if(tries++<8) return setTimeout(check,5000);
      app.innerHTML=box('Paiement en attente',`Si tu as validé le paiement sur ton téléphone, il sera pris en compte automatiquement dans quelques minutes. Référence : ${esc(tx)}`,'<button class="btn" type="button" onclick="route()">Vérifier à nouveau</button>');
    }catch(e){ app.innerHTML=box('Vérification impossible',esc((e&&e.message)||'Réessaie dans un instant.'),'<button class="btn" type="button" onclick="route()">Réessayer</button>'); }
  };
  check();
}
// Mode test : la « page de paiement » est un faux écran, clairement indiqué. Le serveur n'accepte ces faux paiements que d'un modérateur.

  app.innerHTML=`<div class="wrap page" style="max-width:560px"><div class="fakepay"><span class="fakepay-flag">Faux paiement · mode test</span><h2>Aucun argent n'est débité</h2>
    <p>Cette page remplace le prestataire de paiement tant qu'aucun n'est branché. Choisis ce que tu veux simuler.</p><p class="muted">Référence : ${esc(tx)}</p>
    <div class="fakepay-act"><button class="btn btn-ac" data-fake="paid">Simuler un paiement réussi</button><button class="btn" data-fake="failed">Simuler un paiement refusé</button><a class="btn btn-ghost" href="#/boutique">Abandonner</a></div>
    <p class="ferr" id="fake-err" role="alert"></p></div></div>`;
  app.querySelectorAll('[data-fake]').forEach(b=>b.onclick=async()=>{ const err=document.getElementById('fake-err'); app.querySelectorAll('[data-fake]').forEach(x=>x.disabled=true);

}

/* ---- Notifications de l'appareil (quand Coopô est ouverte en arrière-plan) ---- */
async function deviceNotify(n){
  try{ if(!('Notification' in window)||Notification.permission!=='granted'||!S.notifyOn) return; if(!document.hidden) return;
    const title=n.type==='request'?'Nouvelle demande de mate':n.type==='message'?'Nouveau message':n.type==='annonce'?'Réponse à ton annonce':n.type==='flame'?'Ta flamme va s\'éteindre':n.type==='group'?'Invitation dans un groupe':'Coopô';
    const opt={ body:String(n.text||'').slice(0,120), icon:'icons/icon-192.png', badge:'icons/icon-192.png', tag:'coopo-'+(n.type||'n'), data:{url:location.origin+location.pathname+(n.type==='message'||n.type==='flame'?'#/messages':n.type==='group'?'#/groupes/groupes':'#/matchs')} };
    const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration(); if(reg) reg.showNotification(title,opt); else new Notification(title,opt);
  }catch(e){} }
function notifySettingHTML(){
  if(!('Notification' in window)) return `<p class="hint">Ton navigateur ne gère pas les notifications. Installe l'application pour une meilleure expérience.</p>`;
  const st=Notification.permission;
  if(st==='denied') return `<p class="hint">Les notifications sont bloquées pour Coopô dans les réglages de ton navigateur.</p>`;
  return `<div class="toggle"><span><b>Notifications sur cet appareil</b><small class="muted" style="display:block">Demandes de mate et messages, quand Coopô est ouverte en arrière-plan.</small></span><button class="btn btn-sm ${S.notifyOn&&st==='granted'?'':'btn-ac'}" type="button" id="notif-toggle">${S.notifyOn&&st==='granted'?'Désactiver':'Activer'}</button></div>`;
}
document.addEventListener('click',async e=>{ if(!e.target.closest('#notif-toggle')) return;
  if(S.notifyOn&&Notification.permission==='granted'){ S.notifyOn=false; save(); route(); return; }
  try{ const r=await Notification.requestPermission(); S.notifyOn=r==='granted'; save(); toast(r==='granted'?'Notifications activées':'Notifications refusées'); route(); }catch(x){} });

function gamesPulse(){
  if(!S.me) return '';

function envInfo(){
  const ua=navigator.userAgent||'';
  const inApp=/FBAN|FBAV|FB_IAB|Instagram|musical_ly|Bytedance|TikTok|Snapchat|Line\/|WhatsApp|wv\)|; wv/i.test(ua);
  const ios=isIOS(), android=/android/i.test(ua);
  const iosSafari=ios && /Safari/i.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/i.test(ua) && !inApp;
  const iosChrome=ios && /CriOS/i.test(ua);
  const samsung=/SamsungBrowser/i.test(ua), firefox=/Firefox|FxiOS/i.test(ua);
  return {ua,inApp,ios,android,iosSafari,iosChrome,samsung,firefox};
}

async function installDiag(){
  const out=[]; try{ const r=await fetch('manifest.webmanifest',{cache:'no-store'}); out.push(r.ok?'✅ manifest.webmanifest trouvé':'❌ manifest.webmanifest introuvable (fichier non déposé sur GitHub ?)'); if(r.ok){ const m=await r.json(); for(const ic of (m.icons||[])){ const ri=await fetch(ic.src,{cache:'no-store'}); out.push((ri.ok?'✅ ':'❌ ')+ic.src+(ri.ok?'':' introuvable')); } } }catch(e){ out.push('❌ manifest illisible'); }
  try{ const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration(); out.push(reg?'✅ service worker (sw.js) actif':'❌ service worker inactif (sw.js manquant ?)'); }catch(e){ out.push('❌ service worker indisponible'); }
  out.push(location.protocol==='https:'?'✅ connexion sécurisée (https)':'❌ le site doit être en https');
  return out;
}

function showErrs(errs){
  app.querySelectorAll('.ferr').forEach(e=>e.textContent='');
  app.querySelectorAll('#af .invalid').forEach(e=>e.classList.remove('invalid'));
  const ids={name:'a-name',mail:'a-mail',pw:'a-pw'};

  const first=Object.keys(errs)[0]; if(first) (document.getElementById(ids[first])||app.querySelector('#dob-d'))?.focus();
  return Object.keys(errs).length>0;
}
function busy(on){ const b=app.querySelector('.auth-submit'); if(!b) return; b.disabled=on; b.dataset.label=b.dataset.label||b.textContent; b.textContent=on?'Un instant…':b.dataset.label; }
function authErr(err){
  const c=err&&err.code||'';
  if(c==='auth/email-already-in-use') return {mail:'Un compte existe déjà avec cet e-mail.'};
  if(c==='auth/invalid-email') return {mail:'Adresse e-mail invalide.'};
  if(c==='auth/weak-password') return {pw:'Mot de passe trop faible.'};
  if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-login-credentials'].includes(c)) return {pw:'E-mail ou mot de passe incorrect.'};
  if(c==='auth/too-many-requests') return {pw:'Trop de tentatives. La connexion est bloquée un moment : réessaie plus tard ou utilise « Mot de passe oublié ».'};
  if(c==='auth/network-request-failed') return {mail:OFFLINE_MSG};
  if(c==='auth/user-disabled') return {mail:'Ce compte a été désactivé.'};
  return {pw:'Une erreur est survenue. Réessaie.'};
}
const MAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const OFFLINE_MSG="Coopô n'arrive pas à joindre ses serveurs. Vérifie ta connexion internet, puis réessaie.";
async function doSignup(){
  const name=aval('a-name'), mail=aval('a-mail').toLowerCase(), pw=document.getElementById('a-pw').value, dob=draft.dob, age=ageFrom(dob), e={};
  if(!new RegExp(`^[A-Za-z0-9_.-]{${CONFIG.minUsername},${CONFIG.maxUsername}}$`).test(name)) e.name=`${CONFIG.minUsername} à ${CONFIG.maxUsername} caractères : lettres, chiffres, _ . -`;
  else if(PLAYERS.some(p=>p.name.toLowerCase()===name.toLowerCase())) e.name="Ce nom d'utilisateur est déjà pris.";
  if(!MAIL_RE.test(mail)) e.mail='Entre une adresse e-mail valide.';
  if(pw.length<CONFIG.minPassword||!/[a-zA-Z]/.test(pw)||!/\d/.test(pw)) e.pw=`Au moins ${CONFIG.minPassword} caractères, avec une lettre et un chiffre.`;
  if(age===null) e.dob='Indique ta date de naissance.';
  else if(age<CONFIG.minAge) e.dob=`Tu dois avoir au moins ${CONFIG.minAge} ans pour utiliser Coopô.`;
  if(showErrs(e)) return;
  busy(true); SIGNUP={name,dob};
  try{
    if(AUTH_LIVE){
      if(!(await authReady())){ showErrs({mail:OFFLINE_MSG}); return; }
      const cred=await firebase.auth().createUserWithEmailAndPassword(mail,pw);
      await cred.user.updateProfile({ displayName:name });
      cred.user.sendEmailVerification().catch(e=>console.error(e));   // e-mail de vérification : confirme que l'adresse existe vraiment
      S.dobs[cred.user.uid]=dob; save();
      onSignedIn({ uid:cred.user.uid, name, email:mail, photo:'', provider:'password' });
    } else {
      if(S.accounts[mail]){ showErrs({mail:'Un compte existe déjà avec cet e-mail.'}); return; }
      const uid='local-'+mail; S.accounts[mail]={uid,name}; S.dobs[uid]=dob; save();
      onSignedIn({ uid, name, email:mail, photo:'', provider:'password' });
    }
  }catch(err){ if(!/^auth\//.test(String(err&&err.code))) console.error(err); showErrs(authErr(err)); }
  finally{ SIGNUP=null; busy(false); }
}
/* Trop d'essais de connexion ratés : on bloque la connexion à ce compte sur cet appareil pendant quelques heures.
   (Firebase bloque aussi de son côté les essais répétés, quel que soit l'appareil.) */
const LOGIN_MAX=5, LOGIN_LOCK_H=3, LOGIN_WINDOW_MIN=30;
const loginTries = () => { try{ return JSON.parse(localStorage.getItem('coopo_login_tries')||'{}')||{}; }catch(e){ return {}; } };
const loginTriesSave = t => { try{ localStorage.setItem('coopo_login_tries',JSON.stringify(t)); }catch(e){} };
function loginLockedUntil(mail){ const r=loginTries()[mail]; return r&&r.until>Date.now()?r.until:0; }
function loginLockMsg(until){ const min=Math.max(1,Math.ceil((until-Date.now())/60e3)); const h=Math.floor(min/60), m=min%60;
  return `Trop d'essais ratés. La connexion à ce compte est bloquée pendant encore ${[h?h+' h':'',m?m+' min':''].filter(Boolean).join(' ')}. Tu peux aussi utiliser « Mot de passe oublié ».`; }
function loginFailed(mail){ const t=loginTries(), now=Date.now(); let r=t[mail];
  if(!r||now-r.first>LOGIN_WINDOW_MIN*60e3) r={n:0,first:now,until:0};
  r.n++; if(r.n>=LOGIN_MAX){ r.until=now+LOGIN_LOCK_H*3600e3; r.n=0; r.first=now; }
  Object.keys(t).forEach(k=>{ if(k!==mail&&!(t[k].until>now)&&now-t[k].first>LOGIN_WINDOW_MIN*60e3) delete t[k]; });   // ménage des vieux compteurs
  t[mail]=r; loginTriesSave(t); return r; }
function loginOk(mail){ const t=loginTries(); if(t[mail]){ delete t[mail]; loginTriesSave(t); } }
async function doLogin(){
  const mail=aval('a-mail').toLowerCase(), pw=document.getElementById('a-pw').value, e={};
  if(!MAIL_RE.test(mail)) e.mail='Entre une adresse e-mail valide.';
  if(!pw) e.pw='Entre ton mot de passe.';
  if(showErrs(e)) return;
  const locked=loginLockedUntil(mail); if(locked){ showErrs({pw:loginLockMsg(locked)}); return; }
  busy(true);
  try{
    if(AUTH_LIVE){ if(!(await authReady())){ showErrs({mail:OFFLINE_MSG}); return; } await firebase.auth().signInWithEmailAndPassword(mail,pw); loginOk(mail); }
    else { const acc=S.accounts[mail]; if(!acc){ showErrs({mail:'Aucun compte avec cet e-mail.'}); return; }
      onSignedIn({ uid:acc.uid, name:acc.name, email:mail, photo:'', provider:'password' }); }
  }catch(err){ if(!/^auth\//.test(String(err&&err.code))) console.error(err);
    const c=String(err&&err.code||'');
    if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-login-credentials'].includes(c)){
      const r=loginFailed(mail);
      if(r.until>Date.now()){ showErrs({pw:loginLockMsg(r.until)}); return; }
      const left=LOGIN_MAX-r.n; showErrs({pw:`E-mail ou mot de passe incorrect.${left<=2?` Encore ${left} essai${left>1?'s':''} avant un blocage de ${LOGIN_LOCK_H} heures.`:''}`}); return; }
    showErrs(authErr(err)); }
  finally{ busy(false); }
}
async function forgotPw(){
  const mail=aval('a-mail').toLowerCase();
  if(!MAIL_RE.test(mail)){ showErrs({mail:'Entre ton e-mail pour recevoir un lien de réinitialisation.'}); return; }
  if(AUTH_LIVE){ if(!(await authReady())){ showErrs({mail:OFFLINE_MSG}); return; } try{ await firebase.auth().sendPasswordResetEmail(mail); }catch(e){} }
  toast(AUTH_LIVE?'Si un compte existe, un e-mail vient d\'être envoyé. Regarde aussi dans tes spams.':'Mode démo : aucun e-mail n\'est envoyé.',4000);
}

function answerRequest(id,accept){
  const q=reqWith(id); if(!q) return; const p=PLAYERS.find(x=>x.id===id);
  if(accept){ q.status='accepted'; DB.saveRequest(q); toast(`${p?p.name:'Ce joueur'} est maintenant ton mate`); if(p) DB.saveNotif(id,{type:'accepted',from:'me',text:`${S.me.name} a accepté ta demande de mate`}); }
  else { S.requests=S.requests.filter(r=>r!==q); DB.deleteRequest(q); toast('Demande refusée'); }
  { const seen=S.notifs.filter(n=>!n.read&&n.type==='request'&&n.from===id); seen.forEach(n=>n.read=true); DB.markRead(seen.map(n=>n.id)); }   // la notification de cette demande est réglée
  save();
}
function removeRequest(id){ const q=reqWith(id); if(!q) return; S.requests=S.requests.filter(r=>r!==q); save(); DB.deleteRequest(q); }
function demoScheduleIncoming(){
  if(AUTH_LIVE||!S.me||S.demoDone) return; S.demoDone=true; save();
  setTimeout(()=>{ if(!S.me) return; const c=ranked().filter(({p})=>!reqWith(p.id)&&(!crossAge(p)||minorP(p)))[0]; if(!c) return;   // jamais une demande d'un adulte vers un 13-17 ans
    S.requests.push({id:'r'+Date.now(),from:c.p.id,to:'me',status:'pending',at:Date.now()}); save();
    notify({type:'request',from:c.p.id,text:`${c.p.name} veut devenir ton mate`});
    if(location.hash==='#/joueur/'+c.p.id||location.hash==='#/matchs') route(); }, 20000);
}

/* ---- Notifications ---- */
function notify(n){
  S.notifs.unshift({id:'n'+Date.now()+Math.random().toString(36).slice(2,6),at:Date.now(),read:false,...n}); S.notifs=S.notifs.slice(0,60); save();
  renderNotifBadge(); if(n.toast!==false) toast(n.text);
}
const pendFrom = () => new Set(pendingReceived().map(r=>r.from));
const dupReq = (n,pf) => n.type==='request' && pf.has(n.from);   // notification qui répète une demande encore en attente
const unreadCount = () => { const pf=pendFrom(); return S.notifs.filter(n=>!n.read&&!dupReq(n,pf)).length + pf.size; };
const BELL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>';
function renderNotifBadge(){ const n=unreadCount(); try{ if('setAppBadge' in navigator){ n?navigator.setAppBadge(n):navigator.clearAppBadge(); } }catch(e){} document.querySelectorAll('.notif-btn').forEach(b=>{ b.innerHTML=BELL+(n?`<span class="badge">${n>9?'9+':n}</span>`:''); b.classList.toggle('has',n>0); });
  const um=Object.values(S.unread||{}).reduce((a,b)=>a+(+b||0),0);   // messages non lus : pastille sur l'onglet Messages
  document.querySelectorAll('[data-nav="messages"]').forEach(a=>{ let b=a.querySelector('.tb-badge'); if(!um){ if(b) b.remove(); return; } if(!b){ b=document.createElement('span'); b.className='tb-badge'; a.appendChild(b); } b.textContent=um>9?'9+':um; b.setAttribute('aria-label',um+(um>1?' messages non lus':' message non lu')); }); }
const ago = t => { const m=Math.round((Date.now()-t)/60000); return m<1?'à l\'instant':m<60?`il y a ${m} min`:m<1440?`il y a ${Math.round(m/60)} h`:`il y a ${Math.round(m/1440)} j`; };
function notifLink(n){ return n.type==='message'?'#/messages/'+n.from : n.type==='squad'?'#/groupes/sessions' : n.type==='group'&&n.gid?'#/groupe/'+n.gid : n.type==='flame'?'#/messages/'+n.from : n.type==='annonce'?'#/groupes/annonces' : n.from?'#/joueur/'+n.from : '#/matchs'; }
function notifCenter(){
  const pend=pendingReceived(), pf=pendFrom(), rows=S.notifs.filter(n=>!dupReq(n,pf));
  const sent=S.requests.filter(r=>r.from==='me'&&r.status==='pending').map(r=>visible().find(p=>p.id===r.to)).filter(Boolean);
  modal(`<h3>Notifications</h3>
    ${pend.length?`<div class="notif-group"><b>Demandes de mate</b>${pend.map(r=>{ const p=PLAYERS.find(x=>x.id===r.from); if(!p) return ''; return `<div class="nrow">${avatar(p,40)}<div><b>${esc(p.name)}${modBadge(p)}</b><span class="muted">veut devenir ton mate · ${ago(r.at)}</span></div><div class="nact"><button class="btn btn-sm btn-ac" data-acc="${p.id}">Accepter</button><button class="btn btn-sm btn-ghost" data-dec="${p.id}">Refuser</button></div></div>`; }).join('')}</div>`:''}
    <div class="notif-list">${rows.length?rows.slice(0,25).map(n=>{ const p=n.from&&n.from!=='me'?PLAYERS.find(x=>x.id===n.from):null;
      return `<a class="nrow${n.read?'':' unread'}" href="${esc(notifLink(n))}" data-nid="${esc(n.id)}">${p?avatar(p,40):'<span class="av" style="width:40px;height:40px;--h:265">✦</span>'}<div><span>${esc(n.text)}</span><span class="muted">${ago(n.at)}</span></div></a>`; }).join('')
      :pend.length?'':'<p class="muted" style="padding:14px 0">Rien de nouveau pour le moment.</p>'}</div>
    ${sent.length?`<details class="more-fold sent-reqs"><summary>Mes demandes en attente (${sent.length})</summary>${sent.map(p=>`<div class="nrow">${avatar(p,40)}<div><b>${esc(p.name)}${modBadge(p)}</b><span class="muted">n'a pas encore répondu</span></div><div class="nact"><button class="btn btn-sm btn-ghost" data-cancel-req="${p.id}">Annuler</button></div></div>`).join('')}</details>`:''}
    <div class="dlg-actions"><button class="linkbtn" id="nread">Tout marquer comme lu</button><button class="btn" data-close>Fermer</button></div>`,
    d=>{ d.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>{ answerRequest(b.dataset.acc,true); d.close(); route(); });
      d.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{ answerRequest(b.dataset.dec,false); d.close(); renderNotifBadge(); });
      d.querySelectorAll('[data-cancel-req]').forEach(b=>b.onclick=()=>{ removeRequest(b.dataset.cancelReq); toast('Demande annulée'); const row=b.closest('.nrow'), box=row.parentElement; row.remove(); const n=box.querySelectorAll('.nrow').length; if(n) box.querySelector('summary').textContent=`Mes demandes en attente (${n})`; else box.remove(); if(/^#\/(joueur|accueil|matchs)/.test(location.hash||'#/accueil')) route(); });
      d.querySelectorAll('[data-nid]').forEach(a=>a.addEventListener('click',()=>{ const n=S.notifs.find(x=>x.id===a.dataset.nid); if(n&&!n.read){ n.read=true; DB.markRead([n.id]); } save(); d.close(); renderNotifBadge(); }));
      d.querySelector('#nread').onclick=()=>{ DB.markRead(S.notifs.filter(n=>!n.read).map(n=>n.id)); S.notifs.forEach(n=>n.read=true); save(); renderNotifBadge(); d.close(); }; });
}
document.addEventListener('click',e=>{ if(e.target.closest('.notif-btn,[data-notif-open]')) notifCenter(); });

/* ---- Messages privés (entre mates uniquement) ---- */
// Dernier message connu d'une conversation : le dernier message chargé ou, s'il est plus récent, celui annoncé par une notification
function lastMsg(id){ const m=(S.chats[id]||[]).slice(-1)[0]||null, n=S.notifs.filter(x=>x.type==='message'&&x.from===id).sort((a,b)=>(b.at||0)-(a.at||0))[0];
  if(n&&(!m||(n.at||0)>(m.at||0))){ const t=String(n.text||''), i=t.indexOf(' : '); return {from:id,text:i>=0?t.slice(i+3):t,at:n.at||0}; }
  return m; }
/* Colonne des conversations (ordinateur seulement) : les mates puis les groupes, le plus récent en haut. key = 'c:<joueur>' ou 'g:<groupe>'. */
function dmSideInner(key){
  const mates=matesList().sort((a,b)=>{ const la=lastMsg(a.id), lb=lastMsg(b.id); return (lb?lb.at:0)-(la?la.at:0); });
  return `<h3>Messages privés</h3>${mates.length?mates.map((p,i)=>{ const last=lastMsg(p.id), u=S.unread[p.id]||0;   // les plaques des 12 premières lignes sont animées (au-delà : au survol)
      return `<a class="dm-row${key==='c:'+p.id?' on':''}${u?' unread':''}${plqOn(p,i<12)}" href="#/messages/${p.id}"${key==='c:'+p.id?' aria-current="page"':''}>${plq(p)}${avatar(p,36)}<div><b><span>${esc(p.name)}</span>${isOnline(p)?'<span class="online"></span>':''}</b><span class="muted">${last?esc((last.from==='me'?'Toi : ':'')+last.text):'Dis bonjour 👋'}</span></div>${u?`<span class="badge static">${u}</span>`:''}</a>`; }).join(''):'<p class="muted dm-none">Pas encore de mates.</p>'}`; }
// Les groupes dans la colonne de gauche du site (ordinateur) : un rond par groupe, puis « + »
function railGroups(){ if(!S.auth||!S.me) return ''; const m=location.hash.match(/^#\/groupe\/([^/?]+)/), cur=m?decodeURIComponent(m[1]):'';
  const groups=GROUPS.filter(gIn).sort((a,b)=>tsMs(b.lastAt||b.at)-tsMs(a.lastAt||a.at));
  return groups.map(g=>`<a class="dm-ico${cur===g.id?' on':''}${gUnread(g)?' unread':''}" href="#/groupe/${esc(g.id)}" title="${esc(g.name)}" aria-label="Groupe ${esc(g.name)}${gUnread(g)?' (nouveaux messages)':''}"${cur===g.id?' aria-current="page"':''}>${gAvatar(g,48)}${gUnread(g)?'<span class="dm-dot" aria-hidden="true">•</span>':''}</a>`).join('')
    +`<a class="dm-ico plus" href="#/groupes/groupes" title="Trouver ou créer un groupe" aria-label="Trouver ou créer un groupe">+</a>`; }
const railGroupsRefresh = () => { const el=document.getElementById('sr-groups'); if(el) el.innerHTML=railGroups(); };
// Barre des groupes (ordinateur) : le bouton des messages privés, puis un rond par groupe, puis « + »
function dmRailInner(key){ const groups=GROUPS.filter(gIn).sort((a,b)=>tsMs(b.lastAt||b.at)-tsMs(a.lastAt||a.at)); const dmU=Object.values(S.unread||{}).reduce((n,x)=>n+(+x||0),0);
  return `<a class="dm-ico${key.startsWith('g:')?'':' on'}${dmU?' unread':''}" href="#/messages" title="Messages privés" aria-label="Messages privés${dmU?' ('+dmU+' non lus)':''}"${key.startsWith('g:')?'':' aria-current="page"'}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>${dmU?`<span class="dm-dot">${dmU>99?'99+':dmU}</span>`:''}</a><span class="dm-sep" aria-hidden="true"></span>
    ${groups.map(g=>`<a class="dm-ico${key==='g:'+g.id?' on':''}${gUnread(g)?' unread':''}" href="#/groupe/${esc(g.id)}" title="${esc(g.name)}" aria-label="Groupe ${esc(g.name)}${gUnread(g)?' (nouveaux messages)':''}"${key==='g:'+g.id?' aria-current="page"':''}>${gAvatar(g,48)}${gUnread(g)?'<span class="dm-dot" aria-hidden="true">•</span>':''}</a>`).join('')}
    <a class="dm-ico plus" href="#/groupes/groupes" title="Trouver ou créer un groupe" aria-label="Trouver ou créer un groupe">+</a>`; }
const dmSide = key => `<nav class="dm-rail" id="dm-rail" aria-label="Groupes" data-key="${esc(key||'')}">${dmRailInner(key||'')}</nav><nav class="dm-side" id="dm-side" aria-label="Messages privés" data-key="${esc(key||'')}">${dmSideInner(key)}</nav>`;
const dmRefresh = () => { railGroupsRefresh(); const sd=document.getElementById('dm-side'); if(sd&&sd.offsetParent!==null){ const y=sd.scrollTop; sd.innerHTML=dmSideInner(sd.dataset.key); sd.scrollTop=y; const rl=document.getElementById('dm-rail'); if(rl){ const ry=rl.scrollTop; rl.innerHTML=dmRailInner(rl.dataset.key||''); rl.scrollTop=ry; } } };
// Place la colonne à la bonne hauteur : juste sous l'en-tête du site, jusqu'en bas de la fenêtre
function dmFit(){ const sh=document.querySelector('.dm-shell'); if(!sh) return; const top=sh.getBoundingClientRect().top+window.scrollY; sh.style.setProperty('--dm-top',Math.round(top+24)+'px'); const on=sh.querySelector('.dm-row.on'); if(on&&on.scrollIntoView) on.scrollIntoView({block:'nearest'}); }
window.addEventListener('resize',dmFit);
// Téléphone : la conversation prend exactement la hauteur visible, même quand le clavier est ouvert
(function(){ const vv=window.visualViewport; if(!vv) return; const fit=()=>{ document.documentElement.style.setProperty('--vvh',Math.round(vv.height)+'px'); const b=document.getElementById('chatbox'); if(b&&document.activeElement&&document.activeElement.id==='chatin') b.scrollTop=b.scrollHeight; }; vv.addEventListener('resize',fit); fit(); })();
/* Liste des messages sur téléphone : mates et groupes dans une seule liste, avec l'état du dernier message. */
const CHAT_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>';
const shortAgo = t => ago(t).replace('il y a ','');
function snList(mates){
  const groups=GROUPS.filter(gIn);
  const items=[...mates.map(p=>({k:'c',p,at:(lastMsg(p.id)||{}).at||0})),...groups.map(g=>({k:'g',g,at:tsMs(g.lastAt||g.at)}))].sort((x,y)=>y.at-x.at);
  const nU=mates.filter(p=>S.unread[p.id]).length+groups.filter(gUnread).length;
  const rows=items.map(it=>{
    if(it.k==='g'){ const g=it.g, u=gUnread(g);
      return `<a class="sn-row grp${u?' unread':''}" href="#/groupe/${esc(g.id)}" data-f="group${u?' unread':''}" data-n="${esc(g.name.toLowerCase())}"><span class="sn-av">${gAvatar(g,56)}</span><div class="sn-mid"><b><span>${esc(g.name)}</span>${g.private?'<span class="g-lock" title="Groupe privé">'+LOCK_SVG+'</span>':''}</b>
        <span class="sn-st${u?' new':''}"><i></i><span class="t">${u?'Nouveaux messages':'Groupe'}</span><span class="x">${u&&g.lastAt?'· '+shortAgo(tsMs(g.lastAt)):`· ${g.members.length} membre${g.members.length>1?'s':''}${g.lastAt?' · '+shortAgo(tsMs(g.lastAt)):''}`}</span></span></div><span class="sn-end">${u?'<span class="badge static" aria-label="Nouveaux messages">•</span>':CHAT_SVG}</span></a>`; }
    const p=it.p, last=lastMsg(p.id), u=S.unread[p.id]||0, f=flameState(p.id), on=isOnline(p), fl=f&&f.count>=FLAME_FROM;
    const st=u?['new',u>1?`${u} nouveaux messages`:'Nouveau message']:!last?['','Dis bonjour 👋']:last.from==='me'?['sent','Envoyé']:['','Reçu'];
    return `<a class="sn-row${u?' unread':''}${plqOn(p)}" href="#/messages/${p.id}" data-f="${u?'unread ':''}${on?'online ':''}${fl?'flame':''}" data-n="${esc(String(p.name||'').toLowerCase())}">${plq(p)}<span class="sn-av">${avatar(p,56)}${on?'<span class="online" title="En ligne"></span>':''}</span><div class="sn-mid"><b><span>${esc(p.name)}</span>${modBadge(p)}</b>
      <span class="sn-st ${st[0]}">${last||u?'<i></i>':''}<span class="t">${st[1]}</span><span class="x">${last?'· '+shortAgo(last.at):''}${fl?` · ${f.count} ${f.warn?'⏳':'🔥'}`:''}</span></span></div><span class="sn-end">${u?`<span class="badge static">${u}</span>`:CHAT_SVG}</span></a>`; }).join('');
  const chip=(k,l,n)=>`<button type="button" class="chip" data-snf="${k}" aria-pressed="${k==='all'}">${l}${n?` <span class="cnt">${n}</span>`:''}</button>`;
  return `<div class="page-head sn-top"><div><h2>Messages</h2></div><button class="btn sn-round" type="button" id="sn-find" aria-label="Chercher une conversation" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button><a class="btn sn-round" href="#/matchs" aria-label="Trouver de nouveaux mates" title="Trouver de nouveaux mates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9.5" cy="8" r="3.5"/><path d="M3 20c.5-3.5 3-5.5 6.5-5.5s6 2 6.5 5.5M19 7v6M16 10h6"/></svg></a></div>
    <input class="sn-search" id="sn-q" type="search" placeholder="Chercher un mate ou un groupe" autocomplete="off" aria-label="Chercher un mate ou un groupe" hidden>
    <div class="sn-chips" role="group" aria-label="Filtrer les conversations">${chip('all','Tous')}${chip('unread','Non lus',nU)}${chip('online','En ligne')}${chip('flame','Flammes 🔥')}${chip('group','Groupes')}</div>
    ${items.length?`<div class="sn-list" id="sn-list">${rows}<p class="muted sn-none" id="sn-none" hidden>Aucune conversation ici.</p></div>`
      :`<div class="empty"><h3>Pas encore de mates</h3><p class="muted">Envoie une demande à un joueur compatible. Dès qu'il accepte, vous pouvez discuter ici.</p><a class="btn btn-ac" href="#/matchs">Voir mes matchs</a></div>`}
    <a class="btn btn-ac sn-fab" href="#/groupes/groupes" aria-label="Trouver ou créer un groupe" title="Trouver ou créer un groupe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>`; }
function snWire(){ const list=document.getElementById('sn-list'), q=document.getElementById('sn-q'), find=document.getElementById('sn-find'); let f='all';
  const apply=()=>{ if(!list) return; const t=(q&&!q.hidden?q.value:'').trim().toLowerCase(); let n=0;
    list.querySelectorAll('.sn-row').forEach(r=>{ const ok=(f==='all'||(' '+r.dataset.f+' ').includes(' '+f+' '))&&(!t||r.dataset.n.includes(t)); r.hidden=!ok; if(ok) n++; });
    const none=document.getElementById('sn-none'); if(none) none.hidden=n>0; };
  document.querySelectorAll('[data-snf]').forEach(c=>c.onclick=()=>{ f=c.dataset.snf; document.querySelectorAll('[data-snf]').forEach(x=>x.setAttribute('aria-pressed',x===c)); apply(); });
  if(find&&q){ find.onclick=()=>{ q.hidden=!q.hidden; find.setAttribute('aria-expanded',!q.hidden); if(q.hidden){ q.value=''; apply(); } else q.focus(); }; q.oninput=apply; } }
function viewMessages(id){
  if(dataPending()) return loadingView('Messages');
  if(!S.me) return needProfile('Messages');
  if(id) return viewChat(id);
  const mates=matesList().sort((a,b)=>{ const la=lastMsg(a.id), lb=lastMsg(b.id); return (lb?lb.at:0)-(la?la.at:0); });
  app.innerHTML=`<div class="dm-shell">${dmSide('')}<div class="dm-empty"><div><h3>Choisis une conversation</h3><p class="muted">Tes mates sont dans la colonne de gauche, tes groupes dans la barre tout à gauche.</p></div></div><div class="wrap page dm-list-page" style="max-width:720px">${snList(mates)}</div></div>`;
  snWire();
  dmFit();
}
function viewChat(id){
  const p=visible().find(x=>x.id===id);
  if(!p||!isMate(id)){ app.innerHTML=`<div class="wrap page"><div class="empty"><h3>Vous n'êtes pas encore mates</h3><p class="muted">Les messages s'ouvrent une fois la demande de mate acceptée.</p><a class="btn" href="#/messages">Retour aux messages</a></div></div>`; return; }
  S.unread[id]=0; { const seen=S.notifs.filter(n=>!n.read&&n.type==='message'&&n.from===id); seen.forEach(n=>n.read=true); DB.markRead(seen.map(n=>n.id)); } save(); renderNotifBadge();
  app.innerHTML=`<div class="dm-shell">${dmSide('c:'+id)}<div class="wrap page chat-page"><div class="chat-head">${backLink('#/messages','Messages')}<a class="chat-who${plqOn(p,1)}" href="#/joueur/${p.id}">${plq(p)}${avatar(p,44)}<div><b>${esc(p.name)}${modBadge(p)}</b>${isOnline(p)?'<span class="online">En ligne</span>':'<span class="muted" style="font-size:12px">Hors ligne</span>'}</div></a>${callBtns(p)}</div>
    <p class="flame-hint" id="flame-hint"></p>
    <div class="chat-box" id="chatbox"></div>
    <form class="chat-form" id="chatform"><input type="text" id="chatin" placeholder="Écris un message…" maxlength="500" autocomplete="off">${photoBtn(!minorP(p))}${micBtn()}<button class="btn btn-ac" type="submit">Envoyer</button></form></div></div>`;
  dmFit(); renderChat(id);
  // Photo : réduite sur l'appareil, puis envoyée comme un message (jamais à un 13-17 ans)
  photoWire(ph=>{ if(minorP(p)) return; const pid=newId(); PHOTOS[pid]=ph.data; const m={from:'me',text:PHOTO_TEXT,at:Date.now(),photo:{id:pid,w:ph.w,h:ph.h}}; (S.chats[id]||(S.chats[id]=[])).push(m); save();
    DB.sendMessage(id,m).then(()=>{ if(location.hash==='#/messages/'+id) renderChat(id); }); renderChat(id); });
  document.querySelectorAll('[data-call]').forEach(b=>b.onclick=()=>startCall(id,b.dataset.call));
  // Message vocal : enregistré puis envoyé comme un message (30 secondes maximum)
  document.getElementById('micbtn')?.addEventListener('click',()=>recordVoice(v=>{ const vid=newId();
    VOICES[vid]=v.data; const m={from:'me',text:VOICE_TEXT,at:Date.now(),voice:{id:vid,dur:v.dur}}; (S.chats[id]||(S.chats[id]=[])).push(m); save();
    DB.sendMessage(id,m).then(()=>{ if(location.hash==='#/messages/'+id) renderChat(id); }); renderChat(id); }));
  // la zone de messages change de hauteur (contacts chargés, clavier, rotation) : on reste calé sur le dernier message
  try{ const cb=document.getElementById('chatbox'); if(cb&&'ResizeObserver' in window) new ResizeObserver(()=>{ cb.scrollTop=cb.scrollHeight; }).observe(cb); }catch(e){}
  document.getElementById('chatform').addEventListener('submit',e=>{ e.preventDefault(); const i=document.getElementById('chatin'), t=i.value.trim(); if(!t) return;
    if(S.me&&ageGroup(S.me)==='minor'&&hasPhone(t)){ toast('Pour ta sécurité, les numéros de téléphone ne peuvent pas être envoyés ici.'); return; }   // 13-17 ans : pas de numéro dans le chat
    if(minorP(p)&&hasPhone(t)){ toast('Pour la sécurité des 13-17 ans, les numéros de téléphone ne peuvent pas être envoyés ici.'); return; }   // ni de la part d'un adulte vers un 13-17 ans

// Adresses qui aident les deux téléphones à se trouver. Sans relais réglé, on garde l'aide de base (suffit en Wi-Fi, pas toujours en 4G).
async function iceServers(){ const base=[{urls:'stun:stun.l.google.com:19302'}];

function shrinkPhoto(file){ return new Promise((ok,no)=>{ const url=URL.createObjectURL(file), img=new Image();

  const type=['audio/webm;codecs=opus','audio/mp4','audio/ogg;codecs=opus','audio/webm'].find(t=>{ try{ return MediaRecorder.isTypeSupported(t); }catch(e){ return false; } });
  let mr; try{ mr=new MediaRecorder(stream,type?{mimeType:type,audioBitsPerSecond:24000}:{audioBitsPerSecond:24000}); }catch(e){ try{ mr=new MediaRecorder(stream); }catch(x){ stream.getTracks().forEach(t=>t.stop()); toast("L'enregistrement n'est pas possible sur cet appareil."); return; } }
  const chunks=[], t0=Date.now(), bar=document.createElement('div'); bar.className='rec-bar';
  bar.innerHTML=`<i class="rec-dot" aria-hidden="true"></i><b aria-live="off">0:00 / ${vTime(VOICE_MAX)}</b><button class="btn btn-sm btn-ghost" type="button" data-rec="0">Annuler</button><button class="btn btn-sm btn-ac" type="button" data-rec="1">Envoyer</button>`;
  form.classList.add('rec'); form.appendChild(bar);
  const r=REC={mr,send:false,tick:0};
  r.finish=()=>{ stream.getTracks().forEach(t=>t.stop()); bar.remove(); form.classList.remove('rec');
    if(!r.send) return; const dur=Math.min(VOICE_MAX,Math.max(1,Math.round((r.t1-t0)/1000)));
    if(r.t1-t0<700||!chunks.length){ toast('Message trop court.'); return; }
    const fr=new FileReader(); fr.onerror=()=>toast("Le message vocal n'a pas pu être préparé.");
    fr.onload=()=>{ const data=String(fr.result||''); if(!VOICE_RE.test(data)){ toast("Ce format de son n'est pas pris en charge."); return; }
      if(data.length>VOICE_LIMIT){ toast('Message vocal trop lourd : fais-le un peu plus court.'); return; } onDone({data,dur}); };
    fr.readAsDataURL(new Blob(chunks,{type:(mr.mimeType||type||'audio/webm').split(';')[0]})); };
  mr.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  mr.onstop=()=>{ r.t1=r.t1||Date.now(); r.finish(); }; mr.onerror=()=>{ r.send=false; r.t1=Date.now(); if(REC===r){ REC=null; clearInterval(r.tick); } r.finish(); };
  bar.querySelector('[data-rec="0"]').onclick=()=>{ r.t1=Date.now(); stopRec(false); };
  bar.querySelector('[data-rec="1"]').onclick=()=>{ r.t1=Date.now(); stopRec(true); };
  r.tick=setInterval(()=>{ const s=(Date.now()-t0)/1000; const b=bar.querySelector('b'); if(b) b.textContent=`${vTime(s)} / ${vTime(VOICE_MAX)}`;
    if(s>=VOICE_MAX){ r.t1=Date.now(); stopRec(true); } else if(!document.body.contains(form)){ r.t1=Date.now(); stopRec(false); } },250);
  try{ mr.start(); }catch(e){ r.t1=Date.now(); stopRec(false); toast("L'enregistrement n'a pas pu démarrer."); }
}
window.addEventListener('hashchange',()=>{ if(REC){ REC.t1=Date.now(); stopRec(false); } if(VPLAY){ try{ VPLAY.audio.pause(); }catch(e){} VPLAY=null; } });
// Lecture : le son est téléchargé au premier appui, puis gardé en mémoire
let VPLAY=null;
const vBtn = id => document.querySelector(`.voice-play[data-voice="${CSS.escape(id)}"]`);
document.addEventListener('click',async e=>{ const b=e.target.closest('.voice-play'); if(!b) return; const id=b.dataset.voice;
  if(VPLAY&&VPLAY.id===id){ if(VPLAY.audio.paused){ VPLAY.audio.play().catch(()=>{}); } else VPLAY.audio.pause(); return; }
  if(VPLAY){ try{ VPLAY.audio.pause(); }catch(x){} const o=vBtn(VPLAY.id); if(o){ o.classList.remove('on'); o.querySelector('.v-bar i').style.width='0'; } VPLAY=null; }
  if(b.dataset.busy) return; b.dataset.busy='1'; const data=await DB.loadVoice(b.dataset.vk,b.dataset.vo,id); delete b.dataset.busy; { const nb=vBtn(id); if(nb) delete nb.dataset.busy; }
  if(!data||!VOICE_RE.test(data)){ toast("Ce message vocal n'est plus disponible."); return; }

  const sync=()=>{ const x=vBtn(id); if(!x) return; x.classList.toggle('on',VPLAY===me&&!audio.paused); const d=isFinite(audio.duration)&&audio.duration>0?audio.duration:dur; x.querySelector('.v-bar i').style.width=(d?Math.min(100,audio.currentTime/d*100):0)+'%'; };

const hasLink = t => /(?:https?:\/\/|www\.)\S+|\b[a-z0-9-]+\.(?:com|net|org|io|gg|me|ly|xyz|app|link|ci|fr|tk)\b/i.test(t);
const msgWarn = m => m.from==='me' ? '' : hasPhone(m.text) ? '<em class="bubble-warn">Prudence : ne partage ton numéro qu\'avec quelqu\'un que tu connais vraiment.</em>'
