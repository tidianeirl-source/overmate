  aurore:{label:'Aurore',cat:'degrade',tag:'Populaire'}, lagune:{label:'Lagune',cat:'degrade'}, braise:{label:'Braise',cat:'degrade'}, neon:{label:'Néon',cat:'degrade',tag:'Nouveau'},
  pixel:{label:'Pixel',cat:'gaming',tag:'Populaire'}, manette:{label:'Manette',cat:'gaming'}, circuit:{label:'Circuit',cat:'gaming'}, damier:{label:'Damier',cat:'gaming',tag:'Nouveau'},
  or:{label:'Or',cat:'brillant',tag:'Populaire'}, chrome:{label:'Chrome',cat:'brillant'}, holo:{label:'Holo',cat:'brillant',tag:'Nouveau'},
  dragon:{label:'Dragon',cat:'rare'}, galaxie:{label:'Galaxie',cat:'rare'}, foudre:{label:'Foudre',cat:'rare'},
  flamme10:{label:'Étincelle',cat:'recompense',how:'10 jours de flamme avec un mate'}, flamme30:{label:'Brasier',cat:'recompense',how:'30 jours de flamme avec un mate'},
  flamme100:{label:'Fournaise',cat:'recompense',how:'100 jours de flamme avec un mate'}, flamme365:{label:'Flamme éternelle',cat:'recompense',how:'365 jours de flamme avec un mate'},
  souvenir:{label:'Souvenir Awalé',cat:'recompense',how:'Offerte aux joueurs qui avaient le thème Awalé'},
};
// [catégorie, titre, clé de prix, phrase]
const PLATE_CATS=[['couleur','Couleurs','p1','Une couleur franche autour de ton pseudo.'],['degrade','Dégradés animés','p2','Les couleurs glissent doucement.'],['gaming','Motifs gaming','p2','Pixels, manette, circuit, damier.'],['brillant','Effets brillants','p3','Un reflet passe sur la plaque.'],['rare','Édition limitée','p4','En vente pour un temps limité, puis plus jamais.']];
const RARE_UNTIL='2027-01-31';   // dernier jour de vente des plaques en édition limitée (le serveur applique la même date)
const rareOpen = () => Date.now() < Date.parse(RARE_UNTIL+'T23:59:59Z');
const platesIn = cat => Object.keys(PLATES).filter(k=>PLATES[k].cat===cat);
const PPACKS={ couleurs:{label:'Pack Couleurs',cat:'couleur',price:'k1'}, degrades:{label:'Pack Dégradés',cat:'degrade',price:'k2'}, gaming:{label:'Pack Gaming',cat:'gaming',price:'k2'}, brillants:{label:'Pack Brillants',cat:'brillant',price:'k3'},
  plaques:{label:'Toutes les plaques',price:'k4',tag:'Populaire'} };
const ppackItems = k => PPACKS[k].cat ? platesIn(PPACKS[k].cat) : ['couleur','degrade','gaming','brillant'].flatMap(platesIn);
const platePrice = (id,cur=curCode()) => { const c=PLATE_CATS.find(x=>x[0]===PLATES[id].cat); return c?price(c[2],cur):0; };
const plateOf = p => { const id=p&&p.plate; return id&&PLATES[id]?id:''; };
// Le pseudo d'un joueur, dans sa plaque s'il en porte une (profil, messages, groupes, liste des mates)
function np(p,name){ const id=plateOf(p), n=esc(name??(p&&p.name)??''); return id?`<span class="np np-${id}"><span class="np-t">${n}</span></span>`:n; }
function ownsPlate(id){ const pl=PLATES[id]; if(!pl) return false; if(pl.cat==='base') return true;
  if(!AUTH_LIVE||!SHOP.enabled) return true;   // démonstration : tout est libre
  if(S.auth&&isAdmin()) return true;           // modérateurs
  if(pl.cat==='recompense') return (((S.rewards||{}).plates)||[]).includes(id);
  return ((S.owned&&S.owned.plates)||[]).includes(id); }
function setPlate(id){ if(!S.me) return; id=id&&PLATES[id]&&ownsPlate(id)?id:''; S.me.plate=id; if(S.auth) S.profiles[S.auth.uid]=S.me; save(); DB.savePlate(id);
  toast(id?`Plaque ${PLATES[id].label} équipée`:'Plaque retirée'); }
// Aperçu d'une plaque sur son propre profil, avant de l'acheter : en-tête de profil, message, ligne de la liste des mates
function platePreview(id){ const pl=PLATES[id]; if(!pl) return; const me={...publicMe(),plate:id}, own=ownsPlate(id), on=plateOf(S.me)===id;
  const act = own ? (on?`<button class="btn" data-use-plate="" data-close>Retirer</button>`:`<button class="btn btn-ac" data-use-plate="${id}" data-close>Équiper</button>`)
    : pl.cat==='recompense' ? '' : (pl.cat==='rare'&&!rareOpen()) ? '' : `<button class="btn btn-ac" data-shop-buy="plate:${id}">${money(platePrice(id))}</button>`;
  modal(`<h3>Plaque ${esc(pl.label)}</h3><p class="muted">Voilà ce que les autres joueurs verront.</p>
    <div class="np-prev"><div class="np-prev-head">${avatar(me,64)}<div><b class="np-prev-name">${np(me)}</b><span class="muted">Sur ton profil</span></div></div>
      <div class="np-prev-row">${avatar(me,40)}<div><b>${np(me)}</b><span class="muted">Dans la liste des mates</span></div></div>
      <div class="np-prev-msg"><small>${np(me)}</small><div class="bubble"><span>On lance une partie ce soir ?</span></div><span class="muted">Dans un groupe</span></div></div>
    ${pl.how&&!own?`<p class="hint">Cette plaque ne s'achète pas : ${esc(pl.how)}.</p>`:''}
    <div class="dlg-actions"><button class="btn btn-ghost" data-close>Fermer</button>${act}</div>`); }

/* ---- Paiement : le serveur dit s'il est ouvert (mode « test » = faux paiements, réservés aux modérateurs) ---- */
const PAY={ mode:'off', label:'', loaded:false };
async function payInit(){ if(PAY.loaded||PAY._busy||!SHOP.api||!AUTH_LIVE) return; PAY._busy=true;
  try{ const r=await fetch(SHOP.api.replace(/\/$/,'')+'/config'); if(r.ok){ const j=await r.json();
      if(j&&(j.mode==='test'||j.mode==='live')){ PAY.mode=j.mode; PAY.label=String(j.label||'').slice(0,60);
        if(Array.isArray(j.currencies)){ const cs=j.currencies.filter(c=>CURRENCIES[c]); if(cs.length) SHOP.currencies=cs; } } } }catch(e){}
  PAY.loaded=true; PAY._busy=false;
  if(location.hash.startsWith('#/boutique')){ const y=scrollY; route(); scrollTo(0,y); } }
const canPay = () => PAY.mode==='live' || (PAY.mode==='test' && isAdmin());
const TEST_NOTE='<div class="test-note" role="note"><b>Mode test</b><span>Faux paiement : aucun argent n\'est débité. Réservé à la modération, pour vérifier que tout marche.</span></div>';
// Description d'un article : 'theme:<id>', 'pack' (tous les thèmes), 'plate:<id>', 'ppack:<id>'
function itemInfo(item,cur=curCode()){ const [k,id]=String(item).split(':');
  if(k==='theme'&&SKINS[id]&&PAID_SKINS.includes(id)) return {title:'Thème '+SKINS[id].label,desc:SKINS[id].desc,price:skinPrice(id,cur)};
  if(k==='pack') return {title:'Tous les thèmes',desc:`Les ${PAID_SKINS.length} thèmes payants d'un coup.`,price:price('pack',cur)};
  if(k==='plate'&&PLATES[id]&&platePrice(id,cur)) return {title:'Plaque '+PLATES[id].label,desc:'Un cadre autour de ton pseudo, visible partout sur Coopô.',price:platePrice(id,cur)};
  if(k==='ppack'&&PPACKS[id]) return {title:PPACKS[id].label,desc:`${ppackItems(id).length} plaques : ${ppackItems(id).map(x=>PLATES[x].label).join(', ')}.`,price:price(PPACKS[id].price,cur)};
  return null; }
function buy(item){ const inf=itemInfo(item); if(!inf) return;
  const head=`<h3>${esc(inf.title)}</h3><p class="muted">${esc(inf.desc)}</p>`, close='<div class="dlg-actions"><button class="btn" data-close>Fermer</button></div>';
  if(!AUTH_LIVE){ modal(head+'<p class="muted">En démonstration, tout est déjà débloqué.</p>'+close); return; }
  if(!canPay()){ modal(head+`<div class="buy-line"><span>Prix</span><strong>${money(inf.price)}</strong></div><div class="soon-note"><b>Bientôt disponible</b><span>Le paiement par Mobile Money arrive bientôt. En attendant, tu peux utiliser l'aperçu.</span></div>`+close); return; }
  if(!S.auth||!(S.me&&S.me.dob)){ modal(head+'<p class="muted">Termine ton profil avant de faire un achat.</p><div class="dlg-actions"><a class="btn btn-ac" href="#/profil" data-close>Compléter mon profil</a></div>'); return; }
  const minor=ageGroup(S.me)==='minor'; let cur=curCode(); const many=(SHOP.currencies||Object.keys(CURRENCIES)).length>1;
  modal(`${head}${PAY.mode==='test'?TEST_NOTE:''}
    ${many?`<div class="field buy-cur"><label for="buy-cur">Devise</label><select id="buy-cur">${Object.entries(CURRENCIES).filter(([k])=>curOK(k)).map(([k,v])=>`<option value="${k}" ${k===cur?'selected':''}>${v.label} (${k})</option>`).join('')}</select></div>`:''}
    <div class="buy-line"><span>À payer</span><strong id="buy-price">${money(inf.price,cur)}</strong></div>
    ${minor?`<label class="buy-consent"><input type="checkbox" id="buy-parent"> Un parent ou tuteur est d'accord avec cet achat.</label>`:''}
    <p class="muted buy-note">${PAY.mode==='test'?'Tu vas arriver sur une page de faux paiement.':`Paiement sécurisé${PAY.label?' par '+esc(PAY.label):''}.`} L'achat est lié à ton compte. <a href="#/remboursement" data-close>Politique de remboursement</a>.</p>
    <p class="ferr" id="buy-err" role="alert"></p>
    <div class="dlg-actions"><button class="btn btn-ghost" data-close>Annuler</button><button class="btn btn-ac" id="buy-go">Payer</button></div>`, d=>{
    const sel=d.querySelector('#buy-cur'); if(sel) sel.onchange=()=>{ cur=sel.value; S.currency=cur; save(); d.querySelector('#buy-price').textContent=money(itemInfo(item,cur).price,cur); };
    d.querySelector('#buy-go').onclick=async ev=>{ const b=ev.currentTarget, err=d.querySelector('#buy-err'), pc=d.querySelector('#buy-parent');
      if(minor && !(pc&&pc.checked)){ err.textContent='Coche la case pour confirmer l\'accord de ton parent ou tuteur.'; return; }
      if(!(DB.live&&DB.fns)){ err.textContent='Le serveur de paiement n\'est pas prêt. Réessaie dans un instant.'; return; }
      b.disabled=true; b.textContent='Redirection…'; err.textContent='';
      try{ const r=await DB.fns.httpsCallable('createPayment')({item,currency:cur,parentConsent:!!(pc&&pc.checked)}); const u=String((r.data&&r.data.url)||'');
        if(u.startsWith('#/')){ d.close(); location.hash=u; } else if(/^https:\/\//.test(u)) location.href=u; else throw new Error('Le paiement n\'a pas pu démarrer.'); }
      catch(e){ err.textContent=(e&&e.message)||'Le paiement n\'a pas pu démarrer.'; b.disabled=false; b.textContent='Payer'; } }; }); }

/* ---- La page Boutique ---- */
const SHOP_TABS=[['themes','Thèmes'],['plaques','Plaques'],['packs','Packs'],['objets','Mes objets']];
const shopTag = t => t?`<span class="shop-tag${t==='Édition limitée'?' rare':''}">${t}</span>`:'';
const SKIN_TAGS={ prunier:'Nouveau', ocean:'Populaire', samurai:'Populaire' };
function themeCard(id){ const t=SKINS[id], paid=PAID_SKINS.includes(id), own=canUseSkin(id), on=(S.skinWanted||S.skin)===id&&!_preview;
  const prev=`<div class="shop-prev shop-prev-th" style="--a:${t.sw[0]};--b:${t.sw[1]};--c2:${t.sw[2]}"><div class="th-mock"><i></i><i></i><i></i><b></b></div></div>`;
  const act = own ? (on?'<button class="btn btn-sm" disabled>Actif</button>':`<button class="btn btn-sm btn-ac" data-use-skin="${id}">Utiliser</button>`)
    : `<button class="btn btn-sm btn-ghost" data-shop-prev="theme:${id}">Aperçu</button><button class="btn btn-sm btn-ac" data-shop-buy="theme:${id}">${money(skinPrice(id))}</button>`;
  return `<article class="shop-card${own?' owned':''}">${prev}${shopTag(own?'':SKIN_TAGS[id])}<div class="shop-info"><b>${esc(t.label)}</b><span class="muted">${esc(t.desc)}</span>${own?`<small class="shop-own">${paid?'À toi':'Gratuit'}</small>`:''}</div><div class="shop-foot">${act}</div></article>`; }
function plateCard(id){ const pl=PLATES[id], own=ownsPlate(id), on=plateOf(S.me)===id, rare=pl.cat==='rare', sold=rare&&!rareOpen();
  const act = own ? (on?`<button class="btn btn-sm" data-use-plate="">Retirer</button>`:`<button class="btn btn-sm btn-ac" data-use-plate="${id}">Équiper</button>`)
    : pl.cat==='recompense' ? `<button class="btn btn-sm btn-ghost" data-shop-prev="plate:${id}">Aperçu</button>`
    : `<button class="btn btn-sm btn-ghost" data-shop-prev="plate:${id}">Aperçu</button>${sold?'':`<button class="btn btn-sm btn-ac" data-shop-buy="plate:${id}">${money(platePrice(id))}</button>`}`;
  const sub = own ? (on?'Équipée':'À toi') : pl.cat==='recompense' ? pl.how : rare ? (sold?'Plus en vente':`Jusqu'au ${new Date(RARE_UNTIL).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}`) : pl.cat==='base' ? pl.desc : '';
  return `<article class="shop-card${own?' owned':''}${rare?' is-rare':''}"><div class="shop-prev shop-prev-np">${np({plate:id,name:S.me.name})}</div>${shopTag(own?'':rare?'Édition limitée':pl.tag)}<div class="shop-info"><b>${esc(pl.label)}</b>${sub?`<span class="muted">${esc(sub)}</span>`:''}</div><div class="shop-foot">${act}</div></article>`; }
function packCard(item){ const inf=itemInfo(item), [k,id]=item.split(':'); let prev, own, full, tag='';
  if(k==='pack'){ own=ownsAll()||PAID_SKINS.every(canUseSkin); full=PAID_SKINS.reduce((a,x)=>a+skinPrice(x),0); tag='Populaire';
    prev=`<div class="shop-prev shop-prev-pk">${PAID_SKINS.map(x=>`<i style="background:${SKINS[x].sw[0]}"></i>`).join('')}</div>`; }
  else { const its=ppackItems(id); own=its.every(ownsPlate); full=its.reduce((a,x)=>a+platePrice(x),0); tag=PPACKS[id].tag||'';
    prev=`<div class="shop-prev shop-prev-pk np-stack">${its.slice(0,5).map(x=>np({plate:x,name:PLATES[x].label})).join('')}${its.length>5?`<small>+${its.length-5}</small>`:''}</div>`; }
  const eco=full-inf.price;
  return `<article class="shop-card shop-pack${own?' owned':''}">${prev}${shopTag(own?'':tag)}<div class="shop-info"><b>${esc(inf.title)}</b><span class="muted">${esc(inf.desc)}</span>${!own&&eco>0?`<small class="shop-eco">${money(eco)} d'économie</small>`:''}</div>
    <div class="shop-foot">${own?'<button class="btn btn-sm" disabled>Déjà à toi</button>':`<button class="btn btn-sm btn-ac" data-shop-buy="${item}">${money(inf.price)}</button>`}</div></article>`; }
function viewShop(tab){
  if(dataPending()) return loadingView('Boutique');
  if(!S.me) return needProfile('Boutique');
  payInit();
  tab=SHOP_TABS.some(x=>x[0]===tab)?tab:'themes';
  const many=AUTH_LIVE&&(SHOP.currencies||Object.keys(CURRENCIES)).length>1;
  let body='';
  if(tab==='themes') body=`<div class="shop-grid">${Object.keys(SKINS).map(themeCard).join('')}</div>`;
  else if(tab==='plaques') body=`<section class="shop-sec"><h3>Offerte</h3><div class="shop-grid">${plateCard('base')}</div></section>`
    + PLATE_CATS.map(([c,l,,sub])=>`<section class="shop-sec${c==='rare'?' shop-sec-rare':''}"><h3>${l}</h3><p class="muted">${sub}</p><div class="shop-grid">${platesIn(c).map(plateCard).join('')}</div></section>`).join('')
    + `<section class="shop-sec"><h3>À gagner</h3><p class="muted">Ces plaques ne s'achètent pas : elles se méritent.</p><div class="shop-grid">${platesIn('recompense').filter(x=>x!=='souvenir'||ownsPlate(x)).map(plateCard).join('')}</div></section>`;
  else if(tab==='packs') body=`<div class="shop-grid shop-grid-wide">${['pack',...Object.keys(PPACKS).map(k=>'ppack:'+k)].map(packCard).join('')}</div>`;
  else { const th=Object.keys(SKINS).filter(canUseSkin), pls=Object.keys(PLATES).filter(ownsPlate);
    body=`<section class="shop-sec"><h3>Mes thèmes</h3><div class="shop-grid">${th.map(themeCard).join('')}</div></section>
      <section class="shop-sec"><h3>Mes plaques</h3><p class="muted">Équipe une plaque pour l'afficher autour de ton pseudo, ou retire-la.</p><div class="shop-grid">${pls.map(plateCard).join('')}</div>
      ${plateOf(S.me)?'<p style="margin-top:14px"><button class="btn btn-ghost btn-sm" data-use-plate="">Ne porter aucune plaque</button></p>':''}</section>`; }
  app.innerHTML=`<div class="wrap page shop"><div class="page-head"><div><h2>Boutique</h2><p>Thèmes et plaques nominatives pour personnaliser ton Coopô.</p></div>
      ${many?`<div class="field shop-cur"><label for="shop-cur">Devise</label><select id="shop-cur">${Object.entries(CURRENCIES).filter(([k])=>curOK(k)).map(([k,v])=>`<option value="${k}" ${k===curCode()?'selected':''}>${v.label}</option>`).join('')}</select></div>`:''}</div>
    <div class="chips board-tabs" role="tablist">${SHOP_TABS.map(([k,l])=>`<a class="chip" role="tab" href="#/boutique/${k}" aria-selected="${tab===k}" aria-pressed="${tab===k}">${l}</a>`).join('')}</div>
    ${PAY.mode==='test'&&isAdmin()?TEST_NOTE.replace('</div>','<button class="btn btn-sm" data-shop-buy="plate:rubis">Essayer un faux achat</button></div>'):''}${body}</div>`;
}
document.addEventListener('change',e=>{ if(e.target&&(e.target.id==='shop-cur'||e.target.id==='set-cur')){ S.currency=e.target.value; save(); const y=scrollY; route(); scrollTo(0,y); } });
document.addEventListener('click',e=>{ const t=e.target;
  const bb=t.closest('[data-shop-buy]'); if(bb){ buy(bb.dataset.shopBuy); return; }
  const pv=t.closest('[data-shop-prev]'); if(pv){ const [k,id]=pv.dataset.shopPrev.split(':'); if(k==='theme'){ try{ if(dlg.open) dlg.close(); }catch(err){} previewSkin(id); } else platePreview(id); return; }
  const up=t.closest('[data-use-plate]'); if(up){ setPlate(up.dataset.usePlate); if(location.hash.startsWith('#/boutique')){ const y=scrollY; route(); scrollTo(0,y); } return; }
  const us=t.closest('[data-use-skin]'); if(us){ const id=us.dataset.useSkin; if(!SKINS[id]||!canUseSkin(id)) return; const y=scrollY;
    applySkin(id,true,{then:()=>{ route(); scrollTo(0,y); }}); DB.saveSkin(id); toast(`Thème ${SKINS[id].label} activé`); return; }
  if(t.closest('.skin-btn')){ location.hash='#/boutique'; } });

/* ---- Retour de paiement ---- */
function viewPayment(tx){
  const box=(h,p,act='')=>`<div class="wrap page"><div class="empty"><h3>${h}</h3><p class="muted">${p}</p>${act}</div></div>`;
  if(!tx){ app.innerHTML=box('Paiement interrompu','Aucun montant n\'a été débité. Tu peux réessayer depuis la boutique.','<a class="btn" href="#/boutique">Retour à la boutique</a>'); return; }
  if(!S.auth){ app.innerHTML=box('Connecte-toi','Connecte-toi avec le compte qui a fait l\'achat pour le récupérer.','<a class="btn btn-ac" href="#/connexion">Se connecter</a>'); return; }
  app.innerHTML=box('Vérification du paiement…','Ça prend quelques secondes.');
  let tries=0;
  const check=async()=>{
    if(!location.hash.startsWith('#/paiement')) return;
    if(!(DB.live&&DB.fns)){ if(tries++<10) return setTimeout(check,800); app.innerHTML=box('Vérification impossible','Recharge la page dans un instant.'); return; }
    try{ const r=(await DB.fns.httpsCallable('checkPayment')({tx})).data;
      if(r.status==='paid'){ await DB.loadPurchases(); const item=String(r.item||''), [k,id]=item.split(':'), inf=itemInfo(item);
        if(k==='theme'&&SKINS[id]){ applySkin(id,true); DB.saveSkin(id); } else if(k==='plate'&&PLATES[id]&&ownsPlate(id)) setPlate(id);
        app.innerHTML=box('Merci, c\'est débloqué !', k==='theme'?`Le thème ${esc(SKINS[id]?.label||id)} est à toi et vient d'être activé.`:k==='plate'?`La plaque ${esc(PLATES[id]?.label||id)} est à toi et vient d'être équipée.`:`${esc(inf?inf.title:'Ton achat')} : tout est à toi. Retrouve-le dans « Mes objets ».`,'<a class="btn btn-ac" href="#/boutique/objets">Voir mes objets</a>'); return; }
      if(r.status==='failed'){ app.innerHTML=box('Paiement non abouti','Le paiement a été refusé ou annulé. Rien n\'a été débloqué et rien n\'a été débité.','<a class="btn" href="#/boutique">Retour à la boutique</a>'); return; }
      if(r.status==='review'){ app.innerHTML=box('Paiement en vérification','Le montant reçu ne correspond pas au prix. La modération va vérifier : écris-nous via « Nous écrire » avec la référence '+esc(tx)+'.'); return; }
      if(tries++<8) return setTimeout(check,5000);
      app.innerHTML=box('Paiement en attente',`Si tu as validé le paiement sur ton téléphone, il sera pris en compte automatiquement dans quelques minutes. Référence : ${esc(tx)}`,'<button class="btn" type="button" onclick="route()">Vérifier à nouveau</button>');
    }catch(e){ app.innerHTML=box('Vérification impossible',esc((e&&e.message)||'Réessaie dans un instant.'),'<button class="btn" type="button" onclick="route()">Réessayer</button>'); }
  };
  check();
}
// Mode test : la « page de paiement » est un faux écran, clairement indiqué. Le serveur n'accepte ces faux paiements que d'un modérateur.
function viewFakePay(tx){
  if(!tx||!S.auth){ location.hash='#/boutique'; return; }
  app.innerHTML=`<div class="wrap page" style="max-width:560px"><div class="fakepay"><span class="fakepay-flag">Faux paiement · mode test</span><h2>Aucun argent n'est débité</h2>
    <p>Cette page remplace le prestataire de paiement tant qu'aucun n'est branché. Choisis ce que tu veux simuler.</p><p class="muted">Référence : ${esc(tx)}</p>
    <div class="fakepay-act"><button class="btn btn-ac" data-fake="paid">Simuler un paiement réussi</button><button class="btn" data-fake="failed">Simuler un paiement refusé</button><a class="btn btn-ghost" href="#/boutique">Abandonner</a></div>
    <p class="ferr" id="fake-err" role="alert"></p></div></div>`;

const SPLASH={ el:document.getElementById('splash'), t0:performance.now(), min:600, max:9000, on:true, armed:false, gaveUp:false, fonts:false, t1:0, t2:0, t3:0 };

function authErr(err){
  const c=err&&err.code||'';
  if(c==='auth/email-already-in-use') return {mail:'Un compte existe déjà avec cet e-mail.'};
  if(c==='auth/invalid-email') return {mail:'Adresse e-mail invalide.'};
  if(c==='auth/weak-password') return {pw:'Mot de passe trop faible.'};
  if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-login-credentials'].includes(c)) return {pw:'E-mail ou mot de passe incorrect.'};
  if(c==='auth/too-many-requests') return {pw:'Trop de tentatives. La connexion est bloquée un moment : réessaie plus tard ou utilise « Mot de passe oublié ».'};
  if(c==='auth/network-request-failed') return {mail:OFFLINE_MSG};
  if(c==='auth/user-disabled') return {mail:'Ce compte a été désactivé.'};
  return {pw:'Une erreur est survenue. Réessaie.'};
}
const MAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const OFFLINE_MSG="Coopô n'arrive pas à joindre ses serveurs. Vérifie ta connexion internet, puis réessaie.";
async function doSignup(){
  const name=aval('a-name'), mail=aval('a-mail').toLowerCase(), pw=document.getElementById('a-pw').value, dob=draft.dob, age=ageFrom(dob), e={};
  if(!new RegExp(`^[A-Za-z0-9_.-]{${CONFIG.minUsername},${CONFIG.maxUsername}}$`).test(name)) e.name=`${CONFIG.minUsername} à ${CONFIG.maxUsername} caractères : lettres, chiffres, _ . -`;
  else if(PLAYERS.some(p=>p.name.toLowerCase()===name.toLowerCase())) e.name="Ce nom d'utilisateur est déjà pris.";
  if(!MAIL_RE.test(mail)) e.mail='Entre une adresse e-mail valide.';
  if(pw.length<CONFIG.minPassword||!/[a-zA-Z]/.test(pw)||!/\d/.test(pw)) e.pw=`Au moins ${CONFIG.minPassword} caractères, avec une lettre et un chiffre.`;
  if(age===null) e.dob='Indique ta date de naissance.';
  else if(age<CONFIG.minAge) e.dob=`Tu dois avoir au moins ${CONFIG.minAge} ans pour utiliser Coopô.`;
  if(showErrs(e)) return;
  busy(true); SIGNUP={name,dob};
  try{
    if(AUTH_LIVE){
      if(!(await authReady())){ showErrs({mail:OFFLINE_MSG}); return; }
      const cred=await firebase.auth().createUserWithEmailAndPassword(mail,pw);
      await cred.user.updateProfile({ displayName:name });
      cred.user.sendEmailVerification().catch(e=>console.error(e));   // e-mail de vérification : confirme que l'adresse existe vraiment
      S.dobs[cred.user.uid]=dob; save();
      onSignedIn({ uid:cred.user.uid, name, email:mail, photo:'', provider:'password' });
    } else {
      if(S.accounts[mail]){ showErrs({mail:'Un compte existe déjà avec cet e-mail.'}); return; }
      const uid='local-'+mail; S.accounts[mail]={uid,name}; S.dobs[uid]=dob; save();
      onSignedIn({ uid, name, email:mail, photo:'', provider:'password' });
    }
  }catch(err){ if(!/^auth\//.test(String(err&&err.code))) console.error(err); showErrs(authErr(err)); }
  finally{ SIGNUP=null; busy(false); }
}
/* Trop d'essais de connexion ratés : on bloque la connexion à ce compte sur cet appareil pendant quelques heures.
   (Firebase bloque aussi de son côté les essais répétés, quel que soit l'appareil.) */
const LOGIN_MAX=5, LOGIN_LOCK_H=3, LOGIN_WINDOW_MIN=30;
const loginTries = () => { try{ return JSON.parse(localStorage.getItem('coopo_login_tries')||'{}')||{}; }catch(e){ return {}; } };
const loginTriesSave = t => { try{ localStorage.setItem('coopo_login_tries',JSON.stringify(t)); }catch(e){} };
function loginLockedUntil(mail){ const r=loginTries()[mail]; return r&&r.until>Date.now()?r.until:0; }
function loginLockMsg(until){ const min=Math.max(1,Math.ceil((until-Date.now())/60e3)); const h=Math.floor(min/60), m=min%60;
  return `Trop d'essais ratés. La connexion à ce compte est bloquée pendant encore ${[h?h+' h':'',m?m+' min':''].filter(Boolean).join(' ')}. Tu peux aussi utiliser « Mot de passe oublié ».`; }
function loginFailed(mail){ const t=loginTries(), now=Date.now(); let r=t[mail];
  if(!r||now-r.first>LOGIN_WINDOW_MIN*60e3) r={n:0,first:now,until:0};
  r.n++; if(r.n>=LOGIN_MAX){ r.until=now+LOGIN_LOCK_H*3600e3; r.n=0; r.first=now; }
  Object.keys(t).forEach(k=>{ if(k!==mail&&!(t[k].until>now)&&now-t[k].first>LOGIN_WINDOW_MIN*60e3) delete t[k]; });   // ménage des vieux compteurs
  t[mail]=r; loginTriesSave(t); return r; }
function loginOk(mail){ const t=loginTries(); if(t[mail]){ delete t[mail]; loginTriesSave(t); } }
async function doLogin(){
  const mail=aval('a-mail').toLowerCase(), pw=document.getElementById('a-pw').value, e={};
  if(!MAIL_RE.test(mail)) e.mail='Entre une adresse e-mail valide.';
  if(!pw) e.pw='Entre ton mot de passe.';
  if(showErrs(e)) return;
  const locked=loginLockedUntil(mail); if(locked){ showErrs({pw:loginLockMsg(locked)}); return; }
  busy(true);
  try{
    if(AUTH_LIVE){ if(!(await authReady())){ showErrs({mail:OFFLINE_MSG}); return; } await firebase.auth().signInWithEmailAndPassword(mail,pw); loginOk(mail); }
    else { const acc=S.accounts[mail]; if(!acc){ showErrs({mail:'Aucun compte avec cet e-mail.'}); return; }
      onSignedIn({ uid:acc.uid, name:acc.name, email:mail, photo:'', provider:'password' }); }
  }catch(err){ if(!/^auth\//.test(String(err&&err.code))) console.error(err);
    const c=String(err&&err.code||'');
    if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-login-credentials'].includes(c)){
      const r=loginFailed(mail);
      if(r.until>Date.now()){ showErrs({pw:loginLockMsg(r.until)}); return; }
      const left=LOGIN_MAX-r.n; showErrs({pw:`E-mail ou mot de passe incorrect.${left<=2?` Encore ${left} essai${left>1?'s':''} avant un blocage de ${LOGIN_LOCK_H} heures.`:''}`}); return; }
    showErrs(authErr(err)); }
  finally{ busy(false); }
}
async function forgotPw(){
  const mail=aval('a-mail').toLowerCase();
  if(!MAIL_RE.test(mail)){ showErrs({mail:'Entre ton e-mail pour recevoir un lien de réinitialisation.'}); return; }
  if(AUTH_LIVE){ if(!(await authReady())){ showErrs({mail:OFFLINE_MSG}); return; } try{ await firebase.auth().sendPasswordResetEmail(mail); }catch(e){} }
  toast(AUTH_LIVE?'Si un compte existe, un e-mail vient d\'être envoyé. Regarde aussi dans tes spams.':'Mode démo : aucun e-mail n\'est envoyé.',4000);
}

/* ---- Appels vocaux et vidéo ----
   Deux mates s'appellent directement, de téléphone à téléphone (WebRTC). Le son et l'image ne passent pas par Coopô.
   Pour se trouver, les deux téléphones s'échangent leurs réglages dans calls/{paire} :
     { parts, from, to, kind:'audio'|'video', status:'ringing'|'active'|'ended', offer, answer, at, why, endedBy }
   Un relais (réglé sur le serveur, page /turn) aide quand les deux réseaux ne se voient pas directement.
   Limite : l'appel ne sonne que si le mate a Coopô ouvert. */
const CALL_RING_S=40;

const canCall = () => !!(window.RTCPeerConnection&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
const PHONE_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>';
const CAM_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="13" height="12" rx="3"/><path d="M15.5 10.5l6-3.5v10l-6-3.5"/></svg>';
const HANG_SVG=PHONE_SVG.replace('<svg ','<svg style="transform:rotate(135deg)" ');
const callBtns = () => canCall()&&AUTH_LIVE ? `<div class="chat-calls"><button class="btn call-btn" type="button" data-call="audio" aria-label="Appel vocal" title="Appel vocal">${PHONE_SVG}</button><button class="btn call-btn" type="button" data-call="video" aria-label="Appel vidéo" title="Appel vidéo">${CAM_SVG}</button></div>` : '';
// Adresses qui aident les deux téléphones à se trouver. Sans relais réglé, on garde l'aide de base (suffit en Wi-Fi, pas toujours en 4G).
async function iceServers(){ const base=[{urls:'stun:stun.l.google.com:19302'}];
  try{ if(!SHOP.api) return base; const u=firebase.auth().currentUser; if(!u) return base; const tk=await u.getIdToken();
    const r=await Promise.race([fetch(SHOP.api.replace(/\/$/,'')+'/turn',{headers:{Authorization:'Bearer '+tk}}),new Promise((_,no)=>setTimeout(()=>no(new Error('lent')),4000))]);
    const j=await r.json(); if(r.ok&&Array.isArray(j.iceServers)&&j.iceServers.length) return j.iceServers; }catch(e){}
  return base; }
const iceDone = (pc,ms=2500) => new Promise(res=>{ if(pc.iceGatheringState==='complete') return res(); const t=setTimeout(res,ms);
  pc.addEventListener('icegatheringstatechange',()=>{ if(pc.iceGatheringState==='complete'){ clearTimeout(t); res(); } }); });
const callMedia = kind => navigator.mediaDevices.getUserMedia(kind==='video'?{audio:true,video:{facingMode:'user',width:{ideal:640},height:{ideal:480}}}:{audio:true});
const callMediaErr = (e,kind) => toast(e&&e.name==='NotAllowedError'?`Autorise le micro${kind==='video'?' et la caméra':''} dans ton navigateur pour appeler.`:`Le micro${kind==='video'?' ou la caméra':''} n'est pas disponible sur cet appareil.`,4500);
function callPc(c,servers){ const pc=c.pc=new RTCPeerConnection({iceServers:servers});
  c.stream.getTracks().forEach(t=>pc.addTrack(t,c.stream));
  pc.ontrack=e=>{ c.remote=e.streams[0]||new MediaStream([e.track]); callAttach(); };
  pc.onconnectionstatechange=()=>{ if(CALL!==c) return; const st=pc.connectionState;
    if(st==='connected'){ if(c.status!=='active'){ c.status='active'; c.t0=c.t0||Date.now(); clearTimeout(c.ringT); callRing(false); } c.lost=false; renderCall(); }
    else if(st==='disconnected'){ c.lost=true; renderCall(); }
    else if(st==='failed'){ endCall('fail'); } };

// Lancer un appel
async function startCall(id,kind){
  if(CALL){ toast('Tu es déjà en appel.'); return; }
  if(!canCall()){ toast("Les appels ne sont pas possibles sur ce navigateur."); return; }
  if(!DB.live&&!(await DB.ready())) return;
  if(!isMate(id)){ toast("Vous n'êtes pas encore mates."); return; }
  const c=CALL={id,pair:DB.pairId(id),role:'out',kind,at:Date.now(),status:'calling',muted:false,camOff:false}; renderCall();
  try{ c.stream=await callMedia(kind); }catch(e){ if(CALL===c){ closeCall(); callMediaErr(e,kind); } return; }
  if(CALL!==c){ c.stream.getTracks().forEach(t=>t.stop()); return; }
  callAttach();
  try{ const pc=callPc(c,await iceServers()); const offer=await pc.createOffer(); await pc.setLocalDescription(offer); await iceDone(pc); if(CALL!==c) return;
    const me=DB.uid(); await DB.db.collection('calls').doc(c.pair).set({parts:[me,id].sort(),from:me,to:id,kind,status:'ringing',offer:{type:'offer',sdp:pc.localDescription.sdp},at:c.at});
    if(CALL!==c) return; c.sent=true; c.status='ringing'; renderCall(); callRing(true,true);
    c.ringT=setTimeout(()=>{ if(CALL===c&&c.status!=='active') endCall('noanswer'); },CALL_RING_S*1000); }
  catch(e){ console.error(e); if(CALL===c){ closeCall(); toast("L'appel n'a pas pu démarrer. Réessaie dans un instant.",3500); } } }
// Répondre
async function acceptCall(){ const c=CALL; if(!c||c.role!=='in'||c.status!=='ringing') return; c.status='connecting'; callRing(false); renderCall();
  try{ c.stream=await callMedia(c.kind); }catch(e){ if(CALL===c){ endCall('refused'); callMediaErr(e,c.kind); } return; }
  if(CALL!==c){ c.stream.getTracks().forEach(t=>t.stop()); return; }
  callAttach();
  try{ const pc=callPc(c,await iceServers()); await pc.setRemoteDescription(c.offer); const ans=await pc.createAnswer(); await pc.setLocalDescription(ans); await iceDone(pc); if(CALL!==c) return;
    await DB.db.collection('calls').doc(c.pair).update({status:'active',answer:{type:'answer',sdp:pc.localDescription.sdp}});
    c.ringT=setTimeout(()=>{ if(CALL===c&&c.status!=='active') endCall('fail'); },20000); }
  catch(e){ console.error(e); if(CALL===c) endCall('fail'); } }
// Raccrocher, refuser, ou fin automatique. On prévient l'autre téléphone, puis on ferme tout.
const CALL_WHY={ hangup:'Appel terminé.', refused:'Appel refusé.', noanswer:'Pas de réponse.', busy:'Ton mate est déjà en appel.', fail:"La connexion n'a pas pu s'établir. Réessaie, si possible en Wi-Fi." };
function endCall(why){ const c=CALL; if(!c) return;
  if(c.role==='in'||c.sent) DB.db.collection('calls').doc(c.pair).update({status:'ended',why,endedBy:DB.uid()}).catch(e=>console.error(e));
  closeCall(c.role==='in'&&why==='refused'?'':c.role==='out'&&why==='hangup'&&c.status!=='active'?'Appel annulé.':CALL_WHY[why]||CALL_WHY.hangup); }
function closeCall(msg){ const c=CALL; if(!c) return; CALL=null; clearTimeout(c.ringT); clearInterval(c.tick); callRing(false);
  try{ c.stream&&c.stream.getTracks().forEach(t=>t.stop()); }catch(e){} try{ c.pc&&c.pc.close(); }catch(e){}
  const ov=document.getElementById('call-ov'); if(ov) ov.remove(); if(msg) toast(msg,3000); }
// Ce que dit le document d'appel (reçu en direct de la base)
function onCallDoc(pair,d){ if(!d) return; const me=DB.uid(), c=CALL;
  if(c&&c.pair===pair&&d.at===c.at){
    if(d.status==='ended'&&d.endedBy!==me){ closeCall(c.role==='in'&&c.status==='ringing'?'':CALL_WHY[d.why==='refused'||d.why==='busy'||d.why==='fail'?d.why:'hangup']); return; }
    if(c.role==='out'&&d.status==='active'&&d.answer&&!c.answered&&c.pc){ c.answered=true; callRing(false); c.status='connecting'; renderCall();
      c.pc.setRemoteDescription(d.answer).catch(e=>{ console.error(e); if(CALL===c) endCall('fail'); });
      clearTimeout(c.ringT); c.ringT=setTimeout(()=>{ if(CALL===c&&c.status!=='active') endCall('fail'); },20000); }
    return; }
  if(d.to!==me||d.status!=='ringing'||Math.abs(Date.now()-d.at)>CALL_RING_S*1000) return;   // pas pour moi, ou trop vieux
  if(c){ if(c.pair!==pair||c.at!==d.at) DB.db.collection('calls').doc(pair).update({status:'ended',why:'busy',endedBy:me}).catch(()=>{}); return; }
  if(!isMate(d.from)||!d.offer) return;
  const n=CALL={id:d.from,pair,role:'in',kind:d.kind==='video'?'video':'audio',at:d.at,status:'ringing',offer:d.offer,muted:false,camOff:false};
  n.ringT=setTimeout(()=>{ if(CALL===n&&n.status==='ringing') closeCall('Appel manqué.'); },Math.max(3000,CALL_RING_S*1000-(Date.now()-d.at)));
  renderCall(); callRing(true); }
// Sonnerie (petits bips) + vibration. Le navigateur peut refuser le son tant qu'on n'a pas touché l'écran : ce n'est pas grave.
let RING=null;
function callRing(on,soft){ if(RING){ clearInterval(RING.t); try{ RING.ctx.close(); }catch(e){} RING=null; try{ navigator.vibrate&&navigator.vibrate(0); }catch(e){} } if(!on) return;
  try{ const ctx=new (window.AudioContext||window.webkitAudioContext)(); const beep=()=>{ if(ctx.state==='suspended') return; [0,.28].forEach(d=>{ const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.value=soft?440:660; g.gain.value=soft?.04:.12; o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime+d); o.stop(ctx.currentTime+d+.2); }); if(!soft){ try{ navigator.vibrate&&navigator.vibrate([250,120,250]); }catch(e){} } };
    RING={ctx,t:setInterval(beep,soft?3000:1800)}; beep(); }catch(e){} }
// L'écran d'appel (posé par-dessus tout le site : il reste si on change de page)
function callAttach(){ const c=CALL; if(!c) return; const r=document.getElementById(c.kind==='video'?'call-remote':'call-audio'), l=document.getElementById('call-local');
  if(r&&c.remote&&r.srcObject!==c.remote){ r.srcObject=c.remote; r.play&&r.play().catch(()=>{}); } if(l&&c.stream&&l.srcObject!==c.stream){ l.srcObject=c.stream; l.play&&l.play().catch(()=>{}); } }
function renderCall(){ const c=CALL; if(!c) return; let ov=document.getElementById('call-ov'); if(!ov){ ov=document.createElement('div'); ov.id='call-ov'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-modal','true'); document.body.appendChild(ov); }
  const p=visible().find(x=>x.id===c.id)||S.profiles[c.id]||{id:c.id,name:'Ton mate'}, live=c.status==='active', video=c.kind==='video';
  const state=()=>c.lost?'Reconnexion…':live?vTime((Date.now()-c.t0)/1000):c.status==='calling'?'Préparation de l\'appel…':c.status==='connecting'?'Connexion…':c.role==='in'?(video?'Appel vidéo entrant':'Appel vocal entrant'):'Ça sonne…';
  const b=(act,cls,label,svg)=>`<button class="co-b ${cls}" type="button" data-co="${act}"><i>${svg}</i><span>${label}</span></button>`;
  ov.className=(video?'video':'audio')+(live?' live':''); ov.setAttribute('aria-label',`Appel avec ${p.name||'ton mate'}`);
  ov.innerHTML=`${video?`<video id="call-remote" autoplay playsinline></video><video id="call-local" autoplay playsinline muted${c.stream?'':' hidden'}></video>`:'<audio id="call-audio" autoplay></audio>'}
    <div class="co-who">${avatar(p,96)}<div><b>${esc(p.name||'Ton mate')}</b><div class="co-state" id="co-state" aria-live="polite">${state()}</div></div></div>
    <div class="co-btns">${c.role==='in'&&c.status==='ringing' ? b('no','end','Refuser',HANG_SVG)+b('yes','yes','Répondre',video?CAM_SVG:PHONE_SVG)
      : b('mute',c.muted?'off':'',c.muted?'Micro coupé':'Micro',MIC_SVG)+(video?b('cam',c.camOff?'off':'',c.camOff?'Caméra coupée':'Caméra',CAM_SVG):'')+b('end','end','Raccrocher',HANG_SVG)}</div>`;
  ov.querySelectorAll('[data-co]').forEach(x=>x.onclick=()=>{ const a=x.dataset.co;
    if(a==='yes') acceptCall(); else if(a==='no') endCall('refused'); else if(a==='end') endCall('hangup');
    else if(a==='mute'){ c.muted=!c.muted; c.stream&&c.stream.getAudioTracks().forEach(t=>t.enabled=!c.muted); renderCall(); }
    else if(a==='cam'){ c.camOff=!c.camOff; c.stream&&c.stream.getVideoTracks().forEach(t=>t.enabled=!c.camOff); renderCall(); } });
  callAttach(); clearInterval(c.tick); c.tick=setInterval(()=>{ const e=document.getElementById('co-state'); if(e&&CALL===c) e.textContent=state(); },1000); }
window.addEventListener('pagehide',()=>{ if(CALL) endCall('hangup'); });

/* ---- Messages vocaux ----
   Le son est enregistré par le téléphone (30 secondes maximum), puis rangé à part du message :
   chats/{paire}/voices/{id} ou groups/{groupe}/voices/{id} = { from, data, dur, at }.
   Le message lui-même ne garde que { id, dur } : le son n'est téléchargé que si on appuie sur lecture (ça économise la connexion). */
const VOICE_MAX=30, VOICE_TEXT='🎤 Message vocal', VOICE_RE=/^data:audio\/(webm|ogg|mp4|mpeg|aac|x-m4a)[;,]/, VOICE_LIMIT=680000;
const VOICES={};   // sons déjà chargés ou tout juste enregistrés (gardés en mémoire seulement)
const newId = () => { let s=''; const a='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'; for(let i=0;i<20;i++) s+=a[Math.random()*a.length|0]; return s; };
const canVoice = () => !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
const MIC_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const micBtn = () => canVoice() ? `<button class="btn mic-btn" type="button" id="micbtn" aria-label="Enregistrer un message vocal" title="Message vocal">${MIC_SVG}</button>` : '';
const vTime = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const voiceBubble = (v,kind,owner) => `<button type="button" class="voice-play${VPLAY&&VPLAY.id===v.id&&!VPLAY.audio.paused?' on':''}" data-voice="${esc(v.id)}" data-vk="${kind}" data-vo="${esc(owner)}" data-dur="${+v.dur||0}" aria-label="Écouter le message vocal (${vTime(+v.dur||0)})"><span class="v-ico"><svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg><svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></span><span class="v-bar"><i></i></span><span class="v-time">${vTime(+v.dur||0)}</span></button>`;
let REC=null;   // enregistrement en cours
function stopRec(send){ const r=REC; if(!r) return; REC=null; clearInterval(r.tick); r.send=send; try{ if(r.mr.state!=='inactive') r.mr.stop(); else r.finish(); }catch(e){ r.finish(); } }
async function recordVoice(onDone){
  if(REC) return; const form=document.getElementById('chatform'); if(!form) return;
  let stream; try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ toast(e&&e.name==='NotAllowedError'?'Autorise le micro dans ton navigateur pour envoyer un message vocal.':"Le micro n'est pas disponible sur cet appareil.",4000); return; }
  if(!document.body.contains(form)){ stream.getTracks().forEach(t=>t.stop()); return; }   // le joueur a quitté la conversation entre-temps
  const type=['audio/webm;codecs=opus','audio/mp4','audio/ogg;codecs=opus','audio/webm'].find(t=>{ try{ return MediaRecorder.isTypeSupported(t); }catch(e){ return false; } });
  let mr; try{ mr=new MediaRecorder(stream,type?{mimeType:type,audioBitsPerSecond:24000}:{audioBitsPerSecond:24000}); }catch(e){ try{ mr=new MediaRecorder(stream); }catch(x){ stream.getTracks().forEach(t=>t.stop()); toast("L'enregistrement n'est pas possible sur cet appareil."); return; } }
  const chunks=[], t0=Date.now(), bar=document.createElement('div'); bar.className='rec-bar';
  bar.innerHTML=`<i class="rec-dot" aria-hidden="true"></i><b aria-live="off">0:00 / ${vTime(VOICE_MAX)}</b><button class="btn btn-sm btn-ghost" type="button" data-rec="0">Annuler</button><button class="btn btn-sm btn-ac" type="button" data-rec="1">Envoyer</button>`;
  form.classList.add('rec'); form.appendChild(bar);
  const r=REC={mr,send:false,tick:0};
  r.finish=()=>{ stream.getTracks().forEach(t=>t.stop()); bar.remove(); form.classList.remove('rec');
    if(!r.send) return; const dur=Math.min(VOICE_MAX,Math.max(1,Math.round((r.t1-t0)/1000)));
    if(r.t1-t0<700||!chunks.length){ toast('Message trop court.'); return; }
    const fr=new FileReader(); fr.onerror=()=>toast("Le message vocal n'a pas pu être préparé.");
    fr.onload=()=>{ const data=String(fr.result||''); if(!VOICE_RE.test(data)){ toast("Ce format de son n'est pas pris en charge."); return; }
      if(data.length>VOICE_LIMIT){ toast('Message vocal trop lourd : fais-le un peu plus court.'); return; } onDone({data,dur}); };
    fr.readAsDataURL(new Blob(chunks,{type:(mr.mimeType||type||'audio/webm').split(';')[0]})); };
  mr.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  mr.onstop=()=>{ r.t1=r.t1||Date.now(); r.finish(); }; mr.onerror=()=>{ r.send=false; r.t1=Date.now(); if(REC===r){ REC=null; clearInterval(r.tick); } r.finish(); };
  bar.querySelector('[data-rec="0"]').onclick=()=>{ r.t1=Date.now(); stopRec(false); };
  bar.querySelector('[data-rec="1"]').onclick=()=>{ r.t1=Date.now(); stopRec(true); };
  r.tick=setInterval(()=>{ const s=(Date.now()-t0)/1000; const b=bar.querySelector('b'); if(b) b.textContent=`${vTime(s)} / ${vTime(VOICE_MAX)}`;
    if(s>=VOICE_MAX){ r.t1=Date.now(); stopRec(true); } else if(!document.body.contains(form)){ r.t1=Date.now(); stopRec(false); } },250);
  try{ mr.start(); }catch(e){ r.t1=Date.now(); stopRec(false); toast("L'enregistrement n'a pas pu démarrer."); }
}
window.addEventListener('hashchange',()=>{ if(REC){ REC.t1=Date.now(); stopRec(false); } if(VPLAY){ try{ VPLAY.audio.pause(); }catch(e){} VPLAY=null; } });
// Lecture : le son est téléchargé au premier appui, puis gardé en mémoire
let VPLAY=null;
const vBtn = id => document.querySelector(`.voice-play[data-voice="${CSS.escape(id)}"]`);
document.addEventListener('click',async e=>{ const b=e.target.closest('.voice-play'); if(!b) return; const id=b.dataset.voice;
  if(VPLAY&&VPLAY.id===id){ if(VPLAY.audio.paused){ VPLAY.audio.play().catch(()=>{}); } else VPLAY.audio.pause(); return; }
  if(VPLAY){ try{ VPLAY.audio.pause(); }catch(x){} const o=vBtn(VPLAY.id); if(o){ o.classList.remove('on'); o.querySelector('.v-bar i').style.width='0'; } VPLAY=null; }
  if(b.dataset.busy) return; b.dataset.busy='1'; const data=await DB.loadVoice(b.dataset.vk,b.dataset.vo,id); delete b.dataset.busy; { const nb=vBtn(id); if(nb) delete nb.dataset.busy; }
  if(!data||!VOICE_RE.test(data)){ toast("Ce message vocal n'est plus disponible."); return; }
  const audio=new Audio(data), me={id,audio}; VPLAY=me; const dur=+b.dataset.dur||0;
  const sync=()=>{ const x=vBtn(id); if(!x) return; x.classList.toggle('on',VPLAY===me&&!audio.paused); const d=isFinite(audio.duration)&&audio.duration>0?audio.duration:dur; x.querySelector('.v-bar i').style.width=(d?Math.min(100,audio.currentTime/d*100):0)+'%'; };
  audio.ontimeupdate=audio.onplay=audio.onpause=sync;
  audio.onended=()=>{ if(VPLAY===me) VPLAY=null; const x=vBtn(id); if(x){ x.classList.remove('on'); x.querySelector('.v-bar i').style.width='0'; } };
  audio.onerror=()=>{ if(VPLAY===me) VPLAY=null; sync(); toast('Ce téléphone ne peut pas lire ce message vocal.'); };
  audio.play().catch(()=>{}); });

const msgWarn = m => m.from==='me' ? '' : hasPhone(m.text) ? '<em class="bubble-warn">Prudence : ne partage ton numéro qu\'avec quelqu\'un que tu connais vraiment.</em>'

/* =========================================================
   FLAMMES : deux mates qui s'écrivent chaque jour gardent une flamme 🔥 (comme sur Snapchat ou TikTok)
   Firestore : streaks/{uidA_uidB} = { members:[a,b], last:{uid:jour}, both:jour, count:n }
   - « jour » = numéro du jour à l'heure d'Abidjan (UTC, pas de changement d'heure). C'est l'heure du SERVEUR qui compte :
     les règles Firestore refusent toute écriture qui ne correspond pas au jour réel, et n'acceptent une écriture
     que dans le même envoi qu'un vrai message. On ne peut donc pas tricher en changeant l'heure de son téléphone.
   - both = dernier jour où les DEUX ont écrit ; count = nombre de jours d'affilée à ce moment-là.
   ========================================================= */
const FLAME_STEPS=[10,30,100,365], FLAME_FROM=2, FLAME_WARN_HOUR=18;   // la flamme s'affiche à partir de 2 jours ; sablier à partir de 18 h si la journée n'est pas validée
let DAY_SHIFT=0;   // si l'horloge du téléphone est fausse, le serveur refuse la flamme : on se recale d'un jour (voir DB.sendMessage)
const dayNow = () => Math.floor(Date.now()/86400000)+DAY_SHIFT;
function flameState(id){ const s=(S.streaks||{})[id]; if(!s||!AUTH_LIVE) return null; const t=dayNow(), me=DB.uid();
  const alive=s.both>=t-1&&s.count>0, done=s.both===t, mine=(s.last||{})[me]===t, his=(s.last||{})[id]===t;
  return { count:alive?s.count:0, alive, done, mine, his, warn:alive&&!done&&new Date().getUTCHours()>=FLAME_WARN_HOUR }; }
function flameTag(id){ const f=flameState(id); if(!f||f.count<FLAME_FROM) return '';
  return `<span class="flame${f.warn?' warn':''}" title="${f.count} jours d'affilée${f.warn?' · elle va s\'éteindre à minuit':''}">${f.warn?'⏳':'🔥'}<b>${f.count}</b></span>`; }
// Phrase d'état sous une conversation
function flameHint(id,name){ const f=flameState(id); if(!f) return '';
  if(f.count>=FLAME_FROM&&!f.done) return `${f.warn?'⏳':'🔥'} ${f.mine?`${esc(name)} doit t'écrire`:f.his?'Réponds':'Écrivez-vous tous les deux'} avant minuit (heure d'Abidjan) pour garder votre flamme de ${f.count} jours.`;
  if(f.count>=FLAME_FROM) return `🔥 ${f.count} jours d'affilée. C'est validé pour aujourd'hui.`;
  if(f.count===1&&!f.done) return `Écrivez-vous encore aujourd'hui tous les deux pour allumer une flamme 🔥`;
  return ''; }
// Palier atteint (10, 30, 100, 365 jours) : petite fête, et la plaque du palier est offerte
function flameMilestone(id){ const s=(S.streaks||{})[id]; if(!s||s.both<dayNow()-1) return; const p=PLAYERS.find(x=>x.id===id);
  S.flameSeen=S.flameSeen||{}; const seen=S.flameSeen[id]||0, step=FLAME_STEPS.filter(n=>s.count>=n).pop(); if(!step) return;
  FLAME_STEPS.filter(n=>n<=step).forEach(n=>{ if(!ownsPlate('flamme'+n)||isAdmin()) DB.grantPlate('flamme'+n, DB.pairId(id)); });   // la plaque gagnée (les règles vérifient la flamme)
  if(seen>=step) return; S.flameSeen[id]=step; save();
  if(s.count!==step||!DB._streakReady) return;   // on ne fête que le jour même du palier
  setTimeout(()=>{ try{ burst(innerWidth/2,innerHeight*.4); }catch(e){}
    modal(`<div class="flame-party"><span class="flame-big" aria-hidden="true">🔥</span><h3>${step} jours d'affilée${p?` avec ${esc(p.name)}`:''} !</h3>
      <p class="muted">Vous vous êtes écrit chaque jour pendant ${step} jours. La plaque <b>${np({plate:'flamme'+step,name:PLATES['flamme'+step].label})}</b> est à vous deux.</p></div>
      <div class="dlg-actions"><button class="btn btn-ghost" data-close>Plus tard</button><a class="btn btn-ac" href="#/boutique/objets" data-close>Voir ma plaque</a></div>`); },600); }
// Rappel : une flamme va s'éteindre et c'est à moi d'écrire (une fois par jour et par mate, quand Coopô est ouvert)
function flameCheck(){ if(!AUTH_LIVE||!S.me||new Date().getUTCHours()<FLAME_WARN_HOUR) return; const t=dayNow(); S.flameNudged=S.flameNudged||{};
  Object.keys(S.streaks||{}).forEach(id=>{ const f=flameState(id), p=PLAYERS.find(x=>x.id===id); if(!f||!p||!isMate(id)||f.count<FLAME_FROM||f.done||f.mine||S.flameNudged[id]===t) return;
    S.flameNudged[id]=t; const n={type:'flame',from:id,text:`⏳ Ta flamme de ${f.count} jours avec ${p.name} s'éteint à minuit : écris-lui !`};
    notify({...n,toast:location.hash!=='#/messages/'+id}); deviceNotify(n); }); save(); }
setInterval(flameCheck,20*60e3);   // tourne aussi quand l'appli est en arrière-plan : c'est là que la notification du téléphone sert

/* =========================================================
   GROUPES : des salons permanents avec discussion en temps réel
   Firestore : groups/{id} = { name, desc, game, image, private, owner, mods[], members[], invited[], kicked[], ageGroup, at, lastAt }
               groups/{id}/messages/{id} = { from, text, at }
   - Rôles : créateur (admin), modérateurs, membres. Seuls les membres lisent les messages (règles Firestore).
   - 50 membres maximum par groupe, pour rester dans la formule gratuite de Firebase.
   - Comme partout sur Coopô, les 13-17 ans et les adultes ont des groupes séparés.
   ========================================================= */
const GROUP_MAX=50, GROUP_OWN_MAX=3;
let GROUPS=[];   // groupes visibles : les miens, ceux où je suis invité, les groupes publics de ma tranche d'âge
const normG = g => { ['mods','members','invited','kicked'].forEach(k=>{ if(!Array.isArray(g[k])) g[k]=[]; }); g.name=String(g.name||'Groupe'); g.private=!!g.private; return g; };
const tsMs = v => v&&typeof v.toMillis==='function' ? v.toMillis() : (+v||0);
const gById = id => GROUPS.find(g=>g.id===id);
const gIn = g => !!g && g.members.includes(myId());
const gRole = (g,uid) => g.owner===uid?'admin':(g.mods||[]).includes(uid)?'mod':'';
const gCanMod = g => gIn(g) && !!gRole(g,myId());
const gUnread = g => gIn(g) && tsMs(g.lastAt) > ((S.gseen||{})[g.id]||0);
const gPlayer = uid => uid===myId() ? publicMe() : PLAYERS.find(p=>p.id===uid);
function gAvatar(g,size=48){ if(g.image&&g.ageGroup!=='minor'&&/^data:image\/(png|jpeg|webp);base64,/.test(g.image)) return `<img class="av g-av" src="${esc(g.image)}" alt="" width="${size}" height="${size}" style="width:${size}px;height:${size}px">`;
  let h=0; for(const c of String(g.id)) h=(h*31+c.charCodeAt(0))%360;
  return `<span class="av g-av" aria-hidden="true" style="width:${size}px;height:${size}px;--h:${h};font-size:${Math.round(size*.36)}px">${esc((g.name||'?').slice(0,2).toUpperCase())}</span>`; }
const ROLE_TAG={ admin:'<em class="g-role admin">Admin</em>', mod:'<em class="g-role">Modo</em>' };
const groupRow = g => `<a class="chat-row${gUnread(g)?' unread':''}" href="#/groupe/${esc(g.id)}">${gAvatar(g,52)}<div><b><span class="g-name">${esc(g.name)}</span>${g.private?' <span class="g-lock" title="Groupe privé">'+LOCK_SVG+'</span>':''}</b><span class="muted">${esc(g.game||'Tous les jeux')} · ${g.members.length} membre${g.members.length>1?'s':''}</span></div>${gUnread(g)?'<span class="badge static" aria-label="Nouveaux messages">•</span>':''}</a>`;

function viewGroupsList(){
  const mine=GROUPS.filter(gIn).sort((a,b)=>tsMs(b.lastAt||b.at)-tsMs(a.lastAt||a.at)), inv=GROUPS.filter(g=>!gIn(g)&&(g.invited||[]).includes(myId())),
    pub=GROUPS.filter(g=>!gIn(g)&&!g.private&&!(g.invited||[]).includes(myId())&&!(g.kicked||[]).includes(myId())&&!S.blocked.includes(g.owner)).sort((a,b)=>b.members.length-a.members.length);
  app.innerHTML=`<div class="wrap page">${backLink('#/messages','Messages')}<div class="page-head"><div><h2>Groupes</h2><p>Des salons pour discuter à plusieurs, par jeu ou entre amis.</p></div>${S.me?'<button class="btn btn-ac" id="newgrp">Créer un groupe</button>':''}</div>
    ${inv.length?`<h3 class="on-world g-h">Invitations</h3><div class="chat-list">${inv.map(g=>`<div class="chat-row g-inv">${gAvatar(g,52)}<div><b>${esc(g.name)}</b><span class="muted">${esc(g.game||'Tous les jeux')} · ${g.members.length} membre${g.members.length>1?'s':''}</span></div><span class="nact"><button class="btn btn-sm btn-ac" data-gjoin="${esc(g.id)}">Rejoindre</button><button class="btn btn-sm btn-ghost" data-gdecline="${esc(g.id)}">Refuser</button></span></div>`).join('')}</div>`:''}
    <h3 class="on-world g-h">Mes groupes</h3>
    ${mine.length?`<div class="chat-list">${mine.map(groupRow).join('')}</div>`:'<div class="empty"><h3>Tu n\'es dans aucun groupe</h3><p class="muted">Crée le tien et invite tes mates, ou rejoins un groupe public.</p></div>'}
    <h3 class="on-world g-h">Groupes publics</h3>
    ${pub.length?`<div class="grid">${pub.slice(0,40).map((g,i)=>`<article class="mcard g-card" style="--i:${i};--c:var(--pk)"><div class="g-card-head">${gAvatar(g,56)}<div><h3>${esc(g.name)}</h3><span class="muted">${esc(g.game||'Tous les jeux')} · ${g.members.length}/${GROUP_MAX}</span></div></div>
      ${g.desc?`<p class="muted g-desc">${esc(g.desc)}</p>`:''}<div class="sq-act">${g.members.length>=GROUP_MAX?'<span class="muted">Complet</span>':`<button class="btn btn-sm btn-ac" data-gjoin="${esc(g.id)}">Rejoindre</button>`}</div></article>`).join('')}</div>`
      :'<p class="on-world">Aucun autre groupe public pour le moment.</p>'}</div>`;
  document.getElementById('newgrp')?.addEventListener('click',()=>groupForm());
  app.querySelectorAll('[data-gjoin]').forEach(b=>b.onclick=async()=>{ b.disabled=true; if(await DB.joinGroup(b.dataset.gjoin)){ toast('Tu as rejoint le groupe'); location.hash='#/groupe/'+b.dataset.gjoin; } else b.disabled=false; });
  app.querySelectorAll('[data-gdecline]').forEach(b=>b.onclick=async()=>{ await DB.declineGroup(b.dataset.gdecline); viewGroupsList(); });
}
// Créer ou modifier un groupe (g = groupe à modifier)
function groupForm(g){
  const isNew=!g, minor=myGroupNow()==='minor';
  if(isNew && GROUPS.filter(x=>x.owner===myId()).length>=GROUP_OWN_MAX){ toast(`Tu peux créer ${GROUP_OWN_MAX} groupes au maximum.`); return; }
  let image=g?g.image||'':'';
  const games=[...new Set([...(S.me.games||[]),...GAMES])];
  modal(`<h3>${isNew?'Créer un groupe':'Modifier le groupe'}</h3><div class="form" style="margin-top:12px">
    <div class="field"><label for="g-n">Nom du groupe</label><input id="g-n" type="text" maxlength="40" value="${esc(g?g.name:'')}" placeholder="ex. Les lions de Free Fire"></div>
    ${minor?'':`<div class="field"><span class="lbl">Image (facultatif)</span><div class="g-img-row"><span id="g-prev">${gAvatar({id:g?g.id:'nouveau',name:g?g.name:'?',image},56)}</span><label class="btn btn-sm" for="g-img">Choisir une image</label><input id="g-img" type="file" accept="image/*" hidden>${image?'<button class="btn btn-sm btn-ghost" type="button" id="g-noimg">Retirer</button>':''}</div></div>`}
    <div class="field"><label for="g-g">Jeu associé</label><select id="g-g"><option value="">Tous les jeux</option>${games.map(x=>`<option value="${esc(x)}" ${g&&g.game===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
    <div class="field"><label for="g-d">Description (facultatif)</label><textarea id="g-d" rows="3" maxlength="300" placeholder="De quoi parle-t-on ici ? Les règles du groupe…">${esc(g?g.desc||'':'')}</textarea></div>
    <div class="field"><span class="lbl">Qui peut entrer ?</span><div class="radio-list"><label><input type="radio" name="g-p" value="0" ${g&&g.private?'':'checked'}> Public : tout le monde peut le trouver et le rejoindre</label><label><input type="radio" name="g-p" value="1" ${g&&g.private?'checked':''}> Privé : seulement sur invitation</label></div></div>
    <p class="ferr" id="g-e" role="alert"></p></div>
    <div class="dlg-actions"><button class="btn btn-ghost" data-close>Annuler</button><button class="btn btn-ac" id="g-ok">${isNew?'Créer le groupe':'Enregistrer'}</button></div>`, d=>{
    const fi=d.querySelector('#g-img'); if(fi) fi.onchange=()=>{ const f=fi.files&&fi.files[0]; if(!f||!f.type.startsWith('image/')) return; const img=new Image(), url=URL.createObjectURL(f);
      img.onload=()=>{ const c=document.createElement('canvas'); c.width=c.height=160; const x=c.getContext('2d'), m=Math.min(img.width,img.height); x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,160,160);
        image=c.toDataURL('image/jpeg',.7); URL.revokeObjectURL(url); d.querySelector('#g-prev').innerHTML=gAvatar({id:'x',name:'?',image},56); }; img.src=url; };
    const ni=d.querySelector('#g-noimg'); if(ni) ni.onclick=()=>{ image=''; d.querySelector('#g-prev').innerHTML=gAvatar({id:g.id,name:g.name,image:''},56); ni.remove(); };
    d.querySelector('#g-ok').onclick=async ev=>{ const b=ev.currentTarget, err=d.querySelector('#g-e'), name=d.querySelector('#g-n').value.trim().replace(/\s+/g,' ');
      if(name.length<3){ err.textContent='Donne un nom d\'au moins 3 caractères à ton groupe.'; return; }
      if(hasPhone(name)||hasLink(name)){ err.textContent='Pas de numéro ni de lien dans le nom du groupe.'; return; }
      const data={ name, desc:d.querySelector('#g-d').value.trim().slice(0,300), game:d.querySelector('#g-g').value, image:minor?'':image, private:d.querySelector('[name=g-p]:checked').value==='1' };
      b.disabled=true;
      if(isNew){ const id=await DB.createGroup(data); if(id){ d.close(); toast('Groupe créé'); location.hash='#/groupe/'+id; } else { b.disabled=false; err.textContent='Le groupe n\'a pas pu être créé. Vérifie ta connexion et réessaie.'; } }
      else if(await DB.updateGroup(g.id,data)){ d.close(); toast('Groupe modifié'); route(); } else { b.disabled=false; err.textContent='Les changements n\'ont pas pu être enregistrés.'; } }; }); }
// La page d'un groupe : discussion en temps réel
function viewGroup(id){
  if(dataPending()) return loadingView('Groupe');
  if(!S.me) return needProfile('Groupes');
  const g=gById(id);
  if(!g){ app.innerHTML=`<div class="wrap page"><div class="empty"><h3>Ce groupe n'est pas disponible</h3><p class="muted">Il a peut-être été supprimé, ou il est privé.</p><a class="btn" href="#/groupes/groupes">Voir les groupes</a></div></div>`;
    if(!viewGroup._tried){ viewGroup._tried=true; DB.loadGroups(true).then(()=>{ if(location.hash==='#/groupe/'+id) route(); }); } return; }
  viewGroup._tried=false;
  if(!gIn(g)){ const invited=(g.invited||[]).includes(myId());
    app.innerHTML=`<div class="wrap page" style="max-width:720px">${backLink('#/groupes/groupes','Groupes')}<section class="panel g-join">${gAvatar(g,88)}<h2>${esc(g.name)}</h2><p class="muted">${esc(g.game||'Tous les jeux')} · ${g.members.length} membre${g.members.length>1?'s':''} · ${g.private?'privé':'public'}</p>${g.desc?`<p>${esc(g.desc)}</p>`:''}
      ${(g.kicked||[]).includes(myId())?'<p class="muted">Tu ne peux plus rejoindre ce groupe.</p>':g.members.length>=GROUP_MAX?'<p class="muted">Ce groupe est complet.</p>':(!g.private||invited)?'<button class="btn btn-ac" id="gjoin">Rejoindre le groupe</button>':'<p class="muted">Ce groupe est privé : il faut une invitation.</p>'}</section></div>`;
    document.getElementById('gjoin')?.addEventListener('click',async ev=>{ ev.currentTarget.disabled=true; if(await DB.joinGroup(id)){ toast('Tu as rejoint le groupe'); route(); } else ev.currentTarget.disabled=false; }); return; }
  (S.gseen=S.gseen||{})[id]=Date.now(); save();
  app.innerHTML=`<div class="dm-shell">${dmSide('g:'+id)}<div class="wrap page chat-page"><div class="chat-head">${backLink('#/groupes/groupes','Groupes')}<button class="chat-who g-who" type="button" id="ginfo">${gAvatar(g,44)}<div><b>${esc(g.name)}</b><span class="muted" style="font-size:12px">${g.members.length} membre${g.members.length>1?'s':''} · infos</span></div></button></div>
    <div class="chat-box" id="chatbox"><p class="muted" style="margin:auto">Chargement des messages…</p></div>
    <form class="chat-form" id="chatform"><input type="text" id="chatin" placeholder="Écris au groupe…" maxlength="500" autocomplete="off">${micBtn()}<button class="btn btn-ac" type="submit">Envoyer</button></form></div></div>`;
  dmFit(); document.getElementById('ginfo').onclick=()=>groupInfo(id);
  document.getElementById('micbtn')?.addEventListener('click',()=>recordVoice(v=>{ const vid=newId(); VOICES[vid]=v.data; DB.sendGroupMessage(id,VOICE_TEXT,{id:vid,dur:v.dur}); }));
  try{ const cb=document.getElementById('chatbox'); if(cb&&'ResizeObserver' in window) new ResizeObserver(()=>{ cb.scrollTop=cb.scrollHeight; }).observe(cb); }catch(e){}
  document.getElementById('chatform').addEventListener('submit',e=>{ e.preventDefault(); const i=document.getElementById('chatin'), t=i.value.trim(); if(!t) return;
    if(myGroupNow()==='minor'&&hasPhone(t)){ toast('Pour ta sécurité, les numéros de téléphone ne peuvent pas être envoyés ici.'); return; }
    i.value=''; DB.sendGroupMessage(id,t); });
  DB.fetchPlayers(g.members).then(ch=>{ if(ch&&location.hash==='#/groupe/'+id) renderGroupChat(id); }).catch(()=>{});
  DB.listenGroup(id,()=>{ if(location.hash==='#/groupe/'+id){ (S.gseen=S.gseen||{})[id]=Date.now(); renderGroupChat(id); } });
}
let GMSGS={};   // messages du groupe ouvert
function renderGroupChat(id){ const box=document.getElementById('chatbox'), g=gById(id); if(!box||!g) return; const me=myId(), msgs=(GMSGS[id]||[]).filter(m=>!S.blocked.includes(m.from)), canDel=gCanMod(g);
  box.innerHTML = msgs.length ? msgs.map((m,k)=>{ const mine=m.from===me, p=gPlayer(m.from), same=k>0&&msgs[k-1].from===m.from&&m.at-msgs[k-1].at<5*60e3, role=gRole(g,m.from);
      return `<div class="gmsg${mine?' me':''}${same?' same':''}">${mine?'':(same?'<i class="g-gap"></i>':(p?`<a href="#/joueur/${esc(m.from)}">${avatar(p,32)}</a>`:'<span class="av" style="width:32px;height:32px;--h:220">?</span>'))}<div>${same||mine?'':`<small class="g-from">${p?np(p):'Ancien membre'}${ROLE_TAG[role]||''}</small>`}
        <div class="bubble ${mine?'me':''}">${m.voice?voiceBubble(m.voice,'g',id):`<span>${esc(m.text)}</span>${mine?'':msgWarn({from:m.from,text:m.text})}`}<small>${ago(m.at)}${(canDel||mine)&&m.id?` · <button type="button" class="g-del" data-gdel="${esc(m.id)}">Supprimer</button>`:''}</small></div></div></div>`; }).join('')
    : `<div class="chat-empty"><p class="muted">Le groupe est tout neuf. Lance la discussion 👋</p></div>`;
  box.scrollTop=box.scrollHeight;
  box.querySelectorAll('[data-gdel]').forEach(b=>b.onclick=()=>DB.deleteGroupMessage(id,b.dataset.gdel)); }
// Infos du groupe : membres, rôles, invitations, réglages
function groupInfo(id){ const g=gById(id); if(!g) return; const me=myId(), role=gRole(g,me), admin=role==='admin';
  const order=u=>u===g.owner?0:(g.mods||[]).includes(u)?1:2, mem=[...g.members].sort((a,b)=>order(a)-order(b));
  modal(`<div class="g-info-head">${gAvatar(g,64)}<div><h3>${esc(g.name)}</h3><span class="muted">${esc(g.game||'Tous les jeux')} · ${g.private?'privé':'public'} · ${g.members.length}/${GROUP_MAX} membres</span></div></div>
    ${g.desc?`<p class="g-desc">${esc(g.desc)}</p>`:''}
    <div class="g-acts">${g.members.length<GROUP_MAX?'<button class="btn btn-sm btn-ac" id="g-invite">Inviter des mates</button>':''}${admin?'<button class="btn btn-sm" id="g-edit">Modifier</button>':''}</div>
    <b class="g-sub">Membres</b><div class="g-members">${mem.map(u=>{ const p=gPlayer(u), r=gRole(g,u), isMe=u===me;
      const acts = isMe||u===g.owner ? '' : admin ? `<button class="linkbtn" data-gmod="${esc(u)}">${r==='mod'?'Retirer modo':'Nommer modo'}</button><button class="linkbtn" data-gkick="${esc(u)}">Retirer</button>` : (role==='mod'&&!r) ? `<button class="linkbtn" data-gkick="${esc(u)}">Retirer</button>` : '';
      return `<div class="nrow">${p?avatar(p,40):'<span class="av" style="width:40px;height:40px;--h:220">?</span>'}<div><b>${p?np(p):'Joueur'}${ROLE_TAG[r]||''}${isMe?' <span class="muted">(toi)</span>':''}</b>${p&&!isMe?`<a class="muted" href="#/joueur/${esc(u)}" data-close>Voir le profil</a>`:''}</div><div class="nact">${acts}</div></div>`; }).join('')}</div>
    <div class="dlg-actions">${admin?'<button class="btn btn-danger" id="g-del">Supprimer le groupe</button>':'<button class="btn btn-ghost" id="g-leave">Quitter le groupe</button>'}<button class="btn" data-close>Fermer</button></div>`, d=>{
    const re=()=>{ if(location.hash==='#/groupe/'+id){ route(); groupInfo(id); } };
    d.querySelector('#g-invite')?.addEventListener('click',()=>groupInvite(id));
    d.querySelector('#g-edit')?.addEventListener('click',()=>groupForm(g));
    d.querySelectorAll('[data-gkick]').forEach(b=>b.onclick=async()=>{ if(!b.dataset.sure){ b.dataset.sure=1; b.textContent='Confirmer ?'; return; } b.disabled=true; if(await DB.kickFromGroup(id,b.dataset.gkick)){ toast('Membre retiré du groupe'); re(); } else b.disabled=false; });
    d.querySelectorAll('[data-gmod]').forEach(b=>b.onclick=async()=>{ b.disabled=true; const on=!(g.mods||[]).includes(b.dataset.gmod); if(await DB.setGroupMod(id,b.dataset.gmod,on)){ toast(on?'Modérateur nommé':'Modérateur retiré'); re(); } else b.disabled=false; });
    d.querySelector('#g-leave')?.addEventListener('click',async ev=>{ const b=ev.currentTarget; if(!b.dataset.sure){ b.dataset.sure=1; b.textContent='Confirmer : quitter'; return; } b.disabled=true; if(await DB.leaveGroup(id)){ d.close(); toast('Tu as quitté le groupe'); location.hash='#/groupes/groupes'; } else b.disabled=false; });
    d.querySelector('#g-del')?.addEventListener('click',async ev=>{ const b=ev.currentTarget; if(!b.dataset.sure){ b.dataset.sure=1; b.textContent='Confirmer : tout supprimer'; return; } b.disabled=true; b.textContent='Suppression…'; if(await DB.deleteGroup(id)){ d.close(); toast('Groupe supprimé'); location.hash='#/groupes/groupes'; } else { b.disabled=false; b.textContent='Supprimer le groupe'; } }); }); }
function groupInvite(id){ const g=gById(id); if(!g) return; const can=matesList().filter(p=>!g.members.includes(p.id)&&!(g.kicked||[]).includes(p.id)), left=GROUP_MAX-g.members.length;
  modal(`<h3>Inviter des mates</h3><p class="muted">${can.length?`Ils recevront une invitation pour rejoindre « ${esc(g.name)} ».`:'Tous tes mates sont déjà dans ce groupe, ou tu n\'as pas encore de mates.'}</p>

/* =========================================================
   COMMUNAUTÉ : annonces « Je cherche » et tournois
   Firestore : boards/{adult|minor}/annonces/{id} et boards/{adult|minor}/tournois/{id}

const myGroupNow = () => S.me&&S.me.dob ? ageGroup(S.me) : 'adult';
const myId = () => DB.live ? DB.uid() : 'me';
const fmtDay = ts => new Date(ts).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})+' · '+new Date(ts).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
function boardHead(tab,sub,action){
  const nA=annoncesAll().length, nT=tournoisAll().filter(t=>t.status==='open'&&t.date>Date.now()).length;
  const T=[['annonces','Annonces',nA],['sessions','Sessions',0],['tournois','Tournois',nT]];   // les groupes ont quitté la Communauté : on les trouve dans Messages
  return `<div class="page-head"><div><h2>Communauté</h2><p>${sub}</p></div>${action||''}</div>
    <div class="chips board-tabs" role="tablist">${T.map(([k,l,n])=>`<a class="chip" role="tab" href="#/groupes/${k}" aria-selected="${tab===k}" aria-pressed="${tab===k}">${l}${n?` <span class="cnt">${n}</span>`:''}</a>`).join('')}</div>
    ${discordOK()?`<div class="discord-row"><span>Envie de parler en vocal ? Le serveur Discord COOPO est ouvert.</span>${discordBtn('btn btn-sm')}</div>`:''}`;

function viewSquads(tab){
  if(dataPending()) return loadingView('Communauté');
  DB.refreshBoards().then(ch=>{ if(ch&&location.hash.startsWith('#/groupes')) refreshAfterData(); });
  if(tab==='groupes'){ DB.loadGroups().then(ch=>{ if(ch&&location.hash==='#/groupes/groupes') viewGroupsList(); }); return viewGroupsList(); }
  if(tab==='sessions') return viewGroupsTab();
  if(tab==='tournois') return viewTournois();
  return viewAnnonces();
}

async function joinAnnonce(id,on){
  const a=annoncesAll().find(x=>x.id===id); if(!a||!S.me) return;
  const me=myId(); a.replies = on ? [...new Set([...(a.replies||[]),me])] : (a.replies||[]).filter(x=>x!==me);
  if(!DB.live) save();
  route();
  if(!on){ await DB.replyAnnonce(a,false); return; }
  await DB.replyAnnonce(a,true);
  const author=PLAYERS.find(p=>p.id===a.by); if(!author) return;
  let q=reqWith(author.id);
  if(!q){ const r={id:'r'+Date.now(),from:'me',to:author.id,status:'pending',at:Date.now()}; S.requests.push(r); save(); await DB.saveRequest(r); q=r; }
  await DB.saveNotif(author.id,{type:'annonce',from:'me',text:`${S.me.name} est partant pour ton annonce ${a.game}`});
  toast(q.status==='accepted'?`${author.name} est prévenu : écris-lui pour vous organiser`:`${author.name} est prévenu, et une demande de mate lui est envoyée`);
}
async function deleteAnnonce(id){
  const a=annoncesAll().find(x=>x.id===id); if(!a) return;
  if(DB.live){ ANNONCES=ANNONCES.filter(x=>x!==a); await DB.deleteAnnonce(a); } else { S.annonces=(S.annonces||[]).filter(x=>x.id!==id); save(); }
  toast('Annonce retirée'); route();
}
document.addEventListener('click',e=>{
  const j=e.target.closest('[data-an-join]'); if(j){ j.disabled=true; joinAnnonce(j.dataset.anJoin,true); return; }
  const l=e.target.closest('[data-an-leave]'); if(l){ joinAnnonce(l.dataset.anLeave,false); return; }
  const x=e.target.closest('[data-an-del]'); if(x){ deleteAnnonce(x.dataset.anDel); return; }
});

function joinTournoi(id,on){
  const t=tournoisAll().find(x=>x.id===id); if(!t||!S.me) return;
  const go=async()=>{ const me=myId();
    if(DB.live && !(await DB.joinTournoi(t,on))) return;
    t.players = on ? [...new Set([...(t.players||[]),me])] : (t.players||[]).filter(x=>x!==me);
    t.entries = {...(t.entries||{})}; if(on) t.entries[me]={name:S.me.name,ig:(S.me.tags||{})[t.game]||''}; else delete t.entries[me];
    if(!DB.live) save();
    toast(on?`Inscrit à « ${t.title} » 🎮`:'Désinscription enregistrée'); route(); };
  if(on && !((S.me.tags||{})[t.game])){   // l'organisateur a besoin de ton pseudo ou ID en jeu
    modal(`<h3>Ton pseudo ${esc(t.game)}</h3><p class="muted">L'organisateur en a besoin pour t'inviter dans la partie. Il sera aussi ajouté à ton profil.</p>
      <div class="field"><label for="to-ig">Pseudo ou ID sur ${esc(t.game)}</label><input id="to-ig" type="text" maxlength="40"></div><p class="err" id="to-e"></p>
      <div class="dlg-actions"><button class="btn btn-ghost" data-close>Annuler</button><button class="btn btn-ac" id="to-ok">M'inscrire</button></div>`, d=>{
      d.querySelector('#to-ok').onclick=async()=>{ const v=d.querySelector('#to-ig').value.trim(); if(v.length<2){ d.querySelector('#to-e').textContent='Indique ton pseudo ou ton ID.'; return; }

    });
    return;
  }
  go();
}

    ${isNew?'':`<div class="field"><label for="ts">Statut</label><select id="ts">${[['open','Inscriptions ouvertes'],['closed','Inscriptions closes'],['done','Terminé']].map(([v,l])=>`<option value="${v}" ${t.status===v?'selected':''}>${l}</option>`).join('')}</select></div>`}

      if(DB.live){ await DB.deleteTournoi(t); TOURNOIS=TOURNOIS.filter(x=>x!==t); } else { S.tournois=(S.tournois||[]).filter(x=>x.id!==t.id); const i=DEMO_TOURNOIS.indexOf(t); if(i>=0) DEMO_TOURNOIS.splice(i,1); save(); }
      d.close(); toast('Tournoi supprimé'); route(); });
  });
}
function confirmDel(d){ const b=d.querySelector('#tdel'); if(b.dataset.sure) return true; b.dataset.sure='1'; b.textContent='Confirmer la suppression'; return false; }
function tournoiList(id){
  const t=tournoisAll().find(x=>x.id===id); if(!t) return;

  const txt=rows.map((r,i)=>`${i+1}. ${r.name||'Joueur'}${r.ig?` · ${t.game} : ${r.ig}`:''}`).join('\n');
  modal(`<h3>Inscrits · ${esc(t.title)}</h3><p class="muted">${rows.length} / ${+t.max||0} joueurs</p>
    ${rows.length?`<ol class="to-list">${rows.map(r=>`<li><b>${esc(r.name||'Joueur')}</b>${r.ig?`<span class="muted">${esc(t.game)} : ${esc(r.ig)}</span>`:'<span class="muted">pseudo en jeu non renseigné</span>'}</li>`).join('')}</ol>`:'<p class="muted">Personne pour l\'instant.</p>'}
    <div class="dlg-actions">${rows.length?'<button class="btn btn-ghost" id="tcopy">Copier la liste</button>':''}<button class="btn" data-close>Fermer</button></div>`, d=>{

document.addEventListener('click',e=>{
