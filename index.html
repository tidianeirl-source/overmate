<style>
/* =========================================================
   TOKENS — style « rose / cadre blanc »
   ========================================================= */
:root{
  --frame:#E9779E;            /* fond rose autour du cadre */
  --bg:#FFFFFF;               /* intérieur du cadre */
  --s1:#FFF4F8; --s2:#FCE3ED; --line:#F5C6D7;
  --tx:#4A2238; --mu:#97637C;
  --pk:#D4307B;               /* rose principal (titres, boutons) */
  --pk2:#B8346F;              /* rose texte lisible */
  --ac:#D9478A; --ac-ink:#FFFFFF;
  --hi:#139E73; --mid:#C98600; --warm:#E0611F; --lo:#D3304F;
  --fd:'Zen Dots','Trebuchet MS',system-ui,sans-serif;
  --fb:'Quicksand','Segoe UI',system-ui,-apple-system,sans-serif;
  --r:30px;
  --frame-bg:#E9779E; --field:#FFFFFF; --on-pk:#FFFFFF; --glass:rgba(255,255,255,.88); --glass-solid:#FFFFFF;
  --art-bg:#3F6B45; --art-tint:linear-gradient(200deg,transparent 45%,rgba(160,30,90,.45));
  --title:#fff; --title-stroke:0 transparent; --title-shadow:0 2px 20px rgba(120,20,70,.45);
  --case:lowercase; --fdw:400; --rf:40px; --rc:28px; --rp:999px; --ri:16px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{ background:var(--frame-bg); scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--frame-bg); color:var(--tx); font:500 15px/1.6 var(--fb); -webkit-font-smoothing:antialiased; }
img{ max-width:100%; }
a{ color:inherit; }
h1,h2,h3{ margin:0; line-height:1.15; }
h1,h2{ font-family:var(--fd); font-weight:var(--fdw); color:var(--pk); }
h2{ font-size:clamp(26px,3.4vw,38px); text-transform:var(--case); letter-spacing:.02em; }
h3{ font:700 19px var(--fb); color:var(--pk2); }
p{ margin:0; }
.muted{ color:var(--mu); }
:focus-visible{ outline:3px solid var(--tx); outline-offset:2px; }

/* Cadre blanc arrondi */
.frame{ width:min(1260px,100% - 28px); margin:14px auto; background:var(--bg); border-radius:var(--rf); padding:14px; min-height:calc(100vh - 28px); }
.wrap{ width:min(1140px,100% - 16px); margin-inline:auto; }

/* ---------- En-tête ---------- */
.top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bg); display:flex; align-items:center; gap:14px; padding:2px 4px 10px; border-radius:0 0 24px 24px; }
body.is-home .top{ display:none; }
.logo{ width:54px; height:54px; border-radius:50%; background:var(--pk); transition:background .4s; display:grid; place-items:center; flex:none; text-decoration:none; overflow:hidden; }
.logo img{ width:42px; height:42px; display:block; transition:transform .5s cubic-bezier(.3,1.6,.5,1); animation:spinIn 1s cubic-bezier(.3,1.6,.5,1) both; }
.dispo-panel{ margin-bottom:6px; }
.dispo-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.dispo-head h3{ margin:0; }
.pill-live{ font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px; background:color-mix(in srgb,var(--hi) 18%,transparent); color:var(--hi); }
.dot-live{ display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--hi); box-shadow:0 0 0 0 color-mix(in srgb,var(--hi) 60%,transparent); animation:livepulse 1.6s infinite; margin-right:8px; }
@keyframes livepulse{ 0%{ box-shadow:0 0 0 0 color-mix(in srgb,var(--hi) 55%,transparent); } 70%{ box-shadow:0 0 0 9px transparent; } 100%{ box-shadow:0 0 0 0 transparent; } }
.dispo-cta{ display:inline-flex; align-items:center; }
.dispo-me{ display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; padding:12px 14px; border-radius:var(--ri); background:color-mix(in srgb,var(--hi) 10%,transparent); border:1.5px solid color-mix(in srgb,var(--hi) 40%,transparent); margin-bottom:12px; }
.dispo-list{ display:grid; gap:10px; margin-top:12px; }
.dispo-card{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 12px; border-radius:var(--ri); background:var(--field); border:1.5px solid var(--line); }
.dispo-card.same{ border-color:color-mix(in srgb,var(--hi) 50%,transparent); }
.dc-who{ display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; min-width:0; }
.dc-who div{ display:grid; min-width:0; }
.dc-who b{ font-size:15px; }
.dc-who span{ font-size:13px; color:var(--mu); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dc-who em{ font-size:12px; color:var(--mu); font-style:normal; opacity:.85; }
.dc-act{ display:flex; align-items:center; gap:10px; flex:none; }
.dc-compat{ font-weight:800; color:var(--hi); font-size:12px; font-style:normal; margin-left:8px; white-space:nowrap; }
.dc-who b{ display:flex; align-items:center; flex-wrap:wrap; gap:2px 0; }
.dc-sent{ font-size:12px; white-space:nowrap; }
.dispo-empty{ margin:8px 0 0; font-size:14px; }
.dp-durs{ display:flex; flex-wrap:wrap; gap:8px; }

/* ---------- Boutons pilule ---------- */
.btn{ --b:var(--s2); --t:var(--pk2); display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 22px;
  border:0; border-radius:var(--rp); background:var(--b); color:var(--t); font:700 15px var(--fb); text-transform:var(--case); cursor:pointer; text-decoration:none;
  position:relative; overflow:hidden; transition:filter .15s, transform .1s; }
.btn:hover{ filter:brightness(1.05); }
.btn:active{ transform:translateY(1px); }
.btn-ac{ --b:var(--pk); --t:var(--on-pk); }
.btn-lg{ min-height:52px; padding:0 30px; font-size:17px; }
.btn-ghost{ --b:transparent; --t:var(--pk); box-shadow:inset 0 0 0 1.5px var(--pk); }
.btn-danger{ --b:#FDE1E6; --t:#A8203C; }
.btn-sm{ min-height:36px; padding:0 16px; font-size:14px; }
.btn[disabled]{ opacity:.5; cursor:not-allowed; }
.linkbtn{ background:none; border:0; color:var(--mu); font:inherit; text-decoration:underline; cursor:pointer; padding:4px; }

/* ---------- Anneau de compatibilité ---------- */
@property --p{ syntax:'<number>'; inherits:true; initial-value:0; }
.ring{ --s:64px; --rb:var(--bg); width:var(--s); aspect-ratio:1; border-radius:50%; flex:none; position:relative; display:grid; place-items:center;
  background:conic-gradient(var(--c) calc(var(--p) * 1%), var(--s2) 0); }
.ring::before{ content:''; position:absolute; inset:6px; border-radius:50%; background:var(--rb); }
.ring span{ position:relative; font:400 calc(var(--s) * .27) var(--fd); color:var(--c); }
.ring small{ font-size:.55em; }
.ring-lg{ --s:120px; } .ring-lg::before{ inset:10px; }
.ring-sm{ --s:52px; } .ring-sm::before{ inset:5px; }

/* ---------- Avatars ---------- */
.av{ border-radius:var(--ri); flex:none; display:inline-grid; place-items:center; object-fit:cover; font:400 16px var(--fd); color:#fff;
  background:linear-gradient(140deg,hsl(var(--h) 80% 70%),hsl(calc(var(--h) + 40) 70% 50%)); }
.online{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--hi); }
.online::before{ content:''; width:8px; height:8px; border-radius:50%; background:var(--hi); }

/* =========================================================
   ACCUEIL — panneau illustré avec coins découpés
   ========================================================= */
.hero2{ position:relative; }
.art{ position:relative; border-radius:var(--r); overflow:hidden; min-height:600px; background:var(--art-bg); }
.bloom{ position:absolute; inset:0; width:100%; height:100%; }
.art::after{ content:''; position:absolute; inset:0; pointer-events:none; background:var(--art-tint); }
.tab{ position:absolute; z-index:3; background:var(--bg); }
.tab::before,.tab::after{ content:''; position:absolute; width:var(--r); height:var(--r); pointer-events:none; }
.tl{ top:0; left:0; display:flex; align-items:center; gap:12px; padding:0 16px 14px 0; border-bottom-right-radius:var(--r); }
.tl::before{ left:100%; top:0; background:radial-gradient(circle at 100% 100%,transparent calc(var(--r) - .5px),var(--bg) var(--r)); }
.tl::after{ top:100%; left:0; background:radial-gradient(circle at 100% 100%,transparent calc(var(--r) - .5px),var(--bg) var(--r)); }
.tr{ top:0; right:0; padding:6px 8px 16px 24px; border-bottom-left-radius:var(--r); }
.tr::before{ right:100%; top:0; background:radial-gradient(circle at 0 100%,transparent calc(var(--r) - .5px),var(--bg) var(--r)); }
.tr::after{ top:100%; right:0; background:radial-gradient(circle at 0 100%,transparent calc(var(--r) - .5px),var(--bg) var(--r)); }
.tr .top-right{ display:block; }
.bl{ bottom:0; left:0; width:min(430px,42%); padding:26px 28px 4px 6px; border-top-right-radius:var(--r); display:grid; gap:14px; }
.bl::before{ bottom:100%; left:0; background:radial-gradient(circle at 100% 0,transparent calc(var(--r) - .5px),var(--bg) var(--r)); }
.bl::after{ left:100%; bottom:0; background:radial-gradient(circle at 100% 0,transparent calc(var(--r) - .5px),var(--bg) var(--r)); }
.bl h2{ font-size:clamp(30px,3.6vw,44px); line-height:1.05; }
.bl p{ color:var(--pk2); font-size:15px; max-width:36ch; }
.bl .hero-cta{ display:flex; gap:10px; flex-wrap:wrap; }
.hero-title{ position:absolute; right:32px; bottom:24px; z-index:2; text-align:right; color:var(--title); text-shadow:var(--title-shadow); -webkit-text-stroke:var(--title-stroke); paint-order:stroke fill; }
.hero-title small{ display:block; font:500 clamp(18px,2.4vw,30px) var(--fb); margin-bottom:2px; }
.hero-title strong{ display:block; font:400 clamp(44px,7.6vw,100px)/1 var(--fd); letter-spacing:.02em; }
.float-match{ position:absolute; z-index:2; top:110px; right:40px; display:grid; justify-items:center; gap:10px; padding:18px 22px;
  background:var(--glass); backdrop-filter:blur(8px); border-radius:var(--rc); box-shadow:0 18px 40px -18px rgba(120,20,70,.5); }

.home-grid{ display:grid; grid-template-columns:1fr 1fr; gap:44px; padding:34px 10px 16px; }
.steps{ list-style:none; margin:18px 0 0; padding:0; display:grid; gap:4px; counter-reset:s; }
.steps li{ counter-increment:s; display:grid; grid-template-columns:44px 1fr; gap:4px 12px; padding:10px 0; }
.steps li::before{ content:counter(s); grid-row:span 2; font:400 26px var(--fd); color:var(--pk); }

.score-card{ margin-top:22px; display:grid; grid-template-columns:150px 1fr; gap:22px; align-items:center; }
.score-art{ aspect-ratio:1; border-radius:var(--rc); background:var(--s2); display:grid; place-items:center; overflow:hidden; }

.wbar{ display:flex; height:30px; border-radius:var(--rp); overflow:hidden; margin-bottom:10px; }

.wlegend{ display:flex; flex-wrap:wrap; gap:4px 14px; font-size:13px; color:var(--pk2); margin-bottom:14px; }

.row{ display:grid; grid-template-columns:72px 1fr auto; gap:16px; align-items:center; padding:14px 0; border-bottom:1.5px solid var(--line); text-decoration:none; transition:transform .2s; }

/* ---------- Pages ---------- */
.page{ padding:26px 0 48px; }
.page-head{ display:flex; justify-content:space-between; align-items:end; gap:16px; flex-wrap:wrap; margin-bottom:24px; }
.page-head p{ color:var(--pk2); margin-top:6px; }

.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
.mcard{ display:grid; gap:14px; padding:20px; background:var(--bg); border:1.5px solid var(--line); border-radius:var(--rc); text-decoration:none; transition:border-color .2s, transform .2s, box-shadow .2s; }
.mcard:hover{ border-color:var(--pk); transform:translateY(-3px); }
.mc-head{ display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; }
.mc-name{ font:700 18px var(--fb); color:var(--tx); display:block; overflow-wrap:anywhere; }

@media (min-width:761px){ .top-match{ grid-template-columns:auto 1fr; align-items:center; column-gap:28px; padding:26px; } }
.mates-strip{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:28px; }
.mate-pill{ display:flex; align-items:center; gap:8px; padding:5px 14px 5px 5px; background:var(--bg); border:1.5px solid var(--line); border-radius:var(--rp); text-decoration:none; font-weight:700; color:var(--pk2); }

.empty{ text-align:center; padding:56px 20px; background:var(--s1); border:2px dashed var(--line); border-radius:var(--rc); display:grid; gap:14px; justify-items:center; }

/* ---------- Formulaires ---------- */
.form{ display:grid; gap:18px; }
.panel{ background:var(--s1); border-radius:var(--rc); padding:24px; display:grid; gap:18px; }
.field{ display:grid; gap:6px; }
.field label,.lbl{ font-weight:700; font-size:14px; color:var(--tx); }
.hint{ font-size:13px; color:var(--mu); }
.two{ display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
input[type=text],input[type=email],input[type=password],input[type=search],select,textarea{
  width:100%; min-height:46px; padding:10px 16px; background:var(--field); color:var(--tx); border:1.5px solid var(--line); border-radius:var(--ri); font:inherit; }
input:focus,select:focus,textarea:focus{ outline:none; border-color:var(--pk); box-shadow:0 0 0 3px color-mix(in srgb,var(--pk) 20%,transparent); }
.err{ color:#B81F45; font-size:14px; font-weight:600; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ min-height:38px; padding:0 16px; border-radius:var(--rp); border:1.5px solid var(--line); background:var(--field); color:var(--pk2); font:600 14px var(--fb); cursor:pointer; }
.chip[aria-pressed="true"]{ background:var(--pk); border-color:var(--pk); color:var(--on-pk); }
.chip[aria-pressed="true"]::before{ content:'✓ '; }
.tags{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
.avatar-pick{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
.avatar-pick button{ padding:0; border:3px solid transparent; border-radius:var(--ri); background:none; cursor:pointer; }
.avatar-pick button[aria-pressed="true"]{ border-color:var(--pk); }
.upload{ position:relative; overflow:hidden; }
.upload input{ position:absolute; inset:0; opacity:0; cursor:pointer; }
.toggle{ display:flex; justify-content:space-between; align-items:center; gap:16px; padding:12px 0; border-top:1.5px solid var(--line); }
.toggle:first-of-type{ border-top:0; }
.switch{ appearance:none; width:48px; height:28px; border-radius:var(--rp); background:var(--line); position:relative; cursor:pointer; flex:none; transition:background .15s; }
.switch::after{ content:''; position:absolute; top:4px; left:4px; width:20px; height:20px; border-radius:50%; background:var(--field); transition:transform .2s cubic-bezier(.3,1.6,.5,1); }
.switch:checked{ background:var(--pk); }
.switch:checked::after{ transform:translateX(20px); }
.strength{ height:5px; border-radius:3px; background:var(--line); overflow:hidden; }
.strength i{ display:block; height:100%; width:var(--w); background:var(--sc); transition:width .2s; }
.form-actions{ display:flex; gap:12px; flex-wrap:wrap; position:sticky; bottom:0; padding:14px 0; background:linear-gradient(transparent,var(--bg) 35%); }
@media (max-width:860px){ .form-actions{ bottom:calc(64px + env(safe-area-inset-bottom,0px)); } }

/* ---------- Recherche ---------- */
.filters{ display:grid; grid-template-columns:repeat(6,1fr); gap:12px; background:var(--s1); border-radius:var(--rc); padding:18px; margin-bottom:20px; align-items:end; }
.filters .field:first-child{ grid-column:span 2; }
.range-row{ display:flex; align-items:center; gap:10px; }
.range-row output{ font:400 16px var(--fd); color:var(--pk); min-width:52px; }
input[type=range]{ width:100%; accent-color:var(--pk); }
.count{ color:var(--pk2); margin-bottom:14px; font-size:14px; font-weight:600; }

/* ---------- Profil joueur ---------- */
.pp{ display:grid; grid-template-columns:1fr 330px; gap:24px; align-items:start; }
.pp-head{ display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
.pp-head h1{ font-size:clamp(30px,5vw,46px); overflow-wrap:anywhere; }
.pp-head .av{ border-radius:var(--rc); }
.pp-side{ position:sticky; top:96px; display:grid; gap:14px; justify-items:center; text-align:center; background:var(--s1); border-radius:var(--rc); padding:26px; }
.pp-side .ring{ --rb:var(--s1); }
.pp-side strong{ color:var(--pk2); }
.pp-side .btn{ width:100%; }
.breakdown{ display:grid; gap:10px; width:100%; text-align:left; }
.bd-row{ display:grid; grid-template-columns:1fr auto; gap:4px 10px; font-size:13px; font-weight:600; }
.bd-row .bar{ grid-column:1 / -1; height:8px; background:var(--s2); border-radius:var(--rp); overflow:hidden; }
.bd-row .bar i{ display:block; height:100%; width:var(--w); background:var(--k); border-radius:var(--rp); }
.gametag{ display:flex; justify-content:space-between; gap:8px; padding:11px 14px; background:var(--field); border:1.5px solid var(--line); border-radius:var(--ri); font-size:14px; font-weight:600; }
.gametag.shared{ border-color:var(--hi); }
.gametag em{ font-style:normal; color:var(--mu); overflow-wrap:anywhere; text-align:right; }
.safety{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; border-top:1.5px solid var(--line); padding-top:14px; width:100%; }
@media (max-width:900px){ .pp{ grid-template-columns:1fr; } .pp-side{ position:static; order:-1; } }

/* ---------- Modale & toast ---------- */
dialog{ border:0; border-radius:var(--rc); background:var(--bg); color:var(--tx); padding:26px; width:min(480px,calc(100% - 32px)); }
dialog::backdrop{ background:rgba(74,34,56,.55); }
dialog h3{ margin-bottom:10px; font:400 22px var(--fd); color:var(--pk); }
.dlg-actions{ display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top:20px; }
.radio-list{ display:grid; gap:8px; margin:14px 0; }
.radio-list label{ display:flex; gap:10px; align-items:center; padding:10px 14px; border:1.5px solid var(--line); border-radius:var(--ri); cursor:pointer; }
.radio-list input{ accent-color:var(--pk); }
.toast{ position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,20px); opacity:0; z-index:50;
  background:var(--tx); color:var(--bg); font-weight:700; padding:12px 20px; border-radius:var(--rp); transition:.25s; pointer-events:none; max-width:calc(100% - 32px); }
.toast.show{ opacity:1; transform:translate(-50%,0); }
@media (max-width:860px){ .toast{ bottom:calc(88px + env(safe-area-inset-bottom,0px)); } }

/* ---------- Responsive ---------- */
@media (max-width:980px){
  .filters{ grid-template-columns:1fr 1fr; } .filters .field:first-child{ grid-column:1 / -1; }
  .home-grid{ grid-template-columns:1fr; gap:30px; }
  .float-match{ top:auto; bottom:150px; right:20px; scale:.85; transform-origin:bottom right; }
}
@media (max-width:760px){
  .art{ min-height:440px; }
  .tl .navpill,.tr{ display:none; }
  .bl{ position:static; width:auto; padding:24px 6px 0; border-radius:0; }
  .bl::before,.bl::after{ display:none; }
  .hero-title{ right:20px; bottom:18px; }
  .float-match{ top:90px; bottom:auto; right:14px; padding:12px 14px; transform-origin:top right; }
  .two{ grid-template-columns:1fr; }
  .score-card{ grid-template-columns:1fr; }
  .score-art{ max-width:150px; }
  .facts div{ grid-template-columns:104px 1fr; }
  .frame{ width:calc(100% - 16px); margin:8px auto; border-radius:var(--rc); padding:10px; }
}


/* =========================================================
   THÈMES — chaque thème redéfinit les variables
   ========================================================= */
html.skin-anim, html.skin-anim body, html.skin-anim *, html.skin-anim *::before, html.skin-anim *::after{
  transition:background-color .5s ease, color .5s ease, border-color .5s ease, box-shadow .5s ease, fill .5s ease !important; }

/* --- Manga --- */
html[data-skin="manga"]{
  --frame:#111; --frame-bg:radial-gradient(rgba(255,255,255,.16) 1.3px,transparent 1.7px) 0 0/11px 11px,#111;
  --bg:#FFFFFF; --s1:#F3F3F3; --s2:#E4E4E4; --line:#111; --tx:#111; --mu:#555;
  --pk:#111; --pk2:#111; --on-pk:#fff; --field:#fff; --glass:#fff; --glass-solid:#fff;
  --hi:#111; --mid:#555; --warm:#333; --lo:#C1121F;
  --fd:'Bangers',Impact,sans-serif; --fb:'M PLUS Rounded 1c','Segoe UI',sans-serif; --fdw:400; --case:uppercase;
  --rf:14px; --rc:6px; --rp:6px; --ri:4px; --r:14px;
  --art-bg:#fff; --art-tint:none; --title:#fff; --title-stroke:2.5px #111; --title-shadow:6px 6px 0 #111;
}
html[data-skin="manga"] h1, html[data-skin="manga"] h2{ color:#fff; -webkit-text-stroke:1.5px #111; paint-order:stroke fill; text-shadow:4px 4px 0 #111; letter-spacing:.05em; }
html[data-skin="manga"] .hero-title strong{ -webkit-text-stroke:2.5px #111; text-shadow:7px 7px 0 #111; }
html[data-skin="manga"] .ring span{ color:#111; }
html[data-skin="manga"] :is(.mcard,.panel,.pp-side,.filters,.empty,.score-art,dialog,.float-match,.skin,.gametag){ border:3px solid #111; box-shadow:6px 6px 0 #111; }
html[data-skin="manga"] .top-match{ border-color:#111; }
html[data-skin="manga"] .mcard:hover{ box-shadow:9px 9px 0 #111; }
html[data-skin="manga"] :is(.btn,.chip,.navpill,.skin-btn){ border:2.5px solid #111; box-shadow:3px 3px 0 #111; }
html[data-skin="manga"] .btn:active{ box-shadow:1px 1px 0 #111; transform:translate(2px,2px); }
html[data-skin="manga"] .hero-title small{ -webkit-text-stroke:0; text-shadow:none; color:#111; background:#fff; padding:2px 10px; display:inline-block; }
html[data-skin="manga"] .frame{ background-image:radial-gradient(rgba(0,0,0,.06) 1px,transparent 1.3px); background-size:8px 8px; }

  --art-bg:#0B0B0B; --art-tint:none;

  -webkit-backdrop-filter:blur(30px) saturate(110%); backdrop-filter:blur(30px) saturate(110%);
  border:1.5px solid rgba(255,255,255,.22); box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(255,255,255,.08),0 40px 100px rgba(0,0,0,.6); }

html[data-skin="glass"] .tl::before,html[data-skin="glass"] .tl::after,html[data-skin="glass"] .tr::before,html[data-skin="glass"] .tr::after,
html[data-skin="glass"] .bl::before,html[data-skin="glass"] .bl::after{ display:none; }
html[data-skin="glass"] .tab{ background:rgba(34,34,36,.55); -webkit-backdrop-filter:blur(22px); backdrop-filter:blur(22px); border:1.5px solid rgba(255,255,255,.2); box-shadow:inset 0 1px 0 rgba(255,255,255,.3); }

  background:linear-gradient(155deg,rgba(255,255,255,.12),rgba(255,255,255,.03) 55%,rgba(255,255,255,.06));
  border:1.5px solid rgba(255,255,255,.2);
  -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(255,255,255,.06),0 18px 50px rgba(0,0,0,.45); }
html[data-skin="glass"] .empty{ border-style:dashed; }
html[data-skin="glass"] dialog{ background:rgba(26,26,28,.78); -webkit-backdrop-filter:blur(28px); backdrop-filter:blur(28px); border:1.5px solid rgba(255,255,255,.22); box-shadow:inset 0 1.5px 0 rgba(255,255,255,.3),0 50px 120px rgba(0,0,0,.7); }
html[data-skin="glass"] .btn-ac{ background:#E8FF3A; color:#0B0B0B; box-shadow:0 10px 30px rgba(232,255,58,.25); }
html[data-skin="glass"] .btn:not(.btn-ac){ background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.22); color:#F4F4F4; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
html[data-skin="glass"] :is(input,select,textarea){ background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.2); }
html[data-skin="glass"] .tabbar{ background:rgba(22,22,24,.65); -webkit-backdrop-filter:blur(22px); backdrop-filter:blur(22px); border-top:1.5px solid rgba(255,255,255,.18); }
html[data-skin="glass"] h2{ letter-spacing:-.03em; font-weight:600; }
html[data-skin="glass"] h2 .hl, html[data-skin="glass"] .hero2 h2 .hl{ color:#E8FF3A; }
html[data-skin="glass"] .ring{ --rb:#18181A !important; }
@media (max-width:820px), (prefers-reduced-transparency: reduce){
  html[data-skin="glass"],html[data-skin="glass"] body{ background-attachment:scroll; }
  html[data-skin="glass"] .frame{ -webkit-backdrop-filter:none; backdrop-filter:none; background:rgba(24,24,26,.82); }
  html[data-skin="glass"] :is(.panel,.mcard,.empty,.filters,.pp-side,.navpill,.mate-pill,.dispo-card,.buy-opt,.skin,.ref-link,.float-match,.tab){
    -webkit-backdrop-filter:none; backdrop-filter:none; background:linear-gradient(155deg,rgba(255,255,255,.11),rgba(255,255,255,.04)); }
}

    radial-gradient(circle at 0 50%,#E8D9C6 5%,#F4ECE1 5% 15%,#E8D9C6 15% 20%,#F4ECE1 20% 29%,#E8D9C6 29% 34%,#F4ECE1 34% 44%,#E8D9C6 44% 49%,transparent 49%) , #F4ECE1;

}

/* Titre tramé (dégradé plein → points), comme sur l'affiche */

/* Animations de l'illustration samouraï */
.breathe-s{ transform-box:fill-box; transform-origin:50% 100%; animation:breatheS 4s ease-in-out infinite; }
@keyframes breatheS{ 50%{ transform:scaleY(1.008) translateY(-2px); } }
.robe-flap{ transform-box:fill-box; transform-origin:0 0; animation:flap 2.6s ease-in-out infinite; }
@keyframes flap{ 50%{ transform:skewX(-4deg); } }
.glint{ stroke-dasharray:60 800; animation:glint 3.5s ease-in-out infinite; }
@keyframes glint{ 0%,40%{ stroke-dashoffset:860; } 70%,100%{ stroke-dashoffset:0; } }
.wind{ animation:wind var(--wd) linear infinite; animation-delay:calc(var(--wl) * -1); }
@keyframes wind{ from{ transform:translateX(-300px); opacity:0; } 20%{ opacity:.6; } 80%{ opacity:.6; } to{ transform:translateX(900px); opacity:0; } }
.redsun{ transform-box:fill-box; transform-origin:center; animation:mp 7s ease-in-out infinite; }

/* Scènes océan / nuit / menthe */
.ray{ transform-box:fill-box; transform-origin:50% 0; animation:ray 7s ease-in-out infinite alternate; animation-delay:calc(var(--rd) * -1); }
@keyframes ray{ to{ transform:rotate(4deg) scaleX(1.15); opacity:.18; } }
.wave{ animation:waveMove 9s linear infinite; } .wave.w2{ animation-duration:13s; animation-direction:reverse; }
@keyframes waveMove{ to{ transform:translateX(300px); } }
.fish{ animation:swim var(--sd) linear infinite; animation-delay:calc(var(--sl) * -1); }
@keyframes swim{ from{ transform:translate(-320px,var(--fy,0)); } to{ transform:translate(1400px,var(--fy,0)); } }
.bub2{ animation:bub2 var(--bd) ease-in infinite; animation-delay:calc(var(--bl) * -1); }
@keyframes bub2{ 0%{ transform:translate(0,0); opacity:0; } 10%{ opacity:.7; } 100%{ transform:translate(var(--bx),-700px); opacity:0; } }
.shoot{ transform:translate(var(--sx),var(--sy)); opacity:0; animation:shoot var(--sdur) linear infinite; animation-delay:calc(var(--sl) * -1); }
@keyframes shoot{ 0%,88%{ opacity:0; transform:translate(var(--sx),var(--sy)); } 90%{ opacity:1; } 100%{ opacity:0; transform:translate(calc(var(--sx) + 260px),calc(var(--sy) + 90px)); } }
.flap{ transform-box:fill-box; transform-origin:100% 50%; animation:flap .5s ease-in-out infinite alternate; }
.flap.r{ transform-origin:0 50%; animation-name:flapR; }
@keyframes flap{ to{ transform:scaleX(.35); } } @keyframes flapR{ to{ transform:scaleX(.35); } }
/* Manga espace */
.astro{ animation:astro 7s ease-in-out infinite alternate; }
@keyframes astro{ to{ transform:translate(770px,310px) rotate(4deg); } }
.ufo{ animation:ufo 4s ease-in-out infinite alternate; } .beam{ animation:beam 1.2s steps(2) infinite; }
@keyframes ufo{ to{ transform:translate(620px,500px); } } @keyframes beam{ 50%{ opacity:.2; } }
.planet{ animation:planet 12s ease-in-out infinite alternate; } @keyframes planet{ to{ transform:translate(975px,215px) rotate(-6deg); } }
.moonfloat{ animation:moonfloat 9s ease-in-out infinite alternate; } @keyframes moonfloat{ to{ transform:translate(575px,150px); } }
.rocket{ animation:rocket 10s ease-in-out infinite alternate; } @keyframes rocket{ to{ transform:translate(230px,290px) rotate(30deg); } }

/* --- Sélecteur de thème --- */
.skin-btn{ width:44px; height:44px; border-radius:50%; border:1.5px solid var(--line); background:var(--field); color:var(--pk); display:grid; place-items:center; cursor:pointer; flex:none; }

.skin{ display:grid; gap:4px; text-align:left; padding:10px; border:2px solid var(--line); border-radius:var(--ri); background:var(--field); color:var(--tx); cursor:pointer; font:inherit; transition:transform .2s cubic-bezier(.3,1.6,.5,1), border-color .15s; }

.skin .sw i::after{ content:''; position:absolute; right:8px; bottom:8px; width:16px; height:16px; border-radius:50%; background:var(--c2); }

.buy-sw{ display:block; height:84px; border-radius:14px; background:var(--a); padding:12px; margin:14px 0; }
.buy-sw i{ display:block; height:100%; border-radius:9px; background:var(--b); position:relative; }
.buy-sw i::after{ content:''; position:absolute; right:12px; bottom:12px; width:22px; height:22px; border-radius:50%; background:var(--c2); }
.buy-opts{ display:grid; gap:10px; }
.buy-cur{ margin-bottom:12px; }
.prem{ font-style:normal; font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:2px 7px; border-radius:999px; background:linear-gradient(90deg,#F2B100,#E4461F); color:#fff; margin-left:6px; vertical-align:middle; }

.buy-soon .buy-opt{ opacity:.55; cursor:default; }
.soon-note{ display:grid; gap:4px; margin-top:12px; padding:12px 14px; border-radius:var(--ri); background:color-mix(in srgb,var(--pk) 12%,transparent); border:1.5px dashed var(--pk); font-size:14px; }

.buy-consent{ display:flex; gap:8px; align-items:flex-start; margin-top:12px; font-size:14px; }
.buy-note{ font-size:13px; margin-top:10px; }
.skin small{ font-size:12px; color:var(--mu); line-height:1.3; }
dialog:has(.skins){ width:min(620px,calc(100% - 32px)); }

.sfx{ transform-box:fill-box; transform-origin:center; animation:sfx 2.2s ease-in-out infinite; }

@keyframes sfx{ 0%,100%{ transform:rotate(-6deg) scale(1); } 50%{ transform:rotate(-2deg) scale(1.1); } }
.mpulse{ transform-box:fill-box; transform-origin:center; animation:mp 1.4s ease-in-out infinite; }

@keyframes cloud{ from{ transform:translateX(-500px); } to{ transform:translateX(1400px); } }

.gridmove{ animation:gridmove 1.6s linear infinite; }

.sun{ transform-box:fill-box; transform-origin:center; animation:sunbob 8s ease-in-out infinite; }

/* --- Connexion --- */
.login{ justify-items:center; text-align:center; gap:16px; padding:34px 26px; }
.gbtn{ min-height:44px; display:flex; justify-content:center; max-width:100%; overflow:hidden; border-radius:999px; }

.auth,.auth > *,.auth-form,.auth-side,.auth-intro,.auth-steps{ min-width:0; }
.auth{ overflow:hidden; }
body{ overflow-x:clip; }
.demo-g small{ font-weight:500; opacity:.7; text-transform:none; }
.or{ display:flex; align-items:center; gap:12px; width:100%; color:var(--mu); font-size:13px; }

/* --- Listes déroulantes (flèche aux couleurs du thème) --- */
select{ appearance:none; -webkit-appearance:none; padding-right:40px; cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--pk) 50%),linear-gradient(135deg,var(--pk) 50%,transparent 50%);
  background-position:calc(100% - 21px) 52%,calc(100% - 15px) 52%; background-size:6px 6px; background-repeat:no-repeat; }

/* --- Date de naissance --- */
.dob-row{ display:grid; grid-template-columns:.85fr 1.5fr 1fr; gap:8px; }
.dob-f{ position:relative; display:block; }
.dob-f span{ position:absolute; left:14px; top:7px; z-index:1; font-size:11px; font-weight:700; color:var(--mu); text-transform:var(--case); letter-spacing:.04em; pointer-events:none; transition:color .2s; }
.dob-f select{ padding-top:22px; padding-bottom:6px; min-height:56px; font-weight:700; color:var(--tx); transition:border-color .2s, background-color .2s; }
.dob-f select:not(.filled){ color:var(--mu); }
.dob-f:focus-within span{ color:var(--pk); }
.dob-f select.filled{ border-color:var(--pk); background-color:color-mix(in srgb,var(--pk) 7%,var(--field)); }
.dob-status{ display:none; align-items:center; gap:10px; padding:10px 14px; border-radius:var(--ri); font-size:14px; font-weight:600; line-height:1.35; }

.dob-locked{ display:flex; align-items:center; gap:10px; min-height:56px; padding:0 16px; border-radius:var(--ri); background:var(--s2); color:var(--tx); font-weight:700; }

/* --- Inscription / Connexion --- */
.auth{ display:grid; grid-template-columns:1.05fr 1fr; gap:8px; padding:8px; background:var(--s1); border-radius:var(--rc); min-height:640px; }

  background:radial-gradient(42% 38% at 76% 66%,color-mix(in srgb,var(--pk) 85%,#fff),transparent 70%),
    radial-gradient(48% 42% at 18% 8%,color-mix(in srgb,var(--pk) 55%,transparent),transparent 70%),

.bubble{ max-width:78%; align-self:flex-start; padding:10px 14px; border-radius:18px 18px 18px 4px; background:var(--field); border:1.5px solid var(--line); display:grid; gap:2px; animation:pop .25s cubic-bezier(.3,1.6,.5,1); }
.bubble.me{ align-self:flex-end; background:var(--pk); color:var(--on-pk); border-color:var(--pk); border-radius:18px 18px 4px 18px; }
.bubble small{ font-size:11px; opacity:.7; } .bubble span{ overflow-wrap:anywhere; }
.chat-form{ display:flex; gap:8px; margin-top:12px; }
.squad h3{ margin:0; } .sq-top{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
.sq-game{ font:700 13px var(--fb); color:var(--pk); background:color-mix(in srgb,var(--pk) 12%,transparent); padding:4px 12px; border-radius:var(--rp); }
.sq-slots{ font-size:13px; font-weight:700; color:var(--hi); } .sq-slots.full{ color:var(--mu); }
.sq-mem{ display:flex; } .sq-mem .av{ border-radius:50%; box-shadow:0 0 0 2px var(--bg); margin-right:-6px; font-size:11px; }
.sq-act{ display:flex; justify-content:flex-end; }
.online-strip{ display:flex; gap:10px; overflow:auto; padding:4px 2px 14px; margin-bottom:14px; scrollbar-width:thin; }
.online-card{ flex:none; width:104px; display:grid; justify-items:center; gap:4px; padding:12px 8px; background:var(--s1); border-radius:var(--rc); text-decoration:none; color:inherit; font-size:13px; text-align:center; transition:transform .15s; }
.online-card:hover{ transform:translateY(-3px); } .online-card b{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
.online-card .av{ border-radius:50%; }
.pp-meta{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-size:13px; }
.rejoue{ font-size:13px; font-weight:700; color:var(--hi); }
.rank{ font-size:11px; font-weight:700; color:var(--pk); background:color-mix(in srgb,var(--pk) 12%,transparent); padding:2px 8px; border-radius:var(--rp); margin-left:6px; }
.mates-ok{ color:var(--hi); font-weight:700; }
.tags .field select{ margin-top:4px; }
.faq details{ border-top:1.5px solid var(--line); padding:12px 0; } .faq details:first-child{ border-top:0; }
.faq summary{ cursor:pointer; font-weight:700; } .faq p{ margin-top:8px; color:var(--mu); }
.legal{ max-width:760px; } .legal h3{ margin-top:24px; } .legal p{ color:var(--mu); margin-top:6px; }
.notice{ padding:12px 16px; border-radius:var(--ri); background:color-mix(in srgb,var(--mid) 14%,transparent); color:var(--tx); font-size:14px; font-weight:600; }
.admin-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:18px; }
.admin-stats div{ background:var(--s1); border-radius:var(--rc); padding:14px; text-align:center; } .admin-stats b{ display:block; font:var(--fdw) 26px var(--fd); color:var(--pk); } .admin-stats span{ font-size:13px; color:var(--mu); }
.admin-row{ margin-bottom:12px; } .admin-head{ display:grid; grid-template-columns:44px 1fr auto; gap:12px; align-items:center; } .admin-head > div{ display:grid; } .admin-head .muted{ font-size:13px; }
.admin-list{ margin:0; padding-left:18px; display:grid; gap:4px; font-size:14px; } .admin-list li.done{ opacity:.55; }
.foot{ position:relative; z-index:1; display:flex; gap:18px; flex-wrap:wrap; justify-content:center; padding:18px 10px 6px; font-size:13px; color:var(--mu); }
.foot a{ color:var(--mu); font-weight:600; } .foot span{ width:100%; text-align:center; }
@media (max-width:1100px){ .navpill a{ padding:6px 11px; font-size:14px; } }
@media (max-width:860px){ .admin-stats{ grid-template-columns:1fr 1fr; } .foot{ padding-bottom:0; } }

/* --- Vitrine d'accueil (thème Coopô) --- */
@property --b1{ syntax:'<color>'; inherits:true; initial-value:#6A48F0; }
@property --b2{ syntax:'<color>'; inherits:true; initial-value:#2A1C86; }
.showcase{ position:relative; overflow:hidden; margin:-14px -14px 0; padding:16px 26px 26px; border-radius:var(--rf) var(--rf) 0 0; color:#fff; min-height:640px; display:flex; flex-direction:column;
  background:radial-gradient(90% 70% at 50% 105%,var(--b2),transparent 65%),linear-gradient(165deg,var(--b1),var(--b2)); transition:--b1 .8s ease, --b2 .8s ease; }
.showcase::after{ content:''; position:absolute; inset:0; pointer-events:none; background:radial-gradient(60% 50% at 50% 42%,rgba(255,255,255,.14),transparent 70%); }
.sc-top{ position:relative; z-index:2; display:flex; align-items:center; gap:12px; }
.sc-brand{ font:var(--fdw) 20px var(--fd); letter-spacing:.02em; }
.sc-top .navpill{ margin:0 auto; background:rgba(0,0,0,.28); border-color:rgba(255,255,255,.18); backdrop-filter:blur(8px); }
.sc-top .navpill a{ color:rgba(255,255,255,.85); } .sc-top .navpill a:hover{ background:rgba(255,255,255,.12); }
.sc-top .navpill a[aria-current="page"]{ background:#fff; color:#111; }
.sc-top .logo{ background:var(--pk); box-shadow:0 4px 18px rgba(0,0,0,.25); }
.sc-right{ display:flex; gap:8px; margin-left:auto; }
.sc-right .notif-btn,.sc-right .skin-btn{ background:rgba(0,0,0,.28); border-color:rgba(255,255,255,.18); color:#fff; }
.sc-body{ position:relative; z-index:1; flex:1; display:grid; grid-template-columns:1fr 1.25fr .8fr; align-items:center; gap:24px; padding-top:18px; }
.sc-text h1{ color:#fff !important; font-size:clamp(34px,4.2vw,60px); line-height:1.02; text-shadow:none !important; }
.sc-text p{ color:rgba(255,255,255,.84); margin:16px 0 22px; max-width:40ch; }
.sc-arrows{ display:flex; gap:8px; margin-bottom:18px; }
.sc-arrows button{ width:38px; height:38px; border-radius:50%; border:0; background:rgba(0,0,0,.3); color:#fff; font-size:24px; line-height:1; cursor:pointer; transition:.2s; }
.sc-arrows button:hover{ background:#fff; color:#111; }
.sc-text .btn-ac{ --b:#fff; --t:#111; animation:none; } .sc-text .linkbtn{ color:rgba(255,255,255,.85); } .sc-text .trust{ color:rgba(255,255,255,.7); margin-top:10px; }
.sc-stage{ position:relative; display:grid; justify-items:center; }
.sc-obj{ width:min(100%,470px); filter:drop-shadow(0 34px 34px rgba(0,0,0,.45)); animation:scFloat 5s ease-in-out infinite; }
.sc-obj svg{ width:100%; height:auto; display:block; }
.sc-obj.in{ animation:scIn .75s cubic-bezier(.2,.8,.2,1), scFloat 5s ease-in-out .75s infinite; }
@keyframes scIn{ from{ opacity:0; transform:translateX(90px) scale(.75) rotate(8deg); } }
@keyframes scFloat{ 50%{ transform:translateY(-14px); } }
.sc-shadow{ width:50%; height:26px; border-radius:50%; background:rgba(0,0,0,.4); filter:blur(14px); margin-top:-4px; animation:scShadow 5s ease-in-out infinite; }
@keyframes scShadow{ 50%{ transform:scaleX(.82); opacity:.55; } }
.sc-caption{ text-align:center; margin-top:14px; } .sc-caption.in{ animation:pageIn .5s ease both; }
.sc-caption b{ display:block; font:var(--fdw) 22px var(--fd); } .sc-caption span{ color:rgba(255,255,255,.78); font-size:14px; }
.sc-side{ display:grid; gap:18px; justify-items:end; text-align:right; }
.sc-stat b{ display:block; font:var(--fdw) clamp(44px,5vw,66px)/1 var(--fd); } .sc-stat span{ color:rgba(255,255,255,.78); font-size:14px; }
.sc-lbl{ font-size:13px; color:rgba(255,255,255,.78); }
.sc-pills{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
.sc-pills button{ min-height:40px; padding:0 16px; border-radius:999px; border:0; background:rgba(0,0,0,.3); color:#fff; font:700 14px var(--fb); cursor:pointer; transition:.2s; }
.sc-pills button.on,.sc-pills button:hover{ background:#fff; color:#111; }
.sc-dots{ position:relative; z-index:1; display:flex; gap:6px; justify-content:center; margin-top:16px; }
.sc-dots i{ width:8px; height:8px; border-radius:4px; background:rgba(255,255,255,.35); transition:.3s; } .sc-dots i.on{ background:#fff; width:24px; }
.sc-thumb{ position:absolute; z-index:2; right:22px; bottom:20px; width:74px; height:74px; border-radius:16px; border:1.5px solid rgba(255,255,255,.25); background:rgba(0,0,0,.3); padding:6px; cursor:pointer; transition:.2s; }
.sc-thumb:hover{ transform:scale(1.08); background:rgba(0,0,0,.45); } .sc-thumb svg{ width:100%; height:100%; }
html[data-skin="defaut"] .frame{ padding-top:14px; }
@media (max-width:980px){
  .sc-body{ grid-template-columns:1fr 1fr; } .sc-side{ grid-column:1 / -1; justify-items:start; text-align:left; } .sc-pills{ justify-content:flex-start; } }
@media (max-width:760px){
  .showcase{ margin:-10px -10px 0; padding:12px 16px 22px; min-height:0; border-radius:var(--rf) var(--rf) 0 0; }
  .sc-brand{ display:none; } .sc-body{ grid-template-columns:1fr; gap:10px; }
  .sc-stage{ order:-1; } .sc-obj{ width:min(78%,320px); } .sc-thumb{ display:none; }
  .sc-text h1{ font-size:34px; } .sc-arrows{ margin-bottom:12px; } .sc-text .hero-cta{ flex-direction:column; align-items:flex-start; } }

/* =========================================================
   ANIMATIONS
   ========================================================= */
.page-in{ animation:pageIn .45s cubic-bezier(.2,.8,.2,1) both; }
@keyframes pageIn{ from{ opacity:0; transform:translateY(14px); } }
.mcard{ animation:cardIn .5s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i,0) * 70ms); position:relative; overflow:hidden; }
@keyframes cardIn{ from{ opacity:0; transform:translateY(24px) scale(.97); } }
.mcard:hover{ box-shadow:0 16px 36px -18px var(--c); }
.mcard::after{ content:''; position:absolute; inset:0; pointer-events:none; background:linear-gradient(115deg,transparent 35%,color-mix(in srgb,var(--pk) 16%,transparent) 50%,transparent 65%); transform:translateX(-100%); }
.mcard:hover::after{ transform:translateX(100%); transition:transform .7s ease; }
.mcard .ring{ animation:fill 1.2s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i,0) * 70ms + .15s); }
@keyframes fill{ from{ --p:0; } }
.ring.glow{ animation:fill 1.2s cubic-bezier(.2,.8,.2,1) both, glow 2.4s ease-in-out 1.4s infinite; }
@keyframes glow{ 50%{ box-shadow:0 0 20px -4px var(--c); } }
.btn::after{ content:''; position:absolute; top:0; bottom:0; width:40%; left:-60%; pointer-events:none; background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent); transform:skewX(-20deg); }
.btn:hover::after{ left:130%; transition:left .6s ease; }
.btn-ac{ animation:breathe 3s ease-in-out infinite; }
@keyframes breathe{ 50%{ box-shadow:0 0 0 6px color-mix(in srgb,var(--pk) 18%,transparent); } }
.tabbar a[aria-current="page"] svg{ animation:hop .45s cubic-bezier(.3,1.6,.5,1); }
@keyframes hop{ 40%{ transform:translateY(-5px) scale(1.12); } }

/* Accueil */
.art{ animation:artIn .9s cubic-bezier(.2,.8,.2,1) both; }
@keyframes artIn{ from{ clip-path:inset(0 0 100% 0 round var(--r)); } to{ clip-path:inset(0 0 0 0 round var(--r)); } }
.sway{ transform-box:fill-box; transform-origin:50% 90%; animation:sway 5s ease-in-out infinite alternate; animation-delay:calc(var(--sd) * -1); }
@keyframes sway{ to{ transform:rotate(2.5deg) translateY(-4px); } }
.petal{ animation:fall var(--dur) linear infinite; animation-delay:calc(var(--dl) * -1); }
@keyframes fall{ from{ transform:translate(0,0) rotate(0); } to{ transform:translate(var(--dx),720px) rotate(540deg); } }
.hero-title .w{ display:inline-block; animation:wordUp .8s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--d) * 70ms + .5s); }
@keyframes wordUp{ from{ opacity:0; transform:translateY(60%) rotate(6deg); } }
.hero-title small{ animation:pageIn .6s ease .4s both; }
.float-match{ animation:floatIn .8s cubic-bezier(.3,1.4,.5,1) .7s both, bob 5s ease-in-out 1.6s infinite; }
@keyframes floatIn{ from{ opacity:0; transform:translateY(30px) scale(.85); } }
@keyframes bob{ 50%{ translate:0 -8px; } }
.float-match .ring{ animation:fill 1.6s cubic-bezier(.2,.8,.2,1) .9s both, glow 2.4s ease-in-out 2.6s infinite; }
.bl > *{ animation:pageIn .6s cubic-bezier(.2,.8,.2,1) both; }
.bl > *:nth-child(2){ animation-delay:.1s; } .bl > *:nth-child(3){ animation-delay:.2s; }
.reveal{ opacity:0; transform:translateY(24px); transition:opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1); transition-delay:calc(var(--d,0) * 90ms); }
.reveal.in{ opacity:1; transform:none; }
.wbar div{ transform-origin:left; animation:grow .9s cubic-bezier(.2,.8,.2,1) both; animation-play-state:paused; }
.in .wbar div{ animation-play-state:running; }
@keyframes grow{ from{ transform:scaleX(0); } }
.score-art svg{ animation:spinSlow 18s linear infinite; }
@keyframes spinSlow{ to{ transform:rotate(360deg); } }

/* Formulaire */
.chip{ transition:background .15s, border-color .15s, color .15s, transform .15s; }
.chip:hover{ transform:translateY(-1px); border-color:var(--pk); }
.chip.pop{ animation:pop .3s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop{ 50%{ transform:scale(1.12); } }
.panel{ animation:pageIn .5s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i,0) * 80ms); }
.tags .field{ animation:pageIn .3s ease both; }
.err:not(:empty){ animation:shake .4s; }
@keyframes shake{ 20%,60%{ transform:translateX(-6px); } 40%,80%{ transform:translateX(6px); } }
.avatar-pick button{ transition:transform .2s cubic-bezier(.3,1.6,.5,1), border-color .15s; }
.avatar-pick button:hover{ transform:scale(1.08) rotate(-3deg); }

/* Profil joueur */
.pp-head .av{ animation:avIn .6s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes avIn{ from{ transform:scale(.4) rotate(-12deg); opacity:0; } }
.bd-row .bar i{ animation:grow 1s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--n) * 100ms + .4s); transform-origin:left; }
.gametag{ transition:transform .15s; }
.gametag:hover{ transform:translateX(4px); }
.online::before{ animation:ping 2s ease-out infinite; }
@keyframes ping{ 0%{ box-shadow:0 0 0 0 rgba(19,158,115,.6); } 100%{ box-shadow:0 0 0 8px rgba(19,158,115,0); } }
dialog[open]{ animation:dlgIn .3s cubic-bezier(.3,1.4,.5,1); }
dialog[open]::backdrop{ animation:fade .25s ease; }
@keyframes dlgIn{ from{ opacity:0; transform:translateY(20px) scale(.94); } }
@keyframes fade{ from{ opacity:0; } }
.spark{ position:fixed; width:9px; height:6px; border-radius:50%; pointer-events:none; z-index:60; animation:spark .9s cubic-bezier(.1,.7,.3,1) forwards; }
@keyframes spark{ to{ transform:translate(var(--x),var(--y)) rotate(var(--r)); opacity:0; } }


/* =========================================================
   EFFETS ANIMÉS PAR THÈME
   ========================================================= */
@keyframes spin{ to{ transform:rotate(360deg); } }
.frame{ position:relative; overflow:clip; }
.frame > main{ position:relative; z-index:1; }

/* Halos lumineux qui dérivent derrière le contenu */
.orbs{ position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden; border-radius:inherit; }
.orbs i{ position:absolute; left:var(--x); top:var(--y); width:var(--s); aspect-ratio:1; border-radius:50%;
  background:radial-gradient(circle,var(--c),transparent 66%); filter:blur(36px); opacity:var(--o);
  animation:orb var(--d) ease-in-out infinite alternate; animation-delay:calc(var(--dl) * -1); }
@keyframes orb{ 33%{ transform:translate(9vw,7vh) scale(1.18); } 66%{ transform:translate(-6vw,12vh) scale(.88); } 100%{ transform:translate(5vw,-6vh) scale(1.08); } }

/* Particules d'ambiance (pétales, feuilles, étincelles, bulles…) */
#fx{ position:fixed; inset:0; z-index:35; pointer-events:none; overflow:hidden; }
#fx .p{ position:absolute; left:var(--l); top:var(--t,-24px); will-change:transform,opacity; }
#fx .petal,#fx .leaf{ width:var(--w); height:calc(var(--w) * .62); background:var(--c); opacity:.75;
  animation:fxFall var(--dur) linear infinite; animation-delay:calc(var(--dl) * -1); }
#fx .petal{ border-radius:80% 0 80% 0; }
#fx .leaf{ border-radius:0 90% 0 90%; opacity:.6; }
@keyframes fxFall{
  0%{ transform:translate(0,0) rotate(0); }
  25%{ transform:translate(calc(var(--dx) * .5),28vh) rotate(calc(var(--r) * .3)); }
  50%{ transform:translate(calc(var(--dx) * -.3),56vh) rotate(calc(var(--r) * .6)); }
  100%{ transform:translate(var(--dx),112vh) rotate(var(--r)); } }
#fx .spk{ color:var(--c); font-size:var(--w); line-height:1; opacity:0; animation:fxTwinkle var(--dur) ease-in-out infinite; animation-delay:calc(var(--dl) * -1); }
@keyframes fxTwinkle{ 0%,100%{ opacity:0; transform:scale(.3) rotate(0); } 50%{ opacity:.75; transform:scale(1) rotate(120deg); } }
#fx .dot{ top:auto; bottom:-10px; width:var(--w); height:var(--w); border-radius:50%; background:var(--c); box-shadow:0 0 10px var(--c); opacity:0;
  animation:fxRise var(--dur) linear infinite; animation-delay:calc(var(--dl) * -1); }
@keyframes fxRise{ 0%{ opacity:0; transform:translate(0,0); } 10%{ opacity:.8; } 85%{ opacity:.5; } 100%{ opacity:0; transform:translate(var(--dx),-110vh); } }
#fx .bub{ top:auto; bottom:-30px; width:var(--w); height:var(--w); border-radius:50%; border:1.5px solid var(--c); opacity:0;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.8),transparent 40%);
  animation:fxBub var(--dur) ease-in infinite; animation-delay:calc(var(--dl) * -1); }
@keyframes fxBub{ 0%{ transform:translate(0,0); opacity:0; } 10%{ opacity:.6; } 50%{ transform:translate(calc(var(--dx) * .5),-55vh); } 90%{ opacity:.5; } 100%{ transform:translate(var(--dx),-115vh); opacity:0; } }

/* Transitions entre les pages */
#wipe{ position:fixed; inset:0; z-index:45; pointer-events:none; }
#wipe.slash::before{ content:''; position:absolute; left:-20%; top:48%; width:140%; height:4px; background:#C41E3A; box-shadow:0 0 14px rgba(196,30,58,.8);
  transform:rotate(-18deg) scaleX(0); transform-origin:left; animation:slash .55s cubic-bezier(.7,0,.2,1) forwards; }
@keyframes slash{ 55%{ transform:rotate(-18deg) scaleX(1); opacity:1; } 100%{ transform:rotate(-18deg) scaleX(1); opacity:0; } }
#wipe.panels i{ position:absolute; top:-5%; bottom:-5%; width:37%; background:#111 radial-gradient(rgba(255,255,255,.2) 1.3px,transparent 1.6px) 0 0/9px 9px;
  border-inline:4px solid #fff; transform:skewX(-8deg); animation:panelOut .5s cubic-bezier(.7,0,.3,1) forwards; animation-delay:calc(var(--i) * 70ms); }
#wipe.panels i:nth-child(1){ left:-5%; } #wipe.panels i:nth-child(2){ left:30%; } #wipe.panels i:nth-child(3){ left:65%; }
@keyframes panelOut{ to{ transform:skewX(-8deg) translateY(-112%); } }

html[data-skin="defaut"] .page-in, html[data-skin="lofi"] .page-in, html[data-skin="menthe"] .page-in{ animation:pageBlur .65s cubic-bezier(.2,.8,.2,1) both; }
@keyframes pageBlur{ from{ opacity:0; filter:blur(14px); transform:translateY(12px) scale(.99); } }
html[data-skin="soft"] .page-in{ animation:pageBloom .6s cubic-bezier(.3,1.4,.5,1) both; }
@keyframes pageBloom{ from{ opacity:0; transform:scale(.94); } }
html[data-skin="esth"] .page-in{ animation:pageIris .8s cubic-bezier(.6,0,.2,1) both; }
@keyframes pageIris{ from{ clip-path:circle(0% at 50% 18%); } to{ clip-path:circle(150% at 50% 18%); } }
html[data-skin="samurai"] .page-in{ animation:pageCut .6s cubic-bezier(.7,0,.2,1) .12s both; }
@keyframes pageCut{ from{ clip-path:polygon(0 0,0 0,-30% 100%,-30% 100%); } to{ clip-path:polygon(0 0,130% 0,100% 100%,-30% 100%); } }
html[data-skin="sombre"] .page-in{ animation:pageGlitch .5s steps(1) both; }
@keyframes pageGlitch{ 0%{ opacity:0; } 15%{ opacity:1; transform:translateX(-10px); clip-path:inset(8% 0 62% 0); filter:hue-rotate(80deg); }
  30%{ transform:translateX(8px); clip-path:inset(48% 0 18% 0); } 45%{ transform:translateX(-4px); clip-path:inset(0 0 0 0); filter:none; } 60%,100%{ transform:none; opacity:1; } }
html[data-skin="ocean"] .page-in{ animation:pageWave .7s cubic-bezier(.2,.8,.2,1) both; }
@keyframes pageWave{ from{ opacity:0; transform:translateY(40px); clip-path:inset(30% 0 0 0 round 60px); } to{ clip-path:inset(0 0 0 0 round 0); } }
html[data-skin="manga"] .page-in{ animation:pageManga .45s cubic-bezier(.3,1.6,.5,1) .22s both; }
@keyframes pageManga{ from{ opacity:0; transform:scale(.9) rotate(-1.5deg); } }

/* Titres animés */
html[data-skin="defaut"] .page-head h2::after, html[data-skin="menthe"] .page-head h2::after{
  content:'✺'; display:inline-block; margin-left:.3em; font-size:.55em; vertical-align:middle; color:var(--pk); animation:spin 7s linear infinite; }
html[data-skin="samurai"] :is(.page-head h2,.home-grid h2,.bl h2){ position:relative; isolation:isolate; width:fit-content; padding-bottom:6px; }
html[data-skin="samurai"] :is(.page-head h2,.home-grid h2,.bl h2)::after{ content:''; position:absolute; left:-4px; right:-12px; bottom:-2px; height:9px; z-index:-1;
  background:var(--pk); opacity:.85; border-radius:60% 30% 70% 20% / 80% 40% 60% 30%; transform:scaleX(0) skewX(-20deg); transform-origin:left;
  animation:brush .7s cubic-bezier(.7,0,.2,1) .5s forwards; }
@keyframes brush{ to{ transform:scaleX(1) skewX(-20deg); } }

@keyframes neon{ 0%,18%,22%,60%,63%,100%{ opacity:1; } 20%,61.5%{ opacity:.4; } }
html[data-skin="ocean"] :is(.page-head h2,.home-grid h2,.bl h2){ width:fit-content; padding-bottom:12px; animation:waveX 2s linear infinite;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='8'><path d='M0 4 Q10 0 20 4 T40 4' fill='none' stroke='%231F6FD1' stroke-width='2.5'/></svg>") 0 100%/40px 8px repeat-x; }

@keyframes softIn{ from{ transform:translateY(14px) scale(.94); opacity:0; } }

/* Survol des cartes */
html[data-skin="manga"] .mcard:hover{ transform:translate(-2px,-3px) rotate(-.6deg); }

@property --ang{ syntax:'<angle>'; inherits:false; initial-value:0deg; }
@keyframes angle{ to{ --ang:360deg; } }

  background:conic-gradient(from var(--ang),#8A6CF0,#FF8FC4,#5FCFAE,#FFE08A,#8A6CF0); animation:angle 3s linear infinite;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; }

/* Anneau qui tourne autour des grands pourcentages */
.ring-lg::after, .float-match .ring::after{ content:''; position:absolute; inset:-9px; border-radius:50%; border:1.5px dashed var(--c); opacity:.55; animation:spin 12s linear infinite; }

/* Bandeau de texte défilant (accueil) */
.marq{ overflow:hidden; margin:30px -14px 0; padding:16px 0; border-block:1.5px solid var(--line); white-space:nowrap; }
.marq-track{ display:inline-flex; align-items:center; gap:28px; padding-right:28px; animation:marq 34s linear infinite;
  font-family:var(--fd); font-weight:var(--fdw); font-size:clamp(26px,4vw,48px); line-height:1.1; text-transform:var(--case); }
.marq-track span{ color:transparent; -webkit-text-stroke:1.5px var(--pk); }
.marq-track span:nth-of-type(3n+1){ color:var(--pk); -webkit-text-stroke:0; }
.marq-track b{ color:var(--pk); font-size:.6em; display:inline-block; animation:spin 6s linear infinite; }
.marq:hover .marq-track{ animation-play-state:paused; }
@keyframes marq{ to{ transform:translateX(-50%); } }

/* Mot encadré dans le titre de l'accueil */
.hl{ position:relative; display:inline-block; padding:0 .14em; isolation:isolate; }
.hl::before{ content:''; position:absolute; inset:-.04em -.02em; z-index:-1; border:2px solid var(--pk); border-radius:var(--ri);
  background:color-mix(in srgb,var(--pk) 12%,transparent); transform:scaleX(0); transform-origin:left; animation:hlIn .6s cubic-bezier(.7,0,.2,1) 1s forwards; }
@keyframes hlIn{ to{ transform:scaleX(1); } }

/* Effets au clic */
.rip{ position:absolute; left:var(--x); top:var(--y); width:20px; height:20px; margin:-10px 0 0 -10px; border-radius:50%; background:currentColor; opacity:.3; pointer-events:none; animation:rip .6s ease-out forwards; }
@keyframes rip{ to{ transform:scale(16); opacity:0; } }
.fxp{ position:fixed; z-index:60; pointer-events:none; font-weight:700; font-style:normal; line-height:1; will-change:transform,opacity; }
.fxp.blob{ border-radius:50%; }
.fxp.neon{ box-shadow:0 0 8px 1px rgba(255,255,255,.7); }
.fxp.burst{ animation:fxBurst var(--t) cubic-bezier(.1,.7,.3,1) forwards; }
@keyframes fxBurst{ from{ transform:translate(-50%,-50%) scale(.4); opacity:1; } to{ transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(var(--r)); opacity:0; } }
.fxp.float{ animation:fxUp var(--t) ease-out forwards; }
@keyframes fxUp{ from{ transform:translate(-50%,-50%) scale(.5); opacity:0; } 20%{ opacity:1; } to{ transform:translate(calc(-50% + var(--dx)),calc(-50% - 90px)) scale(1.1) rotate(var(--r)); opacity:0; } }
.fxp.pow{ isolation:isolate; font:400 32px Bangers,Impact,sans-serif; color:#E3262F; -webkit-text-stroke:1.5px #111; paint-order:stroke fill; letter-spacing:.04em;
  filter:drop-shadow(3px 3px 0 #111); animation:pow var(--t) cubic-bezier(.3,1.8,.5,1) forwards; }
.fxp.pow::before{ content:''; position:absolute; inset:-22px -26px; z-index:-1; background:#FFE135;
  clip-path:polygon(50% 0,61% 28%,94% 14%,74% 44%,100% 60%,67% 66%,74% 100%,50% 78%,26% 100%,33% 66%,0 60%,26% 44%,6% 14%,39% 28%); }
@keyframes pow{ 0%{ transform:translate(-50%,-50%) scale(.2) rotate(-25deg); opacity:1; } 35%{ transform:translate(-50%,-50%) scale(1.15) rotate(-8deg); } 75%{ opacity:1; } 100%{ transform:translate(-50%,-80%) scale(1) rotate(-8deg); opacity:0; } }

@media (prefers-reduced-motion:reduce){ #fx,#wipe,.orbs,.fxp{ display:none !important; } .marq-track{ animation:none; } }

@media (prefers-reduced-motion:reduce){ *,*::before,*::after{ animation:none !important; transition:none !important; } .reveal{ opacity:1; transform:none; } }
</style>

<script>
/* =========================================================
   1. CONFIGURATION — tout ce qui se modifie facilement
   ========================================================= */
const CONFIG = {
  // Poids des critères (en points). Le score est normalisé sur 100,
  // donc la somme n'a pas besoin de faire exactement 100.
  // Mettre un poids à 0 désactive le critère.
  weights: { games:40, hours:25, style:15, days:10, platform:10, rank:6, language:5, country:4, voice:0, goal:0 },
  // Nombre de signalements ouverts avant masquage automatique d'un profil (en attendant la modération)
  autoHideReports: 3,
  // Score partiel quand l'un des deux joueurs a choisi « Les deux » / « Parfois »
  partialMatch: 0.6,
  minUsername: 3, maxUsername: 20, minPassword: 8,
  // Âge minimum pour utiliser le site
  minAge: 15,
  // Protection des mineurs : les 15-17 ans ne voient et ne sont vus que par des 15-17 ans,
  // les adultes uniquement par des adultes.
  adultAge: 18, separateMinors: true,
};

const GAMES = ['Free Fire','eFootball','Call of Duty Mobile','EA FC Mobile','PUBG Mobile','Fortnite','Roblox','Minecraft',
  'Dream League Soccer','Blood Strike','8 Ball Pool','Clash of Clans','Clash Royale','Brawl Stars','Mobile Legends',
  'EA Sports FC','Call of Duty','GTA V','Valorant','Apex Legends','League of Legends','Rocket League','Among Us',
  'Counter-Strike 2','Fall Guys','Overwatch 2'];
// Plateformes déduites des jeux (pour ne pas les demander à l'inscription)
const GAME_PLATFORMS = {'Free Fire':['mobile'],'eFootball':['mobile','ps','pc','xbox'],'Call of Duty Mobile':['mobile'],'EA FC Mobile':['mobile'],'PUBG Mobile':['mobile'],
  'Dream League Soccer':['mobile'],'Blood Strike':['mobile','pc'],'8 Ball Pool':['mobile'],'Clash of Clans':['mobile'],'Clash Royale':['mobile'],'Brawl Stars':['mobile'],'Mobile Legends':['mobile'],
  'Fortnite':['mobile','ps','pc','xbox','switch'],'Roblox':['mobile','pc','xbox','ps'],'Minecraft':['mobile','pc','ps','xbox','switch'],'Among Us':['mobile','pc','switch'],
  'EA Sports FC':['ps','pc','xbox'],'Call of Duty':['ps','pc','xbox'],'GTA V':['ps','pc','xbox'],'Valorant':['pc'],'Apex Legends':['ps','pc','xbox'],'League of Legends':['pc'],
  'Rocket League':['ps','pc','xbox','switch'],'Counter-Strike 2':['pc'],'Fall Guys':['ps','pc','xbox','switch'],'Overwatch 2':['ps','pc','xbox','switch']};
const TOP_GAMES = ['Free Fire','eFootball','Call of Duty Mobile','EA FC Mobile','PUBG Mobile','Fortnite','Roblox','Minecraft'];
const HOURS = [['matin','Matin'],['aprem','Après-midi'],['soir','Soir'],['nuit','Nuit']];
const DAYS = [['lun','Lun'],['mar','Mar'],['mer','Mer'],['jeu','Jeu'],['ven','Ven'],['sam','Sam'],['dim','Dim']];
const STYLES = [['comp','Compétitif'],['casual','Détente'],['both','Les deux']];
const GOALS = [['serieux','Jouer sérieusement'],['fun',"S'amuser"],['both','Les deux']];
const VOICE = [['oui','Vocal activé'],['parfois','Vocal parfois'],['non','Sans vocal']];
const PLATFORMS = [['mobile','Mobile'],['ps','PlayStation'],['pc','PC'],['xbox','Xbox'],['switch','Switch']];
const CRITERIA = {
  games:{label:'Jeux en commun', color:'#D9478A'}, hours:{label:'Horaires', color:'#9A6BE0'},
  style:{label:'Style de jeu', color:'#22B58A'}, days:{label:'Jours', color:'#F0A21E'},
  platform:{label:'Plateforme', color:'#3EA6E0'}, rank:{label:'Niveau proche', color:'#E05A92'}, language:{label:'Langue', color:'#5BC8A0'}, country:{label:'Pays', color:'#B8A36A'}, voice:{label:'Vocal', color:'#FF8A3D'}, goal:{label:'Objectif', color:'#C7F25B'},
};
const L = (list,v) => (list.find(x=>x[0]===v)||[,v])[1];

/* =========================================================
   2. DONNÉES DE DÉMO — à remplacer par l'API / la base de données
   ========================================================= */
const P = (id,name,hue,games,hours,days,style,goal,voice,platforms,discord,discordPublic,online,tags={}) =>
  ({id,name,avatar:{hue},games,hours,days,style,goal,voice,platforms,discord,discordPublic,online,tags});
let PLAYERS = [
  P('p1','KoffiNight',265,['Roblox','Minecraft','Free Fire'],['soir','nuit'],['ven','sam','dim'],'comp','serieux','oui',['pc','mobile'],'koffi.night',true,true,{Roblox:'KoffiNight_CI',Minecraft:'KoffiN'}),
  P('p2','ShadowPlayer',200,['Roblox','Fortnite'],['aprem','nuit'],['mer','sam','dim'],'casual','fun','parfois',['ps','pc'],'shadowplayer',true,false,{Fortnite:'Shad0w'}),
  P('p3','AwaBuild',150,['Minecraft','Roblox','Among Us'],['soir'],['lun','mar','mer','jeu'],'casual','fun','non',['pc','switch'],'awa.build',false,true),
  P('p4','DjeliSniper',10,['Valorant','Call of Duty','Counter-Strike 2'],['nuit'],['ven','sam'],'comp','serieux','oui',['pc'],'djeli',true,true,{Valorant:'Djeli#225'}),
  P('p5','MamadouFC',120,['EA Sports FC','eFootball'],['soir'],['mer','sam','dim'],'comp','serieux','oui',['ps'],'mamadou.fc',true,false),
  P('p6','YaoRush',30,['Fortnite','Apex Legends','Rocket League'],['aprem','soir'],['sam','dim'],'both','both','oui',['pc','xbox'],'yaorush',true,true),
  P('p7','FatouCraft',320,['Minecraft','Fall Guys'],['matin','aprem'],['mer','sam'],'casual','fun','parfois',['mobile','switch'],'fatoucraft',false,false),
  P('p8','Gbaka_225',45,['Free Fire','PUBG Mobile','Mobile Legends'],['soir','nuit'],['lun','ven','sam','dim'],'comp','serieux','oui',['mobile'],'gbaka225',true,true,{'Free Fire':'GBAKA225'}),
  P('p9','NdeyeGG',285,['League of Legends','Valorant'],['soir'],['mar','jeu','sam'],'both','serieux','oui',['pc'],'ndeyegg',true,false),
  P('p10','TchopKing',0,['GTA V','Call of Duty'],['nuit'],['ven','sam'],'casual','fun','oui',['ps','xbox'],'tchopking',true,true),
  P('p11','AmaraPlays',175,['Roblox','Brawl Stars','Clash Royale'],['aprem'],['mer','sam','dim'],'casual','fun','non',['mobile'],'amaraplays',false,false),
  P('p12','Ziggy_Abj',230,['Fortnite','Minecraft','Roblox'],['nuit'],['jeu','ven','sam'],'comp','both','oui',['pc','ps'],'ziggy.abj',true,true,{Roblox:'ZiggyAbj'}),
  P('p13','KouameV',190,['Valorant','Overwatch 2'],['soir','nuit'],['lun','mer','ven'],'comp','serieux','parfois',['pc'],'kouamev',true,false),
  P('p14','LenaBlitz',340,['Rocket League','EA Sports FC','Fortnite'],['matin','soir'],['sam','dim'],'both','fun','parfois',['xbox','pc'],'lenablitz',true,true),
  P('p15','Kassy_16',95,['Roblox','Minecraft','Brawl Stars'],['aprem','soir'],['mer','sam','dim'],'casual','fun','parfois',['mobile','pc'],'kassy16',false,true),
  P('p16','IbouGamer',60,['Fortnite','Free Fire','Roblox'],['soir','nuit'],['ven','sam'],'comp','both','oui',['mobile','ps'],'ibougamer',false,false),
];
// Âges des profils de démo (connus du serveur, jamais affichés publiquement)
const DEMO_AGES={p1:22,p2:19,p3:24,p4:27,p5:21,p6:20,p7:16,p8:23,p9:25,p10:29,p11:15,p12:17,p13:26,p14:22,p15:16,p16:17};
PLAYERS.forEach(p=>p.age=DEMO_AGES[p.id]);

/* ---- Âge ---- */
function ageFrom(dob){
  const d=new Date(dob+'T00:00:00'); if(!dob||isNaN(d)) return null;
  const n=new Date(); let a=n.getFullYear()-d.getFullYear();
  if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate())) a--;
  return a;
}
const ageOf = p => p.dob ? ageFrom(p.dob) : p.age;
const ageGroup = p => { const a=ageOf(p); if(a==null && p && p.ageGroup) return p.ageGroup; return (a ?? 0) >= CONFIG.adultAge ? 'adult' : 'minor'; };
// Sans profil avec âge, on ne montre que des profils adultes.
const sameGroup = p => !CONFIG.separateMinors || (S.me && S.me.dob ? ageGroup(p)===ageGroup(S.me) : ageGroup(p)==='adult');

/* =========================================================
   3. MOTEUR DE COMPATIBILITÉ
   ========================================================= */
const MATCHERS = {
  // Chevauchement de listes : moyenne de (communs/plus petite liste) et (communs/plus grande liste)
  overlap(a=[],b=[]){ if(!a.length||!b.length) return 0; const s=a.filter(x=>b.includes(x)).length;
    return (s/Math.min(a.length,b.length) + s/Math.max(a.length,b.length))/2; },
  // Choix simple avec option « mixte » (les deux / parfois)
  choice(a,b,mixed){ if(a===b) return 1; if(a===mixed||b===mixed) return CONFIG.partialMatch; return 0; },
};
const CRITERION_SCORE = {
  games:(a,b)=>MATCHERS.overlap(a.games,b.games),
  hours:(a,b)=>MATCHERS.overlap(a.hours,b.hours),
  days:(a,b)=>MATCHERS.overlap(a.days,b.days),
  style:(a,b)=>MATCHERS.choice(a.style,b.style,'both'),
  goal:(a,b)=>MATCHERS.choice(a.goal,b.goal,'both'),
  voice:(a,b)=>MATCHERS.choice(a.voice,b.voice,'parfois'),
  platform:(a,b)=>a.platforms.some(x=>b.platforms.includes(x)) ? 1 : 0,
  // Rang proche sur les jeux en commun (écart de niveau sur une échelle de 1 à 5)
  rank:(a,b)=>{ const sh=a.games.filter(g=>b.games.includes(g)); if(!sh.length) return 0; const ra=a.ranks||{}, rb=b.ranks||{};
    return sh.reduce((t,g)=>t+(ra[g]&&rb[g] ? 1-Math.abs(ra[g]-rb[g])/4 : .5),0)/sh.length; },
  language:(a,b)=>(a.langs||['fr']).some(x=>(b.langs||['fr']).includes(x)) ? 1 : 0,
  country:(a,b)=>a.country&&a.country===b.country ? 1 : 0,
};
function compat(a,b){
  const w = S.weights || CONFIG.weights;
  let total=0, sum=0; const detail=[];
  for(const k in w){ if(!w[k] || !CRITERION_SCORE[k]) continue;
    const s = CRITERION_SCORE[k](a,b); total+=w[k]; sum+=w[k]*s; detail.push({k,w:w[k],s}); }
  let pct = total ? Math.round(sum/total*100) : 0;
  // Avis après une partie : « je rejouerais avec lui » remonte le profil, l'inverse le descend
  const rv=a.id==='me'&&S.ratings?S.ratings[b.id]:0; if(rv===1) pct=Math.min(100,pct+5); if(rv===-1) pct=Math.max(0,pct-20);
  return { pct, detail,
    common:{ games:a.games.filter(g=>b.games.includes(g)), hours:a.hours.filter(h=>b.hours.includes(h)) } };
}
const tier = p => p>=80?'var(--hi)':p>=60?'var(--mid)':p>=40?'var(--warm)':'var(--lo)';

/* =========================================================
   4. ÉTAT LOCAL (prototype) — en production : API + base de données
   ========================================================= */
const KEY='matematch.v1';
const fresh = () => ({ skin:'defaut', auth:null, profiles:{}, accounts:{}, dobs:{}, requests:[], notifs:[], chats:{}, squads:[], joined:[], ratings:{}, unread:{}, hidden:[], banned:[], sort:'compat', me:null, mates:[], blocked:[], reports:[], weights:null,
  privacy:{ discord:true, tags:true, online:true } });
let S = (()=>{ try{ const r=localStorage.getItem(KEY); return r ? {...fresh(),...JSON.parse(r)} : fresh(); }catch(e){ return fresh(); } })();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const visible = () => PLAYERS.filter(p=>!S.blocked.includes(p.id) && !S.hidden.includes(p.id) && !S.banned.includes(p.id) && sameGroup(p));
const ranked = () => visible().map(p=>({p,c:compat(S.me,p)})).sort((x,y)=>y.c.pct-x.c.pct);

/* =========================================================
   5. COMPOSANTS D'AFFICHAGE
   ========================================================= */
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ring = (p,size='') => `<div class="ring ${size}${p>=80?' glow':''}" data-count="${p}" style="--p:${p};--c:${tier(p)}" role="img" aria-label="${p} % compatible"><span>${p}<small>%</small></span></div>`;
function avatar(u,size=48){
  const a=u.avatar||{hue:260};
  const minor = u.ageGroup==='minor' || (u.dob && ageGroup(u)==='minor');   // jamais de photo pour les 15-17 ans
  if(a.src && !minor) return `<img class="av" src="${esc(a.src)}" alt="" width="${size}" height="${size}" style="width:${size}px;height:${size}px">`;
  return `<span class="av" aria-hidden="true" style="width:${size}px;height:${size}px;--h:${a.hue};font-size:${Math.round(size*.36)}px">${esc((u.name||'?').slice(0,2).toUpperCase())}</span>`;
}
const list = (arr,map) => arr.length ? arr.map(map).join(' • ') : '—';

function matchCard({p,c}, top=false, i=0){
  return `<a class="mcard${top?' top-match':''}" href="#/joueur/${p.id}" style="--i:${i};--c:${c?tier(c.pct):'var(--line)'}">
    <div class="mc-head">${avatar(p,top?64:52)}<div><span class="mc-name">${esc(p.name)}${modBadge(p)}${dispoActive(p)?`<span class="tag-live">Dispo · ${esc(p.dispo.game)}</span>`:''}</span>${p.online?'<span class="online">En ligne</span>':''}</div>${c?ring(c.pct, top?'ring-lg':''):''}</div>
    <dl class="facts">
      <div><dt>${c?'Jeux en commun':'Jeux'}</dt><dd>${esc(list(c?c.common.games:p.games,g=>g))}</dd></div>
      <div><dt>Horaires</dt><dd>${list(p.hours,h=>L(HOURS,h))}</dd></div>
      <div><dt>Style</dt><dd>${L(STYLES,p.style)}</dd></div>
    </dl></a>`;
}
function chips(group,options,selected,single=false){
  return `<div class="chips" role="group">${options.map(([v,l])=>
    `<button type="button" class="chip" data-chip="${group}" data-val="${esc(v)}" ${single?'data-single="1"':''} aria-pressed="${[].concat(selected).includes(v)}">${esc(l)}</button>`).join('')}</div>`;
}
const toastEl=document.getElementById('toast'); let tt;
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>toastEl.classList.remove('show'),2400); }
const dlg=document.getElementById('dlg');
function modal(html, onOpen){ dlg.innerHTML=html; dlg.showModal(); onOpen&&onOpen(dlg); }
dlg.addEventListener('click',e=>{ if(e.target===dlg || e.target.closest('[data-close]')) dlg.close(); });

const PUBLIC_ROUTES=['bienvenue','connexion','inscription','cgu','confidentialite','cookies','remboursement','contact','aide','app'];
function route(){
  const [, name='accueil', arg] = location.hash.split('/');
  if(!S.auth && !PUBLIC_ROUTES.includes(name)){
    try{ if(name && name!=='accueil') sessionStorage.setItem('coopo_after_login', location.hash); }catch(e){}
    document.body.classList.add('logged-out');
    let invited=false; try{ invited=!!localStorage.getItem('coopo_ref'); }catch(e){}
    let known=false; try{ known=!!localStorage.getItem('coopo_known'); }catch(e){}
    const gate=invited?'#/inscription':(known?'#/connexion':'#/bienvenue');   // invité → inscription ; déjà venu → connexion ; nouveau → présentation
    if(location.hash!==gate){ location.replace(gate); return; }

  document.body.classList.toggle('logged-out', !S.auth);
  // Connecté mais profil pas encore rempli : seule la création du profil est accessible
  if(S.auth && !profileComplete() && !PUBLIC_ROUTES.includes(name) && name!=='profil'){
    if(dataPending()){ document.body.classList.add('no-profile'); loadingView('Coopô'); renderNav(''); return; }   // on attend de savoir si le profil existe
    try{ if(name && name!=='accueil') sessionStorage.setItem('coopo_after_profile', location.hash); }catch(e){}
    if(location.hash!=='#/profil'){ location.replace('#/profil'); return; }
  }
  document.body.classList.toggle('no-profile', !!S.auth && !profileComplete());

  if(name.startsWith('@')){ const nm=decodeURIComponent(name.slice(1)).toLowerCase(); const p=PLAYERS.find(x=>x.name.toLowerCase()===nm); document.body.classList.remove('is-home'); viewPlayer(S.me&&S.me.name.toLowerCase()===nm?'me':(p?p.id:'?')); renderNav(''); window.scrollTo(0,0); app.firstElementChild?.classList.add('page-in'); animateAfterRender(); return; }
  const v = views[name] || viewHome;

  document.body.classList.toggle('is-home', v===viewHome);

const RM = matchMedia('(prefers-reduced-motion: reduce)');
function countUp(el){
  const target=+el.dataset.count, span=el.querySelector('span'); if(!span||RM.matches) return;
  const card=el.closest('.mcard'), delay=(card?+(card.style.getPropertyValue('--i')||0)*70+150:el.closest('.float-match')?900:0);
  const dur=1200, t0=performance.now()+delay;
  const tick=t=>{ const k=Math.min(1,Math.max(0,(t-t0)/dur)), e=1-Math.pow(1-k,3);
    span.firstChild.nodeValue=Math.round(target*e); if(k<1) requestAnimationFrame(tick); };
  span.firstChild.nodeValue='0'; requestAnimationFrame(tick);
}
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }),{threshold:.2}) : null;
function animateAfterRender(root=app){
  root.querySelectorAll('.ring[data-count]').forEach(countUp);
  root.querySelectorAll('.reveal').forEach(el=> io ? io.observe(el) : el.classList.add('in'));
  root.querySelectorAll('.panel').forEach((p,i)=>p.style.setProperty('--i',i));
}
function burst(x,y){
  if(RM.matches) return;
  const cols=['#D9478A','#FF93BB','#FFC6DB','#F04E8C','#9A6BE0'];
  for(let i=0;i<26;i++){ const s=document.createElement('i'); s.className='spark';
    const a=Math.random()*Math.PI*2, d=60+Math.random()*90;
    s.style.cssText=`left:${x}px;top:${y}px;background:${cols[i%5]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px;--r:${Math.random()*540}deg`;
    document.body.appendChild(s); setTimeout(()=>s.remove(),850); }
}

function bloomSVG(){
  let seed=11; const R=()=>(seed=(seed*16807)%2147483647,(seed-1)/2147483646);
  const W=1200,H=640; let leaves='',flowers='',petals='';
  const greens=['#4E7A4A','#3D6640','#6B9A5A','#2F5236','#5C8C50'];
  for(let i=0;i<80;i++){ const x=R()*W|0,y=R()*H|0,rx=30+R()*55|0;
    leaves+=`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${rx*.36|0}" transform="rotate(${R()*180|0} ${x} ${y})" fill="${greens[i%5]}"/>`; }
  const pinks=['#F04E8C','#F77BAA','#FBA6C6','#E23C7A','#FFC6DB','#D9447F','#FF93BB'];
  for(let i=0;i<48;i++){ const cx=R()*W, cy=R()*H, r=40+R()*75; let g=''; const n=14+(R()*12|0);
    for(let j=0;j<n;j++){ const a=R()*6.283, d=R()*r, pr=10+R()*17, fx=cx+Math.cos(a)*d|0, fy=cy+Math.sin(a)*d|0;
      g+=`<circle cx="${fx}" cy="${fy}" r="${pr|0}" fill="${pinks[R()*7|0]}"/>`;
      if(R()>.55) g+=`<circle cx="${fx-pr*.3|0}" cy="${fy-pr*.3|0}" r="${pr*.3|0}" fill="#FFE6F0" opacity=".85"/>`; }
    flowers+=`<g class="sway" style="--sd:${(R()*5).toFixed(1)}s">${g}</g>`; }
  for(let i=0;i<16;i++){ petals+=`<ellipse class="petal" cx="${R()*W|0}" cy="-20" rx="${6+R()*4|0}" ry="4" fill="${['#FFD3E4','#FFB3CF','#FFFFFF'][i%3]}" opacity=".9" style="--dur:${(9+R()*7).toFixed(1)}s;--dl:${(R()*14).toFixed(1)}s;--dx:${(R()*240-120)|0}px"/>`; }
  return `<svg class="bloom" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="${W}" height="${H}" fill="#3A6340"/>${leaves}${flowers}${petals}</svg>`;
}

function initDob(){
  const D=document.getElementById('dob-d'); if(!D) return;
  const M=document.getElementById('dob-m'), Y=document.getElementById('dob-y'), st=document.getElementById('dob-status');
  const update=animate=>{
    const max = M.value ? new Date(+Y.value||2000, +M.value, 0).getDate() : 31;
    [...D.options].forEach(o=>{ if(o.value) o.disabled = +o.value>max; });
    if(+D.value>max) D.value='';
    [D,M,Y].forEach(x=>x.classList.toggle('filled',!!x.value));
    if(D.value && M.value && Y.value){
      draft.dob=`${Y.value}-${M.value.padStart(2,'0')}-${D.value.padStart(2,'0')}`;
      const a=ageFrom(draft.dob);
      if(a<CONFIG.minAge){ st.className='dob-status bad'; st.innerHTML=`<b>${a} ans</b><span>Il faut avoir au moins ${CONFIG.minAge} ans pour utiliser Coopô.</span>`; }
      else{ const minor=a<CONFIG.adultAge; st.className='dob-status ok';
        st.innerHTML=`<b>${a} ans</b><span>${!CONFIG.separateMinors?'Parfait, tu peux trouver ton mate.':minor?`Tu verras les joueurs de ${CONFIG.minAge} à ${CONFIG.adultAge-1} ans.`:`Tu verras les joueurs de ${CONFIG.adultAge} ans et plus.`}</span>`; }
      if(animate){ st.classList.remove('pop'); void st.offsetWidth; st.classList.add('pop'); }
    } else { draft.dob=''; st.className='dob-status'; st.textContent=''; }
  };
  [D,M,Y].forEach(x=>x.addEventListener('change',()=>update(true)));
  update(false);
}
function toggleChip(c){
  c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
  const g=c.dataset.chip, v=c.dataset.val;
  if(c.dataset.single){ draft[g]=v; c.parentElement.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',b===c)); return; }
  const on = c.getAttribute('aria-pressed')!=='true'; c.setAttribute('aria-pressed',on);

  if(g==='games') renderTags();
}

function pwStrength(p){ let s=0; if(p.length>=CONFIG.minPassword) s++; if(/[a-zA-Z]/.test(p)&&/\d/.test(p)) s++; if(/[^a-zA-Z0-9]/.test(p)) s++; if(p.length>=12) s++; return p?Math.max(s,1):0; }
function loadAvatar(file){

  const img=new Image(), url=URL.createObjectURL(file);
  img.onload=()=>{ const c=document.createElement('canvas'); c.width=c.height=160; const x=c.getContext('2d'), m=Math.min(img.width,img.height);
    x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,160,160); draft.avatar={src:c.toDataURL('image/jpeg',.85)}; URL.revokeObjectURL(url);
    document.querySelectorAll('[data-hue]').forEach(b=>b.setAttribute('aria-pressed','false')); document.getElementById('av-prev').innerHTML=avatar(draft,48); };
