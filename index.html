/* ==== Finitions (novembre 2026) : profondeur des cartes, fond propre à chaque thème, barre d'onglets, accueil compact, page Profil ==== */
:root{   /* valeurs simples d'abord : les navigateurs plus anciens gardent un filet et une ombre */
  --hair:var(--line);
  --e1:0 1px 2px rgba(20,16,40,.06), 0 8px 22px -14px rgba(20,16,40,.3);
  --e2:0 2px 6px rgba(20,16,40,.08), 0 20px 42px -20px rgba(20,16,40,.38);
}
@supports (color:color-mix(in srgb,red 50%,blue)){ :root{
  --hair:color-mix(in srgb,var(--line) 78%,transparent);   /* filet fin autour des cartes */
  --e1:0 1px 2px color-mix(in srgb,var(--tx) 6%,transparent), 0 8px 22px -14px color-mix(in srgb,var(--pk) 45%,transparent);    /* carte posée : ombre à la couleur du thème */
  --e2:0 2px 6px color-mix(in srgb,var(--tx) 8%,transparent), 0 20px 42px -20px color-mix(in srgb,var(--pk) 58%,transparent);   /* carte soulevée */
} }
/* Thèmes clairs : même logique partout — page légèrement teintée, cartes blanches */
html[data-skin="soft"]{ --bg:#FFF5F9; --s1:#FFFFFF; --s2:#FCE3ED; --field:#FFFFFF; --glass-solid:#FFFFFF; --mu:#7C4B64; --pk2:#A92B64; }
/* texte secondaire un peu plus foncé là où la marge de contraste était mince : il reste lisible sur le fond décoré */
html[data-skin="lofi"]{ --mu:#46607A; }
html[data-skin="esth"]{ --mu:#5F5889; }
/* Thèmes sombres : pas d'ombre colorée (invisible sur fond sombre) mais un liseré de lumière en haut des cartes */
html[data-skin="sombre"]{
  --e1:inset 0 1px 0 rgba(255,255,255,.06), 0 14px 30px -18px rgba(0,0,0,.75);
  --e2:inset 0 1px 0 rgba(255,255,255,.09), 0 22px 44px -18px rgba(0,0,0,.85), 0 0 0 1px rgba(120,86,255,.35);
}

/* ---- Cartes : blanches (ou plus claires que la page), filet fin, ombre douce de la couleur du thème ---- */
.mcard{ background:var(--s1); border:1px solid var(--hair); box-shadow:var(--e1); }
.panel,.chat-row,.online-card,.filters,.pp-side{ border:1px solid var(--hair); box-shadow:var(--e1); }
.chat-box{ border:1px solid var(--hair); }
.top-match{ background:var(--s1); border-color:color-mix(in srgb,var(--pk) 45%,var(--line)); box-shadow:var(--e2); }
@media (hover:hover){ .mcard:hover{ transform:translateY(-2px); box-shadow:var(--e2); border-color:color-mix(in srgb,var(--pk) 40%,var(--line)); } }
.mcard:active,.chat-row:active,.online-card:active,.menu-row:active,.todo-item:active{ transform:scale(.985); }
.dispo-card,.an-row,.mate-pill,.google-note,.skin,.chip,.pulse-chip{ border-width:1px; }
.empty{ border:1px dashed color-mix(in srgb,var(--pk) 32%,var(--line)); }
html[data-skin="samurai"] :is(.menu,.list-card,.dz,.chat-row,.online-card,.search-entry){ box-shadow:5px 5px 0 rgba(196,30,58,.14); }   /* Samouraï garde son ombre d'estampe */
html[data-skin="esth"] :is(.mcard,.panel,.menu,.list-card,.dz){ border-color:transparent; background:linear-gradient(var(--s1),var(--s1)) padding-box,linear-gradient(120deg,#C9B8FF,#FFC2DF,#BFF0E0,#C9B8FF) border-box; }

/* ---- Boutons, puces, champs ---- */
.btn{ transition:transform .12s ease, box-shadow .2s ease, filter .2s ease; }
.btn:active{ transform:scale(.97); }
.btn-ac{ background-image:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.13)); box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 10px 22px -12px color-mix(in srgb,var(--pk) 85%,transparent), 0 0 0 0 color-mix(in srgb,var(--pk) 18%,transparent); animation:none; }
/* un seul bouton « respire » par écran : l'action principale (dispo, création de compte, demande de mate) — plus tous les boutons à la fois */
.dispo-cta,.wl-cta .btn-ac,#mate{ animation:breathe2 3s ease-in-out infinite; }
html:is([data-skin="defaut"],[data-skin="sombre"]) .dispo-cta{ box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 10px 30px -12px rgba(160,210,30,.55), 0 0 0 0 rgba(190,235,60,.28); animation-name:breatheLime; }
@keyframes breatheLime{ 50%{ box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 10px 30px -12px rgba(160,210,30,.55), 0 0 0 7px rgba(190,235,60,.28); } }
@keyframes breathe2{ 50%{ box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 10px 22px -12px color-mix(in srgb,var(--pk) 85%,transparent), 0 0 0 6px color-mix(in srgb,var(--pk) 18%,transparent); } }
.chip{ background:var(--s1); }
.chip[aria-pressed="true"]{ background:var(--pk); box-shadow:0 8px 16px -10px color-mix(in srgb,var(--pk) 85%,transparent); }
:is(a,button,summary,.chip):focus-visible{ outline:2px solid var(--pk); outline-offset:2px; }
::selection{ background:color-mix(in srgb,var(--pk) 28%,transparent); color:var(--tx); }
html{ caret-color:var(--pk); scrollbar-color:color-mix(in srgb,var(--pk) 45%,var(--line)) transparent; }
h1,h2,h3,.btn{ text-wrap:balance; }
.pp-side .btn{ padding-inline:14px; }
[data-install-box] .hint + .btn{ margin-top:12px; }
.ring span,.cnt,.tb-badge,.badge,.count,.todo-item b{ font-variant-numeric:tabular-nums; }

/* message court en bas d'écran : il prend la largeur de son texte (il n'est plus coincé dans une demi-largeur) */
.toast{ left:16px; right:16px; width:fit-content; max-width:calc(100% - 32px); margin-inline:auto; text-align:center; transform:translateY(20px); box-shadow:0 12px 28px -12px rgba(0,0,0,.5); }
.toast.show{ transform:translateY(0); }
/* ---- En-tête : translucide, le fond du thème passe dessous ---- */
.top{ background:none; border-radius:0; }
.top::before{ content:''; position:fixed; z-index:-1; top:0; left:0; right:0; height:calc(var(--top-h,76px) + env(safe-area-inset-top,0px)); background:var(--bg);   /* fond de l'en-tête quand la page a défilé : fixé en haut de l'écran, d'un bord à l'autre, sans rien faire déborder */
  -webkit-mask-image:linear-gradient(#000 calc(100% - 16px),transparent); mask-image:linear-gradient(#000 calc(100% - 16px),transparent); }
@supports ((-webkit-backdrop-filter:blur(2px)) or (backdrop-filter:blur(2px))) and (color:color-mix(in srgb,red 50%,blue)){
  html:not(.lite) .top::before{ background:color-mix(in srgb,var(--bg) 78%,transparent); -webkit-backdrop-filter:saturate(1.4) blur(14px); backdrop-filter:saturate(1.4) blur(14px); }
  @media (max-width:860px){ html:not(.lite) .tabbar{ background:color-mix(in srgb,var(--s1) 90%,transparent); -webkit-backdrop-filter:saturate(1.5) blur(16px); backdrop-filter:saturate(1.5) blur(16px); } }
}
.notif-btn,.skin-btn{ border-width:1px; border-color:var(--hair); background:var(--s1); box-shadow:var(--e1); }
.page-head{ margin-bottom:18px; }
.page-head p{ color:var(--mu); max-width:60ch; }
.back{ display:inline-flex; align-items:center; gap:4px; min-height:40px; margin:-6px 0 6px -8px; padding:0 14px 0 8px; border-radius:999px; color:var(--mu); font-weight:600; font-size:14px; text-decoration:none; }
.back:hover{ background:var(--s2); color:var(--tx); }
.chat-head .back{ margin:0 0 0 -8px; flex:none; }
.chat-form input,.range-row > input[type="text"]{ flex:1 1 0; min-width:0; } .chat-form .btn,.range-row > .btn{ flex:none; }   /* le champ rétrécit, pas le bouton */
.chat-who{ flex:none; max-width:100%; } .chat-who > div{ display:grid; min-width:0; line-height:1.25; } .chat-who b{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .chat-who span{ white-space:nowrap; }
.chat-contacts{ flex:1 1 0; min-width:0; justify-content:flex-end; }
@media (max-width:860px){ .chat-who{ flex:1 1 0; min-width:0; } .chat-contacts{ flex:1 1 100%; justify-content:flex-start; } }

/* ---- Barre d'onglets du bas : flottante, l'onglet actif dans une pastille ---- */
@media (max-width:860px){
  .tabbar{ left:10px; right:10px; bottom:calc(8px + env(safe-area-inset-bottom,0px)); padding:6px; border:1px solid var(--hair); border-radius:26px;
    background:var(--s1); box-shadow:0 16px 36px -16px rgba(12,10,28,.5), 0 2px 6px rgba(12,10,28,.08); }
  .tabbar a{ padding:4px 0 3px; gap:2px; border-radius:20px; font-size:11px; font-weight:600; color:var(--mu); -webkit-tap-highlight-color:transparent; }
  .tabbar .tb-ico{ display:grid; place-items:center; width:56px; max-width:100%; height:30px; border-radius:999px; transition:background .2s ease, color .2s ease, transform .12s ease; }
  .tabbar svg{ width:23px; height:23px; }
  .tabbar a[aria-current="page"]{ color:var(--tx); font-weight:700; }
  .tabbar a[aria-current="page"] .tb-ico{ background:var(--pk); color:var(--on-pk); box-shadow:0 8px 16px -8px color-mix(in srgb,var(--pk) 85%,transparent); }
  .tabbar a:active .tb-ico{ transform:scale(.9); }
  .tabbar .tb-badge{ top:1px; left:calc(50% + 9px); box-shadow:0 0 0 2px var(--s1); }
  html[data-skin="samurai"] .tabbar a{ font-size:10px; letter-spacing:.02em; }
  @media (max-width:400px){ .tabbar{ left:6px; right:6px; padding:6px 3px; } .tabbar a{ font-size:10px; } .tabbar .tb-ico{ width:46px; } html[data-skin="samurai"] .tabbar a{ font-size:9px; letter-spacing:0; } }   /* petits écrans : les 6 mots tiennent en entier */
  @media (max-width:340px){ .tabbar a{ font-size:9.5px; } .tabbar .tb-ico{ width:40px; } html[data-skin="samurai"] .tabbar a{ font-size:8.5px; } }
  .facts div{ grid-template-columns:116px 1fr; }
  .frame{ padding-bottom:104px; }
  .toast{ bottom:calc(98px + env(safe-area-inset-bottom,0px)); }
  body:has(.chat-page) .toast{ bottom:calc(152px + env(safe-area-inset-bottom,0px)); }   /* conversation : le message ne cache pas le champ d'écriture */
  body:is(.logged-out,.no-profile) .toast{ bottom:calc(24px + env(safe-area-inset-bottom,0px)); }   /* pas de barre d'onglets sur ces écrans */
  .form-actions{ bottom:calc(82px + env(safe-area-inset-bottom,0px)); }
  .page{ padding-top:16px; }
  .chat-page{ min-height:0; padding-bottom:0; height:calc(100vh - 164px); height:calc(100svh - 164px - env(safe-area-inset-bottom,0px)); }
  .chat-box{ flex:1 1 0; min-height:0; max-height:none; }
  @media (max-height:560px){ .chat-page{ height:auto; } .chat-box{ flex:none; height:300px; } }
}

/* ---- Accueil : bandeau court avec le dessin du thème ---- */
.mh{ position:relative; isolation:isolate; overflow:hidden; display:flex; flex-direction:column; justify-content:space-between; gap:18px; min-height:232px; margin:-14px -14px 0; padding:14px 18px 20px; color:#fff; background:var(--art-bg,var(--pk)); border-radius:0 0 28px 28px; }
.mh{ --scrim:10,6,36; }   /* couleur du halo sous le bonjour */
html[data-skin="samurai"] .mh{ --scrim:46,8,16; } html[data-skin="soft"] .mh{ --scrim:104,20,60; } html[data-skin="lofi"] .mh{ --scrim:8,44,84; } html[data-skin="esth"] .mh{ --scrim:52,26,104; }
.mh :focus-visible{ outline-color:#fff; }
.mh-hello{ margin:0; font-weight:600; font-size:15px; color:#fff; text-shadow:0 0 2px rgba(var(--scrim),.9),0 1px 10px rgba(var(--scrim),.85),0 0 22px rgba(var(--scrim),.7); }
.mh-body h1{ margin:2px 0 0; font:var(--fdw) clamp(30px,8vw,48px)/1.04 var(--fd); color:#fff; text-transform:var(--case); letter-spacing:-.01em; text-shadow:0 0 3px rgba(var(--scrim),.85),0 2px 16px rgba(var(--scrim),.8),0 0 34px rgba(var(--scrim),.6); overflow-wrap:anywhere; }
.mh-body h1.long{ font-size:clamp(21px,6.2vw,40px); }   /* pseudo long : plus petit, pour rester sur une ligne */
.mh-online{ display:inline-flex; align-items:center; margin:12px 0 0; padding:6px 13px 6px 11px; border-radius:999px; background:rgba(8,6,26,.55); border:1px solid rgba(255,255,255,.18); font-size:13px; font-weight:600; color:#fff; }
.home .home-top{ padding-top:16px; gap:14px; }
@media (min-width:861px){ .home .home-top{ padding-top:22px; } }
/* sections de l'accueil : le titre est posé sur la page, le contenu dans une seule carte */
.home-sec{ display:grid; gap:10px; min-width:0; margin-top:6px; }
.home-sec > .dispo-head{ margin:0; padding:0 2px; min-height:32px; }
.home-sec .linkbtn{ color:var(--pk2,var(--pk)); font-weight:600; font-size:14px; text-decoration:none; padding:6px 2px 6px 8px; }
.dispo-sec .dispo-cta{ width:100%; justify-content:center; min-height:52px; font-size:16px; }
.dispo-sec .dispo-empty{ margin:0; }
.dz-row{ display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x proximity; scrollbar-width:none; margin:0 -22px; padding:4px 22px 14px; scroll-padding-inline:22px; }
.dz-row::-webkit-scrollbar{ display:none; }
.dz{ flex:none; width:136px; display:grid; align-content:space-between; justify-items:center; gap:10px; padding:16px 10px 10px; border-radius:var(--rc); background:var(--s1); border:1px solid var(--hair); box-shadow:var(--e1); scroll-snap-align:start; text-align:center; }
.dz-who{ display:grid; justify-items:center; gap:1px; width:100%; min-width:0; text-decoration:none; color:inherit; }
.dz-who .av{ margin-bottom:8px; border-radius:50% !important; box-shadow:0 0 0 2px var(--s1), 0 0 0 4px var(--hi); }   /* anneau « en direct » */
.dz-who b{ max-width:100%; font-size:14px; color:var(--tx); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dz-who span{ max-width:100%; font-size:13px; color:var(--mu); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dz.same .dz-who span{ color:var(--hi-tx); font-weight:600; }
.dz-who small{ font-size:12px; color:var(--mu); }
.dz .btn{ width:100%; min-height:38px; padding-inline:8px; }
.dz .dc-sent{ display:grid; place-items:center; min-height:38px; }
.list-card{ display:grid; background:var(--s1); border:1px solid var(--hair); border-radius:var(--rc); box-shadow:var(--e1); overflow:hidden; }
.list-card.pad{ gap:12px; padding:16px; }
.list-card.rows{ margin:0; gap:0; }
.list-card .row{ grid-template-columns:auto minmax(0,1fr) auto; gap:12px; padding:10px 14px; border-bottom:0; border-top:1px solid var(--hair); }
.list-card > :first-child{ border-top:0; }
.list-card .row .av{ border-radius:50%; }
.list-card .row b{ font-size:15px; }
.list-card .row p{ color:var(--mu); font-size:13px; white-space:normal; overflow:visible; }
.lc-row{ display:flex; align-items:center; gap:12px; min-height:64px; padding:10px 14px; border-top:1px solid var(--hair); color:var(--tx); text-decoration:none; }
.lc-row .av{ flex:none; border-radius:50%; }
.lc-txt{ flex:1; min-width:0; display:grid; gap:1px; }
.lc-txt b{ font-size:15px; overflow-wrap:anywhere; }
.lc-txt small{ font-size:13px; color:var(--mu); }
.lc-txt em{ font-style:normal; font-weight:700; color:var(--pk2,var(--pk)); }
@media (hover:hover){ .list-card :is(.row,.lc-row):hover{ background:color-mix(in srgb,var(--pk) 6%,transparent); transform:none; } }
@media (min-width:861px){
  .home .home-top{ grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); column-gap:28px; align-items:start; }
  .home-top > :is(.todo,.dispo-sec){ grid-column:1 / -1; }
  .todo{ grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); }
  .dispo-sec .dispo-cta{ width:auto; justify-self:start; padding-inline:28px; }
  .dz-row{ margin:0; padding:4px 2px 14px; scroll-padding-inline:2px; }
}
@media (min-width:901px){ .pp{ grid-template-rows:auto 1fr; } }   /* ordinateur : plus de vide entre le nom du joueur et ses jeux */
/* fiche joueur : rappel « dispo maintenant » */
.pp-dispo{ flex:1 1 100%; display:flex; align-items:flex-start; gap:2px; margin:0; padding:10px 14px; border-radius:var(--ri); background:color-mix(in srgb,var(--hi) 12%,transparent); border:1px solid color-mix(in srgb,var(--hi) 40%,transparent); font-size:14px; color:var(--tx); }
.pp-dispo .dot-live{ flex:none; margin-top:5px; }
.pp-dispo em{ display:block; font-style:normal; color:var(--mu); }
/* fenêtre d'un thème : le vrai dessin du thème en aperçu, son nom posé dessus, ses trois couleurs dans le coin */
.buy-art{ position:relative; overflow:hidden; height:150px; margin:0 0 14px; border-radius:16px; background:var(--a); box-shadow:inset 0 0 0 1px rgba(0,0,0,.08), var(--e1); }
@supports (aspect-ratio:1){ .buy-art{ height:auto; aspect-ratio:16 / 9; } }
.buy-art-img{ position:absolute; inset:0; }
.buy-art-img::after{ content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(10,8,24,.1) 0,rgba(10,8,24,.12) 32%,rgba(10,8,24,.86) 100%); }
.buy-art-txt{ position:absolute; left:14px; right:14px; bottom:12px; }
.buy-art-txt h3{ margin:0 0 2px; color:#fff; font:var(--fdw) 22px/1.15 var(--fd); text-transform:var(--case); text-shadow:0 1px 10px rgba(10,8,24,.7); }
.buy-art-txt p{ margin:0; color:#fff; font-size:14px; line-height:1.35; text-shadow:0 1px 8px rgba(10,8,24,.8); }
.buy-pal{ position:absolute; right:10px; top:10px; display:flex; gap:6px; padding:6px 8px; border-radius:999px; background:rgba(12,10,24,.55); }
.buy-pal i{ width:14px; height:14px; border-radius:50%; background:var(--a); box-shadow:0 0 0 1.5px rgba(255,255,255,.85); }
.buy-pal i:nth-child(2){ background:var(--b); } .buy-pal i:nth-child(3){ background:var(--c2); }
.nw{ white-space:nowrap; font-style:normal; } .buy-opt strong{ white-space:nowrap; }
/* à traiter : demandes de mate et messages non lus */
.todo{ display:grid; gap:8px; }
.todo-item{ display:flex; align-items:center; gap:12px; width:100%; min-height:54px; padding:10px 14px 10px 12px; border:1px solid color-mix(in srgb,var(--pk) 35%,var(--line)); border-radius:var(--rc); background:color-mix(in srgb,var(--pk) 9%,var(--s1)); color:var(--tx); font:600 15px var(--fb); text-align:left; text-decoration:none; cursor:pointer; }
.todo-item b{ flex:none; display:grid; place-items:center; min-width:28px; height:28px; padding:0 8px; border-radius:999px; background:var(--pk); color:var(--on-pk); font:700 14px var(--fb); }
.todo-item span{ flex:1; min-width:0; }
.todo-item svg{ flex:none; color:var(--mu); }

/* ---- Matchs : entrée de recherche, tri, rappel de profil ---- */
.search-entry{ display:flex; align-items:center; gap:10px; min-height:50px; padding:0 16px; margin-bottom:14px; border:1px solid var(--line); border-radius:999px; background:var(--field); color:var(--mu); text-decoration:none; font-weight:500; box-shadow:var(--e1); }
.search-entry svg{ flex:none; color:var(--pk2,var(--pk)); }
.search-entry span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sort-row{ align-items:center; margin-bottom:18px; }
.sort-row .chip{ flex:0 1 auto; min-width:0; padding-inline:13px; }
.sort-row .chip[aria-pressed="true"]::before{ content:none; }   /* la puce pleine suffit : pas de coche */
@media (max-width:480px){ .sort-row .sort-lbl{ flex:1 1 100%; margin:0 0 -2px; } .sort-row .chip{ flex:1 1 0; padding-inline:8px; line-height:1.15; } }   /* téléphone : « Trier par » au-dessus, deux puces de même largeur (tient avec toutes les polices des thèmes) */
.sort-lbl{ flex:none; white-space:nowrap; font-size:13px; font-weight:600; color:var(--mu); margin-right:2px; }
a.nudge{ padding:12px 14px; margin-bottom:14px; border:1px dashed color-mix(in srgb,var(--pk) 40%,var(--line)); border-radius:var(--rc); background:color-mix(in srgb,var(--pk) 6%,transparent); }
a.nudge > div{ flex:1; min-width:0; } a.nudge b{ display:block; } a.nudge span:not(.nudge-go){ font-size:13px; color:var(--mu); }
.nudge-go{ flex:none; display:grid; place-items:center; width:32px; height:32px; border-radius:50%; background:var(--pk); color:var(--on-pk) !important; }
/* ---- Recherche : jeux du moment (une ligne qui défile) ---- */
.pulse{ margin-bottom:16px; } .pulse > b{ font-size:13px; font-weight:600; color:var(--mu); }
.pulse-list{ flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; padding:2px 0 4px; } .pulse-list::-webkit-scrollbar{ display:none; }
.pulse-chip{ flex:none; cursor:pointer; font-family:inherit; background:var(--s1); min-height:38px; }
.pulse-chip.on{ background:var(--pk); border-color:var(--pk); color:var(--on-pk); } .pulse-chip.on i{ color:inherit; opacity:.9; }

/* ---- Page Profil : carte « moi » et menu ---- */
.me-card{ gap:16px; }
.me-id{ display:flex; align-items:center; gap:14px; min-width:0; }
.me-who{ display:grid; gap:2px; min-width:0; }
.me-name{ font:var(--fdw) 22px/1.15 var(--fd); color:var(--tx); text-transform:var(--case); overflow-wrap:anywhere; }
.me-who .muted{ font-size:14px; }
.me-stats{ font-size:13px; font-weight:600; color:var(--pk2,var(--pk)); }
.me-actions{ display:flex; gap:10px; flex-wrap:wrap; } .me-actions .btn{ flex:1 1 auto; }
.menu{ display:grid; margin-top:16px; background:var(--s1); border:1px solid var(--hair); border-radius:var(--rc); box-shadow:var(--e1); overflow:hidden; }

</style>
<style id="coopo-monde">
/* ==== Décor immersif : chaque thème est un « monde » ====
   En haut de l'écran : le dessin du thème, derrière l'en-tête et le titre. Il se fond dans la couleur du monde, qui continue sous les cartes
   et s'assombrit à mesure qu'on descend dans la page. Quand on fait défiler, le dessin remonte plus lentement que la page (profondeur).
   --scrim : couleur du monde en haut de page (R,V,B) · --scrim2 : couleur en bas de page · --w-top : voile sombre sous l'en-tête et le titre · --w-h : hauteur du dessin */
html{ --scrim:39,28,120; --scrim2:21,15,63; --w-top:21,15,63; --w-v:.26; --w-sh:.74; --w-h:clamp(300px,54vh,460px);
  --w-halo:0 0 2px rgba(var(--w-top),.95),0 1px 5px rgba(var(--w-top),.88),0 0 14px rgba(var(--w-top),.4);
  --cta-b:#D4FF3F; --cta-t:#16131F; }
html[data-skin="sombre"]{ --scrim:17,13,44; --scrim2:6,5,12; --w-top:6,5,12; }
html[data-skin="samurai"]{ --scrim:150,20,40; --scrim2:92,10,24; --w-top:58,10,18; --w-v:.42; --w-sh:.8; --cta-b:#F4ECE1; --cta-t:#9A152D; }
html[data-skin="soft"]{ --scrim:170,54,106; --scrim2:112,30,70; --w-top:92,22,56; --w-v:.5; --w-sh:.8; --cta-b:#FFFFFF; --cta-t:#A92B64; }
html[data-skin="lofi"]{ --scrim:38,110,46; --scrim2:20,70,34; --w-top:12,58,104; --w-v:.5; --w-sh:.8; --cta-b:#FFFFFF; --cta-t:#155E92; }
html[data-skin="esth"]{ --scrim:94,74,200; --scrim2:60,42,144; --w-top:58,36,120; --w-v:.5; --w-sh:.8; --cta-b:#FFFFFF; --cta-t:#5A3EC8; }
@media (min-width:861px){ html{ --w-h:clamp(380px,64vh,640px); } }
/* la couleur du monde court sur toute la hauteur de la page : on « descend » dans le thème */
html[data-skin]{ min-height:100%; background:rgb(var(--scrim2)) linear-gradient(180deg,rgb(var(--scrim)) 0,rgb(var(--scrim)) 320px,rgb(var(--scrim2)) 100%) no-repeat; }
html[data-skin] body{ background:none; animation:none; }
#world{ position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; }   /* mode léger : le dessin défile avec la page, sans calcul */
html.world-par #world{ position:fixed; }   /* mode normal : il reste en place et la « caméra » le fait défiler plus lentement que la page (voir worldScroll) */
.w-cam{ position:absolute; left:0; right:0; top:0; height:var(--w-h); transform-origin:50% 0; will-change:transform;
  -webkit-mask-image:linear-gradient(#000 0,#000 52%,transparent 100%); mask-image:linear-gradient(#000 0,#000 52%,transparent 100%); }
.w-art{ position:absolute; inset:0; background:var(--art-bg,none); opacity:0; transition:opacity .7s ease; }
html:is([data-skin="defaut"],[data-skin="sombre"]) .w-art{ background:linear-gradient(180deg,var(--cs-sky1),var(--cs-sky2) 78%); }
html.world-on .w-art{ opacity:1; }
/* Animations à l'intérieur du dessin (étoiles, nuages, poissons…) : seulement sur les appareils puissants, et en pause dès qu'on descend dans la page */
html:not(.world-live) #world :is(.bloom,.cscene) *{ animation:none !important; }
html.world-live.scrolled #world :is(.bloom,.cscene) *{ animation-play-state:paused !important; }
#world .cs-l{ transform:none; }   /* les plans de la scène Coopô sont déplacés par le script (voir worldScroll) */
/* voile : plus dense à gauche, là où se lisent le bonjour et les titres ; le dessin reste net à droite */
.w-cam::after{ content:''; position:absolute; inset:0; background:
  radial-gradient(ellipse 96% 46% at max(0px,calc(50% - 600px)) 40%,rgba(var(--w-top),var(--w-sh)) 0,rgba(var(--w-top),calc(var(--w-sh) * .72)) 48%,rgba(var(--w-top),0) 100%),
  linear-gradient(180deg,rgba(var(--w-top),calc(var(--w-v) + .1)) 0,rgba(var(--w-top),var(--w-v)) 30%,rgba(var(--scrim),calc(var(--w-v) + .16)) 62%,rgba(var(--scrim),.72) 100%); }
html body .frame{ z-index:1; background:none; }
.orbs{ display:none; }

/* ---- Texte posé directement sur le décor : blanc, avec un halo à la couleur du monde ---- */
html[data-skin] body :is(.page-head h2,.page-head p,.wrap.page > h3,.home-sec > .dispo-head h3,.dispo-sec > .dispo-empty,.home-sec .linkbtn,.back,.sort-lbl,.pulse > b,.count,.count .linklike,.wrap.page > .hint,.foot,.foot a,
  .chat-who b,.chat-who .muted,.chat-who .online,.pp-head h1,.pp-meta,.pp-meta .muted,.pp-meta .rejoue,.pp-meta .online,.wl-hero h1,.wl-hero p,.wl-cap,.wl-legal,.wl-legal a,.wl-cta .linkbtn,.top-right,.top-right small,.top-right a){
  color:#fff; text-shadow:var(--w-halo); }
html[data-skin] body :is(.page-head p,.dispo-sec > .dispo-empty,.wl-hero p,.foot,.foot a,.wl-cap,.wl-legal,.pp-meta .muted,.chat-who .muted,.sort-lbl,.pulse > b,.wrap.page > .hint){ color:rgba(255,255,255,.92); }
.back:hover{ background:rgba(255,255,255,.16); }
.pill-live,.wl-kicker{ background:rgba(var(--w-top),.6); color:#fff; border:1px solid rgba(255,255,255,.2); }
/* ---- Ce qui était transparent devient une vraie surface ---- */
a.nudge{ background:var(--s1); border-style:solid; border-color:var(--hair); box-shadow:var(--e1); }
.menu-out{ background:var(--s1); box-shadow:var(--e1); }
.chat-contacts .btn-ghost,.page-head .btn-ghost,.wl-cta .btn-ghost{ background:var(--s1); }
.sheet{ background:var(--s1); border:1px solid var(--hair); border-radius:var(--rc); box-shadow:var(--e1); padding:6px 20px 24px; }   /* pages de lecture (CGU, confidentialité…) : le texte est posé sur une feuille */
.sheet > :first-child{ margin-top:18px; } .sheet p{ color:var(--tx); line-height:1.65; } .sheet h3{ margin-top:26px; }
/* bouton principal posé sur le décor : couleur qui ressort sur le monde (blanc quand le monde a la couleur du thème) */
:is(.dispo-sec,.page-head,.wl-cta,.install-foot,.chat-form,.form-actions,.cf-pill) > .btn-ac, .wrap.page > .btn-ac{ --b:var(--cta-b); --t:var(--cta-t); }
/* ---- En-tête : fond seulement quand la page a défilé (au repos, le dessin reste entier) ---- */
.top::before{ background:rgba(var(--w-top),.86); opacity:0; transition:opacity .25s ease; pointer-events:none; }
@media (min-width:861px){ .top{ --top-h:84px; } }
html.scrolled .top::before{ opacity:1; }
@supports ((-webkit-backdrop-filter:blur(2px)) or (backdrop-filter:blur(2px))){ html:not(.lite) .top::before{ background:rgba(var(--w-top),.42); -webkit-backdrop-filter:saturate(1.3) blur(14px); backdrop-filter:saturate(1.3) blur(14px); } }
.form-actions{ background:linear-gradient(transparent,rgba(var(--scrim2),.92) 40%); }
/* ---- Accueil : le bonjour est posé directement sur le décor ---- */
.mh{ background:none; overflow:visible; border-radius:0; width:min(1140px,100% - 16px); margin:0 auto; padding:0 0 4px; min-height:clamp(132px,27vh,250px); justify-content:flex-end; }
body.is-home .top{ display:flex; }   /* l'accueil garde l'en-tête de toutes les pages : le logo et la cloche ne bougent plus d'un onglet à l'autre */
body.is-home .top-right{ visibility:hidden; }   /* le nombre de joueurs en ligne est déjà sous le bonjour (la place est gardée : la cloche reste à droite) */
html[data-skin="samurai"] body .frame::before{ display:none; }
html.lite .top::before{ background:rgb(var(--w-top)); }
/* ---- Le sol du monde : un décor discret tout en bas de chaque page (on y arrive en descendant) ---- */
html{ --g-h:clamp(220px,36vh,340px); --g-clear:calc(var(--g-h) * .36); }   /* --g-clear : hauteur de la partie détaillée du sol, que les liens du bas de page ne recouvrent pas */
#ground{ position:absolute; left:0; right:0; bottom:0; height:var(--g-h); z-index:0; pointer-events:none; overflow:hidden;
  -webkit-mask-image:linear-gradient(transparent 0,#000 42%); mask-image:linear-gradient(transparent 0,#000 42%); }
#ground svg{ position:absolute; inset:0; width:100%; height:100%; display:block; }
/* Bas de page : la place de la barre d'onglets est réservée dans TOUS les thèmes (dans Coopô et Sombre, la fin des pages passait sous la barre) */
html[data-skin] body .frame{ padding-bottom:max(56px,var(--g-clear)); }
@media (max-width:860px){
  html[data-skin] body .frame{ padding-bottom:calc(128px + env(safe-area-inset-bottom,0px)); }
  html[data-skin] body:is(.logged-out,.no-profile) .frame{ padding-bottom:calc(max(40px,var(--g-clear)) + env(safe-area-inset-bottom,0px)); }
}

html[data-skin="samurai"] body .page-head h2::after{ background:#F4ECE1; opacity:.5; }

/* couleurs de la traînée et des poussières de lumière : claires sur le voile sombre, propres à chaque thème */
html{ --sp-a:212,255,63; --sp-b:156,134,255; --land:.84s; }

html[data-skin="esth"]{ --sp-a:255,214,242; --sp-b:184,164,255; }

.sp-art .sp-p{ position:absolute; display:block; background:#fff; -webkit-mask:var(--m) 0 0/100% 100% no-repeat; mask:var(--m) 0 0/100% 100% no-repeat; }
.sp-art .sp-pl{ --m:var(--m-pl); left:0; top:0; width:100%; height:100%; transform-origin:50% 52%; animation:spPlan 1.6s ease-in-out var(--land) infinite alternate; }   /* la planète se balance doucement */
.sp-art .sp-an{ --m:var(--m-an); left:0; top:0; width:100%; height:100%; transform-origin:50% 55%; animation:spAnneau .5s ease-in-out infinite alternate, spAnneau 2.2s ease-in-out var(--land) infinite alternate; }   /* l'anneau oscille : vite pendant le vol, lentement une fois posé */
@keyframes spPlan{ from{ transform:rotate(-3deg); } to{ transform:rotate(3deg); } }
@keyframes spAnneau{ from{ transform:rotate(-6deg) scale(1.02,.96); } to{ transform:rotate(5deg) scale(.98,1.04); } }
.sp-fish .sp-art{ filter:drop-shadow(0 0 12px rgba(var(--sp-a),.45)); }
.sp-body{ transform:rotate(-58deg); animation:spTravel .78s linear .06s both; }
html.sp-quick .sp-body{ animation:spPop .36s cubic-bezier(.2,.9,.3,1.2) both; }
html.sp-quick .sp-echo{ display:none; }
.sp-squash{ animation:spLand .5s cubic-bezier(.3,1.4,.5,1) calc(var(--land) - .04s) both; }
.sp-bob{ animation:spBob 2.4s ease-in-out calc(var(--land) + .45s) infinite; }
.sp-echo{ opacity:0; animation:spTravelE .78s linear calc(.06s + var(--k) * 58ms) both; }
.sp-echo .sp-art{ transform:rotate(58deg) scale(var(--e)); }
.sp-echo b{ background:rgb(var(--c)); opacity:var(--o); }
/* halo et ondes à l'atterrissage */
.sp-glow{ position:absolute; left:50%; top:50%; width:0; height:0; transition:opacity .3s ease; }
#splash.out .sp-glow{ opacity:0; }
.sp-halo{ position:absolute; left:-150px; top:-150px; width:300px; height:300px; border-radius:50%; background:radial-gradient(closest-side,rgba(var(--sp-a),.26),rgba(var(--sp-a),.08) 55%,rgba(var(--sp-a),0)); animation:spHaloIn .7s ease-out var(--land) both, spHalo 3s ease-in-out calc(var(--land) + .7s) infinite; }
.sp-rip{ position:absolute; left:-75px; top:30px; width:150px; height:44px; border-radius:50%; border:1.5px solid rgba(var(--sp-a),.42); opacity:0; animation:spRip 2.6s cubic-bezier(.15,.6,.3,1) var(--land) infinite; }
.sp-rip + .sp-rip{ animation-delay:calc(var(--land) + 1.3s); }
/* départ : la planète recule un instant puis file vers le haut-droite, sa traînée derrière elle ; le voile se lève */
#splash.out .sp-fish{ animation:spDash .48s both; }
#splash.out .sp-bob{ animation-play-state:paused; }
#splash.out .sp-art .sp-an{ animation:spAnneau .12s ease-in-out infinite alternate; }
#splash.out .sp-echo{ animation:spDashE .4s cubic-bezier(.3,0,.8,.6) calc(.07s + var(--k) * 30ms) both; }
/* le nom, le message, l'astuce */
.sp-txt{ position:absolute; inset:0; pointer-events:none; transition:opacity .25s ease, transform .3s ease; }
#splash.out .sp-txt{ opacity:0; transform:translateY(10px); }
.sp-in{ position:absolute; left:0; right:0; top:calc(40% + var(--fs) / 2 + 14px); display:grid; justify-items:center; gap:8px; padding:0 24px; }
.sp-name{ display:block; font:700 34px/1 'Outfit',system-ui,sans-serif; letter-spacing:.01em; white-space:nowrap; }
.sp-name i{ display:inline-block; font-style:normal; animation:spLetter .55s cubic-bezier(.2,.9,.3,1.25) calc(var(--land) - .12s + var(--i,0) * 55ms) both; }
.sp-name i:nth-child(2){ --i:1; } .sp-name i:nth-child(3){ --i:2; } .sp-name i:nth-child(4){ --i:3; } .sp-name i:nth-child(5){ --i:4; }
.sp-msg{ margin:0; min-height:1.6em; font-size:14px; color:#fff; animation:spFade .45s ease calc(var(--land) + .12s) both; }
.sp-tip{ position:absolute; left:0; right:0; bottom:calc(30px + env(safe-area-inset-bottom,0px)); margin:0 auto; padding:0 24px; max-width:440px; font-size:13px; line-height:1.5; color:#fff; text-shadow:0 1px 8px rgba(var(--w-top),.9); text-wrap:balance; animation:spFade .5s ease calc(var(--land) + .35s) both; }
@media (max-height:480px){ .sp-tip{ display:none; } }
.sp-name,.sp-msg{ text-shadow:0 1px 10px rgba(var(--w-top),.9); }

/* mode léger (petits téléphones) : la planète est tout de suite à sa place et se balance doucement, rien d'autre ne bouge */
html.lite .sp-echo, html.lite .sp-motes, html.lite .sp-rip{ display:none; }
html.lite .sp-fish .sp-art{ filter:none; }
html.lite #splash .sp-bob{ animation:spBob 2.4s ease-in-out infinite !important; }
html.lite #splash.out{ opacity:0; transition:opacity .35s ease, visibility 0s linear .35s; }
html.lite #splash.out .sp-fish{ animation:none !important; }
/* « réduire les animations » : rien ne bouge, l'écran s'efface simplement */
@media (prefers-reduced-motion:reduce){
  #splash *, html.lite #splash .sp-bob, html.lite #splash .sp-bw, html.lite #splash .sp-art :is(.sp-pl,.sp-an){ animation:none !important; }
  .sp-echo, .sp-motes, .sp-rip{ display:none; }
  #splash.out{ opacity:0; transition:opacity .35s ease, visibility 0s linear .35s; }
}
/* ---- Boutons de l'en-tête : verre sombre, comme sur l'accueil ---- */
.top .notif-btn,.top .skin-btn{ background:rgba(var(--w-top),.5); border-color:rgba(255,255,255,.24); color:#fff; box-shadow:none; }
@supports ((-webkit-backdrop-filter:blur(2px)) or (backdrop-filter:blur(2px))){ html:not(.lite) .top :is(.notif-btn,.skin-btn){ -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); } }
/* ---- Puces posées sur le décor (tri, onglets de la communauté, jeux du moment) : verre sombre ; la puce choisie ressort ---- */
:is(.sort-row,.board-tabs) .chip, .pulse-chip{ background:rgba(var(--w-top),.46); border-color:rgba(255,255,255,.3); color:#fff; box-shadow:none; }
.pulse-chip i{ color:rgba(255,255,255,.86); }
:is(.sort-row,.board-tabs) .chip[aria-pressed="true"], .pulse-chip.on{ background:var(--cta-b); border-color:var(--cta-b); color:var(--cta-t); box-shadow:0 8px 18px -10px rgba(0,0,0,.55); }

.wrap.page > h3 .online::before{ box-shadow:0 0 0 2px rgba(255,255,255,.9); }

<style id="coopo-plaques">
/* ==== Plaques nominatives, façon Discord ====
   Une plaque = un bandeau décoré DERRIÈRE toute la ligne d'un joueur (photo, pseudo, statut) : une couleur de fond, un dessin à droite
   qui s'efface vers la gauche, et une animation qui ne joue que quand on passe la souris sur la ligne (ou là où la plaque est mise en avant, avec la
   classe .plq-live : profil, en-tête d'une conversation, boutique). Le reste du temps la plaque est une image fixe : elle ne coûte rien au téléphone.
   Chaque plaque apporte son fond ET sa couleur de texte : le pseudo reste lisible dans tous les thèmes.
     .plq-on.pq-<nom>  la ligne qui porte la plaque (c'est elle qui fixe les couleurs --pa, --pb et --ptx)
     .plq              le bandeau, glissé en premier dans la ligne          .plq > i   la « fenêtre » du dessin, collée à droite
   Les dessins sont originaux. Ils sont décrits dans atelier/plaques/dessins.py, et ce bloc est fabriqué par atelier/plaques/gen.py (voir le LISEZ-MOI de ce dossier) :
   pour changer une plaque, on modifie son dessin là-bas puis on relance gen.py et poser.py, plutôt que de retoucher ce bloc à la main. */
.plq-on{ --pa:#2A2D3A; --pb:#4A5070; --ptx:#fff; position:relative; isolation:isolate; }
.plq{ position:absolute; top:var(--plq-y,0); bottom:var(--plq-y,0); left:var(--plq-x,0); right:var(--plq-x,0); z-index:-1; overflow:hidden; border-radius:var(--plq-r,inherit); pointer-events:none; background:linear-gradient(100deg,var(--pa) 30%,var(--pb)); transition:filter .2s; }
.plq-on:hover > .plq{ filter:brightness(1.07) saturate(1.05); }
.plq::before{ content:''; position:absolute; left:0; top:0; width:100%; height:100%; z-index:3; border-radius:inherit; box-shadow:inset 0 0 0 1px rgba(255,255,255,.13), inset 0 1px 0 rgba(255,255,255,.15); }
.plq::after{ content:''; position:absolute; left:0; top:0; width:100%; height:100%; z-index:2; background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.2) 50%,transparent 58%); transform:translateX(-120%); }
.plq-on:is(:hover,:focus-visible,.plq-live) > .plq::after{ animation:plqShine 5s ease-in-out infinite; }
.plq > i{ position:absolute; top:0; right:0; height:100%; aspect-ratio:4/1; max-width:74%; overflow:hidden; background:var(--art,none) right center/auto 100% no-repeat;
  -webkit-mask-image:linear-gradient(90deg,transparent,rgba(0,0,0,.55) 36%,#000 68%); mask-image:linear-gradient(90deg,transparent,rgba(0,0,0,.55) 36%,#000 68%); }
@supports not (aspect-ratio:1){ .plq > i{ width:62%; } }
.plq > i::before, .plq > i::after{ content:''; position:absolute; left:0; right:0; top:0; height:100%; background-repeat:no-repeat; background-position:right center; background-size:auto 100%; }
/* le texte posé sur une plaque */
.plq-on.plq-on, .plq-on.plq-on b, .plq-on.plq-on strong, .plq-on.plq-on h1, .plq-on.plq-on h2, .plq-on.plq-on h3, .plq-on.plq-on small, .plq-on.plq-on em, .plq-on.plq-on .muted, .plq-on.plq-on .online, .plq-on.plq-on .mc-name, .plq-on.plq-on .me-name, .plq-on.plq-on .me-stats, .plq-on.plq-on .rejoue, .plq-on.plq-on .plq-t, .plq-on.plq-on .sn-st, .plq-on.plq-on .x{ color:var(--ptx) !important; text-shadow:var(--pts,0 1px 2px rgba(0,0,0,.5)) !important; -webkit-text-fill-color:currentColor; }
.plq-on.plq-on .muted, .plq-on.plq-on .sn-st{ opacity:.86; }
/* le pseudo seul dans un petit bandeau : là où il n'y a pas de ligne (message d'un groupe, phrase) */
.plq-chip{ display:inline-flex; align-items:center; max-width:100%; min-width:0; min-height:1.8em; padding:.14em 4.4em .16em .62em; border-radius:.5em; font-weight:700; line-height:1.3; vertical-align:middle; text-transform:none; letter-spacing:0; }
.plq-chip > .plq > i{ max-width:5.4em; }
.plq-t{ position:relative; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* les mouvements */
@keyframes plqShine{ 0%,62%{ transform:translateX(-120%); } 100%{ transform:translateX(120%); } }
@keyframes plqPulse{ to{ opacity:.25; } }
@keyframes plqBob{ to{ transform:translateY(-5%); } }
@keyframes plqTilt{ from{ transform:rotate(-5deg); } to{ transform:rotate(5deg); } }
@keyframes plqY2{ to{ transform:translateY(66.667%); } }
@keyframes plqY2u{ to{ transform:translateY(-66.667%); } }
@keyframes plqY1{ to{ transform:translateY(50%); } }
@keyframes plqF8{ to{ background-position:100% 114.286%; } }
@keyframes plqX1l{ from{ transform:translateX(50%); } to{ transform:none; } }
@keyframes plqX1r{ from{ transform:none; } to{ transform:translateX(50%); } }
@keyframes plqF4{ to{ background-position:100% 133.333%; } }

.pq-nuages:is(:hover,:focus-visible,.plq-live) > .plq > i::after{ animation:plqX2l 42s linear infinite; }
.pq-nuages{ --pts:0 1px 2px rgba(0,0,0,.6), 0 0 7px rgba(6,26,24,.7); }
/* mode économie et « moins d'animations » : les plaques restent fixes */
html.lite .plq, html.lite .plq::after, html.lite .plq > i, html.lite .plq > i::before, html.lite .plq > i::after{ animation:none !important; }
@media (prefers-reduced-motion:reduce){ .plq, .plq::after, .plq > i, .plq > i::before, .plq > i::after{ animation:none !important; } }
/* ---- où les plaques s'affichent ---- */
.chat-row b{ min-width:0; }
.plq-on:hover > .plq > i, .plq-live > .plq > i{ background-image:var(--art-live,var(--art,none)); }
.plq-img > i{ aspect-ratio:auto; width:64%; background-size:cover; background-position:center; }   /* plaque faite d'une image ou d'un GIF (voir PLATES : img, gif) */
/* conversations : colonne de gauche sur ordinateur, liste sur téléphone, en-tête d'une conversation */
.dm-row.plq-on{ margin-block:2px; }
.dm-row.plq-on.on{ box-shadow:0 0 0 2px var(--pk); }
.sn-row.plq-on{ --plq-y:5px; --plq-x:8px; --plq-r:16px; }
.sn-row.plq-on .sn-av .online{ border-color:var(--pa); }
.sn-row.plq-on .sn-end{ opacity:1; } .sn-row.plq-on .sn-end svg{ display:none; }   /* la petite bulle de droite laisse la place au dessin (la pastille des messages non lus reste) */
.chat-who.plq-on{ border-color:transparent; padding-right:clamp(40px,9vw,120px); }
@media (max-width:999px){ .chat-page .chat-who.plq-on{ padding:4px 12px 4px 4px; border-radius:12px; margin-right:4px; } }
/* groupes : membres, invitations */
.nrow.plq-on{ padding-inline:10px; margin-block:2px; }
.plq-on .linkbtn{ padding:3px 10px; border-radius:999px; background:var(--pbt,rgba(0,0,0,.34)); color:var(--ptx); font-size:13px; font-weight:600; text-decoration:none; }
/* cartes des joueurs et profils */
/* carte d'un joueur : la plaque s'arrête avant le rond de compatibilité */
.mc-head.mc-plq{ grid-template-columns:minmax(0,1fr) auto; } .top-match .mc-head.mc-plq{ min-width:min(380px,100%); }
.mc-id{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:12px; align-items:center; min-width:0; margin:-8px 0 -8px -10px; padding:8px 10px; border-radius:calc(var(--rc) - 8px); }
.me-id.plq-on{ margin:-10px -12px; padding:10px 12px; border-radius:var(--ri); }
/* profil d'un joueur : la photo, le pseudo et la ligne d'infos tiennent sur une seule ligne, posée sur la plaque */
.pp-id{ flex:1 1 auto; display:flex; gap:18px; align-items:center; min-width:0; padding:14px 18px; border-radius:var(--rc); }
.pp-id > div{ flex:1 1 0; min-width:0; }
@media (max-width:560px){ .pp-id{ gap:12px; padding:12px 14px; } .pp-id .av{ width:64px !important; height:64px !important; font-size:23px !important; } .pp-id h1{ font-size:26px; } }
/* une plaque montrée « en situation » dans la boutique, et l'aperçu avant achat */
.plq-demo{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:10px; align-items:center; width:100%; min-height:52px; padding:8px 10px; border-radius:12px; text-align:left; }
.plq-demo > div{ display:grid; min-width:0; line-height:1.25; } .plq-demo b{ font:700 15px/1.25 var(--fb); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .plq-demo .muted{ font-size:12px; }
.plq-demo .av{ border-radius:50% !important; }
.shop-grid.shop-grid-np{ grid-template-columns:repeat(auto-fill,minmax(min(236px,100%),1fr)); }
.shop-tag.in{ position:static; display:inline-block; margin-left:8px; vertical-align:middle; text-transform:none; }
.np-prev{ display:grid; gap:10px; margin-top:14px; }
.np-prev > div{ display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--ri); background:var(--s2); min-width:0; }
.np-prev > div > div{ display:grid; gap:2px; min-width:0; } .np-prev .muted{ font-size:12px; }
.np-prev-name{ font:var(--fdw) 22px/1.2 var(--fd); }
.np-prev-msg{ flex-direction:column; align-items:flex-start !important; gap:4px !important; } .np-prev-msg small{ font-size:13px; } .np-prev-msg .bubble{ animation:none; max-width:100%; }

/* ==== Boutique ==== */
html[data-skin] body .on-world{ color:#fff; text-shadow:var(--w-halo); }
html[data-skin] body p.on-world{ color:rgba(255,255,255,.92); }
.shop .page-head{ align-items:center; }
.shop-cur{ display:flex; align-items:center; gap:8px; grid-template-columns:none; } .shop-cur label{ color:#fff; text-shadow:var(--w-halo); font-size:13px; } .shop-cur select{ min-height:38px; padding-top:4px; padding-bottom:4px; width:auto; max-width:200px; }
.shop-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
.shop-grid-wide{ grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr)); }
.shop-sec{ margin-top:28px; } .shop-sec > h3{ font:var(--fdw) 20px/1.2 var(--fd); text-transform:var(--case); color:#fff; text-shadow:var(--w-halo); }
.shop-sec > p{ margin:4px 0 0; color:rgba(255,255,255,.92) !important; text-shadow:var(--w-halo); font-size:14px; }
.shop-sec > .shop-grid{ margin-top:12px; }
.shop-card{ position:relative; display:grid; grid-template-rows:auto 1fr auto; gap:10px; min-width:0; padding:10px 10px 12px; background:var(--s1); border:1px solid var(--hair); border-radius:var(--rc); box-shadow:var(--e1); color:var(--tx); }
.shop-card.is-rare{ border-color:#E0A83A; box-shadow:var(--e1), 0 0 0 1px #E0A83A; }
.shop-prev{ height:98px; border-radius:calc(var(--rc) - 8px); display:grid; place-items:center; overflow:hidden; min-width:0; }
.shop-prev-np{ height:auto; min-height:78px; padding:12px 10px; background:var(--s2); }
.shop-prev-th{ background:var(--a); padding:12px 14px; }
.th-mock{ position:relative; width:100%; height:100%; border-radius:10px; background:var(--b); overflow:hidden; }
.th-mock i{ position:absolute; left:10px; height:6px; border-radius:3px; background:var(--c2); opacity:.5; }
.th-mock i:nth-child(1){ top:12px; width:52%; } .th-mock i:nth-child(2){ top:26px; width:34%; opacity:.3; } .th-mock i:nth-child(3){ top:40px; width:44%; opacity:.3; }
.th-mock b{ position:absolute; right:10px; bottom:10px; width:22px; height:22px; border-radius:50%; background:var(--c2); animation:thPulse 2.6s ease-in-out infinite; }
.th-mock::after{ content:''; position:absolute; inset:0; background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%); transform:translateX(-130%); animation:npShine 4.2s ease-in-out infinite; }
@keyframes thPulse{ 50%{ transform:scale(1.18); } }
html.lite .th-mock b, html.lite .th-mock::after{ animation:none; }
.shop-prev-pk{ display:flex; flex-wrap:wrap; gap:6px; align-content:center; justify-content:center; padding:10px; background:var(--s2); font-size:12px; }
.shop-prev-pk > i{ width:26px; height:26px; border-radius:8px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12); } .shop-prev-pk small{ align-self:center; color:var(--mu); font-weight:700; }
.shop-info{ display:grid; gap:3px; align-content:start; min-width:0; } .shop-info b{ font:var(--fdw) 16px/1.2 var(--fd); text-transform:var(--case); overflow-wrap:anywhere; } .shop-info .muted{ font-size:13px; line-height:1.35; }
.shop-own{ font-size:12px; font-weight:700; color:var(--pk2,var(--pk)); } .shop-eco{ font-size:13px; font-weight:700; color:var(--pk2,var(--pk)); }
.shop-foot{ display:flex; gap:8px; flex-wrap:wrap; } .shop-foot .btn{ flex:1 1 auto; padding:0 10px; animation:none; white-space:nowrap; }
.shop-tag{ position:absolute; top:16px; left:16px; z-index:2; padding:3px 9px; border-radius:999px; background:#16131F; color:#fff; font:700 11px/1.4 var(--fb); }
.shop-tag.rare{ background:#FFD23F; color:#231A00; }
.buy-line{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-top:14px; padding:12px 14px; border-radius:var(--ri); background:var(--s2); }
.buy-line strong{ font:var(--fdw) 20px/1 var(--fd); color:var(--pk2,var(--pk)); white-space:nowrap; }
.test-note{ display:grid; gap:2px; margin:12px 0; padding:10px 14px; border-radius:var(--ri); background:#FFF1B8; color:#3A2A00; border:1.5px dashed #9A6B00; font-size:14px; } .test-note b{ font-size:15px; }
.fakepay{ display:grid; gap:12px; padding:24px; border-radius:var(--rc); background:#FFF8DC; color:#2A2000; border:3px dashed #9A6B00; }
.fakepay h2{ margin:0; color:#2A2000; font:var(--fdw) 24px/1.15 var(--fd); } .fakepay p{ margin:0; } .fakepay .muted{ color:#5C4A12; font-size:13px; overflow-wrap:anywhere; }
.fakepay-flag{ justify-self:start; padding:4px 12px; border-radius:999px; background:#2A2000; color:#FFE27A; font:700 12px/1.5 var(--fb); text-transform:uppercase; letter-spacing:.06em; }
.fakepay-act{ display:grid; gap:10px; margin-top:6px; } .fakepay .btn-ghost{ --t:#2A2000; box-shadow:inset 0 0 0 1.5px #2A2000; }
.lang-pick #lang-list{ margin-top:4px; } .lang-pick input{ max-width:420px; }
body.logged-out .skin-btn{ display:none; }
/* La cloche et la boutique ne sont pas sur toutes les pages : la cloche sur l'accueil (le fil de ce qui t'arrive), la boutique sur ton profil et dans les paramètres (là où l'on choisit son thème et sa plaque) */
body:not([data-route="accueil"]) .top .notif-btn{ display:none; }
body:not([data-route="profil"]):not([data-route="parametres"]) .top .skin-btn{ display:none; }

/* ==== Groupes ==== */
.g-h{ margin:24px 0 10px; font:var(--fdw) 19px/1.2 var(--fd); text-transform:var(--case); }
.g-lock{ display:inline-flex; width:14px; height:14px; color:var(--mu); flex:none; } .g-lock svg{ width:100%; height:100%; }
.chat-row.g-inv{ grid-template-columns:52px 1fr; } .g-inv .nact{ grid-column:1 / -1; }
.chat-row b{ overflow:hidden; } .chat-row > div{ min-width:0; }

<style id="coopo-ocean">
/* ==== Thème Océan : une mare vue de dessus ====

   Cartes blanches posées sur l'eau, boutons vert nénuphar, titres blancs arrondis.
   Trois couches, de bas en haut : #world (l'eau), #koi (les carpes), #world-top (les nénuphars : les carpes passent dessous). */
html[data-skin="ocean"]{
  --frame:#083457; --frame-bg:#083457;
  --bg:#F2F8FA; --s1:#FFFFFF; --s2:#E1EFF4; --line:#C5DBE4; --tx:#0A2A3F; --mu:#48657A;
  --pk:#0B8452; --pk2:#086B42; --on-pk:#FFFFFF;
  --hi:#0B8452; --mid:#C68A0C; --warm:#E2641C; --lo:#D63A4A;
  --field:#FFFFFF; --glass:rgba(255,255,255,.92); --glass-solid:#FFFFFF;
  --fd:'Fredoka','Trebuchet MS',sans-serif; --fdw:600; --fb:'Nunito','Segoe UI',sans-serif; --case:none;
  --r:24px; --rf:28px; --rc:20px; --ri:12px;
  --art-bg:#0A4470; --art-tint:none;
  --title:#FFFFFF; --title-shadow:0 2px 18px rgba(3,24,44,.5);
  /* le monde : eau de surface en haut de page, eau profonde en bas ; voile léger (le texte blanc se lit déjà bien sur l'eau sombre) */
  --scrim:8,52,87; --scrim2:4,24,44; --w-top:4,30,52; --w-v:.08; --w-sh:.36;
  /* contour bleu nuit serré autour du texte blanc : invisible sur l'eau sombre, il garde le texte lisible quand une carpe claire passe dessous */
  --w-halo:0 0 1px rgb(3,24,44),0 0 2px rgb(3,24,44),0 1px 4px rgba(3,24,44,.95),0 0 9px rgba(3,24,44,.8),0 0 18px rgba(3,24,44,.45);
  --cta-b:#3EE08D; --cta-t:#04263B;   /* bouton principal posé sur l'eau : vert vif, texte bleu nuit */
  --sp-a:150,240,196; --sp-b:255,160,198;
  --e1:0 1px 2px rgba(3,24,44,.12), 0 12px 26px -16px rgba(3,24,44,.6);   /* cartes : ombre bleu nuit, comme posées au-dessus de l'eau */
  --e2:0 2px 6px rgba(3,24,44,.16), 0 22px 44px -20px rgba(3,24,44,.66);

<style id="coopo-uni">
/* ==== Thèmes Coopô (clair) et Sombre en couleurs unies (23 novembre 2026, choix d'Aki : « noir et blanc ») ====
   Plus de décor dessiné (ciel, ville, sol, particules) : un fond d'une seule couleur, des cartes à peine plus foncées (ou plus claires),
   des boutons pleins sans reflet. Le citron reste pour « Je suis dispo » et le point « en ligne ». Les autres thèmes ne changent pas.
