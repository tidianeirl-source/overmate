function submitProfile(e){
  e.preventDefault();
  const isNew=!S.me, pw=document.getElementById('f-pw')?.value||'', pw2=document.getElementById('f-pw2')?.value||'';
  draft.name=draft.name.trim(); draft.discord=document.getElementById('f-discord').value.trim();
  const errs=[];
  if(!new RegExp(`^[A-Za-z0-9_.-]{${CONFIG.minUsername},${CONFIG.maxUsername}}$`).test(draft.name)) errs.push("Choisis un nom d'utilisateur de 3 à 20 caractères (lettres, chiffres, _ . -).");
  if(PLAYERS.some(p=>p.name.toLowerCase()===draft.name.toLowerCase())) errs.push("Ce nom d'utilisateur est déjà pris.");
  if(!S.auth && (isNew||pw)){ if(pw.length<CONFIG.minPassword||!/[a-zA-Z]/.test(pw)||!/\d/.test(pw)) errs.push(`Le mot de passe doit faire au moins ${CONFIG.minPassword} caractères, avec une lettre et un chiffre.`);
    else if(pw!==pw2) errs.push('Les deux mots de passe ne sont pas identiques.'); }
  const age=ageFrom(draft.dob);
  if(age===null) errs.push('Indique ta date de naissance.');
  else if(age<CONFIG.minAge) errs.push(`Tu dois avoir au moins ${CONFIG.minAge} ans pour utiliser Coopô.`);
  else if(age>100) errs.push('Vérifie ta date de naissance.');
  if(!draft.games.length) errs.push('Sélectionne au moins un jeu.');
  if(!draft.hours.length) errs.push('Indique au moins un horaire de jeu.');
  if(!draft.style) errs.push('Choisis ton style de jeu.');
  if(!draft.platforms.length) errs.push('Sélectionne au moins une plateforme.');
  const fe=document.getElementById('ferr');
  if(errs.length){ fe.innerHTML=errs.map(esc).join('<br>'); fe.scrollIntoView({block:'center'}); return; }
  // Le mot de passe n'est jamais stocké ici. En production : l'envoyer en HTTPS au serveur, qui le hache (argon2 / bcrypt).
  Object.keys(draft.tags).forEach(g=>{ if(!draft.games.includes(g)) delete draft.tags[g]; });
  Object.keys(draft.ranks).forEach(g=>{ if(!draft.games.includes(g)) delete draft.ranks[g]; });
  if(!draft.langs.length) draft.langs=['fr'];
  S.me={...draft,id:'me'}; if(S.auth) S.profiles[S.auth.uid]=S.me; if(isNew) S.onboard=true; save(); DB.saveProfile(S.me); demoScheduleIncoming();
  toast(isNew?'Profil créé':'Modifications enregistrées');
  let next='#/matchs'; if(isNew){ try{ next=sessionStorage.getItem('coopo_after_profile')||sessionStorage.getItem('coopo_after_login')||'#/matchs'; sessionStorage.removeItem('coopo_after_profile'); sessionStorage.removeItem('coopo_after_login'); }catch(e){} }
  location.hash=next;
}

  document.getElementById('decline')?.addEventListener('click',()=>{ answerRequest(id,false); renderNotifBadge(); re(); });
  document.getElementById('unmate')?.addEventListener('click',()=>modal(`<h3>Retirer ${esc(p.name)} de tes mates ?</h3><p class="muted">Vous ne pourrez plus vous écrire, sauf nouvelle demande acceptée.</p><div class="dlg-actions"><button class="btn btn-ghost" data-close>Annuler</button><button class="btn btn-danger" id="uok">Retirer</button></div>`,
    d=>d.querySelector('#uok').onclick=()=>{ removeRequest(id); d.close(); toast(`${p.name} retiré de tes mates`); re(); }));
  app.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{ rate(id,+b.dataset.rate); re(); });
  document.getElementById('copy')?.addEventListener('click',async()=>{
    try{ await navigator.clipboard.writeText(p.discord); toast('Pseudo Discord copié'); }
    catch(e){ modal(`<h3>Pseudo Discord</h3><input type="text" readonly value="${esc(p.discord)}" onfocus="this.select()"><div class="dlg-actions"><button class="btn" data-close>Fermer</button></div>`); }
  });
  document.getElementById('report')?.addEventListener('click',()=>modal(`<h3>Signaler ${esc(p.name)}</h3><p class="muted">Ton signalement est examiné par l'équipe de modération. ${esc(p.name)} n'est pas prévenu. Après ${CONFIG.autoHideReports} signalements, le profil est masqué automatiquement en attendant l'examen.</p>
    <div class="radio-list">${['Comportement toxique ou harcèlement','Contenu inapproprié','Faux profil ou usurpation','Arnaque','Adulte qui contacte un mineur','Autre'].map((r,i)=>`<label><input type="radio" name="rr" value="${r}" ${i?'':'checked'}> ${r}</label>`).join('')}</div>
    <textarea id="rtxt" rows="3" placeholder="Détails (facultatif)" maxlength="500"></textarea>
    <div class="dlg-actions"><button class="btn btn-ghost" data-close>Annuler</button><button class="btn btn-ac" id="rsend">Envoyer le signalement</button></div>`,
    d=>d.querySelector('#rsend').onclick=()=>{ submitReport(id,d.querySelector('[name=rr]:checked').value,d.querySelector('#rtxt').value); d.close(); toast('Signalement envoyé'); if(S.hidden.includes(id)) location.hash='#/matchs'; }));
  document.getElementById('block')?.addEventListener('click',()=>modal(`<h3>Bloquer ${esc(p.name)} ?</h3><p class="muted">Vous ne verrez plus vos profils respectifs, et ${esc(p.name)} sera retiré de tes mates. Tu peux le débloquer dans les paramètres.</p>
    <div class="dlg-actions"><button class="btn btn-ghost" data-close>Annuler</button><button class="btn btn-danger" id="bok">Bloquer</button></div>`,
    d=>d.querySelector('#bok').onclick=()=>{ S.blocked.push(id); removeRequest(id); save(); DB.saveBlock(id,true); d.close(); toast(`${p.name} est bloqué`); location.hash='#/matchs'; }));
}

/* ----- Paramètres ----- */
function viewSettings(){
  if(!S.me) return needProfile('Paramètres');
  const blocked=PLAYERS.filter(p=>S.blocked.includes(p.id)), w=S.weights||CONFIG.weights, mates=matesList();
  const tg=(k,t,h)=>`<div class="toggle"><div><label for="pv-${k}" class="lbl">${t}</label><p class="hint">${h}</p></div><input class="switch" type="checkbox" id="pv-${k}" data-pv="${k}" ${S.privacy[k]?'checked':''}></div>`;
  app.innerHTML=`<div class="wrap page" style="max-width:760px"><div class="page-head"><h2>Paramètres</h2></div><div class="form">
    <section class="panel"><h3>Thème</h3><p class="hint">Change l'apparence de tout le site.</p>${skinGrid()}${AUTH_LIVE&&PAID_SKINS.some(x=>!canUseSkin(x))&&(SHOP.currencies||Object.keys(CURRENCIES)).length>1?`<div class="field" style="margin-top:12px;max-width:320px"><label for="set-cur">Devise des prix</label><select id="set-cur">${Object.entries(CURRENCIES).filter(([k])=>curOK(k)).map(([k,v])=>`<option value="${k}" ${k===curCode()?'selected':''}>${v.label} (${k})</option>`).join('')}</select></div>`:''}</section>
    ${refSection()}
    <section class="panel"><h3>Application</h3><div data-install-box>${installHTML()}</div><div style="margin-top:14px">${notifySettingHTML()}</div></section>
    <section class="panel"><h3>Confidentialité</h3><div>
      ${tg('discord','Afficher mon pseudo Discord','Les autres joueurs peuvent le copier depuis ton profil.')}
      ${tg('tags','Afficher mes pseudos en jeu','Visibles sur ton profil public.')}
      ${tg('online','Afficher mon statut en ligne','Les autres voient quand tu es connecté.')}</div>
      <p class="hint">Ton mot de passe et tes informations de compte ne sont jamais affichés.</p></section>
    <section class="panel"><h3>Mes mates</h3>${mates.length?`<div class="mates-strip">${mates.map(p=>`<a class="mate-pill" href="#/joueur/${p.id}">${avatar(p,28)}${esc(p.name)}${modBadge(p)}</a>`).join('')}</div>`:'<p class="muted">Pas encore de mate accepté.</p>'}${isAdmin()?'<a class="btn btn-sm" href="#/moderation">Ouvrir la modération</a>':''}</section>
    <section class="panel"><h3>Joueurs bloqués</h3>
      ${blocked.length?blocked.map(p=>`<div class="toggle"><span style="display:flex;gap:10px;align-items:center">${avatar(p,32)}${esc(p.name)}${modBadge(p)}</span><button class="btn btn-sm" data-unblock="${p.id}">Débloquer</button></div>`).join(''):'<p class="muted">Tu n\'as bloqué personne.</p>'}</section>
    <section class="panel"><h3>Calcul du score</h3><p class="hint">Réglage de test (administrateur) : modifie l'importance de chaque critère. Mets 0 pour le désactiver.</p>
      <div class="tags">${Object.keys(CRITERIA).map(k=>`<div class="field"><label for="w-${k}">${CRITERIA[k].label}</label><input id="w-${k}" type="text" inputmode="numeric" data-w="${k}" value="${w[k]||0}"></div>`).join('')}</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-sm btn-ac" id="wsave">Appliquer</button><button class="btn btn-sm btn-ghost" id="wreset">Valeurs par défaut</button></div></section>
    <section class="panel"><h3>Compte</h3>
      ${S.auth?`<div class="google-note"><strong>${S.auth.provider==='password'?'Compte e-mail':'Connecté avec Google'}</strong><span class="muted">${esc(S.auth.email)}</span></div><div><button class="btn btn-ghost" data-signout>Se déconnecter</button></div>`
        :`<p class="muted">Compte avec mot de passe. Tu peux aussi relier ton compte Google pour te connecter plus vite.</p><div class="gbtn" style="justify-content:flex-start"></div>`}</section>
    <section class="panel"><h3>Supprimer mon compte</h3><p class="muted">Ton profil, tes mates et tes réglages sont effacés définitivement.</p>
      <div><button class="btn btn-danger" id="del">Supprimer mon compte</button></div></section>
  </div></div>`;
  app.querySelectorAll('[data-pv]').forEach(i=>i.onchange=()=>{ S.privacy[i.dataset.pv]=i.checked; save(); toast('Préférence enregistrée'); });
  app.querySelectorAll('[data-unblock]').forEach(b=>b.onclick=()=>{ S.blocked=S.blocked.filter(x=>x!==b.dataset.unblock); save(); DB.saveBlock(b.dataset.unblock,false); toast('Joueur débloqué'); viewSettings(); });
  document.getElementById('wsave').onclick=()=>{ const nw={}; app.querySelectorAll('[data-w]').forEach(i=>nw[i.dataset.w]=Math.max(0,Math.min(100,parseInt(i.value,10)||0)));
    if(!Object.values(nw).some(v=>v>0)){ toast('Au moins un critère doit avoir un poids'); return; } S.weights=nw; save(); toast('Poids appliqués'); viewSettings(); };
  document.getElementById('wreset').onclick=()=>{ S.weights=null; save(); toast('Valeurs par défaut rétablies'); viewSettings(); };
  document.getElementById('del').onclick=()=>modal(`<h3>Supprimer ton compte ?</h3><p class="muted">Cette action est définitive.</p>
    <div class="dlg-actions"><button class="btn btn-ghost" data-close>Annuler</button><button class="btn btn-danger" id="dok">Supprimer définitivement</button></div>`,
    d=>d.querySelector('#dok').onclick=async()=>{ if(S.auth && !(await deleteGoogleAccount())) return; try{ localStorage.removeItem(KEY); }catch(e){} const sk=S.skin; S=fresh(); S.skin=sk; save(); d.close(); toast('Compte supprimé'); location.hash='#/accueil'; });
}

/* =========================================================
   THÈMES — illustrations de l'accueil + sélecteur
   ========================================================= */
const rng = seed => () => (seed=(seed*16807)%2147483647,(seed-1)/2147483646);
const svgWrap = (inner,defs='') => `<svg class="bloom" viewBox="0 0 1200 640" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>${defs}</defs>${inner}</svg>`;

function shapesSVG(){
  const R=rng(5); let out='';
  const cols=['#3EE6B5','#FF5A6E','#9FD4FF','#FF8FD0'];
  const shape=(t,x,y,s,c)=> t===0?`<polygon points="${x},${y-s} ${x+s*.87|0},${y+s*.5|0} ${x-s*.87|0},${y+s*.5|0}" stroke="${c}"/>`
    : t===1?`<circle cx="${x}" cy="${y}" r="${s}" stroke="${c}"/>`
    : t===2?`<path d="M${x-s} ${y-s}L${x+s} ${y+s}M${x+s} ${y-s}L${x-s} ${y+s}" stroke="${c}"/>`
    : `<rect x="${x-s}" y="${y-s}" width="${s*2}" height="${s*2}" rx="${s*.18|0}" stroke="${c}"/>`;
  for(let i=0;i<24;i++){ const t=i%4, x=R()*1200|0, y=R()*640|0, s=18+R()*42|0;
    out+=`<g class="floaty" style="--fdl:${(R()*9).toFixed(1)}s;--fx:${(R()*80-40)|0}px;--fy:${(R()*80-40)|0}px;--fr:${(R()*120-60)|0}deg;opacity:${(.35+R()*.6).toFixed(2)}">${shape(t,x,y,s,cols[t])}</g>`; }
  return svgWrap(`<rect width="1200" height="640" fill="url(#dots)"/><g fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">${out}</g>`,
    `<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="rgba(255,255,255,.2)"/></pattern>`);
}

function mangaSVG(){

  const star4=(x,y,s,c)=>`<path d="M${x} ${y-s}q${s*.15} ${s*.85} ${s} ${s}q-${s*.85} ${s*.15} -${s} ${s}q-${s*.15} -${s*.85} -${s} -${s}q${s*.85} -${s*.15} ${s} -${s}z" fill="${c}"/>`;

  return svgWrap(`<rect width="1200" height="640" fill="#fff"/>

    </g>
    <!-- Lune cratérisée -->
    <g class="moonfloat" transform="translate(560 130)">
      <circle r="44" fill="#fff" ${ink}/><circle cx="-14" cy="-10" r="9" fill="none" ${ink} stroke-width="3"/><circle cx="16" cy="12" r="6" fill="none" ${ink} stroke-width="3"/><circle cx="-6" cy="22" r="4" fill="#111"/>
      ${hatch(10,-40,6,26,6,25)}
    </g>
    <!-- Soucoupe volante -->
    <g class="ufo" transform="translate(600 520)">
      <path d="M-70 60L-30 10h60l40 50" fill="none" stroke="#111" stroke-width="2.5" stroke-dasharray="6 8" class="beam"/>
      <path d="M-28 -16a28 24 0 0 1 56 0" fill="#fff" ${ink}/>
      <ellipse rx="64" ry="16" fill="#fff" ${ink}/>
      <circle cx="-34" cy="4" r="4" fill="#111"/><circle cx="0" cy="8" r="4" fill="#111"/><circle cx="34" cy="4" r="4" fill="#111"/>

      <g transform="translate(-6 130)"><path d="M-30 -10h60a14 14 0 0 1 12 18l-6 16a9 9 0 0 1-15 2l-8-10h-26l-8 10a9 9 0 0 1-15-2l-6-16a14 14 0 0 1 12-18z" fill="#fff" ${ink} stroke-width="3"/>
        <circle cx="16" cy="-2" r="3" fill="#111"/><circle cx="24" cy="6" r="3" fill="#111"/><path d="M-20 -4v10M-25 1h10" stroke="#111" stroke-width="2.5"/></g>

const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.random()*a.length|0];
const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;

function buildFx(){
  const fx=document.getElementById('fx'), orbs=document.querySelector('.orbs');
  if(!fx||!orbs) return;
  fx.innerHTML=''; orbs.innerHTML='';
  const f=FX[S.skin]; if(!f||reduced()) return;
  if(f.orbs) orbs.innerHTML=[...f.orbs,...f.orbs].slice(0,5).map((c,i)=>
    `<i style="--c:${c};--x:${rand(-15,75)|0}%;--y:${(i*20+rand(-6,8))|0}%;--s:${rand(280,540)|0}px;--d:${rand(16,26)|0}s;--dl:${rand(0,20)|0}s;--o:${f.orbO||.3}"></i>`).join('');
  const p=f.particles; if(!p) return;
  const n = innerWidth<700 ? Math.ceil(p.n*.5) : p.n; let h='';
  for(let i=0;i<n;i++){
    const st=`--l:${rand(0,100).toFixed(1)}%;--c:${pick(p.colors)};--dur:${rand(p.dmin,p.dmax).toFixed(1)}s;--dl:${rand(0,18).toFixed(1)}s;--dx:${rand(-140,140)|0}px;--r:${rand(180,720)|0}deg`;
    if(p.kind==='petal'||p.kind==='leaf') h+=`<i class="p ${p.kind}" style="${st};--w:${rand(9,15)|0}px"></i>`;
    else if(p.kind==='sparkle') h+=`<i class="p spk" style="${st};--t:${rand(6,94).toFixed(1)}%;--w:${rand(10,22)|0}px">${pick(p.chars)}</i>`;
    else if(p.kind==='dot') h+=`<i class="p dot" style="${st};--w:${rand(2,5).toFixed(1)}px"></i>`;
    else if(p.kind==='bubble') h+=`<i class="p bub" style="${st};--w:${rand(8,22)|0}px"></i>`;
  }
  fx.innerHTML=h;
}
function playWipe(){
  const f=FX[S.skin], w=document.getElementById('wipe'); if(!w||!f||!f.wipe||reduced()) return;
  w.className=''; w.innerHTML = f.wipe==='panels' ? '<i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i>' : '';
  void w.offsetWidth; w.className=f.wipe;
  clearTimeout(w._t); w._t=setTimeout(()=>{ w.className=''; w.innerHTML=''; },950);
}
function spawn(x,y,o){
  const s=document.createElement('i'); s.className='fxp '+o.cls; if(o.text) s.textContent=o.text;
  s.style.cssText=`left:${x}px;top:${y}px;--dx:${(o.dx||0)|0}px;--dy:${(o.dy||0)|0}px;--r:${rand(-90,90)|0}deg;--t:${o.life}ms;`
    +(o.color?`color:${o.color};`:'')+(o.size&&o.text?`font-size:${o.size|0}px;`:'')+(o.bg?`background:${o.bg};width:${o.size}px;height:${o.size}px;`:'');
  document.body.appendChild(s); setTimeout(()=>s.remove(),o.life+60);
}
const POW=['POW!','BAM!','ZAP!','WOW!','GO!'];
document.addEventListener('pointerdown',e=>{
  const f=FX[S.skin]; if(!f||reduced()) return;
  const el=e.target.closest('.btn,.chip,.skin,.navpill a,.tabbar a'); if(!el) return;
  const x=e.clientX, y=e.clientY;
  switch(f.click){
    case 'ripple': { const r=el.getBoundingClientRect(); if(getComputedStyle(el).position==='static') el.style.position='relative'; el.style.overflow='hidden';
      const s=document.createElement('span'); s.className='rip'; s.style.cssText=`--x:${x-r.left}px;--y:${y-r.top}px`; el.appendChild(s); setTimeout(()=>s.remove(),650); break; }
    case 'pow': spawn(x,y-10,{cls:'pow',text:pick(POW),life:650}); break;
    case 'ink': for(let i=0;i<10;i++) spawn(x,y,{cls:'burst blob',bg:pick(['#C41E3A','#9A152D','#1E1416']),size:rand(4,11),dx:rand(-70,70),dy:rand(-60,70),life:700}); break;

});

function showSlide(i){

function initShowcase(){

  document.getElementById('sc-prev').onclick=()=>{ showSlide(scI-1); play(); };
  document.getElementById('sc-thumb').onclick=()=>{ showSlide(scI+1); play(); };
  document.querySelectorAll('#sc-pills button').forEach(b=>b.onclick=()=>{ F.platform=b.dataset.plat; location.hash='#/recherche'; });

  play();
}

/* ---- Boutique de thèmes (prix identiques à functions/index.js) ---- */
// enabled  : true -> les thèmes payants sont verrouillés (false -> tout est gratuit)
// payments : false -> le bouton d'achat affiche « Bientôt disponible ». Passe à true une fois CinetPay et les fonctions prêts.
// api : laisse vide pour Firebase (formule Blaze) ; ou l'adresse d'un serveur Vercel, par exemple 'https://coopo-paiement.vercel.app/api'
const SHOP = { enabled:true, payments:false, api:'', region:'europe-west1', currencies:['XOF'] };   // currencies : devises encaissables (même liste que dans api/_lib.js)
// Prix par devise : à garder identiques à PRICES dans functions/index.js
const CURRENCIES = {
  XOF:{ label:'F CFA (BCEAO)', unit:'F CFA', theme:500,  premium:1000,  pack:2500,  countries:['CI','SN','ML','BF','BJ','TG','NE'] },
  XAF:{ label:'F CFA (BEAC)',  unit:'F CFA', theme:500,  premium:1000,  pack:2500,  countries:['CM','GA','CG'] },
  GNF:{ label:'Franc guinéen', unit:'GNF',   theme:7000, premium:14000, pack:35000, countries:['GN'] },
  CDF:{ label:'Franc congolais', unit:'FC',  theme:2500, premium:5000,  pack:12500, countries:['CD'] },
};
const curOK = c => !SHOP.currencies || SHOP.currencies.includes(c);
function curCode(){
  if(S.currency && CURRENCIES[S.currency] && curOK(S.currency)) return S.currency;
  const c=S.me&&S.me.country; const hit=Object.entries(CURRENCIES).find(([k,v])=>v.countries.includes(c)&&curOK(k));
  return hit?hit[0]:(SHOP.currencies&&SHOP.currencies[0])||'XOF';
}
const price = (kind,cur=curCode()) => CURRENCIES[cur][kind];
const PAID_SKINS = ['samurai','soft','lofi','esth','ocean','menthe','awale','glass'];
const PREMIUM_SKINS = ['glass'];   // thèmes à 1 000 F
const skinPrice = (id,cur=curCode()) => price(PREMIUM_SKINS.includes(id)?'premium':'theme',cur);
const money = (n,cur=curCode()) => n.toLocaleString('fr-FR').replace(/\u202f|\u00a0/g,' ')+' '+CURRENCIES[cur].unit;
function ownsAll(){ return !!(S.owned&&S.owned.pack); }
function canUseSkin(id){
  if(!PAID_SKINS.includes(id)) return true;
  if(!AUTH_LIVE || !SHOP.enabled) return true;      // mode démo ou boutique fermée : tout est libre
  if(S.auth && isAdmin()) return true;   // modérateurs
  const rw=S.rewards||{}; if((rw.referrals||0)>=REF_REWARD.all) return true; if(id===REF_REWARD.one&&(rw.referred||(rw.referrals||0)>=1)) return true;
  return ownsAll() || !!(S.owned&&(S.owned.themes||[]).includes(id));
}

function viewPayment(tx){
  const box=(h,p,act='')=>`<div class="wrap page"><div class="empty"><h3>${h}</h3><p class="muted">${p}</p>${act}</div></div>`;
  if(!tx){ app.innerHTML=box('Paiement interrompu','Aucun montant n\'a été débité. Tu peux réessayer depuis le choix des thèmes.','<a class="btn" href="#/parametres">Mes thèmes</a>'); return; }

  app.innerHTML=box('Vérification du paiement…','Ça prend quelques secondes.');
  let tries=0;
  const check=async()=>{
    if(!location.hash.startsWith('#/paiement')) return;
    if(!(DB.live&&DB.fns)){ if(tries++<10) return setTimeout(check,800); app.innerHTML=box('Vérification impossible','Recharge la page dans un instant.'); return; }
    try{ const r=(await DB.fns.httpsCallable('checkPayment')({tx})).data;
      if(r.status==='paid'){ await DB.loadPurchases(); const item=String(r.item||''), th=item.startsWith('theme:')?item.slice(6):null;
        applySkin(th||S.skinWanted||S.skin, true); if(th) DB.saveSkin(th);
        app.innerHTML=box('Merci, c\'est débloqué !', th?`Le thème ${esc(SKINS[th]?.label||th)} est à toi et vient d'être activé.`:'Tous les thèmes sont à toi. Choisis celui que tu préfères.','<a class="btn btn-ac" href="#/parametres">Choisir mon thème</a>'); return; }
      if(r.status==='failed'){ app.innerHTML=box('Paiement non abouti','Le paiement a été refusé ou annulé. Aucun thème n\'a été débloqué.','<a class="btn" href="#/parametres">Réessayer</a>'); return; }
      if(r.status==='review'){ app.innerHTML=box('Paiement en vérification','Le montant reçu ne correspond pas au prix. La modération va vérifier : écris-nous via « Nous écrire » avec la référence '+esc(tx)+'.'); return; }
      if(tries++<8) return setTimeout(check,5000);
      app.innerHTML=box('Paiement en attente',`Si tu as validé le paiement sur ton téléphone, il sera pris en compte automatiquement dans quelques minutes. Référence : ${esc(tx)}`,'<button class="btn" type="button" onclick="route()">Vérifier à nouveau</button>');
    }catch(e){ app.innerHTML=box('Vérification impossible',(e&&e.message)||'Réessaie dans un instant.','<button class="btn" type="button" onclick="route()">Réessayer</button>'); }
  };
  check();
}

function busy(on){ const b=app.querySelector('.auth-submit'); if(!b) return; b.disabled=on; b.dataset.label=b.dataset.label||b.textContent; b.textContent=on?'Un instant…':b.dataset.label; }
function authErr(err){
  const c=err&&err.code||'';
  if(c==='auth/email-already-in-use') return {mail:'Un compte existe déjà avec cet e-mail.'};
  if(c==='auth/invalid-email') return {mail:'Adresse e-mail invalide.'};
  if(c==='auth/weak-password') return {pw:'Mot de passe trop faible.'};
  if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-login-credentials'].includes(c)) return {pw:'E-mail ou mot de passe incorrect.'};
  if(c==='auth/too-many-requests') return {pw:'Trop de tentatives. Réessaie dans quelques minutes.'};
  return {pw:'Une erreur est survenue. Réessaie.'};
}
const MAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
async function doSignup(){
  const name=aval('a-name'), mail=aval('a-mail').toLowerCase(), pw=document.getElementById('a-pw').value, dob=draft.dob, age=ageFrom(dob), e={};
  if(!new RegExp(`^[A-Za-z0-9_.-]{${CONFIG.minUsername},${CONFIG.maxUsername}}$`).test(name)) e.name=`${CONFIG.minUsername} à ${CONFIG.maxUsername} caractères : lettres, chiffres, _ . -`;
  else if(PLAYERS.some(p=>p.name.toLowerCase()===name.toLowerCase())) e.name="Ce nom d'utilisateur est déjà pris.";
  if(!MAIL_RE.test(mail)) e.mail='Entre une adresse e-mail valide.';
  if(pw.length<CONFIG.minPassword||!/[a-zA-Z]/.test(pw)||!/\d/.test(pw)) e.pw=`Au moins ${CONFIG.minPassword} caractères, avec une lettre et un chiffre.`;
  if(age===null) e.dob='Indique ta date de naissance.';
  else if(age<CONFIG.minAge) e.dob=`Tu dois avoir au moins ${CONFIG.minAge} ans pour utiliser Coopô.`;
  if(showErrs(e)) return;
  busy(true);
  try{
    if(AUTH_LIVE){
      const cred=await firebase.auth().createUserWithEmailAndPassword(mail,pw);
      await cred.user.updateProfile({ displayName:name });
      S.dobs[cred.user.uid]=dob; save();
      onSignedIn({ uid:cred.user.uid, name, email:mail, photo:'', provider:'password' });
    } else {
      if(S.accounts[mail]){ showErrs({mail:'Un compte existe déjà avec cet e-mail.'}); return; }
      const uid='local-'+mail; S.accounts[mail]={uid,name}; S.dobs[uid]=dob; save();
      onSignedIn({ uid, name, email:mail, photo:'', provider:'password' });
    }
  }catch(err){ console.error(err); showErrs(authErr(err)); }
  finally{ busy(false); }
}
async function doLogin(){
  const mail=aval('a-mail').toLowerCase(), pw=document.getElementById('a-pw').value, e={};
  if(!MAIL_RE.test(mail)) e.mail='Entre une adresse e-mail valide.';
  if(!pw) e.pw='Entre ton mot de passe.';
  if(showErrs(e)) return;
  busy(true);
  try{
    if(AUTH_LIVE) await firebase.auth().signInWithEmailAndPassword(mail,pw);
    else { const acc=S.accounts[mail]; if(!acc){ showErrs({mail:'Aucun compte avec cet e-mail.'}); return; }
      onSignedIn({ uid:acc.uid, name:acc.name, email:mail, photo:'', provider:'password' }); }
  }catch(err){ console.error(err); showErrs(authErr(err)); }
  finally{ busy(false); }
}
async function forgotPw(){
  const mail=aval('a-mail').toLowerCase();

}

function viewMessages(id){
  if(dataPending()) return loadingView('Messages');
  if(!S.me) return needProfile('Messages');
  if(id) return viewChat(id);
  const mates=matesList().sort((a,b)=>{ const la=(S.chats[a.id]||[]).slice(-1)[0], lb=(S.chats[b.id]||[]).slice(-1)[0]; return (lb?lb.at:0)-(la?la.at:0); });
  app.innerHTML=`<div class="wrap page" style="max-width:720px"><div class="page-head"><div><h2>Messages</h2><p>Discute avec tes mates. Les messages sont réservés aux mates acceptés.</p></div></div>
    ${mates.length?`<div class="chat-list">${mates.map(p=>{ const msgs=S.chats[p.id]||[], last=msgs.slice(-1)[0], u=S.unread[p.id]||0;
      return `<a class="chat-row${u?' unread':''}" href="#/messages/${p.id}">${avatar(p,52)}<div><b>${esc(p.name)}${modBadge(p)}${p.online?' <span class="online"></span>':''}</b><span class="muted">${last?esc((last.from==='me'?'Toi : ':'')+last.text):'Dis bonjour 👋'}</span></div>${u?`<span class="badge static">${u}</span>`:last?`<small class="muted">${ago(last.at)}</small>`:''}</a>`; }).join('')}</div>`
    :`<div class="empty"><h3>Pas encore de mates</h3><p class="muted">Envoie une demande à un joueur compatible. Dès qu'il accepte, vous pouvez discuter ici.</p><a class="btn btn-ac" href="#/matchs">Voir mes matchs</a></div>`}</div>`;
}
function viewChat(id){
  const p=visible().find(x=>x.id===id);
  if(!p||!isMate(id)){ app.innerHTML=`<div class="wrap page"><div class="empty"><h3>Vous n'êtes pas encore mates</h3><p class="muted">Les messages s'ouvrent une fois la demande de mate acceptée.</p><a class="btn" href="#/messages">Retour aux messages</a></div></div>`; return; }
  S.unread[id]=0; save(); renderNotifBadge();
  app.innerHTML=`<div class="wrap page chat-page"><div class="chat-head"><a class="linkbtn" href="#/messages">← Messages</a><a class="chat-who" href="#/joueur/${p.id}">${avatar(p,44)}<div><b>${esc(p.name)}${modBadge(p)}</b>${p.online?'<span class="online">En ligne</span>':'<span class="muted" style="font-size:12px">Hors ligne</span>'}</div></a></div>
    <div class="chat-box" id="chatbox"></div>
    <form class="chat-form" id="chatform"><input type="text" id="chatin" placeholder="Écris un message…" maxlength="500" autocomplete="off"><button class="btn btn-ac" type="submit">Envoyer</button></form></div>`;
  renderChat(id);
  document.getElementById('chatform').addEventListener('submit',e=>{ e.preventDefault(); const i=document.getElementById('chatin'), t=i.value.trim(); if(!t) return; i.value='';
    const m={from:'me',text:t,at:Date.now()}; (S.chats[id]||(S.chats[id]=[])).push(m); save(); DB.sendMessage(id,m); renderChat(id);
    if(!AUTH_LIVE && Math.random()<.75) setTimeout(()=>{ const r={from:id,text:pick(CANNED),at:Date.now()}; (S.chats[id]||(S.chats[id]=[])).push(r);
      if(location.hash==='#/messages/'+id){ save(); renderChat(id); } else { S.unread[id]=(S.unread[id]||0)+1; notify({type:'message',from:id,text:`${p.name} : ${r.text}`}); } }, 2000+Math.random()*3000); });
  DB.listenChat(id,()=>{ if(location.hash==='#/messages/'+id) renderChat(id); });
}
function renderChat(id){
  const box=document.getElementById('chatbox'); if(!box) return; const msgs=S.chats[id]||[];
  box.innerHTML = msgs.length ? msgs.map(m=>`<div class="bubble ${m.from==='me'?'me':''}"><span>${esc(m.text)}</span><small>${ago(m.at)}</small></div>`).join('') : '<p class="muted" style="text-align:center;padding:30px 0">Première partie ensemble ? Propose un créneau 🎮</p>';
  box.scrollTop=box.scrollHeight;
}

/* ---- Partage de profil ---- */
function shareLink(name){ return location.href.split('#')[0]+'#/@'+encodeURIComponent(name); }
async function shareProfile(){
  const url=shareLink(S.me.name);
  if(navigator.share){ try{ await navigator.share({title:'Mon profil Coopô',text:`Deviens mon mate sur Coopô : ${S.me.name}`,url}); return; }catch(e){} }
  try{ await navigator.clipboard.writeText(url); toast('Lien de ton profil copié'); }
  catch(e){ modal(`<h3>Ton lien</h3><input type="text" readonly value="${esc(url)}" onfocus="this.select()"><div class="dlg-actions"><button class="btn" data-close>Fermer</button></div>`); }
}

  const f=app.querySelector('#ob'), err=app.querySelector('#ob-err');
  const keepName=()=>{ const n=app.querySelector('#ob-name'); if(n) OB.name=n.value.trim(); };
  app.querySelectorAll('[data-ob-game]').forEach(b=>b.onclick=()=>{ keepName(); const g=b.dataset.obGame; OB.games=OB.games.includes(g)?OB.games.filter(x=>x!==g):[...OB.games,g]; const on=OB.games.includes(g); b.classList.toggle('on',on); b.setAttribute('aria-pressed',on); });
  const add=app.querySelector('#ob-add'); if(add) add.onclick=()=>{ const i=app.querySelector('#ob-other'); const v=i.value.trim().slice(0,30); if(v&&!OB.games.includes(v)){ OB.games.push(v); keepName(); viewOnboard(); } };
  app.querySelectorAll('[data-ob-hour]').forEach(b=>b.onclick=()=>{ const v=b.dataset.obHour; OB.hours=OB.hours.includes(v)?OB.hours.filter(x=>x!==v):[...OB.hours,v]; const on=OB.hours.includes(v); b.classList.toggle('on',on); b.setAttribute('aria-pressed',on); });
  app.querySelectorAll('[data-ob-style]').forEach(b=>b.onclick=()=>{ OB.style=b.dataset.obStyle; app.querySelectorAll('[data-ob-style]').forEach(x=>{ const on=x===b; x.classList.toggle('on',on); x.setAttribute('aria-pressed',on); }); });
  const we=app.querySelector('#ob-we'); if(we) we.onchange=()=>{ OB.weekend=we.checked; };
  const back=app.querySelector('#ob-back'); if(back) back.onclick=()=>{ OB.step=1; viewOnboard(); };
  f.onsubmit=e=>{ e.preventDefault(); const errs=[];
    if(OB.step===1){ keepName();
      if(!new RegExp(`^[A-Za-z0-9_.-]{${CONFIG.minUsername},${CONFIG.maxUsername}}$`).test(OB.name)) errs.push("Choisis un pseudo de 3 à 20 caractères (lettres, chiffres, _ . -).");
      else if(PLAYERS.some(p=>p.name.toLowerCase()===OB.name.toLowerCase())) errs.push("Ce pseudo est déjà pris.");
      const age=ageFrom(draft.dob); if(age===null) errs.push('Indique ta date de naissance.'); else if(age<CONFIG.minAge) errs.push(`Il faut avoir au moins ${CONFIG.minAge} ans pour utiliser Coopô.`); else if(age>100) errs.push('Vérifie ta date de naissance.');
      if(!OB.games.length) errs.push('Choisis au moins un jeu.');
      if(errs.length){ err.innerHTML=errs.map(esc).join('<br>'); return; }
      OB.step=2; viewOnboard(); window.scrollTo(0,0); return; }
    if(!OB.hours.length) errs.push('Choisis au moins un moment.');
    if(!OB.style) errs.push('Choisis ton style.');
    if(errs.length){ err.innerHTML=errs.map(esc).join('<br>'); return; }
    // tout le reste est déduit ou mis par défaut : modifiable ensuite dans « Mon profil »
    const plats=[...new Set(OB.games.flatMap(g=>GAME_PLATFORMS[g]||['mobile']))];
    const reg=((navigator.language||'').split('-')[1]||'').toUpperCase(); const country=COUNTRIES.some(c=>c[0]===reg)?reg:'';
    S.me={ id:'me', name:OB.name, dob:draft.dob, games:OB.games, hours:OB.hours, days:OB.weekend?['sam','dim']:[], style:OB.style, goal:'both', voice:'parfois',
      platforms:plats.length?plats:['mobile'], country, langs:['fr'], discord:'', tags:{}, ranks:{}, avatar:{hue:[265,330,10,45,150,200][Math.floor(Math.random()*6)]} };
    if(S.auth) S.profiles[S.auth.uid]=S.me; S.onboard=true; save(); DB.saveProfile(S.me); if(typeof demoScheduleIncoming==='function') demoScheduleIncoming();
    OB=null; toast('Profil créé, bienvenue !');
    let next='#/matchs'; try{ next=sessionStorage.getItem('coopo_after_profile')||sessionStorage.getItem('coopo_after_login')||'#/matchs'; sessionStorage.removeItem('coopo_after_profile'); sessionStorage.removeItem('coopo_after_login'); }catch(x){}
    location.hash=next; };
}

function submitReport(id,reason,details){

/* =========================================================
   COUCHE FIRESTORE — active uniquement quand AUTH est configuré.
   En mode démo, tout reste dans le navigateur.
   Schéma : profiles/{uid} (public, sans date de naissance) · private/{uid} (dob, email)
   usernames/{nameLower} · requests/{from_to} · blocks/{uid}/list/{other}
   reports/{id} · chats/{pairId}/messages/{id} · squads/{id}
   notifications/{uid}/items/{id} · ratings/{uid_target} · admins/{uid}
   ========================================================= */
const DB = {
  live:false, db:null, _unsub:[],
  uid(){ return S.auth && S.auth.uid; },
  toUid(id){ return id==='me' ? this.uid() : id; },
  fromUid(u){ return u===this.uid() ? 'me' : u; },
  pairId(id){ return [this.uid(),id].sort().join('_'); },
  async init(){ if(!AUTH_LIVE) return; try{ await loadScript(`https://www.gstatic.com/firebasejs/${FB_VERSION}/firebase-firestore-compat.js`); this.db=firebase.firestore(); this.live=true;
    if(SHOP.api){ const api=SHOP.api.replace(/\/$/,''); this.fns={ httpsCallable: name => async (data) => {
        const u=firebase.auth().currentUser; if(!u) throw new Error('Connecte-toi pour continuer.');
        const token=await u.getIdToken(); const r=await fetch(`${api}/${name}`,{ method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token}, body:JSON.stringify(data||{}) });
        let j={}; try{ j=await r.json(); }catch(e){} if(!r.ok) throw new Error(j.error||'Le serveur de paiement ne répond pas.'); return { data:j }; } }; }
    else { try{ await loadScript(`https://www.gstatic.com/firebasejs/${FB_VERSION}/firebase-functions-compat.js`); this.fns=firebase.app().functions(SHOP.region); }catch(e){ console.error(e); } } }catch(e){ console.error(e); toast('Base de données indisponible'); } },
  async loadAll(){
    if(!this.live||!this.uid()) return; const uid=this.uid(), db=this.db; this._loading=true; this._err=null; this._noProfile=false;
    try{
      const [prof,priv]=await Promise.all([db.collection('profiles').doc(uid).get(),db.collection('private').doc(uid).get()]);
      if(prof.exists){ S.me=normP({...prof.data(),id:'me',dob:priv.exists?priv.data().dob:''}); { const sk=prof.data().skin; if(sk&&SKINS[sk]) S.skinWanted=sk; } S.profiles[uid]=S.me; }
      if(priv.exists&&priv.data().dob) S.dobs[uid]=priv.data().dob;
      if(prof.exists&&prof.data().banned){ toast('Ce compte a été suspendu.'); await signOut(); return; }
      if(!prof.exists){ this._loaded=true; this._loading=false; this._noProfile=true; save(); refreshAfterData(); return; }
      const g=S.me&&S.me.dob?ageGroup(S.me):'adult';
      const ps=await db.collection('profiles').where('ageGroup','==',g).where('hidden','==',false).limit(300).get();
      PLAYERS.length=0; ps.forEach(d=>{ if(d.id!==uid) PLAYERS.push(normP({...d.data(),id:d.id,age:undefined})); });
      const rq=await db.collection('requests').where('participants','array-contains',uid).get();
      S.requests=[]; rq.forEach(d=>{ const r=d.data(); S.requests.push({id:d.id,from:this.fromUid(r.from),to:this.fromUid(r.to),status:r.status,at:r.at}); });
      const bl=await db.collection('blocks').doc(uid).collection('list').get(); S.blocked=[]; bl.forEach(d=>S.blocked.push(d.id));
      const rt=await db.collection('ratings').where('by','==',uid).get(); S.ratings={}; rt.forEach(d=>{ S.ratings[d.data().target]=d.data().value; });
      const sq=await db.collection('squads').where('ageGroup','==',g).get(); DEMO_SQUADS.length=0; S.squads=[]; S.joined=[];
      sq.forEach(d=>{ const s={...d.data(),id:d.id}; s.members=s.members.map(m=>this.fromUid(m)); s.owner=this.fromUid(s.owner); if(s.members.includes('me')&&s.owner!=='me') S.joined.push(s.id); (s.owner==='me'?S.squads:DEMO_SQUADS).push(s); });
      const ad=await db.collection('admins').doc(uid).get(); if(ad.exists&&!ADMINS.includes(uid)) ADMINS.push(uid);
      await this.loadPurchases();
      const isModNow=ad.exists, wasMod=!!(prof.data()||{}).moderator;
      if(isModNow!==wasMod){ try{ await db.collection('profiles').doc(uid).update({moderator:isModNow}); if(S.me) S.me.moderator=isModNow; }catch(e){ console.error(e); } }
      if(ad.exists) await this.loadReports();
      { const before=S.skin; applySkin(S.skinWanted||S.skin); if(S.skin!==before) route(); }
      this._loaded=true; this._loading=false; refreshAfterData();
      this._unsub.forEach(u=>u()); this._unsub=[];
      this._unsub.push(db.collection('notifications').doc(uid).collection('items').orderBy('at','desc').limit(40).onSnapshot(snap=>{
        snap.docChanges().forEach(ch=>{ if(ch.type==='added'){ const n=ch.doc.data(); if(!S.notifs.some(x=>x.id===ch.doc.id)){ S.notifs.unshift({...n,id:ch.doc.id,from:this.fromUid(n.from)}); if(this._notifReady&&!n.read) deviceNotify(n); } } }); this._notifReady=true;
        S.notifs=S.notifs.slice(0,60); save(); renderNotifBadge(); }));
      this._unsub.push(db.collection('requests').where('to','==',uid).onSnapshot(snap=>{ snap.docChanges().forEach(ch=>{ const r=ch.doc.data(); if(!r) return; const ex=S.requests.find(x=>x.id===ch.doc.id);
        if(ch.type==='removed'){ S.requests=S.requests.filter(x=>x.id!==ch.doc.id); } else if(ex) ex.status=r.status; else S.requests.push({id:ch.doc.id,from:this.fromUid(r.from),to:'me',status:r.status,at:r.at}); }); save(); renderNotifBadge(); if(location.hash==='#/messages'||location.hash==='#/matchs') refreshAfterData(); }));
      save(); this.setPresence(true); clearInterval(this._hb); this._hb=setInterval(()=>this.setPresence(true),60000);
      addEventListener('beforeunload',()=>this.setPresence(false));
    }catch(e){ console.error(e); this._loaded=true; this._loading=false; this._err=(e&&e.code)||String(e); toast('Erreur de chargement des données'); refreshAfterData(); }
  },
  async saveProfile(me){ if(!this.live) return; const uid=this.uid(); const {dob,id,age,...pub}=me;
    try{ const ref=this.db.collection('profiles').doc(uid); const isNew=!(await ref.get().catch(()=>({exists:false}))).exists;
      await this.db.collection('private').doc(uid).set({dob,updatedAt:Date.now()},{merge:true});
      await this.db.collection('usernames').doc(me.name.toLowerCase()).set({uid});
      const {banned,hidden,rejoue,moderator,dispo,skin,...safe}=pub;
      const data={...safe,nameLower:me.name.toLowerCase(),ageGroup:ageGroup(me),privacy:S.privacy,discordPublic:S.privacy.discord,online:true,lastSeen:Date.now(),updatedAt:Date.now()};
      if(isNew){ Object.assign(data,{banned:false,hidden:false,rejoue:0}); await ref.set(data); await this.applyReferral(); await this.loadAll(); }
      else await ref.set(data,{merge:true}); }
    catch(e){ console.error(e); toast("Le profil n'a pas pu être enregistré en ligne"); } },
  async saveRequest(r){ if(!this.live) return; const from=this.toUid(r.from), to=this.toUid(r.to); const db=this.db;
    try{ const ref=db.collection('requests').doc(`${from}_${to}`), data={from,to,participants:[from,to],status:r.status,at:r.at};
      if(r.status==='pending'){ // nouvelle demande : compteur journalier (20 max), vérifié par les règles Firestore
        const L=db.collection('limits').doc(this.uid()), cur=(await L.get()).data()||{}, today=Math.floor(Date.now()/86400000);
        const n=(cur.day===today?(cur.reqCount||0):0)+1;
        if(n>20){ toast('Tu as atteint la limite de 20 demandes pour aujourd\'hui. Réessaie demain.'); return; }
        const b=db.batch(); b.set(ref,data); b.set(L,{day:today,reqCount:n},{merge:true}); await b.commit();
        await this.saveNotif(r.to,{type:'request',from:'me',text:`${S.me.name} veut devenir ton mate`});
      } else await ref.set(data);
    }catch(e){ console.error(e); if(String(e&&e.code).includes('permission')) toast("Demande refusée : limite atteinte ou joueur indisponible."); } },
  async deleteRequest(r){ if(!this.live) return; try{ await this.db.collection('requests').doc(`${this.toUid(r.from)}_${this.toUid(r.to)}`).delete(); }catch(e){ console.error(e); } },
  async saveBlock(id,on){ if(!this.live) return; try{ const ref=this.db.collection('blocks').doc(this.uid()).collection('list').doc(id); on?await ref.set({at:Date.now()}):await ref.delete(); }catch(e){ console.error(e); } },
  async saveReport(rep){ if(!this.live) return; const db=this.db;
    try{ const msgs=(S.chats[rep.id]||[]).slice(-10).map(m=>({mine:m.from==='me',text:String(m.text||'').slice(0,300),at:m.at||0}));
      const data={target:rep.id,by:this.uid(),reason:rep.reason,details:rep.details||'',at:rep.at,status:'open'}; if(msgs.length) data.messages=msgs;
      await db.collection('reports').add(data);
      if(msgs.length) await db.collection('reportedChats').doc(this.pairId(rep.id)).set({by:this.uid(),target:rep.id,at:Date.now()});   // autorise la modération à lire cette conversation
    }catch(e){ console.error(e); } },
  async loadReportedChat(by,target){ if(!this.live) return []; try{ const id=[by,target].sort().join('_'); const q=await this.db.collection('chats').doc(id).collection('messages').orderBy('at','desc').limit(30).get();
      const out=[]; q.forEach(d=>{ const m=d.data(); out.push({fromTarget:m.from===target,text:m.text,at:m.at}); }); return out.reverse(); }catch(e){ console.error(e); return null; } },
  async sendMessage(id,m){ if(!this.live) return; const db=this.db;
    try{ const F=firebase.firestore.FieldValue, b=db.batch();
      b.set(db.collection('chats').doc(this.pairId(id)).collection('messages').doc(),{from:this.uid(),text:m.text,at:m.at});
      b.set(db.collection('limits').doc(this.uid()),{lastMsg:F.serverTimestamp()},{merge:true});   // 1 message par seconde maximum
      await b.commit();
      if(!this._lastNotifTo||this._lastNotifTo[id]==null||Date.now()-this._lastNotifTo[id]>60000){ (this._lastNotifTo=this._lastNotifTo||{})[id]=Date.now(); await this.saveNotif(id,{type:'message',from:'me',text:`${S.me.name} : ${m.text.slice(0,80)}`}); }
    }catch(e){ console.error(e); toast(String(e&&e.code).includes('permission')?'Doucement : attends une seconde entre deux messages.':"Le message n'est pas parti, réessaie."); } },
  listenChat(id,cb){ if(!this.live) return; if(this._chatUnsub) this._chatUnsub(); this._chatUnsub=this.db.collection('chats').doc(this.pairId(id)).collection('messages').orderBy('at').limit(200).onSnapshot(snap=>{ S.chats[id]=[]; snap.forEach(d=>{ const m=d.data(); S.chats[id].push({from:this.fromUid(m.from),text:m.text,at:m.at}); }); save(); cb(); }); },
  async saveSquad(s){ if(!this.live) return; try{ await this.db.collection('squads').doc(s.id).set({...s,owner:this.uid(),members:[this.uid()]}); }catch(e){ console.error(e); } },
  async deleteSquad(id){ if(!this.live) return; try{ await this.db.collection('squads').doc(id).delete(); }catch(e){ console.error(e); } },
  async joinSquad(id,on){ if(!this.live) return; try{ const F=firebase.firestore.FieldValue; await this.db.collection('squads').doc(id).update({members:on?F.arrayUnion(this.uid()):F.arrayRemove(this.uid())}); }catch(e){ console.error(e); } },
  async saveNotif(toId,n){ if(!this.live) return; try{ await this.db.collection('notifications').doc(this.toUid(toId)).collection('items').add({...n,from:this.toUid(n.from),at:Date.now(),read:false}); }catch(e){ console.error(e); } },
  async rate(id,v){ if(!this.live) return; try{ await this.db.collection('ratings').doc(`${this.uid()}_${id}`).set({by:this.uid(),target:id,value:v,at:Date.now()}); const F=firebase.firestore.FieldValue; if(v>0) await this.db.collection('profiles').doc(id).update({rejoue:F.increment(1)}); }catch(e){ console.error(e); } },
  async setPresence(on){ if(!this.live||!this.uid()||!S.me) return; try{ await this.db.collection('profiles').doc(this.uid()).update({online:on&&S.privacy.online,lastSeen:Date.now()}); }catch(e){} },
  saveSkin(id){ try{ if(S.auth){ S.skinByUser=S.skinByUser||{}; S.skinByUser[S.auth.uid]=id; save(); } }catch(e){}
    if(!this.live||!this.uid()||!S.me) return; clearTimeout(this._skinT);
    this._skinT=setTimeout(()=>{ this.db.collection('profiles').doc(this.uid()).update({skin:id}).catch(e=>console.error(e)); },600); },
  async setDispo(d){ if(!this.live||!this.uid()) return; try{ await this.db.collection('profiles').doc(this.uid()).update({dispo:d||null}); }catch(e){ console.error(e); toast('Statut non enregistré en ligne'); } },
  async refreshPlayers(){ if(!this.live||!this.uid()||!S.me||!S.me.dob) return false; if(this._refreshing||(this._lastPlayers&&Date.now()-this._lastPlayers<45000)) return false; this._lastPlayers=Date.now(); this._refreshing=true;
    try{ const uid=this.uid(), g=ageGroup(S.me); const ps=await this.db.collection('profiles').where('ageGroup','==',g).where('hidden','==',false).limit(300).get();
      const fresh=[]; ps.forEach(d=>{ if(d.id!==uid) fresh.push(normP({...d.data(),id:d.id,age:undefined})); }); const keep=PLAYERS.filter(p=>p._reported&&!fresh.some(f=>f.id===p.id)); PLAYERS.length=0; fresh.concat(keep).forEach(p=>PLAYERS.push(p)); return true; }catch(e){ console.error(e); return false; } finally{ this._refreshing=false; } },
  async applyReferral(){ if(!this.live||!this.uid()||!S.me) return; const code=(localStorage.getItem('coopo_ref')||'').toLowerCase(); if(!code||code===S.me.name.toLowerCase()) return;
    try{ const un=await this.db.collection('usernames').doc(code).get(); if(!un.exists||un.data().uid===this.uid()){ localStorage.removeItem('coopo_ref'); return; }
      const by=un.data().uid, db=this.db, b=db.batch();
      b.set(db.collection('referrals').doc(this.uid()),{by,byName:code,at:Date.now()});
      b.set(db.collection('rewards').doc(by),{referrals:firebase.firestore.FieldValue.increment(1)},{merge:true});
      b.set(db.collection('rewards').doc(this.uid()),{referred:true},{merge:true});
      await b.commit(); localStorage.removeItem('coopo_ref'); S.rewards={...(S.rewards||{}),referred:true}; save(); toast(`Parrainage validé : le thème ${SKINS[REF_REWARD.one].label} est à toi !`); }
    catch(e){ console.error(e); localStorage.removeItem('coopo_ref'); } },
  async loadPurchases(){ if(!this.live||!this.uid()) return; try{ const d=await this.db.collection('purchases').doc(this.uid()).get(); const x=d.exists?d.data():{}; S.owned={pack:!!x.pack,themes:Array.isArray(x.themes)?x.themes:[]}; const r=await this.db.collection('rewards').doc(this.uid()).get(); S.rewards=r.exists?r.data():{}; save(); }catch(e){ console.error(e); } },
  async loadReports(){ if(!this.live) return; const db=this.db;
    try{ const rs=await db.collection('reports').orderBy('at','desc').limit(300).get();
      S.reports=[]; rs.forEach(d=>{ const r=d.data(); S.reports.push({rid:d.id,id:r.target,by:r.by,reason:r.reason,details:r.details,at:r.at,status:r.status,messages:r.messages||null}); });
      const ids=[...new Set(S.reports.map(r=>r.id))].filter(id=>!PLAYERS.some(p=>p.id===id));
      const docs=await Promise.all(ids.map(id=>db.collection('profiles').doc(id).get().catch(()=>null)));
      docs.forEach(d=>{ if(d&&d.exists) PLAYERS.push(normP({...d.data(),id:d.id,age:undefined,_reported:true})); });
      S.hidden=PLAYERS.filter(p=>p.hidden).map(p=>p.id); S.banned=PLAYERS.filter(p=>p.banned).map(p=>p.id); save();
    }catch(e){ console.error(e); toast('Signalements indisponibles'); } },
  async closeReports(target){ if(!this.live) return; try{ const b=this.db.batch(); S.reports.filter(r=>r.id===target&&r.rid&&r.status!=='done').forEach(r=>b.update(this.db.collection('reports').doc(r.rid),{status:'done'})); await b.commit(); }catch(e){ console.error(e); } },
  async sendContact(c){ if(!this.live) throw new Error('offline'); await this.db.collection('contact').add({message:c.message,email:c.email||'',uid:this.uid()||'',topic:this.uid()?'general':'connexion',at:Date.now()}); },
  async deleteAccountData(){ if(!this.live||!this.uid()) return; const uid=this.uid(), db=this.db;
    try{ const bl=await db.collection('blocks').doc(uid).collection('list').get(); const nt=await db.collection('notifications').doc(uid).collection('items').get();
      const rq=await db.collection('requests').where('participants','array-contains',uid).get();
      const b=db.batch(); bl.forEach(d=>b.delete(d.ref)); nt.forEach(d=>b.delete(d.ref)); rq.forEach(d=>b.delete(d.ref));
      if(S.me&&S.me.name) b.delete(db.collection('usernames').doc(S.me.name.toLowerCase()));
      b.delete(db.collection('profiles').doc(uid)); b.delete(db.collection('private').doc(uid)); await b.commit();
    }catch(e){ console.error(e); } },
  async adminHide(id,hidden){ if(!this.live) return; try{ await this.db.collection('profiles').doc(id).update({hidden}); }catch(e){ console.error(e); } },
  async adminBan(id,banned){ if(!this.live) return; try{ await this.db.collection('profiles').doc(id).update({banned,hidden:banned}); }catch(e){ console.error(e); } },
};


// Site en ligne (Firebase configuré) : on retire tous les profils et groupes de démonstration
if(AUTH_LIVE){
  PLAYERS.length=0; DEMO_SQUADS.length=0;
  const isDemo=id=>/^p\d+$/.test(String(id));
  S.requests=(S.requests||[]).filter(r=>!isDemo(r.from)&&!isDemo(r.to));
  S.notifs=(S.notifs||[]).filter(n=>!isDemo(n.from));
  Object.keys(S.chats||{}).forEach(k=>{ if(isDemo(k)) delete S.chats[k]; });
  Object.keys(S.unread||{}).forEach(k=>{ if(isDemo(k)) delete S.unread[k]; });
  Object.keys(S.ratings||{}).forEach(k=>{ if(isDemo(k)) delete S.ratings[k]; });
  ['blocked','hidden','banned'].forEach(k=>{ if(Array.isArray(S[k])) S[k]=S[k].filter(x=>!isDemo(x)); });
  S.reports=(S.reports||[]).filter(r=>!isDemo(r.id));
  S.joined=[]; save();
}
applySkin(S.skinWanted||S.skin||'defaut');
route();
initAuth();
demoScheduleIncoming();
</script>
