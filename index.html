/* =========================================================
   FLAMMES : deux mates qui s'écrivent chaque jour gardent une flamme 🔥 (comme sur Snapchat ou TikTok)
   Firestore : streaks/{uidA_uidB} = { members:[a,b], last:{uid:jour}, both:jour, count:n }
   - « jour » = numéro du jour à l'heure d'Abidjan (UTC, pas de changement d'heure). C'est l'heure du SERVEUR qui compte :
     les règles Firestore refusent toute écriture qui ne correspond pas au jour réel, et n'acceptent une écriture
     que dans le même envoi qu'un vrai message. On ne peut donc pas tricher en changeant l'heure de son téléphone.
   - both = dernier jour où les DEUX ont écrit ; count = nombre de jours d'affilée à ce moment-là.
   ========================================================= */
const FLAME_STEPS=[10,30,100,365], FLAME_FROM=2, FLAME_WARN_HOUR=18;   // la flamme s'affiche à partir de 2 jours ; sablier à partir de 18 h si la journée n'est pas validée
let DAY_SHIFT=0;   // si l'horloge du téléphone est fausse, le serveur refuse la flamme : on se recale d'un jour (voir DB.sendMessage)
const dayNow = () => Math.floor(Date.now()/86400000)+DAY_SHIFT;
function flameState(id){ const s=(S.streaks||{})[id]; if(!s||!AUTH_LIVE) return null; const t=dayNow(), me=DB.uid();
  const alive=s.both>=t-1&&s.count>0, done=s.both===t, mine=(s.last||{})[me]===t, his=(s.last||{})[id]===t;
  return { count:alive?s.count:0, alive, done, mine, his, warn:alive&&!done&&new Date().getUTCHours()>=FLAME_WARN_HOUR }; }
function flameTag(id){ const f=flameState(id); if(!f||f.count<FLAME_FROM) return '';
  return `<span class="flame${f.warn?' warn':''}" title="${f.count} jours d'affilée${f.warn?' · elle va s\'éteindre à minuit':''}">${f.warn?'⏳':'🔥'}<b>${f.count}</b></span>`; }
// Phrase d'état sous une conversation
function flameHint(id,name){ const f=flameState(id); if(!f) return '';
  if(f.count>=FLAME_FROM&&!f.done) return `${f.warn?'⏳':'🔥'} ${f.mine?`${esc(name)} doit t'écrire`:f.his?'Réponds':'Écrivez-vous tous les deux'} avant minuit (heure d'Abidjan) pour garder votre flamme de ${f.count} jours.`;
  if(f.count>=FLAME_FROM) return `🔥 ${f.count} jours d'affilée. C'est validé pour aujourd'hui.`;
  if(f.count===1&&!f.done) return `Écrivez-vous encore aujourd'hui tous les deux pour allumer une flamme 🔥`;
  return ''; }
// Palier atteint (10, 30, 100, 365 jours) : petite fête, et la plaque du palier est offerte
function flameMilestone(id){ const s=(S.streaks||{})[id]; if(!s||s.both<dayNow()-1) return; const p=PLAYERS.find(x=>x.id===id);
  S.flameSeen=S.flameSeen||{}; const seen=S.flameSeen[id]||0, step=FLAME_STEPS.filter(n=>s.count>=n).pop(); if(!step) return;
  FLAME_STEPS.filter(n=>n<=step).forEach(n=>{ if(!ownsPlate('flamme'+n)||isAdmin()) DB.grantPlate('flamme'+n, DB.pairId(id)); });   // la plaque gagnée (les règles vérifient la flamme)
  if(seen>=step) return; S.flameSeen[id]=step; save();
  if(s.count!==step||!DB._streakReady) return;   // on ne fête que le jour même du palier
  setTimeout(()=>{ try{ burst(innerWidth/2,innerHeight*.4); }catch(e){}
    modal(`<div class="flame-party"><span class="flame-big" aria-hidden="true">🔥</span><h3>${step} jours d'affilée${p?` avec ${esc(p.name)}`:''} !</h3>
      <p class="muted">Vous vous êtes écrit chaque jour pendant ${step} jours. La plaque <b>${np({plate:'flamme'+step,name:PLATES['flamme'+step].label})}</b> est à vous deux.</p></div>
      <div class="dlg-actions"><button class="btn btn-ghost" data-close>Plus tard</button><a class="btn btn-ac" href="#/boutique/objets" data-close>Voir ma plaque</a></div>`); },600); }
// Rappel : une flamme va s'éteindre et c'est à moi d'écrire (une fois par jour et par mate, quand Coopô est ouvert)
function flameCheck(){ if(!AUTH_LIVE||!S.me||new Date().getUTCHours()<FLAME_WARN_HOUR) return; const t=dayNow(); S.flameNudged=S.flameNudged||{};
  Object.keys(S.streaks||{}).forEach(id=>{ const f=flameState(id), p=PLAYERS.find(x=>x.id===id); if(!f||!p||!isMate(id)||f.count<FLAME_FROM||f.done||f.mine||S.flameNudged[id]===t) return;
    S.flameNudged[id]=t; const n={type:'flame',from:id,text:`⏳ Ta flamme de ${f.count} jours avec ${p.name} s'éteint à minuit : écris-lui !`};
    notify({...n,toast:location.hash!=='#/messages/'+id}); deviceNotify(n); }); save(); }
setInterval(flameCheck,20*60e3);   // tourne aussi quand l'appli est en arrière-plan : c'est là que la notification du téléphone sert

/* =========================================================
   GROUPES : des salons permanents avec discussion en temps réel
   Firestore : groups/{id} = { name, desc, game, image, private, owner, mods[], members[], invited[], kicked[], ageGroup, at, lastAt }
               groups/{id}/messages/{id} = { from, text, at }
   - Rôles : créateur (admin), modérateurs, membres. Seuls les membres lisent les messages (règles Firestore).
   - 50 membres maximum par groupe, pour rester dans la formule gratuite de Firebase.
   - v7 — les groupes sont ouverts à tous les âges. Un adulte n'invite un 13-17 ans que s'ils sont mates (une invitation à la fois),
     et dans un groupe où il y a un 13-17 ans : pas de photo, pas de numéro de téléphone.
   ========================================================= */
const GROUP_MAX=50, GROUP_OWN_MAX=3;
let GROUPS=[];   // groupes visibles : les miens, ceux où je suis invité, les groupes publics
// Un 13-17 ans (autre que moi) fait-il partie du groupe ? (profils chargés seulement)
const gHasMinor = g => !!g && (g.members||[]).some(u=>{ if(u===myId()) return false; const p=gPlayer(u); return !!p&&minorP(p); });
const normG = g => { ['mods','members','invited','kicked'].forEach(k=>{ if(!Array.isArray(g[k])) g[k]=[]; }); g.name=String(g.name||'Groupe'); g.private=!!g.private; return g; };
const tsMs = v => v&&typeof v.toMillis==='function' ? v.toMillis() : (+v||0);
const gById = id => GROUPS.find(g=>g.id===id);
const gIn = g => !!g && g.members.includes(myId());
const gRole = (g,uid) => g.owner===uid?'admin':(g.mods||[]).includes(uid)?'mod':'';
const gCanMod = g => gIn(g) && !!gRole(g,myId());
const gUnread = g => gIn(g) && tsMs(g.lastAt) > ((S.gseen||{})[g.id]||0);
const gPlayer = uid => uid===myId() ? publicMe() : PLAYERS.find(p=>p.id===uid);
function gAvatar(g,size=48){ if(g.image&&g.ageGroup!=='minor'&&/^data:image\/(png|jpeg|webp);base64,/.test(g.image)) return `<img class="av g-av" src="${esc(g.image)}" alt="" width="${size}" height="${size}" style="width:${size}px;height:${size}px">`;
  let h=0; for(const c of String(g.id)) h=(h*31+c.charCodeAt(0))%360;
  return `<span class="av g-av" aria-hidden="true" style="width:${size}px;height:${size}px;--h:${h};font-size:${Math.round(size*.36)}px">${esc((g.name||'?').slice(0,2).toUpperCase())}</span>`; }
const ROLE_TAG={ admin:'<em class="g-role admin">Admin</em>', mod:'<em class="g-role">Modo</em>' };
const groupRow = g => `<a class="chat-row${gUnread(g)?' unread':''}" href="#/groupe/${esc(g.id)}">${gAvatar(g,52)}<div><b><span class="g-name">${esc(g.name)}</span>${g.private?' <span class="g-lock" title="Groupe privé">'+LOCK_SVG+'</span>':''}</b><span class="muted">${esc(g.game||'Tous les jeux')} · ${g.members.length} membre${g.members.length>1?'s':''}</span></div>${gUnread(g)?'<span class="badge static" aria-label="Nouveaux messages">•</span>':''}</a>`;

function viewGroupsList(){
  const mine=GROUPS.filter(gIn).sort((a,b)=>tsMs(b.lastAt||b.at)-tsMs(a.lastAt||a.at)), inv=GROUPS.filter(g=>!gIn(g)&&(g.invited||[]).includes(myId())),
    pub=GROUPS.filter(g=>!gIn(g)&&!g.private&&!(g.invited||[]).includes(myId())&&!(g.kicked||[]).includes(myId())&&!S.blocked.includes(g.owner)).sort((a,b)=>b.members.length-a.members.length);
  app.innerHTML=`<div class="wrap page">${backLink('#/messages','Messages')}<div class="page-head"><div><h2>Groupes</h2><p>Des salons pour discuter à plusieurs, par jeu ou entre amis.</p></div>${S.me?'<button class="btn btn-ac" id="newgrp">Créer un groupe</button>':''}</div>
    ${inv.length?`<h3 class="on-world g-h">Invitations</h3><div class="chat-list">${inv.map(g=>`<div class="chat-row g-inv">${gAvatar(g,52)}<div><b>${esc(g.name)}</b><span class="muted">${esc(g.game||'Tous les jeux')} · ${g.members.length} membre${g.members.length>1?'s':''}</span></div><span class="nact"><button class="btn btn-sm btn-ac" data-gjoin="${esc(g.id)}">Rejoindre</button><button class="btn btn-sm btn-ghost" data-gdecline="${esc(g.id)}">Refuser</button></span></div>`).join('')}</div>`:''}
    <h3 class="on-world g-h">Mes groupes</h3>
    ${mine.length?`<div class="chat-list">${mine.map(groupRow).join('')}</div>`:'<div class="empty"><h3>Tu n\'es dans aucun groupe</h3><p class="muted">Crée le tien et invite tes mates, ou rejoins un groupe public.</p></div>'}
    <h3 class="on-world g-h">Groupes publics</h3>
    ${pub.length?`<div class="grid">${pub.slice(0,40).map((g,i)=>`<article class="mcard g-card" style="--i:${i};--c:var(--pk)"><div class="g-card-head">${gAvatar(g,56)}<div><h3>${esc(g.name)}</h3><span class="muted">${esc(g.game||'Tous les jeux')} · ${g.members.length}/${GROUP_MAX}</span></div></div>
      ${g.desc?`<p class="muted g-desc">${esc(g.desc)}</p>`:''}<div class="sq-act">${g.members.length>=GROUP_MAX?'<span class="muted">Complet</span>':`<button class="btn btn-sm btn-ac" data-gjoin="${esc(g.id)}">Rejoindre</button>`}</div></article>`).join('')}</div>`
      :'<p class="on-world">Aucun autre groupe public pour le moment.</p>'}</div>`;

function newAnnonce(){
  if(!S.me){ location.hash='#/inscription'; return; }
  if(annoncesAll().filter(isMine).length>=MAX_ANNONCES){ toast(`Tu as déjà ${MAX_ANNONCES} annonces en cours. Retires-en une pour en publier une nouvelle.`); return; }
  const games=S.me.games.length?S.me.games:GAMES.slice(0,8);
  modal(`<h3>Publier une annonce</h3><p class="muted">Les joueurs la verront dans Annonces. Elle disparaît toute seule après la partie.</p>
    <div class="form" style="margin-top:12px">

      <div class="field"><label for="an-n">Je cherche</label><select id="an-n">${[1,2,3,4,5].map(n=>`<option value="${n}" ${n===2?'selected':''}>${n} joueur${n>1?'s':''}</option>`).join('')}</select></div></div>
    <div class="two"><div class="field"><label for="an-r">Niveau souhaité</label><select id="an-r"></select></div>

    <div class="field"><label for="an-t">Message (facultatif)</label><input id="an-t" type="text" maxlength="140" placeholder="ex. Ranked, vocal obligatoire, on vise Héroïque"></div>
    <p class="err" id="an-e" role="alert"></p></div>
    <div class="dlg-actions"><button class="btn btn-ghost" data-close>Annuler</button><button class="btn btn-ac" id="an-ok">Publier</button></div>`, d=>{
    const fill=()=>{ const g=d.querySelector('#an-g').value; d.querySelector('#an-r').innerHTML='<option value="">Peu importe</option>'+rankOptions(g).map(([,l])=>`<option value="${esc(l)}">${esc(l)}</option>`).join(''); };
    d.querySelector('#an-g').onchange=fill; fill();
    d.querySelector('#an-ok').onclick=async()=>{ const btn=d.querySelector('#an-ok');
      if(myGroupNow()==='minor'&&hasPhone(d.querySelector('#an-t').value)){ d.querySelector('#an-e').textContent='Pour ta sécurité, pas de numéro de téléphone dans une annonce.'; return; }
      btn.disabled=true;
      const w=WHEN.find(x=>x[0]===d.querySelector('#an-w').value)||WHEN[0], now=Date.now();
      const a={id:'a'+now,by:myId(),byName:S.me.name,game:d.querySelector('#an-g').value,need:+d.querySelector('#an-n').value,rank:d.querySelector('#an-r').value,when:w[0],
        text:d.querySelector('#an-t').value.trim().slice(0,140),at:now,until:now+w[2]*3600e3,replies:[],ageGroup:myGroupNow()};
      if(DB.live){ if(!(await DB.saveAnnonce(a))){ d.querySelector('#an-e').textContent="L'annonce n'a pas pu être publiée. Réessaie dans un instant."; btn.disabled=false; return; } ANNONCES.unshift(a); }
      else { S.annonces=[...(S.annonces||[]).filter(x=>x.until>now),a]; save(); }
      d.close(); toast('Annonce publiée'); location.hash='#/groupes/annonces'; route(); };
  });
}
async function joinAnnonce(id,on){
  const a=annoncesAll().find(x=>x.id===id); if(!a||!S.me) return;
  const me=myId(); a.replies = on ? [...new Set([...(a.replies||[]),me])] : (a.replies||[]).filter(x=>x!==me);
  if(!DB.live) save();
  route();
  if(!on){ await DB.replyAnnonce(a,false); return; }
  await DB.replyAnnonce(a,true);
  const author=PLAYERS.find(p=>p.id===a.by); if(!author) return;
  let q=reqWith(author.id);
  // v7 — un adulte ne fait pas de demande à un 13-17 ans : il est seulement noté partant, c'est le jeune qui décide de l'ajouter
  if(!q&&!canAsk(author)){ toast(`Tu es noté partant. ${author.name} peut t'envoyer une demande de mate s'il le souhaite.`,4000); return; }
  if(!q){ const r={id:'r'+Date.now(),from:'me',to:author.id,status:'pending',at:Date.now()}; S.requests.push(r); save(); await DB.saveRequest(r); q=r; }
  await DB.saveNotif(author.id,{type:'annonce',from:'me',text:`${S.me.name} est partant pour ton annonce ${a.game}`});
  toast(q.status==='accepted'?`${author.name} est prévenu : écris-lui pour vous organiser`:`${author.name} est prévenu, et une demande de mate lui est envoyée`);
}
async function deleteAnnonce(id){
  const a=annoncesAll().find(x=>x.id===id); if(!a) return;
  if(DB.live){ ANNONCES=ANNONCES.filter(x=>x!==a); await DB.deleteAnnonce(a); } else { S.annonces=(S.annonces||[]).filter(x=>x.id!==id); save(); }
  toast('Annonce retirée'); route();
}
document.addEventListener('click',e=>{
  const j=e.target.closest('[data-an-join]'); if(j){ j.disabled=true; joinAnnonce(j.dataset.anJoin,true); return; }
  const l=e.target.closest('[data-an-leave]'); if(l){ joinAnnonce(l.dataset.anLeave,false); return; }
  const x=e.target.closest('[data-an-del]'); if(x){ deleteAnnonce(x.dataset.anDel); return; }
});

function joinTournoi(id,on){
  const t=tournoisAll().find(x=>x.id===id); if(!t||!S.me) return;
  const go=async()=>{ const me=myId();
    if(DB.live && !(await DB.joinTournoi(t,on))) return;
    t.players = on ? [...new Set([...(t.players||[]),me])] : (t.players||[]).filter(x=>x!==me);
    t.entries = {...(t.entries||{})}; if(on) t.entries[me]={name:S.me.name,ig:myGroupNow()==='minor'?'':(S.me.tags||{})[t.game]||''}; else delete t.entries[me];   // le pseudo en jeu d'un 13-17 ans n'est pas écrit dans le tournoi
    if(!DB.live) save();
    toast(on?`Inscrit à « ${t.title} » 🎮`:'Désinscription enregistrée'); route(); };
  if(on && !((S.me.tags||{})[t.game])){   // l'organisateur a besoin de ton pseudo ou ID en jeu
    modal(`<h3>Ton pseudo ${esc(t.game)}</h3><p class="muted">L'organisateur en a besoin pour t'inviter dans la partie. Il sera aussi ajouté à ton profil.</p>
      <div class="field"><label for="to-ig">Pseudo ou ID sur ${esc(t.game)}</label><input id="to-ig" type="text" maxlength="40"></div><p class="err" id="to-e"></p>
      <div class="dlg-actions"><button class="btn btn-ghost" data-close>Annuler</button><button class="btn btn-ac" id="to-ok">M'inscrire</button></div>`, d=>{
      d.querySelector('#to-ok').onclick=async()=>{ const v=d.querySelector('#to-ig').value.trim(); if(v.length<2){ d.querySelector('#to-e').textContent='Indique ton pseudo ou ton ID.'; return; }
        S.me.tags={...(S.me.tags||{}),[t.game]:v}; if(!S.me.games.includes(t.game)) S.me.games=[...S.me.games,t.game]; save(); DB.saveProfile(S.me); d.close(); go(); };
    });
    return;
  }
  go();
}

    ${isNew?'':`<div class="field"><label for="ts">Statut</label><select id="ts">${[['open','Inscriptions ouvertes'],['closed','Inscriptions closes'],['done','Terminé']].map(([v,l])=>`<option value="${v}" ${t.status===v?'selected':''}>${l}</option>`).join('')}</select></div>`}

      if(err){ d.querySelector('#te').textContent=err; return; }

        players:t?t.players||[]:[],entries:t?t.entries||{}:{},at:t?t.at:Date.now(),id:t?t.id:''};
      if(DB.live){ if(!(await DB.saveTournoi(data))){ d.querySelector('#te').textContent="Le tournoi n'a pas pu être enregistré."; return; } TOURNOIS=TOURNOIS.filter(x=>x.id!==data.id); TOURNOIS.push(data); }

function confirmDel(d){ const b=d.querySelector('#tdel'); if(b.dataset.sure) return true; b.dataset.sure='1'; b.textContent='Confirmer la suppression'; return false; }
function tournoiList(id){

let OB=null;
function viewOnboard(){
  if(!OB) OB={ step:1, name:suggestName((S.auth&&S.auth.name)||''), games:[], hours:[], weekend:false, style:'' };
  if(!OB.name && S.auth && S.auth.name) OB.name=suggestName(S.auth.name);
  draft = draft&&draft.dob!==undefined&&!draft.games ? draft : { dob:'' };
  if(!draft.dob) draft.dob=knownDob();
  const step=OB.step, kd=knownDob();
  const tile=(on,attr,label,sub='')=>`<button type="button" class="ob-tile${on?' on':''}" ${attr} aria-pressed="${on}"><b>${label}</b>${sub?`<small>${sub}</small>`:''}</button>`;
  const more=GAMES.filter(g=>!TOP_GAMES.includes(g));
  const body = step===1 ? `
      <div class="field"><label for="ob-name">Ton pseudo</label><input id="ob-name" type="text" maxlength="${CONFIG.maxUsername}" value="${esc(OB.name)}" autocomplete="username" placeholder="ex. KoffiNight"><span class="hint">3 à 20 caractères : lettres, chiffres, _ . -</span></div>
      ${kd?'':dobField()}
      <div class="field"><span class="lbl">À quoi tu joues ?</span>
        <div class="ob-grid">${TOP_GAMES.map(g=>tile(OB.games.includes(g),`data-ob-game="${esc(g)}"`,esc(g))).join('')}</div>
        <details class="ob-more"${OB.games.some(g=>!TOP_GAMES.includes(g))?' open':''}><summary>Autres jeux</summary>
          <div class="chips" style="margin-top:10px">${more.map(g=>`<button type="button" class="chip" data-ob-game="${esc(g)}" aria-pressed="${OB.games.includes(g)}">${esc(g)}</button>`).join('')}</div>
          <div class="row" style="gap:8px;margin-top:10px"><input id="ob-other" type="text" maxlength="30" placeholder="Un autre jeu ?" style="flex:1"><button type="button" class="btn btn-sm" id="ob-add">Ajouter</button></div>
        </details></div>`
    : `
      <div class="field"><span class="lbl">Tu joues plutôt quand ?</span>
        <div class="ob-grid ob-4">${HOURS.map(([v,l])=>tile(OB.hours.includes(v),`data-ob-hour="${v}"`,l)).join('')}</div>
        <label class="ob-check"><input type="checkbox" id="ob-we" ${OB.weekend?'checked':''}> Surtout le week-end</label></div>
      <div class="field"><span class="lbl">Ton style ?</span>
        <div class="ob-grid ob-3">${[['casual','Chill','pour le plaisir'],['comp','Compétitif','pour gagner'],['both','Les deux','selon le jour']].map(([v,l,sub])=>tile(OB.style===v,`data-ob-style="${v}"`,l,sub)).join('')}</div></div>`;
  app.innerHTML=`<div class="wrap page onboard">
    <div class="ob-head"><div class="ob-progress" aria-label="Étape ${step} sur 2"><i style="width:${step*50}%"></i></div>
      <h2>${step===1?'Bienvenue sur Coopô 👋':'Dernière question'}</h2>
      <p>${step===1?'Deux questions et tu vois tes matchs.':'On s\'en sert pour te proposer les bons joueurs.'}</p>
      ${S.auth?`<p class="muted" style="font-size:13px">Connecté : ${esc(S.auth.email||S.auth.name||'')} · <button class="linklike" type="button" data-signout>Se déconnecter</button></p>`:''}</div>
    <form class="panel ob-form" id="ob" novalidate>${body}
      <p class="ferr" id="ob-err" role="alert"></p>
      <div class="ob-actions">${step===2?'<button type="button" class="btn btn-ghost" id="ob-back">Retour</button>':''}<button type="submit" class="btn btn-ac btn-lg">${step===1?'Continuer':'Voir mes matchs'}</button></div>
    </form>
    <p class="muted ob-later">Tu pourras ajouter plus tard tes pseudos en jeu, tes jours et ton avatar.</p></div>`;
  initDob();
  const f=app.querySelector('#ob'), err=app.querySelector('#ob-err');
  const keepName=()=>{ const n=app.querySelector('#ob-name'); if(n) OB.name=n.value.trim(); };
  app.querySelectorAll('[data-ob-game]').forEach(b=>b.onclick=()=>{ keepName(); const g=b.dataset.obGame; OB.games=OB.games.includes(g)?OB.games.filter(x=>x!==g):[...OB.games,g]; const on=OB.games.includes(g); b.classList.toggle('on',on); b.setAttribute('aria-pressed',on); });
  const add=app.querySelector('#ob-add'); if(add) add.onclick=()=>{ const i=app.querySelector('#ob-other'); const v=i.value.trim().slice(0,30); if(v&&!OB.games.includes(v)){ OB.games.push(v); keepName(); viewOnboard(); } };
  app.querySelectorAll('[data-ob-hour]').forEach(b=>b.onclick=()=>{ const v=b.dataset.obHour; OB.hours=OB.hours.includes(v)?OB.hours.filter(x=>x!==v):[...OB.hours,v]; const on=OB.hours.includes(v); b.classList.toggle('on',on); b.setAttribute('aria-pressed',on); });
  app.querySelectorAll('[data-ob-style]').forEach(b=>b.onclick=()=>{ OB.style=b.dataset.obStyle; app.querySelectorAll('[data-ob-style]').forEach(x=>{ const on=x===b; x.classList.toggle('on',on); x.setAttribute('aria-pressed',on); }); });
  const we=app.querySelector('#ob-we'); if(we) we.onchange=()=>{ OB.weekend=we.checked; };
  const back=app.querySelector('#ob-back'); if(back) back.onclick=()=>{ OB.step=1; viewOnboard(); };
  f.onsubmit=async e=>{ e.preventDefault(); const errs=[], btn=f.querySelector('button[type=submit]'); if(btn.disabled) return;
    if(OB.step===1){ keepName();
      if(!new RegExp(`^[A-Za-z0-9_.-]{${CONFIG.minUsername},${CONFIG.maxUsername}}$`).test(OB.name)) errs.push("Choisis un pseudo de 3 à 20 caractères (lettres, chiffres, _ . -).");
      else if(PLAYERS.some(p=>p.name.toLowerCase()===OB.name.toLowerCase())) errs.push("Ce pseudo est déjà pris.");
      const age=ageFrom(draft.dob); if(age===null) errs.push('Indique ta date de naissance.'); else if(age<CONFIG.minAge) errs.push(`Il faut avoir au moins ${CONFIG.minAge} ans pour utiliser Coopô.`); else if(age>100) errs.push('Vérifie ta date de naissance.');
      if(!OB.games.length) errs.push('Choisis au moins un jeu.');
      if(!errs.length){ btn.disabled=true; const taken=await DB.nameTaken(OB.name); btn.disabled=false; if(taken) errs.push("Ce pseudo est déjà pris."); }   // vérifié auprès de tous les comptes, pas seulement des joueurs affichés
      if(errs.length){ err.innerHTML=errs.map(esc).join('<br>'); return; }
      OB.step=2; viewOnboard(); window.scrollTo(0,0); return; }
    if(!OB.hours.length) errs.push('Choisis au moins un moment.');
    if(!OB.style) errs.push('Choisis ton style.');
    if(errs.length){ err.innerHTML=errs.map(esc).join('<br>'); return; }
    // tout le reste est déduit ou mis par défaut : modifiable ensuite dans « Mon profil »
    const plats=[...new Set(OB.games.flatMap(g=>GAME_PLATFORMS[g]||['mobile']))];
    const reg=((navigator.language||'').split('-')[1]||'').toUpperCase(); const country=COUNTRIES.some(c=>c[0]===reg)?reg:'';
    S.me={ id:'me', name:OB.name, dob:draft.dob, games:OB.games, hours:OB.hours, days:OB.weekend?['sam','dim']:[], style:OB.style, goal:'both', voice:'parfois',
      platforms:plats.length?plats:['mobile'], country, langs:['fr'], tags:{}, ranks:{}, avatar:{hue:[265,330,10,45,150,200][Math.floor(Math.random()*6)]} };
    if(S.auth) S.profiles[S.auth.uid]=S.me; S.onboard=true; save();
    btn.disabled=true; btn.textContent='Création du profil…';
    if(!(await DB.saveProfile(S.me))){   // rien n'est gardé en local si le profil n'existe pas en ligne
      S.me=null; if(S.auth) delete S.profiles[S.auth.uid]; S.onboard=false; save();
      if(DB._saveErr==='name'){ OB.step=1; viewOnboard(); const er=app.querySelector('#ob-err'); if(er) er.textContent="Ce pseudo vient d'être pris. Choisis-en un autre."; }
      else { btn.disabled=false; btn.textContent='Voir mes matchs'; err.textContent="Ton profil n'a pas pu être enregistré. Vérifie ta connexion et réessaie."; }
      return; }
    if(typeof demoScheduleIncoming==='function') demoScheduleIncoming();
    OB=null; toast(DB._refWait?'Profil créé ! Vérifie ton e-mail pour valider l\'invitation de ton ami.':'Profil créé, bienvenue !');
    let next='#/matchs'; try{ next=sessionStorage.getItem('coopo_after_profile')||sessionStorage.getItem('coopo_after_login')||'#/matchs'; sessionStorage.removeItem('coopo_after_profile'); sessionStorage.removeItem('coopo_after_login'); }catch(x){}
    location.hash=next; };
}

/* ---- Nous écrire (formulaire enregistré dans Firebase, aucun contact affiché) ---- */
function viewContact(){
  app.innerHTML=`<div class="wrap page legal">${backAuto()}<div class="page-head"><div><h2>Nous écrire</h2><p>${S.auth?'Une question, un problème de compte, une demande sur tes données ? Écris-nous ici, la modération te répondra.':'Tu n\'arrives pas à te connecter ? Explique-nous le problème (600 caractères max). Pour toute autre demande, connecte-toi d\'abord.'}</p></div></div>
    <form class="panel" id="ct-form" novalidate style="display:grid;gap:14px;max-width:620px">
      <div class="field"><label for="ct-mail">Ton e-mail pour la réponse</label><input id="ct-mail" type="email" maxlength="120" autocomplete="email" value="${esc(S.auth?.email||'')}"></div>
      <div class="field"><label for="ct-msg">Ton message</label><textarea id="ct-msg" rows="6" maxlength="${S.auth?2000:600}" required></textarea><small class="ferr" id="ct-err"></small></div>
      <div><button class="btn btn-ac" type="submit" id="ct-send">Envoyer le message</button></div>
    </form></div>`;
  document.getElementById('ct-form').addEventListener('submit',async e=>{ e.preventDefault();
    const msg=document.getElementById('ct-msg').value.trim(), mail=document.getElementById('ct-mail').value.trim(), err=document.getElementById('ct-err'), btn=document.getElementById('ct-send');
    if(!msg){ err.textContent='Écris ton message avant d\'envoyer.'; return; }
    if(mail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)){ err.textContent='Cet e-mail ne semble pas valide.'; return; }
    err.textContent=''; btn.disabled=true; btn.textContent='Envoi…';
    try{ await DB.sendContact({message:msg,email:mail}); app.querySelector('#ct-form').innerHTML='<h3>Message envoyé</h3><p class="muted">Merci. La modération te répondra par e-mail si tu en as laissé un.</p><div><a class="btn" href="#/accueil">Retour à l\'accueil</a></div>'; }
    catch(x){ btn.disabled=false; btn.textContent='Envoyer le message'; err.textContent='Envoi impossible pour le moment. Vérifie ta connexion et réessaie.'; } });
}

/* ---- Modération (administrateurs) ---- */
const isAdmin = () => !!S.auth && (ADMINS.includes(S.auth.email)||ADMINS.includes(S.auth.uid));
function viewAdmin(){
  if(!isAdmin()){
    const uid=S.auth&&S.auth.uid, waiting=DB.live&&uid&&!DB._loaded;
    const why=!S.auth?'Connecte-toi avec ton compte modérateur.'
      :DB._noProfile?"Ton profil n'est pas encore enregistré : termine la création de ton profil, puis reviens ici."
      :DB._err?`Erreur de chargement (${esc(DB._err)}).`
      :"Aucun document admins/{ton UID} n'a été trouvé dans Firestore.";
    if(waiting && !DB._loading) DB.loadAll();
    app.innerHTML=waiting?`<div class="wrap page"><div class="empty"><h3>Vérification de tes droits…</h3></div></div>`
      :`<div class="wrap page"><div class="empty"><h3>Accès réservé à la modération</h3><p class="muted">${why}</p>${uid?`<p class="muted">Ton UID : <code style="user-select:all;word-break:break-all">${esc(uid)}</code></p>`:''}<a class="btn" href="#/accueil">Retour</a></div></div>`;
    return; }
  const groups={}; S.reports.forEach(r=>{ (groups[r.id]||(groups[r.id]=[])).push(r); });
  const rows=Object.entries(groups).sort((a,b)=>b[1].length-a[1].length);
  app.innerHTML=`<div class="wrap page"><div class="page-head"><div><h2>Modération</h2><p>${S.reports.filter(r=>r.status==='open').length} signalement(s) à traiter · ${S.hidden.length} profil(s) masqué(s) · ${S.banned.length} banni(s)</p></div></div>
    <div class="admin-stats"><div><b>${PLAYERS.length}</b><span>profils</span></div><div><b>${PLAYERS.filter(p=>isOnline(p)).length}</b><span>en ligne</span></div><div><b>${S.requests.filter(r=>r.status==='accepted').length}</b><span>paires de mates</span></div><div><b>${allSquads().length}</b><span>sessions</span></div></div>
    ${AUTH_LIVE&&SHOP.api?`<section class="panel admin-row"><div class="admin-head"><div><b>Anciens pseudos d'autres réseaux</b><span class="muted">Efface de la base les pseudos Discord, WhatsApp, Snapchat… de tous les joueurs, même ceux qui ne se sont pas reconnectés. Les comptes, les profils et les achats ne sont pas touchés.</span></div>
      <div class="nact"><button class="btn btn-sm" id="purge-go">Tout effacer</button></div></div><p class="muted" id="purge-out" role="status"></p></section>`:''}
    ${rows.length?rows.map(([id,rs])=>{ const p=PLAYERS.find(x=>x.id===id); const hid=S.hidden.includes(id), ban=S.banned.includes(id), open=rs.filter(r=>r.status==='open').length;
      return `<section class="panel admin-row"><div class="admin-head">${p?avatar(p,44):''}<div><b>${p?esc(p.name)+modBadge(p):esc(id)}</b><span class="muted">${rs.length} signalement(s) · ${open} ouvert(s)${hid?' · <strong>masqué</strong>':''}${ban?' · <strong>banni</strong>':''}</span></div>
        <div class="nact">${ban?`<button class="btn btn-sm" data-unban="${esc(id)}">Lever le ban</button>`:`<button class="btn btn-sm ${hid?'':'btn-ghost'}" data-hide="${esc(id)}">${hid?'Rétablir':'Masquer'}</button><button class="btn btn-sm btn-danger" data-ban="${esc(id)}">Bannir</button>`}${open?`<button class="btn btn-sm" data-done="${esc(id)}">Marquer traité</button>`:''}</div></div>
        <ul class="admin-list">${rs.map(r=>`<li class="${r.status==='open'?'open':'done'}"><b>${esc(r.reason)}</b> ${r.details?'— '+esc(r.details):''} <small class="muted">${ago(r.at)} · ${r.status==='open'?'ouvert':'traité'}</small>
          ${r.messages&&r.messages.length?`<details class="rep-msgs"><summary>Derniers messages joints (${r.messages.length})</summary><div>${r.messages.map(m=>`<p class="${m.mine?'by-rep':'by-target'}"><b>${m.mine?'Signaleur':'Joueur signalé'} :</b> ${esc(m.text)}</p>`).join('')}</div>${r.by?`<button class="btn btn-sm btn-ghost" type="button" data-chat-by="${esc(r.by)}" data-chat-target="${esc(id)}">Voir la conversation complète</button><div class="rep-full"></div>`:''}</details>`:''}</li>`).join('')}</ul></section>`; }).join('')
      :'<div class="empty"><h3>Aucun signalement</h3><p class="muted">Tout est calme.</p></div>'}</div>`;
  const pg=document.getElementById('purge-go'); if(pg) pg.onclick=async()=>{ const out=document.getElementById('purge-out'); pg.disabled=true; out.textContent='Effacement en cours…'; let c=0,p=0;
    try{ if(!(DB.live&&DB.fns)) await DB.ready(); for(let k=0;k<25;k++){ const r=(await DB.fns.httpsCallable('purgeContacts')({})).data; c+=r.contacts||0; p+=r.profils||0; if(!r.encore) break; }
      out.textContent=`Terminé : ${c} fiche(s) de pseudos supprimée(s), ${p} profil(s) nettoyé(s).`; }
    catch(e){ out.textContent='Pas terminé : '+((e&&e.message)||'erreur')+' Réessaie plus tard.'; } pg.disabled=false; };
  app.querySelectorAll('[data-hide]').forEach(b=>b.onclick=()=>{ const id=b.dataset.hide; S.hidden=S.hidden.includes(id)?S.hidden.filter(x=>x!==id):[...S.hidden,id]; save(); DB.adminHide(id,S.hidden.includes(id)); viewAdmin(); });
  app.querySelectorAll('[data-ban]').forEach(b=>b.onclick=()=>modal(`<h3>Bannir ce compte ?</h3><p class="muted">Le profil disparaît pour tout le monde et le compte ne peut plus se connecter.</p><div class="dlg-actions"><button class="btn btn-ghost" data-close>Annuler</button><button class="btn btn-danger" id="bk">Bannir</button></div>`,
    d=>d.querySelector('#bk').onclick=()=>{ const id=b.dataset.ban; S.banned.push(id); DB.closeReports(id); S.reports.forEach(r=>{ if(r.id===id) r.status='done'; }); save(); DB.adminBan(id,true); d.close(); viewAdmin(); }));
  app.querySelectorAll('[data-unban]').forEach(b=>b.onclick=()=>{ S.banned=S.banned.filter(x=>x!==b.dataset.unban); save(); DB.adminBan(b.dataset.unban,false); viewAdmin(); });
  app.querySelectorAll('[data-chat-by]').forEach(b=>b.onclick=async()=>{ const box=b.nextElementSibling; box.textContent='Chargement…'; const l=await DB.loadReportedChat(b.dataset.chatBy,b.dataset.chatTarget);
    box.innerHTML = l===null ? '<p class="muted">Conversation non accessible.</p>' : l.length ? l.map(m=>`<p class="${m.fromTarget?'by-target':'by-rep'}"><b>${m.fromTarget?'Joueur signalé':'Signaleur'} :</b> ${esc(m.text)}</p>`).join('') : '<p class="muted">Aucun message.</p>'; });
  app.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{ DB.closeReports(b.dataset.done); S.reports.forEach(r=>{ if(r.id===b.dataset.done) r.status='done'; }); save(); viewAdmin(); });
}
function submitReport(id,reason,details){
  const rep={id,reason,details,at:Date.now(),status:'open',by:'me'}; S.reports.push(rep); DB.saveReport(rep);
  const n=S.reports.filter(r=>r.id===id&&r.status==='open').length;
  if(!S.hidden.includes(id)) S.hidden.push(id); // le profil signalé disparaît pour toi ; la modération décide pour les autres
  if(isAdmin() && n>=CONFIG.autoHideReports) DB.adminHide(id,true);
  save();
}

function onboarding(){
  if(!S.onboard||!S.me) return; S.onboard=false; save();
  const top=ranked().slice(0,3);
  modal(`<h3>Bienvenue, ${esc(S.me.name)} 🎮</h3><p class="muted">${top.length?`Voici tes ${top.length} meilleurs matchs. Envoie-leur une demande de mate, ou rejoins un groupe.`:'Ton profil est prêt. Coopô vient d\'ouvrir : dès qu\'un joueur compatible s\'inscrit, il apparaîtra dans « Mes matchs ».'}</p>
    <div class="rows" style="margin-top:8px">${top.map(({p,c})=>`<a class="row" href="#/joueur/${p.id}" data-close>${avatar(p,56)}<div><b>${esc(p.name)}${modBadge(p)}</b><p>${esc(p.games.slice(0,3).join(', '))}</p></div>${ring(c.pct,'ring-sm')}</a>`).join('')}</div>

}

/* =========================================================
   COUCHE FIRESTORE — active uniquement quand AUTH est configuré.
   En mode démo, tout reste dans le navigateur.
   Schéma : profiles/{uid} (public, sans date de naissance) · private/{uid} (dob, email)
   usernames/{nameLower} · requests/{from_to} · blocks/{uid}/list/{other}
   reports/{id} · chats/{pairId}/messages/{id} · squads/{id}
   notifications/{uid}/items/{id} · ratings/{uid_target} · admins/{uid}
   ========================================================= */
const DB = {
  live:false, db:null, _unsub:[],
  uid(){ return S.auth && S.auth.uid; },
  toUid(id){ return id==='me' ? this.uid() : id; },
  fromUid(u){ return u===this.uid() ? 'me' : u; },
  pairId(id){ return [this.uid(),id].sort().join('_'); },
  // Firestore prêt ? Pendant les premières secondes d'une visite (ou sur une connexion lente), une action attend la base au lieu d'être perdue.
  async ready(){ if(this.live) return true; if(!AUTH_LIVE) return false; const ok=await authReady(20000); if(!ok&&!this._slowToast){ this._slowToast=true; setTimeout(()=>{ this._slowToast=false; },8000); toast("Connexion trop lente : l'action n'a pas été enregistrée. Réessaie.",4000); } return ok&&this.live; },
  async init(){ if(!AUTH_LIVE) return false; if(this.live) return true;
    try{ if(!firebase.firestore) await loadScript(`https://www.gstatic.com/firebasejs/${FB_VERSION}/firebase-firestore-compat.js`); this.db=firebase.firestore(); await this.db.enablePersistence({synchronizeTabs:true}).catch(()=>{}); this.live=true;   // cache Firestore sur l'appareil
    if(SHOP.api){ const api=SHOP.api.replace(/\/$/,''); this.fns={ httpsCallable: name => async (data) => {
        const u=firebase.auth().currentUser; if(!u) throw new Error('Connecte-toi pour continuer.');
        const token=await u.getIdToken(); const r=await fetch(`${api}/${name}`,{ method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token}, body:JSON.stringify(data||{}) });
        let j={}; try{ j=await r.json(); }catch(e){} if(!r.ok) throw new Error(j.error||'Le serveur de paiement ne répond pas.'); return { data:j }; } }; }
    else { try{ await loadScript(`https://www.gstatic.com/firebasejs/${FB_VERSION}/firebase-functions-compat.js`); this.fns=firebase.app().functions(SHOP.region); }catch(e){ console.error(e); } }
    return true; }catch(e){ console.error(e); this.live=false; return false; } },
  async loadAll(){
    if(!this.live||!this.uid()) return; const uid=this.uid(), db=this.db; this._loading=true; this._err=null; this._noProfile=false;
    try{
      const [prof,priv]=await Promise.all([db.collection('profiles').doc(uid).get(),db.collection('private').doc(uid).get()]);
      const prevMe=S.me||{};
      if(prof.exists){ const pd=prof.data(), pv=priv.exists?priv.data():{};
        S.me=normP({...pd,id:'me',dob:pv.dob||''}); if(S.me._langLost){ delete S.me._langLost; S.langAsk=true; }   // une de ses langues a été retirée de la liste : on lui proposera d'en choisir une autre
        if(pv.tags&&typeof pv.tags==='object') S.me.tags=pv.tags;   // pseudos en jeu : la copie privée fait foi (la copie publique est vide quand ils sont masqués)
        if(pd.privacy&&typeof pd.privacy==='object') ['tags','online'].forEach(k=>{ if(typeof pd.privacy[k]==='boolean') S.privacy[k]=pd.privacy[k]; });   // confidentialité : les réglages du compte, sur tous les appareils
        { const sk=pd.skin; if(sk&&SKINS[sk]) S.skinWanted=sk; else if(sk) S.skinWanted='defaut'; if(RETIRED_SKINS.includes(sk)) this._retired=sk; } S.profiles[uid]=S.me; }
      if(priv.exists&&priv.data().dob) S.dobs[uid]=priv.data().dob;
      if(prof.exists&&prof.data().banned){ await signOut(); toast('Ce compte a été suspendu par la modération.',7000); return; }
      if(!prof.exists){ this._loaded=true; this._loading=false; this._noProfile=true; save(); refreshAfterData(); return; }
      { // Coopô ne garde plus aucun pseudo d'autres réseaux : on efface ce que ce compte avait enregistré (une seule fois par appareil)
        if(S.me){ delete S.me.discord; delete S.me.whatsapp; delete S.me.socials; delete S.privacy.discord; }
        let done=false; try{ done=localStorage.getItem('coopo_purge1')===uid; }catch(e){}
        const pd=prof.data();
        if(!done || 'discord' in pd || 'discordPublic' in pd){ const FD=firebase.firestore.FieldValue.delete();
          Promise.all([ db.collection('contacts').doc(uid).delete(), ('discord' in pd || 'discordPublic' in pd) ? db.collection('profiles').doc(uid).update({discord:FD,discordPublic:FD,privacy:{tags:!!S.privacy.tags,online:!!S.privacy.online}}) : null ])
            .then(()=>{ try{ localStorage.setItem('coopo_purge1',uid); }catch(e){} }).catch(e=>console.error(e)); }
      }
      let g=S.me&&S.me.dob?ageGroup(S.me):'adult';
      // Anniversaire des 18 ans : le groupe d'âge enregistré doit suivre l'âge réel, sinon les règles refusent toutes les lectures
      if(S.me&&S.me.dob&&prof.data().ageGroup!==g){ try{ await db.collection('profiles').doc(uid).update({ageGroup:g}); }catch(e){ console.error(e); if(prof.data().ageGroup) g=prof.data().ageGroup; } }
      // v7 — âges réunis : les profils et les sessions de tous les âges
      const [ps,rq,bl,rt,sq,ad]=await Promise.all([db.collection('profiles').where('hidden','==',false).limit(300).get(), db.collection('requests').where('participants','array-contains',uid).get(), db.collection('blocks').doc(uid).collection('list').get(), db.collection('ratings').where('by','==',uid).get(), db.collection('squads').get(), db.collection('admins').doc(uid).get(), this.loadPurchases()]);
      // v7 — les pseudos en jeu d'un 13-17 ans quittent son profil public (copie privée et gametags d'abord, pour ne rien perdre)
      { const pt=prof.data().tags; if(g==='minor'&&pt&&typeof pt==='object'&&Object.keys(pt).length){ const tg={...pt,...(S.me.tags||{})};
        Promise.resolve().then(async()=>{ await db.collection('private').doc(uid).set({tags:tg},{mergeFields:['tags']}); await this.syncGameTags(tg); await db.collection('profiles').doc(uid).update({tags:{}}); }).catch(e=>console.error(e)); } }
      this._checked=true;
      // Thème Awalé retiré : le compte repasse au thème par défaut, avec un petit mot d'explication (une seule fois)
      if(this._retired){ db.collection('profiles').doc(uid).update({skin:'defaut'}).catch(e=>console.error(e)); S.retiredMsg=true; this._retired=null; }
      PLAYERS.length=0; ps.forEach(d=>{ if(d.id!==uid) PLAYERS.push(normP({...d.data(),id:d.id,age:undefined})); }); this._lastPlayers=Date.now();
      S.requests=[]; rq.forEach(d=>{ const r=d.data(); S.requests.push({id:d.id,from:this.fromUid(r.from),to:this.fromUid(r.to),status:r.status,at:r.at}); });
      S.blocked=[]; bl.forEach(d=>S.blocked.push(d.id));
      S.ratings={}; S.rated={}; rt.forEach(d=>{ const x=d.data(); S.ratings[x.target]=x.value; if(x.counted||x.value===1) S.rated[x.target]=true; });
      DEMO_SQUADS.length=0; S.squads=[]; S.joined=[];
      sq.forEach(d=>{ const s={...d.data(),id:d.id}; s.members=(Array.isArray(s.members)?s.members:[]).map(m=>this.fromUid(m)); s.owner=this.fromUid(s.owner); if(s.members.includes('me')&&s.owner!=='me') S.joined.push(s.id); (s.owner==='me'?S.squads:DEMO_SQUADS).push(s); });
      if(ad.exists&&!ADMINS.includes(uid)) ADMINS.push(uid); else if(!ad.exists){ const k=ADMINS.indexOf(uid); if(k>=0) ADMINS.splice(k,1); }
      await this.fetchPlayers(S.requests.map(r=>r.from==='me'?r.to:r.from));   // mates et demandes dont le profil n'est pas dans les 300 chargés
      const isModNow=ad.exists, wasMod=!!(prof.data()||{}).moderator;
      if(isModNow!==wasMod){ try{ await db.collection('profiles').doc(uid).update({moderator:isModNow}); if(S.me) S.me.moderator=isModNow; }catch(e){ console.error(e); } }
      await Promise.all([ad.exists?this.loadReports():null, this.loadBoards(), this.loadGroups(true)]);
      { const before=S.skin; applySkin(S.skinWanted||S.skin); if(S.skin!==before) route(); }
      this._loaded=true; this._loading=false; refreshAfterData(); retiredNotice();
      try{ localStorage.setItem('coopo_cache', JSON.stringify({ uid, players:PLAYERS, admin:ADMINS.includes(uid) })); }catch(e){}
      this._unsub.forEach(u=>u()); this._unsub=[];
      const lerr=e=>console.error(e);   // une écoute refusée ou coupée ne doit jamais bloquer la page
      this._unsub.push(db.collection('notifications').doc(uid).collection('items').orderBy('at','desc').limit(40).onSnapshot(snap=>{
        snap.docChanges().forEach(ch=>{ const n=ch.doc.data(); if(!n) return; const ex=S.notifs.find(x=>x.id===ch.doc.id);
          if(ch.type==='added'&&!ex){ const from=this.fromUid(n.from), open=n.type==='message'&&location.hash==='#/messages/'+from;
            S.notifs.push({...n,id:ch.doc.id,from,read:!!n.read||open}); if(open&&!n.read) this.markRead([ch.doc.id]);   // conversation ouverte : lu tout de suite
            if(!n.read&&n.type==='message'&&!open) S.unread[from]=(S.unread[from]||0)+1;   // message non lu : pastille sur la conversation
            if(this._notifReady&&!n.read) deviceNotify(n); }
          else if(ch.type==='modified'&&ex&&n.read) ex.read=true; });   // lu sur un autre appareil
        this._notifReady=true;
        S.notifs.sort((a,b)=>(b.at||0)-(a.at||0)); S.notifs=S.notifs.slice(0,60); save(); renderNotifBadge(); },lerr));
      // Demandes de mate, dans les deux sens : une demande acceptée par l'autre joueur apparaît tout de suite chez celui qui l'a envoyée
      this._unsub.push(db.collection('requests').where('participants','array-contains',uid).onSnapshot(snap=>{ let chg=false; const fresh=[];
        snap.docChanges().forEach(ch=>{ const r=ch.doc.data(); if(!r) return; const from=this.fromUid(r.from), to=this.fromUid(r.to);
          const i=S.requests.findIndex(x=>x.id===ch.doc.id||(x.from===from&&x.to===to));
          if(ch.type==='removed'){ if(i>=0){ S.requests.splice(i,1); chg=true; } return; }
          const row={id:ch.doc.id,from,to,status:r.status,at:r.at};
          if(i<0){ S.requests.push(row); chg=true; fresh.push(from==='me'?to:from); }
          else if(S.requests[i].status!==row.status||S.requests[i].id!==row.id){ if(S.requests[i].status!==row.status) chg=true; S.requests[i]=row; } });
        if(!chg) return; save(); renderNotifBadge();

      // Flammes : une écoute sur toutes mes séries (un petit document par mate avec qui j'ai une série)

  joinGroup(id){ const me=myId(); return this._gUpdate(id,F=>({members:F.arrayUnion(me),invited:F.arrayRemove(me)}),g=>{ if(!g.members.includes(me)) g.members.push(me); g.invited=g.invited.filter(x=>x!==me); }); },
  async leaveGroup(id){ const me=myId(); this.stopGroup(); const ok=await this._gUpdate(id,F=>({members:F.arrayRemove(me),mods:F.arrayRemove(me)}),g=>{ g.members=g.members.filter(x=>x!==me); g.mods=g.mods.filter(x=>x!==me); }); if(ok){ const g=gById(id); if(g&&g.private) GROUPS=GROUPS.filter(x=>x.id!==id); } return ok; },
  async declineGroup(id){ const me=myId(); const ok=await this._gUpdate(id,F=>({invited:F.arrayRemove(me)}),g=>{ g.invited=g.invited.filter(x=>x!==me); }); if(ok){ const g=gById(id); if(g&&g.private) GROUPS=GROUPS.filter(x=>x.id!==id); } return ok; },
  kickFromGroup(id,uid){ const g=gById(id), owner=g&&g.owner===myId();   // un modérateur ne touche qu'à members et kicked (règles) ; le créateur retire aussi le rôle
    return this._gUpdate(id,F=>owner?{members:F.arrayRemove(uid),mods:F.arrayRemove(uid),kicked:F.arrayUnion(uid)}:{members:F.arrayRemove(uid),kicked:F.arrayUnion(uid)},x=>{ x.members=x.members.filter(u=>u!==uid); x.mods=x.mods.filter(u=>u!==uid); if(!x.kicked.includes(uid)) x.kicked.push(uid); }); },
  setGroupMod(id,uid,on){ return this._gUpdate(id,F=>({mods:on?F.arrayUnion(uid):F.arrayRemove(uid)}),g=>{ g.mods=on?[...new Set([...g.mods,uid])]:g.mods.filter(u=>u!==uid); }); },
  // v7 — une invitation à la fois (les règles vérifient chaque personne invitée : un adulte n'invite un 13-17 ans que s'ils sont mates)
  async inviteToGroup(id,ids){ const g=gById(id); if(!g||!ids.length) return 0; let n=0;
    for(const u of ids){ const ok=await this._gUpdate(id,F=>({invited:F.arrayUnion(u)}),x=>{ if(!x.invited.includes(u)) x.invited.push(u); }); if(!ok) break; n++;
      if(this.live) await this.saveNotif(u,{type:'group',gid:id,from:'me',text:`${S.me.name} t'invite dans le groupe « ${g.name} »`.slice(0,190)}); }
    return n; },
  async deleteGroup(id){ this.stopGroup(); if(AUTH_LIVE){ if(!this.live&&!(await this.ready())) return false; const ref=this.db.collection('groups').doc(id);
      try{ for(let k=0;k<6;k++){ const q=await ref.collection('messages').limit(300).get(); if(q.empty) break; const b=this.db.batch(); q.forEach(x=>b.delete(x.ref)); await b.commit(); }   // les messages d'abord, puis le groupe
        try{ for(let k=0;k<30;k++){ const q=await ref.collection('voices').limit(8).get(); if(q.empty) break; const b=this.db.batch(); q.forEach(x=>b.delete(x.ref)); await b.commit(); } }catch(e){ console.error(e); }   // les sons des messages vocaux
        try{ for(let k=0;k<40;k++){ const q=await ref.collection('photos').limit(4).get(); if(q.empty) break; const b=this.db.batch(); q.forEach(x=>b.delete(x.ref)); await b.commit(); } }catch(e){ console.error(e); }   // les photos
        await ref.delete(); }catch(e){ console.error(e); toast("Le groupe n'a pas pu être supprimé."); return false; } }
    GROUPS=GROUPS.filter(g=>g.id!==id); delete GMSGS[id]; return true; },
  async sendGroupMessage(id,text,voice,photo){ const m={from:myId(),text,at:Date.now()}; if(voice) m.voice=voice; if(photo) m.photo=photo;
    if(!AUTH_LIVE){ (GMSGS[id]=GMSGS[id]||[]).push({...m,id:'l'+m.at}); renderGroupChat(id); return; }
    if(!this.live&&!(await this.ready())) return; const db=this.db, F=firebase.firestore.FieldValue, ref=db.collection('groups').doc(id);
    try{ const b=db.batch(); b.set(ref.collection('messages').doc(),m); if(voice) b.set(ref.collection('voices').doc(voice.id),{from:m.from,data:VOICES[voice.id]||'',dur:voice.dur,at:m.at});
      if(photo) b.set(ref.collection('photos').doc(photo.id),{from:m.from,data:PHOTOS[photo.id]||'',w:photo.w,h:photo.h,at:m.at});
      b.set(db.collection('limits').doc(this.uid()),{lastMsg:F.serverTimestamp()},{merge:true}); await b.commit();
      const g=gById(id); if(g&&Date.now()-tsMs(g.lastAt)>5*60e3){ g.lastAt=Date.now(); ref.update({lastAt:F.serverTimestamp()}).catch(e=>console.error(e)); }   // « nouveaux messages » pour les autres membres, au plus une écriture toutes les 5 minutes
    }catch(e){ console.error(e); toast(String(e&&e.code).includes('permission')?"Message refusé : attends une seconde, ou tu n'es plus membre de ce groupe.":"Le message n'est pas parti, réessaie."); } },
  deleteGroupMessage(id,mid){ if(!this.live) { GMSGS[id]=(GMSGS[id]||[]).filter(m=>m.id!==mid); renderGroupChat(id); return; } const gm=(GMSGS[id]||[]).find(m=>m.id===mid); if(gm&&gm.voice) this.db.collection('groups').doc(id).collection('voices').doc(gm.voice.id).delete().catch(e=>console.error(e));   // le son part avec le message
    if(gm&&gm.photo) this.db.collection('groups').doc(id).collection('photos').doc(gm.photo.id).delete().catch(e=>console.error(e));   // la photo aussi
    this.db.collection('groups').doc(id).collection('messages').doc(mid).delete().catch(e=>{ console.error(e); toast("Le message n'a pas pu être supprimé."); }); },
  listenGroup(id,cb){ this.stopGroup(); if(!this.live){ cb(); return; }   // les 100 derniers messages, en temps réel
    this._groupUnsub=this.db.collection('groups').doc(id).collection('messages').orderBy('at').limitToLast(100).onSnapshot(snap=>{ GMSGS[id]=[]; snap.forEach(x=>{ const m=x.data(); const o={id:x.id,from:m.from,text:m.text,at:m.at}; if(m.voice&&m.voice.id) o.voice={id:String(m.voice.id),dur:+m.voice.dur||0}; if(m.photo&&m.photo.id) o.photo={id:String(m.photo.id),w:+m.photo.w||4,h:+m.photo.h||3}; GMSGS[id].push(o); }); cb(); },
      e=>{ console.error(e); this.stopGroup(); this.loadGroups(true).then(()=>{ if(location.hash==='#/groupe/'+id) route(); }); }); },   // plus le droit de lire (retiré du groupe, groupe supprimé) : on recharge la liste
  stopGroup(){ if(this._groupUnsub){ try{ this._groupUnsub(); }catch(e){} this._groupUnsub=null; } },
  async saveNotif(toId,n){ if(!this.live&&AUTH_LIVE) await this.ready(); if(!this.live) return; try{ await this.db.collection('notifications').doc(this.toUid(toId)).collection('items').add({...n,from:this.toUid(n.from),at:Date.now(),read:false}); }catch(e){ console.error(e); } },
  // « Rejouerait avec lui » : le +1 n'est compté qu'une fois par joueur (champ counted, vérifié aussi par les règles Firestore)
  async rate(id,v){ if(!this.live&&AUTH_LIVE) await this.ready(); if(!this.live) return; const db=this.db, uid=this.uid(), ref=db.collection('ratings').doc(`${uid}_${id}`), counted=!!(S.rated&&S.rated[id]);
    const data={by:uid,target:id,value:v,at:Date.now(),counted:counted||v>0};
    try{ const b=db.batch(); b.set(ref,data); if(v>0&&!counted) b.update(db.collection('profiles').doc(id),{rejoue:firebase.firestore.FieldValue.increment(1)}); await b.commit();
      if(v>0){ (S.rated=S.rated||{})[id]=true; save(); } }
    catch(e){ console.error(e); try{ await ref.set({...data,counted}); }catch(e2){ console.error(e2); } } },   // le compteur n'a pas pu bouger : on garde au moins la note privée
  async setPresence(on){ if(!this.live||!this.uid()||!S.me) return; this._lastPres=Date.now();
    try{ await this.db.collection('profiles').doc(this.uid()).update({online:!!(on&&S.privacy.online),lastSeen:S.privacy.online?Date.now():0}); }catch(e){} },   // statut masqué : aucune heure d'activité n'est publiée
  saveSkin(id){ try{ if(S.auth){ S.skinByUser=S.skinByUser||{}; S.skinByUser[S.auth.uid]=id; save(); } }catch(e){}
    if(!this.live&&AUTH_LIVE){ this.ready().then(ok=>{ if(ok) this.saveSkin(id); }); return; }
    if(!this.live||!this.uid()||!S.me) return; clearTimeout(this._skinT);
    this._skinT=setTimeout(()=>{ this.db.collection('profiles').doc(this.uid()).update({skin:id}).catch(e=>console.error(e)); },600); },
  // Plaque équipée : visible par les autres joueurs (les règles Firestore vérifient qu'elle est bien à ce joueur)
  savePlate(id){ if(!this.live&&AUTH_LIVE){ this.ready().then(ok=>{ if(ok) this.savePlate(id); }); return; } if(!this.live||!this.uid()||!S.me) return;
    this.db.collection('profiles').doc(this.uid()).update({plate:id||''}).catch(e=>{ console.error(e); toast("La plaque n'a pas pu être enregistrée en ligne."); }); },
  // Plaque gagnée (flammes, souvenir) : ajoutée à rewards/{uid}.plates ; les règles vérifient que la récompense est méritée (proof = conversation qui a la flamme)
  async grantPlate(id,proof){ if(!this.live||!this.uid()) return false; if((((S.rewards||{}).plates)||[]).includes(id)) return true;
    try{ const data={plates:firebase.firestore.FieldValue.arrayUnion(id)}; if(proof) data.proof=proof; await this.db.collection('rewards').doc(this.uid()).set(data,{merge:true});
      S.rewards={...(S.rewards||{}),plates:[...(((S.rewards||{}).plates)||[]),id]}; save(); return true; }catch(e){ console.error(e); return false; } },
  async setDispo(d){ if(!this.live&&AUTH_LIVE) await this.ready(); if(!this.live||!this.uid()) return; try{ await this.db.collection('profiles').doc(this.uid()).update({dispo:d||null}); }catch(e){ console.error(e); toast('Statut non enregistré en ligne'); } },
  async refreshPlayers(){ if(!this.live||!this.uid()||!S.me||!S.me.dob) return false; if(this._refreshing||(this._lastPlayers&&Date.now()-this._lastPlayers<180000)) return false; this._lastPlayers=Date.now(); this._refreshing=true;
    try{ const uid=this.uid(); const ps=await this.db.collection('profiles').where('hidden','==',false).limit(300).get();   // v7 — tous les âges
      const fresh=[]; ps.forEach(d=>{ if(d.id!==uid) fresh.push(normP({...d.data(),id:d.id,age:undefined})); }); const keep=PLAYERS.filter(p=>(p._reported||p._extra)&&!fresh.some(f=>f.id===p.id)); PLAYERS.length=0; fresh.concat(keep).forEach(p=>PLAYERS.push(p)); return true; }catch(e){ console.error(e); return false; } finally{ this._refreshing=false; } },
  // Parrainage : validé une seule fois, quand le filleul a un profil ET une adresse e-mail vérifiée (les comptes Google le sont d'office).
  // Tant que l'e-mail n'est pas vérifié, le code est gardé et retesté au prochain chargement.
  async applyReferral(){ if(!this.live||!this.uid()||!S.me) return; let code=''; try{ code=(localStorage.getItem('coopo_ref')||'').toLowerCase(); }catch(e){} if(!code) return;
    const drop=()=>{ this._refWait=false; try{ localStorage.removeItem('coopo_ref'); }catch(e){} };
    if(code===S.me.name.toLowerCase()||(S.rewards&&S.rewards.referred)){ drop(); return; }
    try{ const done=await this.db.collection('referrals').doc(this.uid()).get(); if(done.exists){ drop(); return; } }catch(e){}   // déjà parrainé : une seule fois
    try{ const u=firebase.auth().currentUser;
      if(u&&!u.emailVerified){ await u.reload().catch(()=>{}); if(!u.emailVerified){ this._refWait=true; return; } await u.getIdToken(true).catch(()=>{}); }
      const un=await this.db.collection('usernames').doc(code).get(); if(!un.exists||un.data().uid===this.uid()){ drop(); return; }
      const by=un.data().uid, db=this.db, b=db.batch();
      b.set(db.collection('referrals').doc(this.uid()),{by,byName:code,at:Date.now()});
      b.set(db.collection('rewards').doc(by),{referrals:firebase.firestore.FieldValue.increment(1)},{merge:true});
      await b.commit(); drop(); }   // seul celui qui invite reçoit le thème (les filleuls d'avant gardent le leur)
    catch(e){ console.error(e); drop(); } },
  async loadPurchases(){ if(!this.live||!this.uid()) return; try{ const d=await this.db.collection('purchases').doc(this.uid()).get(); const x=d.exists?d.data():{}; S.owned={pack:!!x.pack,themes:Array.isArray(x.themes)?x.themes:[],plates:Array.isArray(x.plates)?x.plates:[]}; const r=await this.db.collection('rewards').doc(this.uid()).get(); S.rewards=r.exists?r.data():{}; save(); }catch(e){ console.error(e); } },
  async loadReports(){ if(!this.live) return; const db=this.db;
    try{ const rs=await db.collection('reports').orderBy('at','desc').limit(300).get();
      S.reports=[]; rs.forEach(d=>{ const r=d.data(); S.reports.push({rid:d.id,id:r.target,by:r.by,reason:r.reason,details:r.details,at:r.at,status:r.status,messages:r.messages||null}); });
      const ids=[...new Set(S.reports.map(r=>r.id))].filter(id=>!PLAYERS.some(p=>p.id===id));
      const docs=await Promise.all(ids.map(id=>db.collection('profiles').doc(id).get().catch(()=>null)));
      docs.forEach(d=>{ if(d&&d.exists) PLAYERS.push(normP({...d.data(),id:d.id,age:undefined,_reported:true})); });
      S.hidden=PLAYERS.filter(p=>p.hidden).map(p=>p.id); S.banned=PLAYERS.filter(p=>p.banned).map(p=>p.id); save();
    }catch(e){ console.error(e); toast('Signalements indisponibles'); } },
  async closeReports(target){ if(!this.live&&AUTH_LIVE) await this.ready(); if(!this.live) return; try{ const b=this.db.batch(); S.reports.filter(r=>r.id===target&&r.rid&&r.status!=='done').forEach(r=>b.update(this.db.collection('reports').doc(r.rid),{status:'done'})); await b.commit(); }catch(e){ console.error(e); } },
  async sendContact(c){ if(!this.live&&AUTH_LIVE) await this.ready(); if(!this.live) throw new Error('offline'); await this.db.collection('contact').add({message:c.message,email:c.email||'',uid:this.uid()||'',topic:this.uid()?'general':'connexion',at:Date.now()}); },
  // Efface les données du compte. Renvoie false si l'effacement a échoué (le compte n'est alors pas supprimé, pour ne pas laisser de profil orphelin).
  async deleteAccountData(){ if(!this.live&&AUTH_LIVE&&!(await this.ready())) return false; if(!this.live||!this.uid()) return true; const uid=this.uid(), db=this.db, F=firebase.firestore.FieldValue, quiet=p=>p.catch(e=>console.error(e));
    try{ // d'abord ce qui peut manquer sans gravité : mes groupes, les groupes rejoints, mes annonces
      await Promise.all([ ...(S.squads||[]).map(s=>quiet(db.collection('squads').doc(s.id).delete())),
        ...(S.joined||[]).map(id=>quiet(db.collection('squads').doc(id).update({members:F.arrayRemove(uid)}))),
        ...GROUPS.filter(g=>g.owner===uid).map(g=>quiet(this.deleteGroup(g.id))),
        ...GROUPS.filter(g=>g.owner!==uid&&g.members.includes(uid)).map(g=>quiet(db.collection('groups').doc(g.id).update({members:F.arrayRemove(uid),mods:F.arrayRemove(uid)}))),
        quiet(db.collection('streaks').where('members','array-contains',uid).get().then(q=>Promise.all(q.docs.map(x=>x.ref.delete())))),
        quiet(db.collection('gametags').doc(uid).delete()),   // v7 — pseudos en jeu rangés à part (13-17 ans)
        ...ANNONCES.filter(a=>a.by===uid).map(a=>quiet(db.collection('boards').doc(a.ageGroup).collection('annonces').doc(a.id).delete())),
        ...ANNONCES.filter(a=>a.by!==uid&&(a.replies||[]).includes(uid)).map(a=>quiet(db.collection('boards').doc(a.ageGroup).collection('annonces').doc(a.id).update({replies:F.arrayRemove(uid)}))),
        ...TOURNOIS.filter(t=>(t.players||[]).includes(uid)).map(t=>{ const u={players:F.arrayRemove(uid)}; u['entries.'+uid]=F.delete(); return quiet(db.collection('boards').doc(t.ageGroup).collection('tournois').doc(t.id).update(u)); }) ]);
      const bl=await db.collection('blocks').doc(uid).collection('list').get(); const nt=await db.collection('notifications').doc(uid).collection('items').get();
      const rq=await db.collection('requests').where('participants','array-contains',uid).get();
      const b=db.batch(); bl.forEach(x=>b.delete(x.ref)); nt.forEach(x=>b.delete(x.ref)); rq.forEach(x=>b.delete(x.ref));
      if(S.me&&S.me.name) b.delete(db.collection('usernames').doc(S.me.name.toLowerCase()));
      b.delete(db.collection('profiles').doc(uid)); b.delete(db.collection('private').doc(uid)); b.delete(db.collection('contacts').doc(uid)); await b.commit(); return true;
    }catch(e){ console.error(e); return false; } },
  async adminHide(id,hidden){ if(!this.live&&AUTH_LIVE) await this.ready(); if(!this.live) return; try{ await this.db.collection('profiles').doc(id).update({hidden}); }catch(e){ console.error(e); } },
  async adminBan(id,banned){ if(!this.live&&AUTH_LIVE) await this.ready(); if(!this.live) return; try{ await this.db.collection('profiles').doc(id).update({banned,hidden:banned}); }catch(e){ console.error(e); } },
};

// Site en ligne (Firebase configuré) : on retire tous les profils et groupes de démonstration
if(AUTH_LIVE){
  PLAYERS.length=0; DEMO_SQUADS.length=0; DEMO_ANNONCES.length=0; DEMO_TOURNOIS.length=0;
  const isDemo=id=>/^p\d+$/.test(String(id));
  S.requests=(S.requests||[]).filter(r=>!isDemo(r.from)&&!isDemo(r.to));
  S.notifs=(S.notifs||[]).filter(n=>!isDemo(n.from));
  Object.keys(S.chats||{}).forEach(k=>{ if(isDemo(k)) delete S.chats[k]; });
  Object.keys(S.unread||{}).forEach(k=>{ if(isDemo(k)) delete S.unread[k]; });
  Object.keys(S.ratings||{}).forEach(k=>{ if(isDemo(k)) delete S.ratings[k]; });
  ['blocked','hidden','banned'].forEach(k=>{ if(Array.isArray(S[k])) S[k]=S[k].filter(x=>!isDemo(x)); });
  S.reports=(S.reports||[]).filter(r=>!isDemo(r.id));
  S.joined=[]; save();
}
addEventListener('pagehide',()=>{ try{ DB.setPresence(false); }catch(e){} });   // fermeture ou changement de page (plus fiable sur téléphone que beforeunload)
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && DB.live && S.me && Date.now()-(DB._lastPres||0)>60000) DB.setPresence(true); });   // retour sur l'onglet
// compte déjà connecté : on affiche tout de suite les joueurs et le statut de la dernière visite, puis on rafraîchit
try{ const c=JSON.parse(localStorage.getItem('coopo_cache')||'null'); if(AUTH_LIVE && c && S.auth && c.uid===S.auth.uid){ if(Array.isArray(c.players)){ PLAYERS.length=0; c.players.forEach(p=>PLAYERS.push(p)); } if(c.admin && !ADMINS.includes(c.uid)) ADMINS.push(c.uid); } }catch(e){}
applySkin(S.skinWanted||S.skin||'defaut');
route();
initAuth();
splashShow();
demoScheduleIncoming();
</script>
